schema: spec-driven

context: |
  Language: French
  All artifacts must be written in French.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Projet : KODJO (application mobile Expo SDK 57 de routines sportives).
  Ce dépôt OpenSpec sert à la révision de la documentation fonctionnelle
  (docs/Specifications-fonctionnelles, chapitres 01 à 13, et docs/*.md).
  Documentation = comportements et calculs ; Figma = rendu visuel uniquement.
  Un document plus récent ne remplace jamais implicitement un autre ;
  seul un remplacement explicite (décision Dxxx, mention « remplacé par ») vaut.
  Chaque règle doit avoir une seule référence normative.
  Aucun code applicatif, Figma, push, workflow ou EAS. Aucun lien BMAD/VNext.
  Instructions du clone : openspec/instructions/.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
