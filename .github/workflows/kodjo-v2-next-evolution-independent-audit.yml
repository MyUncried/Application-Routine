name: KODJO V2 — Next Evolution Independent Claude Audit

on:
  pull_request:
    paths:
      - '.github/orchestration/**'
      # Une demande immuable n'est pas une modification du protocole : son
      # admission ciblée est effectuée par Lean Queue au lancement.
      - '!.github/orchestration/queue/v2/*.json'
      # Pure backlog edits are known non normative and need no workflow run.
      - '!.github/orchestration/PROTOCOL_EVOLUTION_BACKLOG.md'
      - '!.github/orchestration/reports/**'
      - '.github/orchestration/reports/2026-09-29_PROTOCOL_DETERMINISM_MATRIX.md'
      - '.github/orchestration/reports/2026-09-29_PROTOCOL_DETERMINISM_AUDIT.md'
      - '.github/orchestration/reports/2026-09-29_PROTOCOL_EVOLUTION_CLAUDE_AUDIT_MISSION.md'
      # The audit matrix and mission are executable inputs of protocol checks.
      # Keep them in the qualified set even though they are Markdown files.
      - '.github/workflows/kodjo-v2-*.yml'
      - '.github/workflows/kodjo-slice-*.yml'
      - '.github/AI_ORCHESTRATION.md'
      - '.github/AI_ORCHESTRATION_CONTINUITY.md'
      - 'scripts/kodjo/**'
      - 'tests/kodjo/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Candidate protocol PR
        required: true
        type: string
      candidate_sha:
        description: Exact 40-hex HEAD to audit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: kodjo-v2-next-evolution-audit-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  await_qualified_head:
    # Qualification updates do not authorize another global model audit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Qualification includes Linux plus the bounded 60-minute Windows preflight.
    # The former 21-minute polling window could expire immediately before PASS.
    timeout-minutes: 90
    outputs:
      owner_accepted: ${{ steps.owner_disposition.outputs.owner_accepted }}
    steps:
      - name: Require pilot qualification PASS on exact candidate HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          CANDIDATE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          branch="$CANDIDATE_BRANCH"
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            test "$(jq -r '.head.sha' <<< "$pr")" = "$CANDIDATE_SHA"
            branch=$(jq -r '.head.ref' <<< "$pr")
          fi
          for attempt in $(seq 1 240); do
            selected=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kodjo-v2-pilot-tests.yml/runs?event=pull_request&branch=$branch&per_page=100" |
              jq -c --arg sha "$CANDIDATE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | if length == 0 then null else max_by(.run_number) end')
            state=$(jq -r 'if . == null then "NONE" else (.status + ":" + (.conclusion // "NONE")) end' <<< "$selected")
            if [ "$state" = 'completed:success' ]; then
              run_id=$(jq -r '.id' <<< "$selected")
              jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
              qualified=$(jq -r '[.jobs[] | select(.name == "protocol" or .name == "protocol-windows-preflight") | .conclusion] | if length == 2 and all(. == "success") then "true" else "false" end' <<< "$jobs")
              if [ "$qualified" != true ]; then echo "PILOT_HEAVY_JOBS_NOT_QUALIFIED: $run_id" >&2; exit 1; fi
              exit 0
            fi
            if [ "$state" = 'completed:failure' ] || [ "$state" = 'completed:cancelled' ]; then
              echo "Pilot qualification refused for $CANDIDATE_SHA: $state" >&2
              exit 1
            fi
            sleep 20
          done
          echo "PILOT_QUALIFICATION_NOT_PASS: $CANDIDATE_SHA" >&2
          exit 1

      # Explicit owner decision on 2026-09-30 for PR #267 only. The original
      # REVISE report remains unchanged; this records a separate acceptance.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve exact owner disposition for PRE-1 only
        id: owner_disposition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/pre1-owner-disposition.json"
          disposition=$(node scripts/kodjo/resolve-pre1-targeted-acceptance.js "$PR_NUMBER" "$CANDIDATE_SHA" "$RUNNER_TEMP/pre1-owner-disposition.json")
          accepted=false
          if [ "$disposition" != NONE ]; then
            accepted=true
            echo "PRE1_TARGETED_OWNER_ACCEPTANCE: $CANDIDATE_SHA, comment=$disposition, qualification=PASS; original audit verdict unchanged" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "owner_accepted=$accepted" >> "$GITHUB_OUTPUT"

  independent-audit:
    needs: await_qualified_head
    if: needs.await_qualified_head.result == 'success' && needs.await_qualified_head.outputs.owner_accepted != 'true'
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 60
    outputs:
      base_sha: ${{ steps.target.outputs.base_sha }}
      session_id: ${{ steps.claude.outputs.session_id }}
      audit_attempt: ${{ steps.claude.outputs.audit_attempt }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: powershell

    steps:
      - name: Validate immutable audit target
        id: target
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('kodjo-next-evolution-audit.json','kodjo-next-evolution-audit.err.txt','kodjo-next-evolution-audit.md','kodjo-next-evolution-audit-summary.json')){
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -Force -ErrorAction SilentlyContinue
          }
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner' }
          if ($env:PR_NUMBER -notmatch '^[1-9][0-9]*$') { throw 'Invalid PR number' }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid candidate SHA' }
          $pr=gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER"|ConvertFrom-Json
          if($LASTEXITCODE-ne0-or$null-eq$pr){throw 'Candidate PR unreadable'}
          if([string]$pr.state-ne'open'){throw 'Candidate PR is not open'}
          if([string]$pr.base.ref-ne'main'){throw 'Candidate PR base is not main'}
          if([string]$pr.head.sha-ne$env:CANDIDATE_SHA){throw 'Candidate PR moved'}
          $base=[string]$pr.base.sha
          if($base-notmatch'^[0-9a-f]{40}$'){throw 'Candidate base SHA invalid'}
          "base_sha=$base"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "branch=$([string]$pr.head.ref)"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Install isolated planning tokenizer for deterministic pre-audit
        run: |
          $ErrorActionPreference='Stop'
          npm ci --prefix scripts/kodjo/openai-runtime --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE-ne0){throw 'Planning tokenizer installation failed'}

      - name: Set up independent workflow syntax parser for audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned YAML parser before deterministic pre-audit
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install PyYAML==6.0.3
          if($LASTEXITCODE-ne0){throw 'Audit YAML parser installation failed'}

      - name: Verify exact checkout and deterministic pre-audit
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim()-ne$env:CANDIDATE_SHA){throw 'Audit HEAD mismatch'}
          git cat-file -e "$env:BASE_SHA^{commit}"
          if($LASTEXITCODE-ne0){throw 'Audit base missing'}
          node tests/kodjo/run-all.js
          if($LASTEXITCODE-ne0){throw 'Pilot suite failed before independent audit'}
          node scripts/kodjo/validate-workflows.js
          if($LASTEXITCODE-ne0){throw 'Workflow validation failed before independent audit'}

      - name: Preflight mandatory audit artifact transport before Claude
        run: |
          $ErrorActionPreference='Stop'
          $inventory=Join-Path $env:RUNNER_TEMP ('kodjo-audit-artifact-inventory-'+$env:GITHUB_RUN_ID+'.json')
          $raw=gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          if($LASTEXITCODE-ne0){throw 'Audit artifact inventory unavailable'}
          [IO.File]::WriteAllText($inventory,($raw -join [Environment]::NewLine),(New-Object Text.UTF8Encoding($false)))
          node scripts/kodjo/check-artifact-budget.js $inventory
          if($LASTEXITCODE-ne0){throw 'Audit artifact budget refused before Claude'}

      - name: Build bounded independent audit prompt
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $mission=Get-Content -LiteralPath '.github/orchestration/reports/2026-09-29_PROTOCOL_EVOLUTION_CLAUDE_AUDIT_MISSION.md' -Raw -Encoding UTF8
          $register=Get-Content -LiteralPath '.github/orchestration/reports/2026-09-30_PR250_CUMULATIVE_AUDIT_REGISTER.md' -Raw -Encoding UTF8
          $registerSummary=($register -split '## Inventaire cumulatif à rapprocher du candidat',2)[0]
          $changed=(git diff --name-only $env:BASE_SHA $env:CANDIDATE_SHA) -join [Environment]::NewLine
          if($LASTEXITCODE-ne0){throw 'Audit diff inventory failed'}
          $prompt=@"
          $mission

          ===== IMMUTABLE AUDIT TARGET =====
          repository=$env:GITHUB_REPOSITORY
          pr_number=$env:PR_NUMBER
          base_sha=$env:BASE_SHA
          candidate_sha=$env:CANDIDATE_SHA

          ===== CUMULATIVE AUDIT REGISTER (claims must be independently verified) =====
          $registerSummary
          Read the full register at .github/orchestration/reports/2026-09-30_PR250_CUMULATIVE_AUDIT_REGISTER.md for all 103 references and family dispositions.

          ===== CHANGED FILES =====
          $changed

          The checkout is exactly candidate_sha. Inspect the actual files and git diff locally.
          The deterministic pilot suite and workflow validator have already passed in this run before your invocation.
          Their execution proves only those checks; do not extrapolate unexecuted Linux/GitHub/device behavior.
          Do not modify files. Do not use network or GitHub writes. Audit independently and adversarially.
          "@
          $promptFile=Join-Path $env:RUNNER_TEMP 'kodjo-next-evolution-audit-prompt.txt'
          [IO.File]::WriteAllText($promptFile,$prompt,(New-Object Text.UTF8Encoding($false)))
          "prompt_file=$promptFile"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: prompt

      - name: Run independent Claude audit
        id: claude
        env:
          AUDIT_PROMPT_FILE: ${{ steps.prompt.outputs.prompt_file }}
        run: |
          $ErrorActionPreference='Stop'
          $prompt=Get-Content -LiteralPath $env:AUDIT_PROMPT_FILE -Raw -Encoding UTF8
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          $out=Join-Path $env:RUNNER_TEMP 'kodjo-next-evolution-audit.json'
          $err=Join-Path $env:RUNNER_TEMP 'kodjo-next-evolution-audit.err.txt'
          # Stdin keeps the complete dossier outside Windows' native argv limit.
          # PowerShell 5.1 otherwise encodes piped native input as ASCII.
          $previousOutputEncoding=$OutputEncoding
          try {
            $OutputEncoding=New-Object Text.UTF8Encoding($false)
            $prompt | & claude -p --output-format json --dangerously-skip-permissions 1> $out 2> $err
            $code=$LASTEXITCODE
          } finally {
            $OutputEncoding=$previousOutputEncoding
          }
          $status=git status --porcelain --untracked-files=all
          if($LASTEXITCODE-ne0-or-not[string]::IsNullOrWhiteSpace(($status -join [Environment]::NewLine))){throw 'Independent auditor modified checkout'}
          if(!(Test-Path -LiteralPath $out)-or(Get-Item -LiteralPath $out).Length-eq0){throw "Claude audit produced no JSON; exit=$code"}
          $json=Get-Content -LiteralPath $out -Raw -Encoding UTF8|ConvertFrom-Json
          if(!$json.session_id-or!$json.result){throw 'Claude audit result incomplete'}
          if($code-ne0){throw "Claude audit failed; exit=$code"}
          $audit=Join-Path $env:RUNNER_TEMP 'kodjo-next-evolution-audit.md'
          [IO.File]::WriteAllText($audit,[string]$json.result,(New-Object Text.UTF8Encoding($false)))
          node scripts/kodjo/verify-independent-protocol-audit.js $audit (Join-Path $env:RUNNER_TEMP 'kodjo-next-evolution-audit-summary.json')
          if($LASTEXITCODE-ne0){throw 'Independent audit output contract refused'}
          if(-not[string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Independent auditor modified checkout'}
          "session_id=$($json.session_id)"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "audit_attempt=$env:GITHUB_RUN_ATTEMPT"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Preserve independent audit regardless of comment publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-independent-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kodjo-next-evolution-audit.md
            ${{ runner.temp }}/kodjo-next-evolution-audit-summary.json
            ${{ runner.temp }}/kodjo-next-evolution-audit.json
            ${{ runner.temp }}/kodjo-next-evolution-audit.err.txt
          if-no-files-found: error
          retention-days: 14

  publish-evidence:
    needs: independent-audit
    if: needs.independent-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Isolated audit evidence writer; never passed to Claude.
      pull-requests: write
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
      BASE_SHA: ${{ needs.independent-audit.outputs.base_sha }}
      SESSION_ID: ${{ needs.independent-audit.outputs.session_id }}
      SOURCE_AUDIT_ATTEMPT: ${{ needs.independent-audit.outputs.audit_attempt }}
    steps:
      - name: Checkout exact publication contract
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download validated audit without recalling Claude
        uses: actions/download-artifact@v4
        with:
          name: kodjo-v2-independent-audit-${{ github.run_id }}-${{ needs.independent-audit.outputs.audit_attempt }}
          path: ${{ runner.temp }}/kodjo-independent-audit
      - name: Commit report on isolated evidence branch and verify PR comment
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kodjo/publish-independent-protocol-audit.js \
            "$RUNNER_TEMP/kodjo-independent-audit/kodjo-next-evolution-audit.md" \
            "$RUNNER_TEMP/kodjo-independent-audit/publication-receipt.json"
      - name: Preserve publication receipt without masking a publication failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-audit-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kodjo-independent-audit/publication-receipt.json
          if-no-files-found: warn
          retention-days: 14
