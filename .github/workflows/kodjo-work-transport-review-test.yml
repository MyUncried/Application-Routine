name: KODJO Work transport commit-update micro-test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kodjo-work-transport-review-test.yml

permissions:
  contents: write

jobs:
  update-pr-head:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR 19 head
        uses: actions/checkout@v4
        with:
          ref: orchestration/v1-3-integrated-t1-t9
      - name: Commit isolated transport marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' \
            'test_id=KODJO-V13-T1T9-20260829-01' \
            'event_test=PR_COMMIT_UPDATE_SYNCHRONIZE' \
            'business_write=false' \
            > .github/orchestration/KODJO_WORK_TRANSPORT_COMMIT_TEST.txt
          git add .github/orchestration/KODJO_WORK_TRANSPORT_COMMIT_TEST.txt
          git commit -m "test: emit PR commit update for Work transport"
          git push origin HEAD:orchestration/v1-3-integrated-t1-t9
