name: KODJO Work transport ready-for-review micro-test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kodjo-work-transport-review-test.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 19 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr_node_id=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pulls/19" | jq -r '.node_id')
          payload=$(jq -n \
            --arg query 'mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{id isDraft updatedAt}}}' \
            --arg id "$pr_node_id" \
            '{query:$query,variables:{id:$id}}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/graphql" \
            -d "$payload" | jq .
