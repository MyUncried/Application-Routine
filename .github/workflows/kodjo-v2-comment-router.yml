name: KODJO — Comment Router
run-name: KODJO comment / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  e2e-orchestration-test-v1-3:
    if: >-
      (github.event.issue.number == 17 && contains(github.event.comment.body, '[KODJO_E2E_AUTOMATION_TEST]'))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
    uses: ./.github/workflows/kodjo-e2e-orchestration-test-v1-3.yml
    secrets: inherit

  e2e-t1-t6-v1-3:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.number == 17 && contains(github.event.comment.body, '[KODJO_E2E_T1_T6_REAL_CLAUDE_TEST]')) || (github.event_name == 'repository_dispatch' && github.event.action == 'kodjo-e2e-t2-claude-real')
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
      id-token: write
    uses: ./.github/workflows/kodjo-e2e-t1-t6-v1-3.yml
    secrets: inherit

  event-router-v1-3:
    if: >-
      (github.event.issue.number == 17 && ( contains(github.event.comment.body, '[KODJO_TEST_EVENT]') || contains(github.event.comment.body, '[KODJO_ORCHESTRATOR_DRY_RUN_TEST]') || (github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, 'STATUT : PLAN_READY_FOR_REVIEW')) || (github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, 'STATUT : IMPLEMENTATION_READY_FOR_REVIEW')) || contains(github.event.comment.body, '[KODJO_USER_INPUT]') ))
    permissions:
      issues: write
      contents: read
    uses: ./.github/workflows/kodjo-event-router-v1-3.yml
    secrets: inherit

  slice-finalize:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_SLICE] VISUAL_APPROVED'))
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/kodjo-slice-finalize.yml
    secrets: inherit

  slice-implementation-publication-recovery:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && startsWith(github.event.comment.body, format('[KODJO_SLICE] RECOVER_IMPLEMENTATION_PUBLICATION{0}', fromJSON('"\n"'))))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
    uses: ./.github/workflows/kodjo-slice-implementation-publication-recovery.yml
    secrets: inherit

  implementation-review:
    name: Generic implementation review
    if: >-
      ((github.event_name == 'issue_comment' && ((github.event.comment.user.login == 'github-actions[bot]' && startsWith(github.event.comment.body, format('[KODJO_SLICE] IMPLEMENTATION_OUTPUT{0}', fromJSON('"\n"')))) || (github.event.comment.user.login == 'MyUncried' && startsWith(github.event.comment.body, format('[KODJO_SLICE] START_IMPLEMENTATION_REVIEW{0}', fromJSON('"\n"')))))) || (github.event_name == 'repository_dispatch' && github.event.action == 'kodjo_implementation_ready'))
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/kodjo-slice-implementation-review.yml
    secrets: inherit

  slice-implementation:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && (startsWith(github.event.comment.body, format('[KODJO_SLICE] START_IMPLEMENTATION{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('[KODJO_SLICE] IMPLEMENTATION_REVISION{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('[KODJO_SLICE] VISUAL_CORRECTION{0}', fromJSON('"\n"')))))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
    uses: ./.github/workflows/kodjo-slice-implementation.yml
    secrets: inherit

  slice-plan-review:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_SLICE] START_PLAN_REVIEW'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-slice-plan-review.yml
    secrets: inherit

  slice-plan:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_SLICE] START_PLAN') && !contains(github.event.comment.body, '[KODJO_SLICE] START_PLAN_REVIEW'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-slice-plan.yml
    secrets: inherit

  slice-recover:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_SLICE] RECOVER_WORKTREE'))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
    uses: ./.github/workflows/kodjo-slice-recover.yml
    secrets: inherit

  t8-work-arbitration:
    if: >-
      (github.event.issue.pull_request && github.event.issue.number == 18 && github.event.comment.user.login == 'MyUncried' && (contains(github.event.comment.body, '[KODJO_T8_USER_ARBITRATION]') || contains(github.event.comment.body, '[KODJO_T8_TECHNICAL_RETRY]')) && contains(github.event.comment.body, 'choice=A') && contains(github.event.comment.body, 'source=CHATGPT_WORK_SAME_THREAD'))
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/kodjo-t8-work-arbitration.yml
    secrets: inherit

  v1-3-integrated-t1-t9:
    if: >-
      (github.event.issue.pull_request && github.event.issue.number == 19 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, 'test_id=KODJO-V13-T1T9-20260829-01') && (contains(github.event.comment.body, '[KODJO_T1T9_START]') || contains(github.event.comment.body, '[KODJO_T1T9_REVIEW_CHANGES_REQUESTED]') || contains(github.event.comment.body, '[KODJO_T1T9_REVIEW_RETEST_REQUIRED]') || contains(github.event.comment.body, '[KODJO_T1T9_DECISION_MID]') || contains(github.event.comment.body, '[KODJO_T1T9_DECISION_LOOP3]'))) || (github.event.issue.pull_request && github.event.issue.number == 19 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_T1T9_RESUME_AFTER_TRANSPORT_FIX]') && contains(github.event.comment.body, 'test_id=KODJO-V13-T1T9-20260829-01')) || (github.event.issue.pull_request && github.event.issue.number == 19 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_T1T9_SIGNAL_EXISTING_RETEST]') && contains(github.event.comment.body, 'test_id=KODJO-V13-T1T9-20260829-01')) || (github.event.issue.pull_request && github.event.issue.number == 19 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, 'test_id=KODJO-V13-T1T9-20260829-01') && (contains(github.event.comment.body, '[KODJO_T1T9_DECISION_LOOP1]') || contains(github.event.comment.body, '[KODJO_T1T9_DECISION_LOOP2]')))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/kodjo-v1-3-integrated-t1-t9.yml
    secrets: inherit

  v14-s09-dev:
    if: >-
      (github.event.issue.number == 17 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V14_S09] START_DEV_S09'))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
    uses: ./.github/workflows/kodjo-v14-s09-dev.yml
    secrets: inherit

  v14-s09-finalize:
    if: >-
      (github.event.issue.number == 17 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V14_S09] VISUAL_APPROVED'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-v14-s09-finalize.yml
    secrets: inherit

  v14-s09-implementation-local:
    if: >-
      (github.event.issue.number == 17 && (contains(github.event.comment.body, '[KODJO_V14_S09] PLAN_APPROVED') || contains(github.event.comment.body, '[KODJO_V14_S09] IMPLEMENTATION_REVISION') || contains(github.event.comment.body, '[KODJO_V14_S09] VISUAL_CORRECTION') || contains(github.event.comment.body, '[KODJO_V14_S09] CORRECT')))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
    uses: ./.github/workflows/kodjo-v14-s09-implementation-local.yml
    secrets: inherit

  v14-s09-plan-local:
    if: >-
      (github.event.issue.number == 17 && github.event.comment.user.login == 'MyUncried' && ( contains(github.event.comment.body, '[KODJO_V14_S09] START_PLAN_OPENAI') || contains(github.event.comment.body, '[KODJO_V14_S09] PLAN_REVISION_OPENAI') ))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-v14-s09-plan-local.yml
    secrets: inherit

  v14-s09-plan-review-independent:
    if: >-
      (github.event.issue.number == 17 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V14_S09] START_PLAN_REVIEW_CLAUDE'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-v14-s09-plan-review-independent.yml
    secrets: inherit

  v14-s09-protocol-audit:
    if: >-
      (github.event.issue.number == 17 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V14_S09] AUDIT_PROTOCOL'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-v14-s09-protocol-audit.yml
    secrets: inherit

  v14-s09-recover-worktree:
    if: >-
      (github.event.issue.number == 17 && contains(github.event.comment.body, '[KODJO_V14_S09] RECOVER_WORKTREE')) || (github.event.issue.number == 17 && contains(github.event.comment.body, '[KODJO_V14_S09] REPAIR_RECOVERY'))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
    uses: ./.github/workflows/kodjo-v14-s09-recover-worktree.yml
    secrets: inherit

  v14-s09-review:
    if: >-
      (github.event.issue.number == 17 && github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, '[KODJO_S09_PLAN_OUTPUT]') && contains(github.event.comment.body, 'plan_builder=OPENAI')) || (github.event.issue.number == 17 && (github.event.comment.user.login == 'github-actions[bot]' || github.event.comment.user.login == 'MyUncried') && contains(github.event.comment.body, '[KODJO_S09_IMPLEMENTATION_OUTPUT]'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-v14-s09-review.yml
    secrets: inherit

  v14-s09-validate-integration:
    if: >-
      (github.event.issue.number == 17 && contains(github.event.comment.body, '[KODJO_V14_S09] VALIDATE_INTEGRATION'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-v14-s09-validate-integration.yml
    secrets: inherit

  v2-plan-handoff-materialize:
    if: >-
      ((github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, '[KODJO_V2] PLAN_REVIEW_OUTPUT') && contains(github.event.comment.body, 'verdict=APPROVE') && contains(github.event.comment.body, 'STATUT : PLAN_REVIEW_APPROVED')) || (github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] MATERIALIZE_PLAN_HANDOFF')))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
      pull-requests: read
    uses: ./.github/workflows/kodjo-v2-plan-handoff-materialize.yml
    secrets: inherit

  v2-plan-handoff-queue:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && (contains(github.event.comment.body, '[KODJO_V2] VALIDATE_PLAN_HANDOFF') || contains(github.event.comment.body, '[KODJO_V2] QUEUE_APPROVED_PLAN')))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
      pull-requests: read
      actions: write
    uses: ./.github/workflows/kodjo-v2-plan-handoff-queue.yml
    secrets: inherit

  v2-review-existing-delivery-bridge:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && startsWith(github.event.comment.body, format('[KODJO_V2] REVIEW_EXISTING_DELIVERY{0}', fromJSON('"\n"'))))
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/kodjo-v2-review-existing-delivery-bridge.yml
    secrets: inherit

  v2-slice-initial-plan-review:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_INITIAL_PLAN_REVIEW'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-v2-slice-initial-plan-review.yml
    secrets: inherit

  v2-slice-initial-plan:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_INITIAL_PLAN') && !contains(github.event.comment.body, '[KODJO_V2] START_INITIAL_PLAN_REVIEW'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-v2-slice-initial-plan.yml
    secrets: inherit

  v2-slice-minor-plan-clarification:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_MINOR_PLAN_CLARIFICATION'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/kodjo-v2-slice-minor-plan-clarification.yml
    secrets: inherit

  v2-slice-plan-review:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_PLAN_REVIEW'))
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/kodjo-v2-slice-plan-review.yml
    secrets: inherit

  v2-slice-plan:
    if: >-
      ((github.event_name == 'issue_comment' && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_PLAN_REVISION')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/kodjo-v2-slice-plan.yml
    secrets: inherit

  v2-targeted-requalification:
    if: >-
      (github.event.comment.user.login == 'MyUncried' && startsWith(github.event.comment.body, '[KODJO_SLICE] TARGETED_VISUAL_APPROVED_REQUALIFY'))
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    uses: ./.github/workflows/kodjo-v2-targeted-requalification.yml
    secrets: inherit

  t01-s09-implementation-v1-3-temporary:
    if: >-
      (github.event.issue.number == 17 && contains(github.event.comment.body, '@claude-t01-s09-implement-v1-3-phase-a'))
    permissions:
      contents: write # Delegated comment worker; no steps in this job.
      issues: write
      id-token: write
    uses: ./.github/workflows/t01-s09-implementation-v1-3-temporary.yml
    secrets: inherit

  t01-s09-plan-revision-v1-3-temporary:
    if: >-
      (github.event.issue.number == 17 && contains(github.event.comment.body, '@claude-t01-s09-plan-revision-v1-3'))
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/t01-s09-plan-revision-v1-3-temporary.yml
    secrets: inherit

  routine-dev-sync:
    needs: implementation-review
    if: needs.implementation-review.result == 'success'
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/kodjo-routine-dev-environment-sync.yml
    secrets: inherit
    with:
      review_run_id: ${{ format('{0}', github.run_id) }}
      review_run_attempt: ${{ format('{0}', github.run_attempt) }}
