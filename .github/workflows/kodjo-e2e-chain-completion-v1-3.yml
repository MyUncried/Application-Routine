name: KODJO E2E Chain Completion V1.3
run-name: KODJO E2E — chain completion

on:
  repository_dispatch:
    types: [kodjo-e2e-review-complete]

permissions:
  contents: read
  issues: write

jobs:
  complete-e2e-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatched review and complete controlled chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.client_payload.issue }}
          RESULT_COMMENT_ID: ${{ github.event.client_payload.result_comment_id }}
          CHECKPOINT_STATE: ${{ github.event.client_payload.checkpoint_state }}
          BRANCH: ${{ github.event.client_payload.branch }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head }}
          IMPLEMENTATION_AUTHORIZED: ${{ github.event.client_payload.implementation_authorized }}
          SOURCE_COMMENT_ID: ${{ github.event.client_payload.source_comment_id }}
        run: |
          set -euo pipefail
          fail() { echo "E2E_COMPLETION_FAILURE: $1" >&2; exit 1; }

          test "$ISSUE" = "17" || fail "issue mismatch"
          test "$IMPLEMENTATION_AUTHORIZED" = "false" || fail "implementation authorization must remain false"
          test -n "$RESULT_COMMENT_ID" || fail "missing result comment id"
          test -n "$SOURCE_COMMENT_ID" || fail "missing source comment id"
          test -n "$BRANCH" || fail "missing branch"
          test -n "$EXPECTED_HEAD" || fail "missing head"

          RESULT_BODY=$(gh api "repos/${{ github.repository }}/issues/comments/$RESULT_COMMENT_ID" --jq '.body')
          printf '%s' "$RESULT_BODY" | grep -Fq '[KODJO_E2E_REVIEW_RESULT] VERIFIED_SUCCESS' || fail "review result marker missing"
          printf '%s' "$RESULT_BODY" | grep -Fq 'implementation_authorized=false' || fail "review safety marker missing"

          COMMENTS=$(gh api --paginate "repos/${{ github.repository }}/issues/17/comments")
          CHECKPOINT=$(printf '%s' "$COMMENTS" | jq -r '[.[] | select(.body | startswith("[KODJO_CHECKPOINT_ACTIVE]"))] | last | .body // empty')
          test -n "$CHECKPOINT" || fail "active checkpoint missing"
          CHECKPOINT_JSON=$(printf '%s\n' "$CHECKPOINT" | sed -n '/```json/,/```/p' | sed '1d;$d')

          printf '%s' "$CHECKPOINT_JSON" | jq -e \
            --arg state "$CHECKPOINT_STATE" --arg branch "$BRANCH" --arg head "$EXPECTED_HEAD" \
            '.schema == "kodjo.checkpoint.v1" and .issue == 17 and .state == $state and .branch == $branch and .head == $head and .implementation_authorized == false and .mode == "CLOUD_READ_ONLY" and .writer == "NONE"' >/dev/null \
            || fail "checkpoint changed or unsafe"

          CURRENT_HEAD=$(gh api "repos/${{ github.repository }}/branches/$BRANCH" --jq '.commit.sha')
          test "$CURRENT_HEAD" = "$EXPECTED_HEAD" || fail "feature branch HEAD changed"

          cat > /tmp/final.md <<EOF
          [KODJO_E2E_CHAIN_COMPLETE] VERIFIED_SUCCESS

          \`schema=kodjo.e2e-chain-complete.v1\`
          \`source_comment_id=$SOURCE_COMMENT_ID\`
          \`review_result_comment_id=$RESULT_COMMENT_ID\`
          \`checkpoint_state=$CHECKPOINT_STATE\`
          \`branch=$BRANCH\`
          \`head=$EXPECTED_HEAD\`
          \`implementation_authorized=false\`
          \`claude_triggered=false\`
          \`business_write=false\`

          Chaîne contrôlée terminée automatiquement après réception du repository_dispatch. Le checkpoint et le HEAD métier sont restés inchangés ; aucune autorisation d’implémentation et aucun appel Claude n’ont été produits par ce test.
          EOF
          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/final.md
