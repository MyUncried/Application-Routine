name: KODJO E2E Chain Completion V1.3
run-name: KODJO E2E — T6 real Claude Cloud

on:
  repository_dispatch:
    types: [kodjo-e2e-real-claude-t6]

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  t6-real-claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0
      - name: Validate orchestrator decision before T6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_COMMENT_ID: ${{ github.event.client_payload.result_comment_id }}
          BRANCH: ${{ github.event.client_payload.branch }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head }}
        run: |
          set -euo pipefail
          BODY=$(gh api "repos/${{ github.repository }}/issues/comments/$RESULT_COMMENT_ID" --jq '.body')
          printf '%s' "$BODY" | grep -Fq '[KODJO_E2E_ORCHESTRATOR_DECISION] VERIFIED_SUCCESS'
          printf '%s' "$BODY" | grep -Fq 'decision=CONTINUE_TO_REAL_CLAUDE_READ_ONLY'
          printf '%s' "$BODY" | grep -Fq 'implementation_authorized=false'
          printf '%s' "$BODY" | grep -Fq 'real_claude_authorized=true'
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - name: Run real Claude Cloud T6 read-only
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            KODJO E2E — T6 REAL CLAUDE CLOUD.
            You were automatically triggered after a ChatGPT-orchestrator decision in GitHub.
            Strictly read-only. Do not edit, write, commit, push, or access the network. Read `.github/AI_ORCHESTRATION.md` only enough to identify the KODJO protocol.
            Return a structured message confirming this real Claude Cloud invocation was reached automatically from the orchestrator decision, implementation remains unauthorized, and end exactly with `STATUT : KODJO_E2E_T6_REAL_CLAUDE_SUCCESS`.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep"
            --json-schema '{"type":"object","properties":{"message":{"type":"string"}},"required":["message"]}'
      - name: Publish T6 real Claude proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          SOURCE_COMMENT_ID: ${{ github.event.client_payload.source_comment_id }}
          RESULT_COMMENT_ID: ${{ github.event.client_payload.result_comment_id }}
          BRANCH: ${{ github.event.client_payload.branch }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head }}
        run: |
          set -euo pipefail
          MESSAGE=$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.message // empty')
          test -n "$MESSAGE"
          printf '%s' "$MESSAGE" | grep -Fq 'STATUT : KODJO_E2E_T6_REAL_CLAUDE_SUCCESS'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          cat > /tmp/t6.md <<EOF
          [KODJO_E2E_T6_REAL_CLAUDE] VERIFIED_SUCCESS
          [KODJO_E2E_REAL_CLAUDE_CHAIN]

          \`source_comment_id=$SOURCE_COMMENT_ID\`
          \`orchestrator_decision_comment_id=$RESULT_COMMENT_ID\`
          \`decision=CONTINUE_TO_REAL_CLAUDE_READ_ONLY\`
          \`branch=$BRANCH\`
          \`head=$EXPECTED_HEAD\`
          \`implementation_authorized=false\`
          \`real_claude_called=true\`
          \`business_write=false\`

          $MESSAGE
          EOF
          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/t6.md
