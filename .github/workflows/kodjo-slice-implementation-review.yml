name: KODJO — Generic Slice Implementation Review
run-name: KODJO SLICE / IMPLEMENTATION-REVIEW / ${{ github.event.comment.id || github.event.client_payload.source_comment_id }}

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [kodjo_implementation_ready]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-slice-implementation-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: (github.event_name == 'issue_comment' && ((github.event.comment.user.login == 'github-actions[bot]' && startsWith(github.event.comment.body, format('[KODJO_SLICE] IMPLEMENTATION_OUTPUT{0}', fromJSON('"\n"')))) || (github.event.comment.user.login == 'MyUncried' && startsWith(github.event.comment.body, format('[KODJO_SLICE] START_IMPLEMENTATION_REVIEW{0}', fromJSON('"\n"')))))) || (github.event_name == 'repository_dispatch' && github.event.action == 'kodjo_implementation_ready')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOURCE_BODY: ${{ github.event.comment.body || '' }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id || github.event.client_payload.source_comment_id }}
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate implementation output and manifest
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          source_body=$(jq -Rnr --arg body "$SOURCE_BODY" '$body | gsub("\\r"; "")')
          source_comment_id="$SOURCE_COMMENT_ID"
          first_line() {
            local line="${1%%$'\n'*}"
            printf '%s' "${line%$'\r'}"
          }
          trigger_marker=$(first_line "$source_body")
          if [ "$trigger_marker" = '[KODJO_SLICE] START_IMPLEMENTATION_REVIEW' ]; then
            mapfile -t recovery_ids < <(sed -n 's/^source_implementation_comment_id=\([0-9][0-9]*\)\r\{0,1\}$/\1/p' <<<"$source_body")
            [ "${#recovery_ids[@]}" -eq 1 ] || { echo 'Recovery trigger must contain exactly one valid source comment id' >&2; exit 1; }
            source_comment_id="${recovery_ids[0]}"
          elif [ -n "$source_body" ] && [ "$trigger_marker" != '[KODJO_SLICE] IMPLEMENTATION_OUTPUT' ]; then
            echo 'Invalid implementation review trigger marker' >&2
            exit 1
          fi
          [[ "$source_comment_id" =~ ^[0-9]+$ ]] || { echo 'Invalid source implementation comment id' >&2; exit 1; }
          source_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$source_comment_id")
          jq -e --arg issue "$ISSUE_NUMBER" '
            .user.login == "github-actions[bot]"
            and (.issue_url | endswith("/issues/" + $issue))
            and (.body | type == "string")
          ' <<<"$source_json" >/dev/null
          source_body=$(jq -r '.body | gsub("\\r"; "")' <<<"$source_json")
          [ "$(first_line "$source_body")" = '[KODJO_SLICE] IMPLEMENTATION_OUTPUT' ] || { echo 'Source comment is not an exact implementation output' >&2; exit 1; }
          slice=$(sed -n 's/^slice_id=//p' <<<"$source_body"|head -n1)
          head=$(sed -n 's/^head=//p' <<<"$source_body"|head -n1)
          base=$(sed -n 's/^base_head=//p' <<<"$source_body"|head -n1)
          session=$(sed -n 's/^session_id=//p' <<<"$source_body"|head -n1)
          plan=$(sed -n 's/^plan_comment_id=//p' <<<"$source_body"|head -n1)
          test -n "$slice" && [[ "$session" =~ ^[0-9a-f-]{36}$ ]] && [[ "$plan" =~ ^[0-9]+$ ]]
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] && [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          manifest=".github/orchestration/slices/$slice.yml"
          test -f "$manifest"
          export ISSUE_NUMBER slice head base
          ruby -ryaml -e 'm=YAML.safe_load(File.read(ARGV[0]),aliases:false);abort "identity" unless m["slice_id"]==ENV["slice"]&&m["issue_number"].to_i==ENV["ISSUE_NUMBER"].to_i;abort "baseline" unless m["baseline_head"]==ENV["base"];abort "branch" if m["target_branch"].to_s.empty?;puts m["target_branch"]' "$manifest" > /tmp/target-branch
          branch=$(cat /tmp/target-branch)
          remote=$(git ls-remote origin "refs/heads/$branch"|awk '{print $1}')
          test "$remote" = "$head"
          git merge-base --is-ancestor "$base" "$head"
          plan_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$plan")
          jq -e --arg issue "$ISSUE_NUMBER" '
            .user.login == "github-actions[bot]"
            and (.issue_url | endswith("/issues/" + $issue))
            and (.body | type == "string")
          ' <<<"$plan_json" >/dev/null
          plan_body=$(jq -r '.body | gsub("\\r"; "")' <<<"$plan_json")
          [ "$(first_line "$plan_body")" = '[KODJO_SLICE] PLAN_OUTPUT' ] || { echo 'Invalid source plan marker' >&2; exit 1; }
          printf 'slice_id=%s\nhead=%s\nbase=%s\nsession=%s\nplan=%s\nbranch=%s\nmanifest=%s\nsource_comment_id=%s\n' "$slice" "$head" "$base" "$session" "$plan" "$branch" "$manifest" "$source_comment_id" >> "$GITHUB_OUTPUT"
          printf '%s' "$plan_body" > /tmp/approved-plan.md

      - name: Checkout implementation HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run deterministic verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.gate.outputs.head }}"
          npm ci
          npm test -- --runInBand
          npx tsc --noEmit
          git diff --name-only "${{ steps.gate.outputs.base }}..${{ steps.gate.outputs.head }}" > /tmp/changed-files.txt
          test -s /tmp/changed-files.txt
          ! grep -Fxq 'src/infrastructure/database/migrations/migration001.ts' /tmp/changed-files.txt

      - name: Independent OpenAI review
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          HEAD: ${{ steps.gate.outputs.head }}
          BASE: ${{ steps.gate.outputs.base }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          git diff --stat "$BASE..$HEAD" > /tmp/diff-stat.txt
          git diff "$BASE..$HEAD" > /tmp/diff.patch
          {
            echo "You are the independent KODJO implementation reviewer for $SLICE_ID."
            echo "Review exact commit $HEAD against the approved plan and repository sources. Reuse the validated S09 review criteria: scope, correctness, persistence atomicity, migrations, backward compatibility, tests, Unicode, UI contracts, non-regression, and evidence integrity."
            echo "Do not modify files. End with exactly VERDICT: APPROVE or VERDICT: REVISE. If REVISE, list only demonstrated blocking points and a precise REVIEW_FEEDBACK section."
            echo
            echo "APPROVED PLAN:"
            cat /tmp/approved-plan.md
            echo
            echo "CHANGED FILES:"
            cat /tmp/changed-files.txt
            echo
            echo "DIFF:"
            head -c 700000 /tmp/diff.patch
          } > /tmp/review-prompt.txt
          jq -n --arg model 'gpt-5.6-luna' --rawfile prompt /tmp/review-prompt.txt '{model:$model,input:$prompt,store:false,reasoning:{effort:"high"},max_output_tokens:12000,text:{verbosity:"medium"}}' > /tmp/review-request.json
          curl --fail-with-body -sS https://api.openai.com/v1/responses -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' -d @/tmp/review-request.json -o /tmp/review-response.json
          status=$(jq -r '.status // "missing"' /tmp/review-response.json)
          if [ "$status" != completed ]; then jq -c '{status,incomplete_details,error,usage}' /tmp/review-response.json >&2; exit 1; fi
          jq -er '[.output[]?|select(.type=="message")|.content[]?|select(.type=="output_text")|.text]|join("\n")|select(length>0)' /tmp/review-response.json > /tmp/review.md
          grep -Eq '^VERDICT: (APPROVE|REVISE)$' /tmp/review.md

      - name: Publish implementation verdict
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          HEAD: ${{ steps.gate.outputs.head }}
          BASE: ${{ steps.gate.outputs.base }}
          SESSION: ${{ steps.gate.outputs.session }}
          PLAN: ${{ steps.gate.outputs.plan }}
          SOURCE_COMMENT_ID: ${{ steps.gate.outputs.source_comment_id }}
        run: |
          set -euo pipefail
          verdict=$(sed -n 's/^VERDICT: //p' /tmp/review.md|tail -n1)
          if [ "$verdict" = APPROVE ]; then status=IMPLEMENTATION_REVIEW_APPROVED; else status=IMPLEMENTATION_REVISION_REQUIRED; fi
          {
            echo '[KODJO_SLICE] IMPLEMENTATION_REVIEW_OUTPUT'
            echo "slice_id=$SLICE_ID"
            echo "base_head=$BASE"
            echo "head=$HEAD"
            echo "session_id=$SESSION"
            echo "plan_comment_id=$PLAN"
            echo "source_implementation_comment_id=$SOURCE_COMMENT_ID"
            echo "verdict=$verdict"
            echo "STATUT : $status"
            echo
            cat /tmp/review.md
          } > /tmp/review-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/review-comment.md

      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-slice-implementation-review-${{ github.run_id }}
          path: |
            /tmp/review-response.json
            /tmp/review.md
            /tmp/changed-files.txt
            /tmp/diff-stat.txt
          if-no-files-found: warn
          retention-days: 7
