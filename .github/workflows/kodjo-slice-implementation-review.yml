name: KODJO — Generic Slice Implementation Review
run-name: KODJO SLICE / IMPLEMENTATION-REVIEW / ${{ github.event.comment.id || github.event.client_payload.source_comment_id }}

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [kodjo_implementation_ready]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: kodjo-slice-implementation-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: (github.event_name == 'issue_comment' && ((github.event.comment.user.login == 'github-actions[bot]' && startsWith(github.event.comment.body, format('[KODJO_SLICE] IMPLEMENTATION_OUTPUT{0}', fromJSON('"\n"')))) || (github.event.comment.user.login == 'MyUncried' && startsWith(github.event.comment.body, format('[KODJO_SLICE] START_IMPLEMENTATION_REVIEW{0}', fromJSON('"\n"')))))) || (github.event_name == 'repository_dispatch' && github.event.action == 'kodjo_implementation_ready')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOURCE_BODY: ${{ github.event.comment.body || '' }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id || github.event.client_payload.source_comment_id }}
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Test incremental review bridge invariants
        shell: bash
        run: bash .github/orchestration/tests/test-increment-review-gate.sh

      - name: Validate implementation output and manifest
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          source_body=$(jq -Rnr --arg body "$SOURCE_BODY" '$body | gsub("\\r"; "")')
          source_comment_id="$SOURCE_COMMENT_ID"
          recovery_trigger_comment_id=""
          first_line() {
            local line="${1%%$'\n'*}"
            printf '%s' "${line%$'\r'}"
          }
          extract_exactly_one() {
            local body="$1" expression="$2" label="$3" values=()
            mapfile -t values < <(sed -n "$expression" <<<"$body")
            [ "${#values[@]}" -eq 1 ] || { echo "$label must occur exactly once" >&2; return 1; }
            printf '%s' "${values[0]}"
          }
          trigger_marker=$(first_line "$source_body")
          if [ "$trigger_marker" = '[KODJO_SLICE] START_IMPLEMENTATION_REVIEW' ]; then
            mapfile -t recovery_ids < <(sed -n 's/^source_implementation_comment_id=\([0-9][0-9]*\)\r\{0,1\}$/\1/p' <<<"$source_body")
            [ "${#recovery_ids[@]}" -eq 1 ] || { echo 'Recovery trigger must contain exactly one valid source comment id' >&2; exit 1; }
            source_comment_id="${recovery_ids[0]}"
            mapfile -t recovery_trigger_ids < <(sed -n 's/^source_implementation_trigger_comment_id=\([0-9][0-9]*\)$/\1/p' <<<"$source_body")
            [ "${#recovery_trigger_ids[@]}" -le 1 ] || { echo 'Recovery trigger contains duplicate implementation trigger ids' >&2; exit 1; }
            if [ "${#recovery_trigger_ids[@]}" -eq 1 ]; then recovery_trigger_comment_id="${recovery_trigger_ids[0]}"; fi
          elif [ -n "$source_body" ] && [ "$trigger_marker" != '[KODJO_SLICE] IMPLEMENTATION_OUTPUT' ]; then
            echo 'Invalid implementation review trigger marker' >&2
            exit 1
          fi
          [[ "$source_comment_id" =~ ^[0-9]+$ ]] || { echo 'Invalid source implementation comment id' >&2; exit 1; }
          source_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$source_comment_id")
          jq -e --arg issue "$ISSUE_NUMBER" '
            .user.login == "github-actions[bot]"
            and (.issue_url | endswith("/issues/" + $issue))
            and (.body | type == "string")
          ' <<<"$source_json" >/dev/null
          source_body=$(jq -r '.body | gsub("\\r"; "")' <<<"$source_json")
          [ "$(first_line "$source_body")" = '[KODJO_SLICE] IMPLEMENTATION_OUTPUT' ] || { echo 'Source comment is not an exact implementation output' >&2; exit 1; }
          slice=$(extract_exactly_one "$source_body" 's/^slice_id=//p' slice_id)
          head=$(extract_exactly_one "$source_body" 's/^head=//p' head)
          base=$(extract_exactly_one "$source_body" 's/^base_head=//p' base_head)
          session=$(extract_exactly_one "$source_body" 's/^session_id=//p' session_id)
          plan=$(extract_exactly_one "$source_body" 's/^plan_comment_id=//p' plan_comment_id)
          plan_review=$(extract_exactly_one "$source_body" 's/^plan_review_comment_id=//p' plan_review_comment_id)
          mapfile -t increments < <(sed -n 's/^increment=\(LOT_[1-9][0-9]*_OF_[1-9][0-9]*\)$/\1/p' <<<"$source_body")
          mapfile -t output_trigger_ids < <(sed -n 's/^source_implementation_trigger_comment_id=\([0-9][0-9]*\)$/\1/p' <<<"$source_body")
          [ "${#increments[@]}" -le 1 ] && [ "${#output_trigger_ids[@]}" -le 1 ] || { echo 'Duplicate increment causality fields' >&2; exit 1; }
          if [ "${#increments[@]}" -eq 1 ] && [ "${#output_trigger_ids[@]}" -eq 1 ]; then
            increment="${increments[0]}"
            implementation_trigger_comment_id="${output_trigger_ids[0]}"
            if [ -n "$recovery_trigger_comment_id" ] && [ "$recovery_trigger_comment_id" != "$implementation_trigger_comment_id" ]; then echo 'Recovery trigger causality mismatch' >&2; exit 1; fi
          elif [ "${#increments[@]}" -eq 0 ] && [ "${#output_trigger_ids[@]}" -eq 0 ] && [ -n "$recovery_trigger_comment_id" ]; then
            implementation_trigger_comment_id="$recovery_trigger_comment_id"
          else
            echo 'Implementation output lacks complete increment causality' >&2; exit 1
          fi
          test -n "$slice" && [[ "$session" =~ ^[0-9a-f-]{36}$ ]] && [[ "$plan" =~ ^[0-9]+$ ]] && [[ "$plan_review" =~ ^[0-9]+$ ]]
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] && [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          if grep -Fxq 'continuity_origin=V2_LEAN_QUEUE' <<<"$source_body"; then
            v2_queue_path=$(extract_exactly_one "$source_body" 's/^v2_queue_path=//p' v2_queue_path)
            v2_protocol_head=$(extract_exactly_one "$source_body" 's/^v2_protocol_head=//p' v2_protocol_head)
            v2_request_id=$(extract_exactly_one "$source_body" 's/^v2_request_id=//p' v2_request_id)
            application_pr=$(extract_exactly_one "$source_body" 's/^application_pr=\([1-9][0-9]*\)$/\1/p' application_pr)
            branch=$(extract_exactly_one "$source_body" 's/^application_branch=//p' application_branch)
            case "$v2_queue_path" in .github/orchestration/queue/v2/*.json) ;; *) echo 'Invalid V2 queue path' >&2; exit 1 ;; esac
            [[ "$v2_protocol_head" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid V2 protocol head' >&2; exit 1; }
            [[ "$v2_request_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Invalid V2 request id' >&2; exit 1; }
            test -f "$v2_queue_path"
            jq -e --arg slice "$slice" --arg base "$base" --arg protocol "$v2_protocol_head" --arg request "$v2_request_id" '
              .slice_id == $slice
              and .source_head == $base
              and .source_head == $protocol
              and .request_id == $request
              and .authorized_plan.plan_blob_oid
              and .independent_review.review_blob_oid
              and .user_gate.gate_ref
            ' "$v2_queue_path" >/dev/null
            KODJO_VERIFY_GITHUB=1 node scripts/kodjo/verify-authorizations.js "$v2_queue_path"

            gate_ref=$(jq -r '.user_gate.gate_ref' "$v2_queue_path")
            [[ "$gate_ref" =~ ^issue_comment:([1-9][0-9]*)$ ]] || { echo 'Invalid V2 gate ref' >&2; exit 1; }
            gate_id="${BASH_REMATCH[1]}"
            [ "$implementation_trigger_comment_id" = "$gate_id" ] || { echo 'V2 gate causality mismatch' >&2; exit 1; }
            gate_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$gate_id")
            gate_body=$(jq -r '.body | gsub("\r"; "")' <<<"$gate_json")
            gate_plan=$(extract_exactly_one "$gate_body" 's/^source_plan_comment_id=//p' gate_plan_comment_id)
            gate_review=$(extract_exactly_one "$gate_body" 's/^source_review_comment_id=//p' gate_review_comment_id)
            [ "$gate_plan" = "$plan" ] && [ "$gate_review" = "$plan_review" ] || { echo 'V2 plan/review binding mismatch' >&2; exit 1; }

            [ "$increment" = 'LOT_1_OF_1' ] || { echo 'V2 review must cover LOT_1_OF_1' >&2; exit 1; }
            baseline="$base"
            manifest="$v2_queue_path"
            [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid V2 baseline SHA' >&2; exit 1; }

            pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$application_pr")
            jq -e --arg head "$head" --arg branch "$branch" '
              .state == "open" and .base.ref == "main" and .head.sha == $head and .head.ref == $branch
            ' <<<"$pr_json" >/dev/null

            implementation_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$head" --jq '.status')
            [ "$implementation_status" = ahead ] || { echo 'V2 implementation HEAD is not strictly descended from baseline' >&2; exit 1; }

            plan_blob=$(jq -r '.authorized_plan.plan_blob_oid' "$v2_queue_path")
            [[ "$plan_blob" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid V2 plan blob' >&2; exit 1; }
            plan_body=$(git cat-file -p "$plan_blob")
            plan_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$plan")
            jq -e --arg issue "$ISSUE_NUMBER" '
              .user.login == "github-actions[bot]"
              and (.issue_url | endswith("/issues/" + $issue))
              and (.body | type == "string")
            ' <<<"$plan_json" >/dev/null
            v2_plan_comment_body=$(jq -r '.body | gsub("\r"; "")' <<<"$plan_json")
            [ "$(first_line "$v2_plan_comment_body")" = '[KODJO_V2] PLAN_OUTPUT' ] || { echo 'Invalid V2 source plan marker' >&2; exit 1; }
          else
            trigger_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$implementation_trigger_comment_id")
            jq -e --arg issue "$ISSUE_NUMBER" '.user.login == "MyUncried" and (.issue_url | endswith("/issues/" + $issue)) and (.body | type == "string")' <<<"$trigger_json" >/dev/null
            trigger_body=$(jq -r '.body | gsub("\\r"; "")' <<<"$trigger_json")
            trigger_marker=$(first_line "$trigger_body")
            case "$trigger_marker" in
              '[KODJO_SLICE] START_IMPLEMENTATION'|'[KODJO_SLICE] IMPLEMENTATION_REVISION'|'[KODJO_SLICE] VISUAL_CORRECTION') ;;
              *) echo 'Invalid source implementation trigger marker' >&2; exit 1 ;;
            esac
            trigger_slice=$(extract_exactly_one "$trigger_body" 's/^slice_id=//p' trigger_slice_id)
            trigger_source=$(extract_exactly_one "$trigger_body" 's/^source_head=//p' trigger_source_head)
            trigger_plan=$(extract_exactly_one "$trigger_body" 's/^source_plan_comment_id=//p' trigger_plan_comment_id)
            trigger_review=$(extract_exactly_one "$trigger_body" 's/^source_review_comment_id=//p' trigger_review_comment_id)
            mapfile -t trigger_sessions < <(sed -n 's/^session_id=//p' <<<"$trigger_body")
            [ "${#trigger_sessions[@]}" -le 1 ] || { echo 'Duplicate trigger session_id' >&2; exit 1; }
            trigger_session="${trigger_sessions[0]:-}"
            mapfile -t trigger_increments < <(sed -n 's/^increment=\(LOT_[1-9][0-9]*_OF_[1-9][0-9]*\)$/\1/p' <<<"$trigger_body")
            [ "${#trigger_increments[@]}" -eq 1 ] || { echo 'Source trigger must contain exactly one valid increment' >&2; exit 1; }
            if [ -z "${increment:-}" ]; then increment="${trigger_increments[0]}"; fi
            [[ "$increment" =~ ^LOT_([1-9][0-9]*)_OF_([1-9][0-9]*)$ ]] && [ "${BASH_REMATCH[1]}" -le "${BASH_REMATCH[2]}" ] || { echo 'Invalid increment bounds' >&2; exit 1; }
            [ "$increment" = "${trigger_increments[0]}" ] && [ "$trigger_slice" = "$slice" ] && [ "$trigger_source" = "$base" ] && [ "$trigger_plan" = "$plan" ] && [ "$trigger_review" = "$plan_review" ] || { echo 'Implementation trigger causality mismatch' >&2; exit 1; }
            if [ -n "$trigger_session" ] && [ "$trigger_session" != "$session" ]; then echo 'Implementation session causality mismatch' >&2; exit 1; fi
            manifest=".github/orchestration/slices/$slice.yml"
            test -f "$manifest"
            export ISSUE_NUMBER slice
            ruby -ryaml -e 'm=YAML.safe_load(File.read(ARGV[0]),aliases:false);abort "identity" unless m["slice_id"]==ENV["slice"]&&m["issue_number"].to_i==ENV["ISSUE_NUMBER"].to_i;baseline=m["baseline_head"].to_s;branch=m["target_branch"].to_s;abort "baseline" if baseline.empty?;abort "branch" if branch.empty?;puts branch;puts baseline' "$manifest" > /tmp/manifest-gate
            mapfile -t manifest_gate < /tmp/manifest-gate
            [ "${#manifest_gate[@]}" -eq 2 ] || { echo 'Invalid manifest gate output' >&2; exit 1; }
            branch="${manifest_gate[0]}"
            baseline="${manifest_gate[1]}"
            [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid manifest baseline SHA' >&2; exit 1; }
            remote=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
            test "$remote" = "$head"
            baseline_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$baseline...$base" --jq '.status')
            case "$baseline_status" in identical|ahead) ;; *) echo 'Implementation base is not descended from manifest baseline' >&2; exit 1 ;; esac
            implementation_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$head" --jq '.status')
            [ "$implementation_status" = ahead ] || { echo 'Implementation HEAD is not strictly descended from implementation base' >&2; exit 1; }
            plan_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$plan")
            jq -e --arg issue "$ISSUE_NUMBER" '
              .user.login == "github-actions[bot]"
              and (.issue_url | endswith("/issues/" + $issue))
              and (.body | type == "string")
            ' <<<"$plan_json" >/dev/null
            plan_body=$(jq -r '.body | gsub("\\r"; "")' <<<"$plan_json")
            [ "$(first_line "$plan_body")" = '[KODJO_SLICE] PLAN_OUTPUT' ] || { echo 'Invalid source plan marker' >&2; exit 1; }
            fi
          printf 'slice_id=%s\nhead=%s\nbase=%s\nsession=%s\nplan=%s\nbranch=%s\nmanifest=%s\nsource_comment_id=%s\nincrement=%s\nimplementation_trigger_comment_id=%s\n' "$slice" "$head" "$base" "$session" "$plan" "$branch" "$manifest" "$source_comment_id" "$increment" "$implementation_trigger_comment_id" >> "$GITHUB_OUTPUT"
          printf '%s' "$plan_body" > /tmp/approved-plan.md
          printf '%s' "$source_body" > /tmp/implementation-output.md

      - name: Checkout implementation HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run deterministic verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.gate.outputs.head }}"
          npm ci
          npm test -- --runInBand
          npx tsc --noEmit
          git diff --name-only "${{ steps.gate.outputs.base }}..${{ steps.gate.outputs.head }}" > /tmp/changed-files.txt
          test -s /tmp/changed-files.txt
          ! grep -Fxq 'src/infrastructure/database/migrations/migration001.ts' /tmp/changed-files.txt

      - name: Independent OpenAI review
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          HEAD: ${{ steps.gate.outputs.head }}
          BASE: ${{ steps.gate.outputs.base }}
          INCREMENT: ${{ steps.gate.outputs.increment }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          git diff --stat "$BASE..$HEAD" > /tmp/diff-stat.txt
          git diff "$BASE..$HEAD" > /tmp/diff.patch
          {
            echo "You are the independent KODJO implementation reviewer for $SLICE_ID, increment $INCREMENT only."
            echo "Review exact commit $HEAD only against the requirements explicitly allocated to $INCREMENT in the approved plan, using the implementation output as the authoritative statement of the delivered increment. Requirements allocated to later increments are deferred: their absence MUST NOT be reported as a defect, missing scope, missing wiring, or missing test."
            echo "Apply the validated S09 criteria only where they are applicable to $INCREMENT: scope, correctness, persistence atomicity, migrations, backward compatibility, tests, Unicode, UI contracts, non-regression, and evidence integrity. The deterministic gate immediately preceding this review has already completed npm test and TypeScript successfully; do not claim those checks were not run. You may report only a demonstrated defect in their actual results or coverage within $INCREMENT."
            echo "Do not modify files. End with exactly VERDICT: APPROVE or VERDICT: REVISE. If REVISE, list only demonstrated blocking points inside $INCREMENT and a precise REVIEW_FEEDBACK section."
            echo
            echo "IMPLEMENTATION OUTPUT:"
            cat /tmp/implementation-output.md
            echo
            echo "APPROVED PLAN:"
            cat /tmp/approved-plan.md
            echo
            echo "CHANGED FILES:"
            cat /tmp/changed-files.txt
            echo
            echo "DIFF:"
            head -c 700000 /tmp/diff.patch
          } > /tmp/review-prompt.txt
          jq -n --arg model 'gpt-5.6-luna' --rawfile prompt /tmp/review-prompt.txt '{model:$model,input:$prompt,store:false,reasoning:{effort:"high"},max_output_tokens:12000,text:{verbosity:"medium"}}' > /tmp/review-request.json
          curl --fail-with-body -sS https://api.openai.com/v1/responses -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' -d @/tmp/review-request.json -o /tmp/review-response.json
          status=$(jq -r '.status // "missing"' /tmp/review-response.json)
          if [ "$status" != completed ]; then jq -c '{status,incomplete_details,error,usage}' /tmp/review-response.json >&2; exit 1; fi
          jq -er '[.output[]?|select(.type=="message")|.content[]?|select(.type=="output_text")|.text]|join("\n")|select(length>0)' /tmp/review-response.json > /tmp/review.md
          grep -Eq '^VERDICT: (APPROVE|REVISE)$' /tmp/review.md

      - name: Publish implementation verdict
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          HEAD: ${{ steps.gate.outputs.head }}
          BASE: ${{ steps.gate.outputs.base }}
          SESSION: ${{ steps.gate.outputs.session }}
          PLAN: ${{ steps.gate.outputs.plan }}
          SOURCE_COMMENT_ID: ${{ steps.gate.outputs.source_comment_id }}
          INCREMENT: ${{ steps.gate.outputs.increment }}
          IMPLEMENTATION_TRIGGER_COMMENT_ID: ${{ steps.gate.outputs.implementation_trigger_comment_id }}
        run: |
          set -euo pipefail
          verdict=$(sed -n 's/^VERDICT: //p' /tmp/review.md|tail -n1)
          if [ "$verdict" = APPROVE ]; then status=IMPLEMENTATION_REVIEW_APPROVED; else status=IMPLEMENTATION_REVISION_REQUIRED; fi
          {
            echo '[KODJO_SLICE] IMPLEMENTATION_REVIEW_OUTPUT'
            echo "slice_id=$SLICE_ID"
            echo "increment=$INCREMENT"
            echo "base_head=$BASE"
            echo "head=$HEAD"
            echo "session_id=$SESSION"
            echo "plan_comment_id=$PLAN"
            echo "source_implementation_comment_id=$SOURCE_COMMENT_ID"
            echo "source_implementation_trigger_comment_id=$IMPLEMENTATION_TRIGGER_COMMENT_ID"
            echo "verdict=$verdict"
            echo "STATUT : $status"
            echo
            cat /tmp/review.md
          } > /tmp/review-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/review-comment.md

      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-slice-implementation-review-${{ github.run_id }}
          path: |
            /tmp/review-response.json
            /tmp/review.md
            /tmp/changed-files.txt
            /tmp/diff-stat.txt
          if-no-files-found: warn
          retention-days: 7
