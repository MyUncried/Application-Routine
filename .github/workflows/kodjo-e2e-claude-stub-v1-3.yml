name: KODJO E2E Claude Stub V1.3
run-name: KODJO E2E — fake Claude job

on:
  repository_dispatch:
    types: [kodjo-e2e-claude-stub]

permissions:
  contents: read
  issues: write

jobs:
  fake-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Execute fake Claude endpoint only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.client_payload.issue }}
          RESULT_COMMENT_ID: ${{ github.event.client_payload.result_comment_id }}
          SOURCE_COMMENT_ID: ${{ github.event.client_payload.source_comment_id }}
          BRANCH: ${{ github.event.client_payload.branch }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head }}
          DECISION: ${{ github.event.client_payload.decision }}
          IMPLEMENTATION_AUTHORIZED: ${{ github.event.client_payload.implementation_authorized }}
          REAL_CLAUDE_AUTHORIZED: ${{ github.event.client_payload.real_claude_authorized }}
        run: |
          set -euo pipefail
          fail() { echo "E2E_CLAUDE_STUB_FAILURE: $1" >&2; exit 1; }

          test "$ISSUE" = "17" || fail "issue mismatch"
          test "$DECISION" = "CONTINUE_TO_CLAUDE_STUB" || fail "unexpected decision"
          test "$IMPLEMENTATION_AUTHORIZED" = "false" || fail "implementation authorization must remain false"
          test "$REAL_CLAUDE_AUTHORIZED" = "false" || fail "real Claude authorization must remain false"
          test -n "$RESULT_COMMENT_ID" || fail "missing orchestrator decision comment id"
          test -n "$SOURCE_COMMENT_ID" || fail "missing source comment id"
          test -n "$BRANCH" || fail "missing branch"
          test -n "$EXPECTED_HEAD" || fail "missing head"

          DECISION_BODY=$(gh api "repos/${{ github.repository }}/issues/comments/$RESULT_COMMENT_ID" --jq '.body')
          printf '%s' "$DECISION_BODY" | grep -Fq '[KODJO_E2E_ORCHESTRATOR_DECISION] VERIFIED_SUCCESS' || fail "orchestrator decision missing"
          printf '%s' "$DECISION_BODY" | grep -Fq 'decision=CONTINUE_TO_CLAUDE_STUB' || fail "decision marker mismatch"

          CURRENT_HEAD=$(gh api "repos/${{ github.repository }}/branches/$BRANCH" --jq '.commit.sha')
          test "$CURRENT_HEAD" = "$EXPECTED_HEAD" || fail "feature branch HEAD changed"

          cat > /tmp/stub.md <<EOF
          [KODJO_E2E_CLAUDE_STUB] VERIFIED_SUCCESS

          \`schema=kodjo.e2e-claude-stub.v1\`
          \`source_comment_id=$SOURCE_COMMENT_ID\`
          \`orchestrator_decision_comment_id=$RESULT_COMMENT_ID\`
          \`decision=CONTINUE_TO_CLAUDE_STUB\`
          \`branch=$BRANCH\`
          \`head=$EXPECTED_HEAD\`
          \`implementation_authorized=false\`
          \`real_claude_called=false\`
          \`business_write=false\`

          Job Claude factice exécuté automatiquement. Ce workflow ne contient aucun appel à Claude et ne modifie aucun fichier métier.
          EOF
          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/stub.md
