name: KODJO recover interrupted run 37446216690
on:
  create:
permissions:
  contents: read
jobs:
  recover:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'recovery/vnext-run-37446216690-20261006')
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 120
    steps:
      - name: Copy durable reservation and runner diagnostics into one recovery directory
        shell: cmd
        run: |
          node -e "const fs=require('fs'),p=require('path'),os=require('os');const out=p.join(process.env.RUNNER_TEMP,'vnext-recovery-37446216690');fs.mkdirSync(out,{recursive:true});const claim=p.join(os.homedir(),'.kodjo-vnext12','628b3349-88b4-4bf1-be6b-50bc09e7d245','figma','6ea7b481-9de4-463a-a79b-26327a2bbcca');if(fs.existsSync(claim))fs.cpSync(claim,p.join(out,'reservation'),{recursive:true});const diag=p.resolve(process.env.RUNNER_TEMP,'..','..','_diag');if(fs.existsSync(diag)){const d=p.join(out,'runner-diagnostics');fs.mkdirSync(d);for(const n of fs.readdirSync(diag).filter(n=>/^(Worker|Runner)_20261006/.test(n))){const f=p.join(diag,n);if(fs.statSync(f).isFile())fs.copyFileSync(f,p.join(d,n));}}const fixture=p.join(os.tmpdir(),'vnext-figma-TF9fPs');if(fs.existsSync(fixture)){fs.cpSync(fixture,p.join(out,'retained-fixture'),{recursive:true,filter:f=>!f.split(p.sep).some(x=>['.git','node_modules'].includes(x))});const cp=require('child_process');for(const args of [['rev-parse','HEAD'],['status','--short'],['log','-3','--oneline']]){try{console.log('FIXTURE_GIT '+JSON.stringify(args)+' '+cp.execFileSync('git',args,{cwd:fixture,encoding:'utf8'}));}catch(e){console.log('FIXTURE_GIT_ERROR '+e.message);}}}const runners=fs.existsSync(diag)?fs.readdirSync(diag).filter(n=>/^Runner_/.test(n)).sort().slice(-2):[];for(const n of runners)fs.copyFileSync(p.join(diag,n),p.join(out,n));console.log('RECOVERY_FIXTURE_EXISTS '+fs.existsSync(fixture));"
      - name: Preserve original evidence and exact request reservation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-original-37446216690
          path: ${{ runner.temp }}/vnext-recovery-37446216690/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
