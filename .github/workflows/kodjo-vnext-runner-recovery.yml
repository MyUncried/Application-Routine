name: KODJO recover interrupted run 37446216690
on:
  create:
permissions:
  contents: read
jobs:
  recover:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'recovery/vnext-run-37446216690-20261006')
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 120
    steps:
      - name: Inventory and summarize retained evidence without executing Claude
        shell: cmd
        run: |
          node -e "const fs=require('fs'),p=require('path'),os=require('os'); const root=p.join(process.env.RUNNER_TEMP,'vnext12-figma-37446216690-1'); const claim=p.join(os.homedir(),'.kodjo-vnext12','628b3349-88b4-4bf1-be6b-50bc09e7d245','figma','6ea7b481-9de4-463a-a79b-26327a2bbcca'); for(const dir of [root,claim]) {console.log('RECOVERY_DIRECTORY '+dir); if(!fs.existsSync(dir)){console.log('NOT_FOUND');continue;} const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=p.join(d,e.name);if(e.isDirectory())walk(f);else{console.log('RECOVERY_FILE '+f+' '+fs.statSync(f).size);if(/(?:status|process|admission|started|lock|response|review).*\.json$/.test(e.name)){const t=fs.readFileSync(f,'utf8'); if(t.length<100000)console.log('RECOVERY_JSON '+p.relative(dir,f)+' '+t);}}}}; walk(dir);}"
      - name: Copy durable reservation and runner diagnostics into one recovery directory
        shell: cmd
        run: |
          node -e "const fs=require('fs'),p=require('path'),os=require('os');const out=p.join(process.env.RUNNER_TEMP,'vnext-recovery-37446216690');fs.mkdirSync(out,{recursive:true});const claim=p.join(os.homedir(),'.kodjo-vnext12','628b3349-88b4-4bf1-be6b-50bc09e7d245','figma','6ea7b481-9de4-463a-a79b-26327a2bbcca');if(fs.existsSync(claim))fs.cpSync(claim,p.join(out,'reservation'),{recursive:true});const diag=p.resolve(process.env.RUNNER_TEMP,'..','..','_diag');if(fs.existsSync(diag)){const d=p.join(out,'runner-diagnostics');fs.mkdirSync(d);for(const n of fs.readdirSync(diag).filter(n=>/^(Worker|Runner)_20261006/.test(n))){const f=p.join(diag,n);if(fs.statSync(f).isFile())fs.copyFileSync(f,p.join(d,n));}}const candidates=[];for(const dir of [os.tmpdir(),p.dirname(process.env.RUNNER_TEMP)])if(fs.existsSync(dir))for(const n of fs.readdirSync(dir))if(/figma|vnext|kodjo/.test(n))candidates.push(p.join(dir,n));fs.writeFileSync(p.join(out,'retained-candidates.json'),JSON.stringify(candidates,null,2));console.log('RECOVERY_CANDIDATES '+JSON.stringify(candidates));"
      - name: Preserve original evidence and exact request reservation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-original-37446216690
          path: ${{ runner.temp }}/vnext-recovery-37446216690/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
