name: KODJO Event Router V1.3
run-name: KODJO event router — Issue #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  route-event:
    if: >
      github.event.issue.number == 17 &&
      (
        contains(github.event.comment.body, '[KODJO_TEST_EVENT]') ||
        (github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, 'STATUT : PLAN_READY_FOR_REVIEW')) ||
        (github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, 'STATUT : IMPLEMENTATION_READY_FOR_REVIEW')) ||
        contains(github.event.comment.body, '[KODJO_USER_INPUT]')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Build verified resume event and test OpenAI bridge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          COMMENTS=$(gh api --paginate repos/${{ github.repository }}/issues/17/comments)
          CHECKPOINT=$(printf '%s' "$COMMENTS" | jq -r '[.[] | select(.body | startswith("[KODJO_CHECKPOINT_ACTIVE]"))] | last | .body // empty')
          test -n "$CHECKPOINT"

          CHECKPOINT_JSON=$(printf '%s\n' "$CHECKPOINT" | sed -n '/```json/,/```/p' | sed '1d;$d')
          printf '%s' "$CHECKPOINT_JSON" | jq -e '.schema == "kodjo.checkpoint.v1" and .issue == 17' >/dev/null

          if printf '%s' "$COMMENT_BODY" | grep -q '\[KODJO_TEST_EVENT\]'; then
            EVENT_TYPE="TEST_RESUME_EVENT"
          elif printf '%s' "$COMMENT_BODY" | grep -q 'STATUT : IMPLEMENTATION_READY_FOR_REVIEW'; then
            EVENT_TYPE="CLAUDE_IMPLEMENTATION_READY"
          elif printf '%s' "$COMMENT_BODY" | grep -q 'STATUT : PLAN_READY_FOR_REVIEW'; then
            EVENT_TYPE="CLAUDE_PLAN_READY"
          else
            EVENT_TYPE="USER_INPUT"
          fi

          BRANCH=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.branch')
          HEAD=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.head')
          STATE=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.state')
          NEXT_ACTOR=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.next_actor')

          cat > /tmp/event.md <<EOF
          [KODJO_EVENT] CHATGPT_RESUME_REQUIRED

          \`schema=kodjo.resume-event.v1\`
          \`event_type=$EVENT_TYPE\`
          \`source_comment_id=$COMMENT_ID\`
          \`source_author=$COMMENT_AUTHOR\`
          \`checkpoint_state=$STATE\`
          \`next_actor=$NEXT_ACTOR\`
          \`branch=$BRANCH\`
          \`head=$HEAD\`

          Événement GitHub détecté et checkpoint actif validé. Cet événement matérialise la reprise attendue pour ChatGPT. Il ne constitue aucune autorisation d'écriture.
          EOF

          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/event.md

          # Phase 1 bridge test only. Real plan/implementation events do not call OpenAI yet.
          if [ "$EVENT_TYPE" != "TEST_RESUME_EVENT" ]; then
            exit 0
          fi

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            gh issue comment 17 --repo "${{ github.repository }}" --body "[KODJO_OPENAI_TEST_RESULT] ORCHESTRATION_FAILURE — OPENAI_API_KEY absent. Aucune écriture métier autorisée."
            exit 1
          fi

          PROMPT=$(cat <<EOF
          You are the KODJO orchestration bridge test. Validate the supplied active checkpoint and controlled GitHub resume event.
          This is NOT an implementation authorization. You must not authorize business-code writes.
          Return RESUME_ACCEPTED only if the checkpoint schema is kodjo.checkpoint.v1, issue is 17, current state is PLAN_APPROVED, and implementation_authorized is false.

          Event type: $EVENT_TYPE
          Source comment id: $COMMENT_ID
          Active checkpoint JSON:
          $CHECKPOINT_JSON
          EOF
          )

          jq -n \
            --arg model "gpt-5.6-luna" \
            --arg prompt "$PROMPT" \
            '{
              model: $model,
              input: $prompt,
              store: false,
              reasoning: {effort: "none"},
              max_output_tokens: 300,
              text: {
                verbosity: "low",
                format: {
                  type: "json_schema",
                  name: "kodjo_bridge_test",
                  strict: true,
                  schema: {
                    type: "object",
                    properties: {
                      schema: {type: "string", enum: ["kodjo.openai-bridge-test.v1"]},
                      decision: {type: "string", enum: ["RESUME_ACCEPTED"]},
                      checkpoint_state: {type: "string", enum: ["PLAN_APPROVED"]},
                      implementation_authorized: {type: "boolean"},
                      reason: {type: "string"}
                    },
                    required: ["schema", "decision", "checkpoint_state", "implementation_authorized", "reason"],
                    additionalProperties: false
                  }
                }
              }
            }' > /tmp/openai-request.json

          if ! curl --fail-with-body -sS \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/openai-request.json \
            -o /tmp/openai-response.json; then
            ERROR=$(jq -r '.error.message // "OpenAI API request failed"' /tmp/openai-response.json 2>/dev/null || echo "OpenAI API request failed")
            printf '[KODJO_OPENAI_TEST_RESULT] ORCHESTRATION_FAILURE — OpenAI API: %s\nAucune écriture métier autorisée.\n' "$ERROR" > /tmp/openai-result.md
            gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/openai-result.md
            exit 1
          fi

          OUTPUT=$(jq -r '[.output[]? | select(.type == "message") | .content[]? | select(.type == "output_text") | .text] | join("\n")' /tmp/openai-response.json)
          printf '%s' "$OUTPUT" | jq -e \
            '.schema == "kodjo.openai-bridge-test.v1" and
             .decision == "RESUME_ACCEPTED" and
             .checkpoint_state == "PLAN_APPROVED" and
             .implementation_authorized == false' >/dev/null

          RESPONSE_ID=$(jq -r '.id // "unknown"' /tmp/openai-response.json)
          MODEL=$(jq -r '.model // "unknown"' /tmp/openai-response.json)
          INPUT_TOKENS=$(jq -r '.usage.input_tokens // 0' /tmp/openai-response.json)
          OUTPUT_TOKENS=$(jq -r '.usage.output_tokens // 0' /tmp/openai-response.json)
          TOTAL_TOKENS=$(jq -r '.usage.total_tokens // 0' /tmp/openai-response.json)
          REASON=$(printf '%s' "$OUTPUT" | jq -r '.reason')

          cat > /tmp/openai-result.md <<EOF
          [KODJO_OPENAI_TEST_RESULT] VERIFIED_SUCCESS

          \`schema=kodjo.openai-bridge-test-result.v1\`
          \`decision=RESUME_ACCEPTED\`
          \`checkpoint_state=PLAN_APPROVED\`
          \`implementation_authorized=false\`
          \`model=$MODEL\`
          \`response_id=$RESPONSE_ID\`
          \`input_tokens=$INPUT_TOKENS\`
          \`output_tokens=$OUTPUT_TOKENS\`
          \`total_tokens=$TOTAL_TOKENS\`

          $REASON

          Le pont GitHub → OpenAI API → GitHub est validé pour l'événement de test. Aucune écriture métier n'est autorisée par ce test.
          EOF

          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/openai-result.md
