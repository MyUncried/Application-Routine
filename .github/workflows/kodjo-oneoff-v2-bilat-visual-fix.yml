name: KODJO one-off V2-BILAT-01 visual fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  fix:
    if: github.event.issue.number == 52 && github.event.comment.user.login == 'MyUncried' && github.event.comment.body == '[KODJO_ONEOFF] APPLY_V2_BILAT_VISUAL_FIX_20260915'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kodjo/v2-v2-bilat-01-34948992572
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify current source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "01a36df2958e3be1f606bac5f600366d976bd570"
          test -z "$(git status --porcelain)"

      - name: Restore exact baseline bytes and apply bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git show 3a0dbbe7510f69f702c4b440e25b63b893d2d492:src/features/sessions/CompositionScreen.tsx > src/features/sessions/CompositionScreen.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/sessions/CompositionScreen.tsx')
          b = p.read_bytes()
          old = b'  activitySideModeIndicator: {\r\n    position: "absolute",\r\n    left: 311,\r\n    top: 24.5,\r\n    alignItems: "center",'
          new = b'  activitySideModeIndicator: {\r\n    position: "absolute",\r\n    right: spacing[16],\r\n    top: spacing[4],\r\n    alignItems: "center",'
          if b.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy coordinate block, found {b.count(old)}')
          p.write_bytes(b.replace(old, new, 1))
          PY

      - name: Verify bounded diff against original HEAD
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff 3a0dbbe7510f69f702c4b440e25b63b893d2d492 --name-only)"
          test "$files" = "src/features/sessions/CompositionScreen.tsx"
          git diff --check 3a0dbbe7510f69f702c4b440e25b63b893d2d492
          test "$(git diff --numstat 3a0dbbe7510f69f702c4b440e25b63b893d2d492 -- src/features/sessions/CompositionScreen.tsx)" = $'2\t2\tsrc/features/sessions/CompositionScreen.tsx'
          git diff 3a0dbbe7510f69f702c4b440e25b63b893d2d492 -- src/features/sessions/CompositionScreen.tsx

      - name: Install dependencies
        run: npm ci

      - name: Targeted Composition tests
        run: npx jest src/features/sessions/__tests__/CompositionScreen.test.tsx --runInBand

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint (bounded)
        run: npx eslint src/features/sessions/CompositionScreen.tsx

      - name: Full Jest
        run: npx jest --runInBand

      - name: Commit and push to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/sessions/CompositionScreen.tsx
          git commit -m "fix(V2-BILAT-01): preserve baseline bytes for indicator alignment"
          git push origin HEAD:kodjo/v2-v2-bilat-01-34948992572
