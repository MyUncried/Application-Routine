name: KODJO V2 — Minor Plan Clarification
run-name: KODJO V2 / MINOR-PLAN-CLARIFICATION / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v2-minor-plan-clarification-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_MINOR_PLAN_CLARIFICATION')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    outputs:
      slice_id: ${{ steps.gate.outputs.slice_id }}
      bootstrap_path: ${{ steps.gate.outputs.bootstrap_path }}
      source_head: ${{ steps.gate.outputs.source_head }}
      source_plan_id: ${{ steps.gate.outputs.source_plan_id }}
      clarification_id: ${{ steps.gate.outputs.clarification_id }}
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate minor clarification gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          SLICE_ID=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^slice_id=//p' | head -n1)
          BOOTSTRAP_PATH=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^bootstrap_path=//p' | head -n1)
          SOURCE_PLAN_ID=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^source_plan_comment_id=//p' | head -n1)
          CLARIFICATION_ID=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^clarification_source_comment_id=//p' | head -n1)
          FROM_TEXT=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^from_text=//p' | head -n1)
          TO_TEXT=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^to_text=//p' | head -n1)
          EXPECTED=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^expected_occurrences=//p' | head -n1)
          test -n "$SLICE_ID"
          test "$BOOTSTRAP_PATH" = ".github/orchestration/v2-slices/$SLICE_ID/slice-bootstrap.json"
          printf '%s' "$SOURCE_PLAN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$CLARIFICATION_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$EXPECTED" | grep -Eq '^[1-9][0-9]*$'
          test -n "$FROM_TEXT"
          test -n "$TO_TEXT"
          test "$FROM_TEXT" != "$TO_TEXT"
          test -f "$BOOTSTRAP_PATH"

          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$SOURCE_PLAN_ID" > /tmp/minor-source-plan.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLARIFICATION_ID" > /tmp/minor-clarification.json
          test "$(jq -r '.user.login' /tmp/minor-source-plan.json)" = 'github-actions[bot]'
          test "$(jq -r '.user.login' /tmp/minor-clarification.json)" = 'MyUncried'
          jq -r '.body' /tmp/minor-source-plan.json > /tmp/minor-source-plan.md
          jq -r '.body' /tmp/minor-clarification.json > /tmp/minor-clarification.md
          sed -i 's/\r$//' /tmp/minor-source-plan.md /tmp/minor-clarification.md

          grep -Fxq '[KODJO_V2] PLAN_OUTPUT' /tmp/minor-source-plan.md
          grep -Fxq "slice_id=$SLICE_ID" /tmp/minor-source-plan.md
          grep -Fxq "bootstrap_path=$BOOTSTRAP_PATH" /tmp/minor-source-plan.md
          grep -Fxq 'planning_mode=INITIAL' /tmp/minor-source-plan.md
          grep -Fxq 'planning_contract=kodjo.plan-impact.v1' /tmp/minor-source-plan.md
          grep -Eq '^STATUT : (PLAN_READY_FOR_INDEPENDENT_REVIEW|CLARIFICATION_REQUIRED)$' /tmp/minor-source-plan.md
          if ! grep -Fxq '[ChatGPT] CLARIFICATION_RESOLVED' /tmp/minor-clarification.md && ! grep -Fxq '[KODJO_V2] CLARIFICATION_RESOLVED' /tmp/minor-clarification.md; then
            echo 'MINOR_CLARIFICATION_RESOLUTION_MARKER_MISSING' >&2; exit 1
          fi
          grep -Fxq "slice_id=$SLICE_ID" /tmp/minor-clarification.md
          grep -Fxq "source_plan_comment_id=$SOURCE_PLAN_ID" /tmp/minor-clarification.md

          SOURCE_HEAD=$(sed -n 's/^source_head=//p' /tmp/minor-source-plan.md | head -n1)
          printf '%s' "$SOURCE_HEAD" | grep -Eq '^[0-9a-f]{40}$'
          export BOOTSTRAP_PATH SLICE_ID SOURCE_HEAD ISSUE_NUMBER
          node <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.env.BOOTSTRAP_PATH,'utf8').replace(/^\uFEFF/,''));
          if(b.slice_id!==process.env.SLICE_ID) throw new Error('MINOR_CLARIFICATION_SLICE_MISMATCH');
          if(Number(b.issue_number)!==Number(process.env.ISSUE_NUMBER)) throw new Error('MINOR_CLARIFICATION_ISSUE_MISMATCH');
          if(b.repository!==process.env.GITHUB_REPOSITORY) throw new Error('MINOR_CLARIFICATION_REPOSITORY_MISMATCH');
          if(b.baseline_head!==process.env.SOURCE_HEAD) throw new Error('MINOR_CLARIFICATION_SOURCE_HEAD_CHANGED');
          NODE

          printf '%s' "$FROM_TEXT" > /tmp/minor-from.txt
          printf '%s' "$TO_TEXT" > /tmp/minor-to.txt
          printf 'slice_id=%s\nbootstrap_path=%s\nsource_head=%s\nsource_plan_id=%s\nclarification_id=%s\nexpected=%s\n' "$SLICE_ID" "$BOOTSTRAP_PATH" "$SOURCE_HEAD" "$SOURCE_PLAN_ID" "$CLARIFICATION_ID" "$EXPECTED" >> "$GITHUB_OUTPUT"

      - name: Apply exact literal clarification
        shell: bash
        env:
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          SOURCE_PLAN_ID: ${{ steps.gate.outputs.source_plan_id }}
          CLARIFICATION_ID: ${{ steps.gate.outputs.clarification_id }}
          EXPECTED: ${{ steps.gate.outputs.expected }}
        run: |
          set -euo pipefail
          FROM_TEXT=$(cat /tmp/minor-from.txt)
          TO_TEXT=$(cat /tmp/minor-to.txt)
          node scripts/kodjo/apply-minor-plan-clarification.js \
            /tmp/minor-source-plan.md "$SOURCE_HEAD" "$SOURCE_PLAN_ID" "$CLARIFICATION_ID" \
            "$FROM_TEXT" "$TO_TEXT" "$EXPECTED" \
            /tmp/minor-revised-plan.md /tmp/minor-clarification-proof.json

      - name: Revalidate unchanged machine contract
        shell: bash
        env:
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
        run: |
          set -euo pipefail
          node scripts/kodjo/verify-plan-impact.js /tmp/minor-revised-plan.md "$SOURCE_HEAD" /tmp/minor-impact-replay.json /tmp/minor-impact-proof.json
          node scripts/kodjo/verify-plan-contract-consistency.js /tmp/minor-revised-plan.md "$SOURCE_HEAD" "$GITHUB_WORKSPACE" /tmp/minor-revalidated-contract.json
          node <<'NODE'
          const fs=require('node:fs');
          const plan=fs.readFileSync('/tmp/minor-revised-plan.md','utf8');
          const {extractTaggedJson,canonicalJson}=require('./scripts/kodjo/lib/plan-impact');
          const embedded=extractTaggedJson(plan,'KODJO_PLAN_CONTRACT_JSON');
          const revalidated=JSON.parse(fs.readFileSync('/tmp/minor-revalidated-contract.json','utf8'));
          if(canonicalJson(embedded)!==canonicalJson(revalidated)) throw new Error('MINOR_CLARIFICATION_CONTRACT_REPLAY_MISMATCH');
          NODE
          node - <<'NODE'
          const fs=require('node:fs');
          const body=fs.readFileSync('/tmp/minor-source-plan.md','utf8').replace(/\r\n/g,'\n');
          const status=body.match(/^STATUT\s*:\s*[^\n]+$/m);
          const split=body.indexOf('\n\n',status.index+status[0].length);
          fs.writeFileSync('/tmp/minor-prior-plan.md',body.slice(split+2),'utf8');
          NODE
          git diff --no-index -- /tmp/minor-prior-plan.md /tmp/minor-revised-plan.md > /tmp/minor-plan.diff || test $? = 1
          test -s /tmp/minor-plan.diff

      - name: Preserve minor clarification packet
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-minor-plan-clarification-${{ github.run_id }}
          path: |
            /tmp/minor-source-plan.md
            /tmp/minor-clarification.md
            /tmp/minor-prior-plan.md
            /tmp/minor-revised-plan.md
            /tmp/minor-plan.diff
            /tmp/minor-clarification-proof.json
            /tmp/minor-impact-replay.json
            /tmp/minor-impact-proof.json
            /tmp/minor-revalidated-contract.json
          if-no-files-found: error
          retention-days: 14

  light-review:
    needs: prepare
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      SLICE_ID: ${{ needs.prepare.outputs.slice_id }}
      BOOTSTRAP_PATH: ${{ needs.prepare.outputs.bootstrap_path }}
      SOURCE_HEAD: ${{ needs.prepare.outputs.source_head }}
      SOURCE_PLAN_ID: ${{ needs.prepare.outputs.source_plan_id }}
      CLARIFICATION_ID: ${{ needs.prepare.outputs.clarification_id }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate local reviewer boundary
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner' }
          if (!(Test-Path -LiteralPath 'scripts/kodjo/apply-minor-plan-clarification.js')) { throw 'Minor clarification protocol missing' }

      - name: Download deterministic clarification packet
        uses: actions/download-artifact@v4
        with:
          name: kodjo-v2-minor-plan-clarification-${{ github.run_id }}
          path: ${{ runner.temp }}\kodjo-minor-plan

      - name: Review bounded clarification with Claude
        id: claude
        run: |
          $ErrorActionPreference='Stop'
          $packet=Join-Path $env:RUNNER_TEMP 'kodjo-minor-plan'
          $prompt=@"
          You are the independent KODJO V2 reviewer for a MINOR PLAN CLARIFICATION on $env:SLICE_ID. This is a reduced review path, not a new planning pass. The user resolution is in $packet\minor-clarification.md. The exact old/new plan diff is in $packet\minor-plan.diff. Deterministic proof is in $packet\minor-clarification-proof.json, impact replay in $packet\minor-impact-proof.json, and the revised plan in $packet\minor-revised-plan.md.

          APPROVE only if the diff is exclusively the explicit literal clarification requested by the user and does not introduce, remove or reinterpret functional behavior beyond that literal; does not alter scope, files, tests, migration, API, architecture, data model, persistence or implementation strategy; and the deterministic proofs show the machine contract unchanged. If any of those conditions is not met, REVISE so the full planning path can be used instead.

          Do not redo a full product review and do not request unrelated improvements. End with exactly VERDICT: APPROVE or VERDICT: REVISE.
          "@
          $out=Join-Path $packet 'minor-review.json'
          $err=Join-Path $packet 'minor-review.err.txt'
          & claude -p --output-format json --dangerously-skip-permissions $prompt 1> $out 2> $err
          $code=$LASTEXITCODE
          if (!(Test-Path $out) -or (Get-Item $out).Length -eq 0) { throw "Claude produced no JSON; exit=$code" }
          $json=Get-Content -Raw -LiteralPath $out -Encoding UTF8 | ConvertFrom-Json
          if (!$json.session_id -or !$json.result) { throw 'Minor clarification review result incomplete' }
          if ($code -ne 0) { throw "Claude minor clarification review failed; exit=$code" }
          [IO.File]::WriteAllText((Join-Path $packet 'minor-review.md'),[string]$json.result,(New-Object Text.UTF8Encoding($false)))
          "session_id=$($json.session_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish compatible plan and review outputs
        env:
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          $ErrorActionPreference='Stop'
          $packet=Join-Path $env:RUNNER_TEMP 'kodjo-minor-plan'
          $review=Get-Content -Raw -LiteralPath (Join-Path $packet 'minor-review.md') -Encoding UTF8
          $verdict=if($review -match '(?m)^VERDICT:\s*APPROVE\s*$'){'APPROVE'}elseif($review -match '(?m)^VERDICT:\s*REVISE\s*$'){'REVISE'}else{throw 'Review verdict missing'}
          $nl=[Environment]::NewLine
          if($verdict -eq 'REVISE'){
            $body='[KODJO_V2] MINOR_PLAN_CLARIFICATION_REJECTED'+$nl+'slice_id='+$env:SLICE_ID+$nl+'source_plan_comment_id='+$env:SOURCE_PLAN_ID+$nl+'clarification_source_comment_id='+$env:CLARIFICATION_ID+$nl+'STATUT : FULL_PLAN_PATH_REQUIRED'+$nl+$nl+$review
            $payload=@{body=$body}|ConvertTo-Json -Compress
            $payloadPath=Join-Path $packet 'rejected-comment.json'
            [IO.File]::WriteAllText($payloadPath,$payload,(New-Object Text.UTF8Encoding($false)))
            gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input $payloadPath | Out-Null
            exit 0
          }

          $plan=Get-Content -Raw -LiteralPath (Join-Path $packet 'minor-revised-plan.md') -Encoding UTF8
          $header='[KODJO_V2] PLAN_OUTPUT'+$nl+'slice_id='+$env:SLICE_ID+$nl+'bootstrap_path='+$env:BOOTSTRAP_PATH+$nl+'source_head='+$env:SOURCE_HEAD+$nl+'planning_mode=INITIAL'+$nl+'planning_contract=kodjo.plan-impact.v1'+$nl+'clarification_mode=MINOR_LITERAL'+$nl+'supersedes_plan_comment_id='+$env:SOURCE_PLAN_ID+$nl+'clarification_source_comment_id='+$env:CLARIFICATION_ID+$nl+'STATUT : PLAN_READY_FOR_INDEPENDENT_REVIEW'+$nl+$nl
          $planBody=$header+$plan.TrimEnd()+$nl
          $planPayload=@{body=$planBody}|ConvertTo-Json -Compress
          $planPayloadPath=Join-Path $packet 'plan-comment.json'
          [IO.File]::WriteAllText($planPayloadPath,$planPayload,(New-Object Text.UTF8Encoding($false)))
          $created=gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input $planPayloadPath | ConvertFrom-Json
          $newPlanId=[string]$created.id
          if(!$newPlanId){throw 'Minor clarification PLAN_OUTPUT publication failed'}

          $proof=Get-Content -Raw -LiteralPath (Join-Path $packet 'minor-impact-proof.json') -Encoding UTF8
          $reviewHeader='[KODJO_V2] PLAN_REVIEW_OUTPUT'+$nl+'slice_id='+$env:SLICE_ID+$nl+'bootstrap_path='+$env:BOOTSTRAP_PATH+$nl+'source_head='+$env:SOURCE_HEAD+$nl+'planning_mode=INITIAL'+$nl+'source_plan_comment_id='+$newPlanId+$nl+'reviewer=CLAUDE'+$nl+'review_mode=MINOR_CLARIFICATION'+$nl+'review_session_id='+$env:SESSION_ID+$nl+'verdict=APPROVE'+$nl+'STATUT : PLAN_REVIEW_APPROVED'+$nl+$nl
          $impact=$nl+'<KODJO_PLAN_IMPACT_REVIEW_JSON>'+$nl+$proof.Trim()+$nl+'</KODJO_PLAN_IMPACT_REVIEW_JSON>'+$nl
          $reviewBody=$reviewHeader+$review.TrimEnd()+$impact
          $reviewPayload=@{body=$reviewBody}|ConvertTo-Json -Compress
          $reviewPayloadPath=Join-Path $packet 'review-comment.json'
          [IO.File]::WriteAllText($reviewPayloadPath,$reviewPayload,(New-Object Text.UTF8Encoding($false)))
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input $reviewPayloadPath | Out-Null

      - name: Preserve light review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-minor-plan-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\kodjo-minor-plan\minor-review.json
            ${{ runner.temp }}\kodjo-minor-plan\minor-review.err.txt
            ${{ runner.temp }}\kodjo-minor-plan\minor-review.md
            ${{ runner.temp }}\kodjo-minor-plan\minor-plan.diff
            ${{ runner.temp }}\kodjo-minor-plan\minor-clarification-proof.json
            ${{ runner.temp }}\kodjo-minor-plan\minor-impact-proof.json
          if-no-files-found: warn
          retention-days: 14
