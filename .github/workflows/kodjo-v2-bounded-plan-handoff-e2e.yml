name: KODJO V2 — Bounded PLAN Handoff E2E

on:
  push:
    branches:
      - protocol/v2-initial-handoff-redesign-20260917

permissions:
  contents: read
  issues: read

jobs:
  e2e-plan-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate production handoff implementation
        run: |
          set -euo pipefail
          node --check scripts/kodjo/materialize-approved-plan-handoff.js
          node --check scripts/kodjo/generate-approved-plan-lean-request.js
          node scripts/kodjo/scan-remote-write-capability.js .
          test ! -e .github/workflows/kodjo-v2-comment-causal-implementation.yml
          test ! -d .github/orchestration/queue/v2-causal
          ! grep -R "LocalRequestFile" -n scripts/kodjo/run-queued-request.ps1
          grep -q "kodjo.protocol.v2.lean-request.0.6.13" scripts/kodjo/generate-approved-plan-lean-request.js

      - name: Run bounded E2E-PLAN-HANDOFF
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/kodjo/v2-plan-handoff-bounded-e2e.js

      - name: Run bounded negative handoff cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/kodjo/v2-plan-handoff-negative-e2e.js
