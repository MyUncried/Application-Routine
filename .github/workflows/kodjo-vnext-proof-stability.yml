name: KODJO VNext proof stability and architecture

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/orchestration/**'
      - '.github/AI_ORCHESTRATION*.md'
      - 'CLAUDE.md'
      - 'scripts/kodjo/**'
      - 'tests/kodjo/**'
  workflow_dispatch:
  create:

permissions:
  contents: read

concurrency:
  group: kodjo-vnext-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'qualification/vnext-task2-two-hours-20261006')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The expanded Windows fixture suite can exceed the former 15-minute job budget.
    # Preserve every contract; this is a job allowance, not a model-call timeout.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse all workflow syntax independently
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/kodjo/validate-workflow-syntax.py
      - name: Validate the exact candidate tree with native Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $parent=(git rev-parse 'HEAD^').Trim()
          $checkpoint=Get-Content -LiteralPath '.github/orchestration/vnext12/VNEXT-12-QUALIF/campaign-state.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          # A failed parser attempt cannot certify unchanged units in its child.
          # Revalidate the entire consolidated delta from its recorded base.
          if ($checkpoint.v8_consolidation.parent_head) { $parent=$checkpoint.v8_consolidation.parent_head }
          if ($parent -notmatch '^[0-9a-f]{40}$') { throw 'VNEXT_NATIVE_VALIDATION_BASE_INVALID' }
          git merge-base --is-ancestor $parent HEAD
          if ($LASTEXITCODE -ne 0) { throw 'VNEXT_NATIVE_VALIDATION_BASE_NOT_ANCESTOR' }
          $tree=(git rev-parse 'HEAD^{tree}').Trim()
          node -e "const P=require('./scripts/kodjo/lib/vnext-publication'); console.log(JSON.stringify(P.validateTree({cwd:process.cwd(),expectedParent:process.argv[1],candidateTree:process.argv[2]})));" $parent $tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute VNext contracts on exact candidate
        shell: bash
        run: |
          node --test tests/kodjo/vnext-*.pilot.js
      - name: Validate executable workflow invariants
        run: node scripts/kodjo/validate-workflows.js
      - name: Check patch whitespace
        shell: bash
        run: git diff --check

  historical-equivalence:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'qualification/vnext-task2-two-hours-20261006')
    # Step 3 only: disposable fixture assertions, no queue, Claude or cutover.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The full inherited Windows suite took 18m06s before revision checks were added.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated pinned tokenizer for inherited fixture assertions
        run: npm ci --prefix scripts/kodjo/openai-runtime --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Execute structured historical assertion evidence
        shell: bash
        run: |
          node --test --test-reporter=./scripts/kodjo/lib/vnext-equivalence-reporter.js tests/kodjo/*.pilot.js > "$RUNNER_TEMP/historical-equivalence.jsonl"
      - name: Resolve each historical assertion on the exact candidate
        if: always()
        shell: bash
        run: node scripts/kodjo/qualify-vnext-historical-equivalence.js "$RUNNER_TEMP/historical-equivalence.jsonl" "$RUNNER_TEMP/historical-${{ runner.os }}.json"
      - name: Preserve exact candidate platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-equivalence-${{ runner.os }}
          path: ${{ runner.temp }}/historical-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual assertion diagnostics if qualification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: historical-failure-diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/historical-equivalence.jsonl
          if-no-files-found: error
          retention-days: 14

  historical-platform-coverage:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'qualification/vnext-task2-two-hours-20261006')
    needs: historical-equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: historical-equivalence-*
          path: platform-evidence
          merge-multiple: true
      - name: Require each mapped assertion to pass on at least one OS
        run: node scripts/kodjo/verify-vnext-platform-coverage.js platform-evidence/historical-Linux.json platform-evidence/historical-Windows.json

  architecture-audit:
    # One early read-only architecture audit, never a final approval or PRE-1 gate.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'protocol/vnext-proof-stability-') && github.event.action == 'opened' && github.run_attempt == 1
    needs: qualification
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 60
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze architecture dossier
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner' }
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw 'Candidate mismatch' }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))) { throw 'Dirty architecture checkout' }
          $dir=Join-Path $env:RUNNER_TEMP ('vnext-architecture-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $mission=Get-Content -LiteralPath '.github/orchestration/KODJO_VNEXT_ARCHITECTURE_AUDIT_MISSION.md' -Raw -Encoding UTF8
          $prompt=$mission+[Environment]::NewLine+'candidate_sha='+$env:CANDIDATE_SHA
          [IO.File]::WriteAllText((Join-Path $dir 'prompt.txt'),$prompt,(New-Object Text.UTF8Encoding($false)))
      - name: Run one architecture audit without repository credentials
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('vnext-architecture-'+$env:GITHUB_RUN_ID)
          $prompt=Get-Content -LiteralPath (Join-Path $dir 'prompt.txt') -Raw -Encoding UTF8
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $saved=$OutputEncoding
          try {
            $OutputEncoding=New-Object Text.UTF8Encoding($false)
            $prompt | & claude -p --output-format json --tools 'Read,Glob,Grep' --allowedTools 'Read,Glob,Grep' 1> (Join-Path $dir 'result.json') 2> (Join-Path $dir 'stderr.txt')
            $code=$LASTEXITCODE
          } finally { $OutputEncoding=$saved }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))) { throw 'Audit mutated checkout' }
          if ($code -ne 0) { throw 'Architecture invocation failed; no automatic retry' }
          $result=Get-Content -LiteralPath (Join-Path $dir 'result.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if (!$result.session_id -or !$result.result) { throw 'Architecture report unavailable' }
          [IO.File]::WriteAllText((Join-Path $dir 'report.md'),[string]$result.result,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $dir 'candidate.txt'),$env:CANDIDATE_SHA,(New-Object Text.UTF8Encoding($false)))
      - name: Preserve architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-vnext-architecture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vnext-architecture-${{ github.run_id }}/*
          retention-days: 14
          if-no-files-found: error
