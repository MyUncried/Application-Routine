name: KODJO V2 — Independent Implementation Review

on:
  repository_dispatch:
    types: [kodjo_v2_implementation_ready]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: kodjo-v2-implementation-review-${{ github.event.client_payload.issue_number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QUEUE_PATH: ${{ github.event.client_payload.queue_path }}
      APPLICATION_PR: ${{ github.event.client_payload.application_pr }}
      APPLICATION_HEAD: ${{ github.event.client_payload.application_head }}
      APPLICATION_BRANCH: ${{ github.event.client_payload.application_branch }}
      PROTOCOL_HEAD: ${{ github.event.client_payload.protocol_head }}
      DELIVERY_RUN_ID: ${{ github.event.client_payload.delivery_run_id }}
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}

    steps:
      - name: Checkout current protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable delivery and authorization
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPLICATION_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPLICATION_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROTOCOL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DELIVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          test -n "$QUEUE_PATH"
          test -n "$APPLICATION_BRANCH"

          git cat-file -e "$PROTOCOL_HEAD^{commit}"
          git cat-file -e "$PROTOCOL_HEAD:$QUEUE_PATH"
          git show "$PROTOCOL_HEAD:$QUEUE_PATH" > /tmp/queue.json

          jq -e --arg request "$REQUEST_ID" --arg protocol "$PROTOCOL_HEAD" --arg issue "$ISSUE_NUMBER" '
            .request_id == $request
            and .source_head == $protocol
            and (.issue_number|tostring) == $issue
            and (.authorized_plan.plan_blob_oid|type) == "string"
            and (.authorized_plan.approved_at_commit|type) == "string"
            and (.independent_review.review_blob_oid|type) == "string"
            and .independent_review.verdict == "APPROVED"
            and .user_gate.decision == "APPROVED"
          ' /tmp/queue.json >/dev/null

          plan_path=$(jq -r '.authorized_plan.plan_path' /tmp/queue.json)
          plan_blob=$(jq -r '.authorized_plan.plan_blob_oid' /tmp/queue.json)
          approved_at=$(jq -r '.authorized_plan.approved_at_commit' /tmp/queue.json)
          baseline=$(jq -r '.baseline_head' /tmp/queue.json)
          slice=$(jq -r '.slice_id' /tmp/queue.json)
          [[ "$plan_blob" =~ ^[0-9a-f]{40}$ ]]
          [[ "$approved_at" =~ ^[0-9a-f]{40}$ ]]
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          test -n "$slice"

          actual_blob=$(git ls-tree "$approved_at" -- "$plan_path" | awk '{print $3}')
          test "$actual_blob" = "$plan_blob"
          git cat-file -p "$plan_blob" > /tmp/approved-plan.md
          node scripts/kodjo/extract-plan-acceptance.js /tmp/approved-plan.md > /tmp/acceptance-criteria.json

          pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$APPLICATION_PR")
          jq -e --arg head "$APPLICATION_HEAD" --arg branch "$APPLICATION_BRANCH" '
            .state == "open"
            and .base.ref == "main"
            and .head.sha == $head
            and .head.ref == $branch
          ' <<<"$pr_json" >/dev/null

          printf 'slice=%s\n' "$slice" >> "$GITHUB_OUTPUT"
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
          printf 'plan_blob=%s\n' "$plan_blob" >> "$GITHUB_OUTPUT"

      - name: Checkout exact application HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ env.APPLICATION_HEAD }}
          fetch-depth: 0
          persist-credentials: false
          path: _application

      - name: Re-run deterministic implementation checks
        shell: bash
        working-directory: _application
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_HEAD"
          npm ci --no-audit --no-fund
          npm test -- --runInBand
          npx tsc --noEmit
          npm run lint --silent -- --no-cache

      - name: Build cumulative implementation evidence
        shell: bash
        working-directory: _application
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE^{commit}" || git fetch --no-tags origin "$BASELINE"
          git rev-list "$APPLICATION_HEAD" > /tmp/application-ancestors.txt
          grep -Fx "$BASELINE" /tmp/application-ancestors.txt >/dev/null
          git diff --name-status "$BASELINE..$APPLICATION_HEAD" > /tmp/changed-files.txt
          git diff --stat "$BASELINE..$APPLICATION_HEAD" > /tmp/diff-stat.txt
          git diff "$BASELINE..$APPLICATION_HEAD" > /tmp/diff.patch

      - name: Independent exhaustive implementation review
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          {
            echo "You are the independent KODJO V2 implementation reviewer for $SLICE_ID."
            echo "The implementation was produced by Claude in a separate execution context. You are read-only and independent."
            echo "Review exact application HEAD $APPLICATION_HEAD against the COMPLETE approved plan."
            echo "This is not a spot check and not a diff-only review. Every acceptance criterion MUST appear exactly once in the structured result, in the exact AC order supplied below."
            echo "For each criterion, inspect the cumulative implementation from the immutable baseline to the reviewed HEAD and classify it as exactly one of: CONFORME, PARTIELLEMENT_CONFORME, NON_CONFORME, NON_VERIFIABLE."
            echo "Use NON_VERIFIABLE only when the repository evidence cannot establish the criterion (for example a genuinely device-only visual observation). Missing code, missing wiring, missing test, or an obvious mismatch is not NON_VERIFIABLE."
            echo "PARTIELLEMENT_CONFORME and NON_CONFORME are blocking and require VERDICT: REVISE."
            echo "CONFORME and explicit NON_VERIFIABLE may reach VERDICT: APPROVE so that the remaining device/user gate can occur."
            echo "Do not modify files. Do not omit a criterion. Do not add criteria."
            echo "The JSON object must use schema kodjo.protocol.v2.implementation-review.0.6.38, reviewed_head=$APPLICATION_HEAD, criteria_complete=true, blocking_count, non_verifiable_count, and criteria."
            echo "Each criteria item must contain id, requirement copied EXACTLY from the supplied criteria, status, files (array), evidence (non-empty array of precise observations)."
            echo "End with exactly VERDICT: APPROVE or VERDICT: REVISE."
            echo
            echo "ACCEPTANCE CRITERIA (authoritative enumeration):"
            cat /tmp/acceptance-criteria.json
            echo
            echo "APPROVED PLAN:"
            cat /tmp/approved-plan.md
            echo
            echo "CHANGED FILES FROM IMMUTABLE BASELINE:"
            cat /tmp/changed-files.txt
            echo
            echo "CUMULATIVE DIFF:"
            head -c 700000 /tmp/diff.patch
            echo
            echo "Return the structured block exactly between:"
            echo "<KODJO_IMPLEMENTATION_REVIEW_JSON>"
            echo "{...}"
            echo "</KODJO_IMPLEMENTATION_REVIEW_JSON>"
          } > /tmp/review-prompt.txt

          jq -n --arg model 'gpt-5.6-luna' --rawfile prompt /tmp/review-prompt.txt             '{model:$model,input:$prompt,store:false,reasoning:{effort:"high"},max_output_tokens:16000,text:{verbosity:"medium"}}'             > /tmp/review-request.json

          curl --fail-with-body -sS https://api.openai.com/v1/responses             -H "Authorization: Bearer $OPENAI_API_KEY"             -H 'Content-Type: application/json'             -d @/tmp/review-request.json             -o /tmp/review-response.json

          status=$(jq -r '.status // "missing"' /tmp/review-response.json)
          if [ "$status" != completed ]; then
            jq -c '{status,incomplete_details,error,usage}' /tmp/review-response.json >&2
            exit 1
          fi
          jq -er '[.output[]?|select(.type=="message")|.content[]?|select(.type=="output_text")|.text]|join("\n")|select(length>0)'             /tmp/review-response.json > /tmp/review.md

          node scripts/kodjo/verify-implementation-review.js /tmp/approved-plan.md /tmp/review.md "$APPLICATION_HEAD" > /tmp/review-verification.json

      - name: Publish reviewed HEAD and verdict
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice }}
          PLAN_BLOB: ${{ steps.gate.outputs.plan_blob }}
        run: |
          set -euo pipefail
          verdict=$(sed -n 's/^VERDICT: //p' /tmp/review.md | tail -n1)
          if [ "$verdict" = APPROVE ]; then
            state=USER_VALIDATION_PENDING
          else
            state=IMPLEMENTATION_REVISION_REQUIRED
          fi
          {
            echo '[KODJO_V2] IMPLEMENTATION_REVIEW_OUTPUT'
            echo "slice_id=$SLICE_ID"
            echo "application_pr=$APPLICATION_PR"
            echo "reviewed_head=$APPLICATION_HEAD"
            echo "plan_blob_oid=$PLAN_BLOB"
            echo "request_id=$REQUEST_ID"
            echo "delivery_run_id=$DELIVERY_RUN_ID"
            echo "reviewer=OPENAI_INDEPENDENT"
            echo "verdict=$verdict"
            echo "STATUT : $state"
            echo
            cat /tmp/review.md
          } > /tmp/review-comment.md

          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             --input <(jq -n --rawfile body /tmp/review-comment.md '{body:$body}') >/tmp/published-review.json

      - name: Preserve implementation review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-implementation-review-${{ github.run_id }}
          path: |
            /tmp/acceptance-criteria.json
            /tmp/changed-files.txt
            /tmp/diff-stat.txt
            /tmp/review-prompt.txt
            /tmp/review-response.json
            /tmp/review.md
            /tmp/review-verification.json
            /tmp/review-comment.md
          if-no-files-found: warn
          retention-days: 30
