name: TEMP V2-CAT-01 review2 sync

on:
  push:
    branches:
      - docs/v2-cat-01-review2-findings-20260917
    paths:
      - .github/workflows/tmp-v2-cat-review2-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v2-cat-01-review2-findings-20260917
          fetch-depth: 0
      - name: Apply bounded review2 findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/orchestration/v2-slices/V2-CAT-01/planning-mission.md')
          s=p.read_text(encoding='utf-8')
          anchor='Le prochain plan doit énumérer et justifier l’intégralité de son `scope_allow` ; sa section de périmètre technique et l’artefact machine ne doivent pas diverger.\n'
          insert='''Le prochain plan doit énumérer et justifier l’intégralité de son `scope_allow` ; sa section de périmètre technique et l’artefact machine ne doivent pas diverger.\n\n### Corrections imposées après la seconde revue indépendante\n\nLa revue `5714616288` a confirmé les corrections précédentes et demande uniquement de fermer les écarts de déterminisme de scope suivants avant développement :\n\n- la liste de scope présentée en prose doit être **strictement identique** au `scope_allow` machine final : même nombre de chemins, mêmes chemins et mêmes statuts d’écriture ; aucune entrée machine ne peut être omise de la section de périmètre technique ;\n- si `app/(creation)/composition.tsx`, `src/features/sessions/SessionDraftProvider.tsx`, `src/features/sessions/SessionService.ts` ou `src/features/sessions/__tests__/SessionService.test.ts` restent classés comme modifiés/adaptés par l’artefact final, chacun doit être explicitement listé et justifié dans le plan ; sinon ils doivent être reclassés comme non affectés avec justification déterministe ;\n- `src/features/sessions/SessionCard.tsx` est gelé pour cette tranche et `src/features/sessions/__tests__/SessionCard.test.tsx` ne doit pas être ouvert en écriture en l’absence d’un changement concret de contrat démontré ; le simple passage par le barrel i18n ne suffit pas à justifier `MODIFY` ;\n- toute entrée ajoutée au scope pour satisfaire un impact direct doit correspondre à un changement réellement requis par la tranche ; aucune écriture de confort ou de régression préventive sur un composant gelé n’est autorisée.\n\nPour éviter une nouvelle ambiguïté de revue, le prochain plan doit également rendre déterministes les réserves non bloquantes déjà identifiées : ne pas traiter `Lecture`/`Démarrer` au conditionnel lorsqu’une décision ou un contrat d’écran fixe déjà son état ; expliciter l’ancrage de l’arbre `Créer` conformément à D-184 ; couvrir complètement D-168 pour la restauration du contexte Catalogue concerné ; préciser le comportement de validation sans sélection prévu par `09 bis` ; et, si `SegmentedControl` est extrait, imposer la préservation de la traduction visuelle DSF canonique sans refonte.\n'''
          if s.count(anchor)!=1:
            raise SystemExit(f'anchor count={s.count(anchor)}')
          s=s.replace(anchor,insert)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'La revue `5714616288`' '.github/orchestration/v2-slices/V2-CAT-01/planning-mission.md'
          grep -Fq 'strictement identique' '.github/orchestration/v2-slices/V2-CAT-01/planning-mission.md'
          grep -Fq 'SessionCard.test.tsx' '.github/orchestration/v2-slices/V2-CAT-01/planning-mission.md'
          git diff --check
      - name: Commit bounded change and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-v2-cat-review2-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(kodjo): close second V2-CAT-01 plan review findings'
          git push origin HEAD:docs/v2-cat-01-review2-findings-20260917
