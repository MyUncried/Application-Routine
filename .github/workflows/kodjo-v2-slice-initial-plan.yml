name: KODJO V2 — Initial Slice Plan
run-name: KODJO V2 / INITIAL-PLAN / ${{ github.event.comment.id }}

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      slice_id:
        required: true
        type: string
      bootstrap_path:
        required: true
        type: string
      source_head:
        required: true
        type: string
      command_comment_id:
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: kodjo-openai-planning
  cancel-in-progress: false

jobs:
  plan:
    if: (github.event_name == 'issue_comment' && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_INITIAL_PLAN') && !contains(github.event.comment.body, '[KODJO_V2] START_INITIAL_PLAN_REVIEW')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TRIGGER_BODY: ${{ github.event.comment.body || '' }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      DISPATCH_SLICE_ID: ${{ inputs.slice_id || '' }}
      DISPATCH_BOOTSTRAP_PATH: ${{ inputs.bootstrap_path || '' }}
      DISPATCH_SOURCE_HEAD: ${{ inputs.source_head || '' }}
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Replay causal initial planning command
        if: github.event_name == 'workflow_dispatch' && inputs.command_comment_id != ''
        shell: bash
        env:
          COMMAND_COMMENT_ID: ${{ inputs.command_comment_id }}
        run: |
          set -euo pipefail
          EVENT_JSON="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMAND_COMMENT_ID")"
          printf '%s' "$EVENT_JSON" | jq -e --arg issue "$ISSUE_NUMBER" '
            (.user.login == "MyUncried" or .user.login == "github-actions[bot]") and
            (.issue_url | endswith("/issues/" + $issue)) and (.body | type == "string")
          ' >/dev/null
          export EVENT_JSON
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const body=JSON.parse(process.env.EVENT_JSON).body;
          const delimiter='KODJO_EVENT_'+crypto.randomBytes(16).toString('hex');
          fs.appendFileSync(process.env.GITHUB_ENV,'TRIGGER_BODY<<'+delimiter+'\n'+body+'\n'+delimiter+'\n');
          NODE

      - name: Validate initial V2 planning gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_SLICE_ID" ]; then
            SLICE_ID="$DISPATCH_SLICE_ID"
            BOOTSTRAP_PATH="$DISPATCH_BOOTSTRAP_PATH"
            SOURCE_HEAD="$DISPATCH_SOURCE_HEAD"
          else
            SLICE_ID=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^slice_id=//p' | head -n1)
            BOOTSTRAP_PATH=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^bootstrap_path=//p' | head -n1)
            SOURCE_HEAD=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^source_head=//p' | head -n1)
          fi
          test -n "$SLICE_ID"
          node scripts/kodjo/resolve-slice-protocol.js "$SLICE_ID" --require-legacy
          test "$BOOTSTRAP_PATH" = ".github/orchestration/v2-slices/$SLICE_ID/slice-bootstrap.json"
          printf '%s' "$SOURCE_HEAD" | grep -Eq '^[0-9a-f]{40}$'
          test -f "$BOOTSTRAP_PATH"
          SLICE_DIR=$(dirname "$BOOTSTRAP_PATH")
          MISSION_PATH="$SLICE_DIR/planning-mission.md"
          SEED_PATH="$SLICE_DIR/technical-plan.md"
          test -f "$MISSION_PATH"
          export SLICE_ID BOOTSTRAP_PATH SOURCE_HEAD ISSUE_NUMBER
          node <<'NODE' > /tmp/kodjo-v2-initial.env
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.env.BOOTSTRAP_PATH,'utf8').replace(/^\uFEFF/,''));
          if(!String(b.schema_version||'').startsWith('kodjo.protocol.v2.slice-bootstrap.')) throw new Error('V2_BOOTSTRAP_SCHEMA_REFUSED');
          if(b.slice_id!==process.env.SLICE_ID) throw new Error('V2_BOOTSTRAP_SLICE_MISMATCH');
          if(Number(b.issue_number)!==Number(process.env.ISSUE_NUMBER)) throw new Error('V2_BOOTSTRAP_ISSUE_MISMATCH');
          if(b.repository!==process.env.GITHUB_REPOSITORY) throw new Error('V2_BOOTSTRAP_REPOSITORY_MISMATCH');
          if(b.baseline_head!==process.env.SOURCE_HEAD) throw new Error('V2_INITIAL_SOURCE_MUST_EQUAL_BASELINE');
          if(!/^[0-9a-f]{40}$/.test(String(b.planning_application_head||''))) throw new Error('V2_INITIAL_PLANNING_APPLICATION_HEAD_MISSING');
          if(b.planning_application_head!==b.baseline_head) throw new Error('V2_INITIAL_PLANNING_APPLICATION_HEAD_MUST_EQUAL_BASELINE');
          if(!Array.isArray(b.product_sources)||b.product_sources.length===0) throw new Error('V2_BOOTSTRAP_SOURCES_MISSING');
          const r=JSON.parse(fs.readFileSync(b.activation_registry,'utf8').replace(/^\uFEFF/,''));
          const active=(r.activations||[]).filter(x=>x&&x.slice_id===b.slice_id);
          if(active.length!==1||active[0].status!=='ACTIVE') throw new Error('V2_SLICE_NOT_ACTIVE');
          process.stdout.write('target_branch='+b.target_branch+'\n');
          NODE
          source /tmp/kodjo-v2-initial.env
          git cat-file -e "$SOURCE_HEAD^{commit}"
          printf 'slice_id=%s\nbootstrap_path=%s\nsource_head=%s\nmission_path=%s\nseed_path=%s\ntarget_branch=%s\n' "$SLICE_ID" "$BOOTSTRAP_PATH" "$SOURCE_HEAD" "$MISSION_PATH" "$SEED_PATH" "$target_branch" >> "$GITHUB_OUTPUT"

      - name: Install isolated planning tokenizer
        run: npm ci --prefix scripts/kodjo/openai-runtime --ignore-scripts --no-audit --no-fund

      - name: Build immutable initial planning packet
        shell: bash
        env:
          BOOTSTRAP_PATH: ${{ steps.gate.outputs.bootstrap_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          MISSION_PATH: ${{ steps.gate.outputs.mission_path }}
          SEED_PATH: ${{ steps.gate.outputs.seed_path }}
          COMMAND_COMMENT_ID: ${{ github.event.comment.id || inputs.command_comment_id }}
          PLANNING_MODE: initial
        run: |
          set -euo pipefail
          rm -rf /tmp/kodjo-v2-initial
          mkdir -p /tmp/kodjo-v2-initial
          git worktree add --detach /tmp/kodjo-v2-initial/source "$SOURCE_HEAD"
          cp "$BOOTSTRAP_PATH" /tmp/kodjo-v2-initial/slice-bootstrap.json
          cp "$MISSION_PATH" /tmp/kodjo-v2-initial/planning-mission.md
          if test -f "$SEED_PATH"; then cp "$SEED_PATH" /tmp/kodjo-v2-initial/non-opposable-seed-plan.md; fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > /tmp/kodjo-v2-initial/issue.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" | jq -s add > /tmp/kodjo-v2-initial/comments.json
          node scripts/kodjo/verify-initial-product-sources.js \
            /tmp/kodjo-v2-initial/slice-bootstrap.json \
            /tmp/kodjo-v2-initial/source \
            /tmp/kodjo-v2-initial/product-evidence.txt
          git -C /tmp/kodjo-v2-initial/source ls-files app src > /tmp/kodjo-v2-initial/code-files.txt
          node scripts/kodjo/build-planning-context.js /tmp/kodjo-v2-initial

      - name: Draft initial V2 plan
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
        run: |
          set -euo pipefail
          exec 2> >(tee -a /tmp/kodjo-v2-initial/planning-stderr.log >&2)
          test -n "${OPENAI_API_KEY:-}"
          cat > /tmp/kodjo-v2-initial/draft-prompt.txt <<EOF
          You are the KODJO V2 initial technical-plan builder for $SLICE_ID at immutable product HEAD $SOURCE_HEAD. READ ONLY: never implement and never modify repository files.
          The bootstrap, planning mission, Issue, current product sources and checked-out code are authoritative. A file named non-opposable-seed-plan.md may be supplied only for a true first plan; verify it independently and do not treat it as protocol authority.
          If the canonical context contains BASE_PLAN and INDEPENDENT_REVIEW with verdict=REVISE, this is a bounded correction of that reviewed plan, not a new planning pass. Preserve every validated product decision, unaffected plan section, file choice and test contract unless the review finding or a directly demonstrated dependency requires changing it. Correct only the blocking findings and their causal consequences. Do not rebuild the plan from scratch and do not broaden scope opportunistically.
          Return a complete French plan in plan_markdown and the exact application roots in modified_modules. Use repository-relative POSIX paths only. Every MODIFY path must name the exact existing repository path; every CREATE path must be new. Return plan_status=READY_FOR_INDEPENDENT_REVIEW only if no clarification remains; otherwise CLARIFICATION_REQUIRED.
          Do not generate the UI criteria matrix in this draft. The workflow first closes the deterministic one-level impact scope, then generates UI criteria against that exact scope.
          EOF
          cat /tmp/kodjo-v2-initial/canonical-context.txt >> /tmp/kodjo-v2-initial/draft-prompt.txt
          DRAFT_SCHEMA=$(jq -nc '{type:"object",additionalProperties:false,required:["plan_markdown","modified_modules","plan_status"],properties:{plan_markdown:{type:"string",minLength:1},modified_modules:{type:"array",minItems:1,items:{type:"object",additionalProperties:false,required:["path","change"],properties:{path:{type:"string",minLength:1},change:{type:"string",enum:["MODIFY","CREATE"]}}}},plan_status:{type:"string",enum:["READY_FOR_INDEPENDENT_REVIEW","CLARIFICATION_REQUIRED"]}}}')
          jq -n --arg model 'gpt-5.6-luna' --rawfile prompt /tmp/kodjo-v2-initial/draft-prompt.txt --argjson schema "$DRAFT_SCHEMA" '{model:$model,input:$prompt,store:false,reasoning:{effort:"high"},max_output_tokens:20000,text:{verbosity:"medium",format:{type:"json_schema",name:"kodjo_initial_plan_draft",strict:true,schema:$schema}}}' > /tmp/kodjo-v2-initial/draft-request.json
          node scripts/kodjo/openai-plan-request.js /tmp/kodjo-v2-initial/draft-request.json /tmp/kodjo-v2-initial/draft-response.json /tmp/kodjo-v2-initial/draft-api-evidence.json /tmp/kodjo-v2-initial/api-pacing.json
          test "$(jq -r '.status // "missing"' /tmp/kodjo-v2-initial/draft-response.json)" = completed
          jq -er '[.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text] | join("\n") | select(length>0)' /tmp/kodjo-v2-initial/draft-response.json > /tmp/kodjo-v2-initial/draft-structured.json
          node <<'NODE'
          const fs=require('node:fs');
          const {normalizeModules}=require('./scripts/kodjo/lib/plan-impact');
          const result=JSON.parse(fs.readFileSync('/tmp/kodjo-v2-initial/draft-structured.json','utf8'));
          if(!result||typeof result.plan_markdown!=='string'||!result.plan_markdown.trim()) throw new Error('INITIAL_PLAN_DRAFT_INVALID');
          if(/<\/?KODJO_|^\s*PLAN_STATUS:/m.test(result.plan_markdown)) throw new Error('PLAN_GENERATION_MARKER_DUPLICATION');
          const modules=normalizeModules(result.modified_modules);
          const status=String(result.plan_status||'');
          if(!['READY_FOR_INDEPENDENT_REVIEW','CLARIFICATION_REQUIRED'].includes(status)) throw new Error('INITIAL_PLAN_STATUS_INVALID');
          const out=result.plan_markdown.trimEnd()+'\n\n<KODJO_MODIFIED_MODULES_JSON>\n'+JSON.stringify(modules,null,2)+'\n</KODJO_MODIFIED_MODULES_JSON>\n\nPLAN_STATUS: '+status+'\n';
          fs.writeFileSync('/tmp/kodjo-v2-initial/plan-draft.md',out,'utf8');
          NODE

      - name: Close impact scope and assemble canonical plan
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
        run: |
          set -euo pipefail
          exec 2> >(tee -a /tmp/kodjo-v2-initial/planning-stderr.log >&2)
          node scripts/kodjo/scan-plan-impact.js extract-modules /tmp/kodjo-v2-initial/plan-draft.md /tmp/kodjo-v2-initial/modules.json
          node scripts/kodjo/validate-plan-module-paths.js "$SOURCE_HEAD" /tmp/kodjo-v2-initial/modules.json /tmp/kodjo-v2-initial/source
          (cd /tmp/kodjo-v2-initial/source && node "$GITHUB_WORKSPACE/scripts/kodjo/scan-plan-impact.js" scan "$SOURCE_HEAD" /tmp/kodjo-v2-initial/modules.json /tmp/kodjo-v2-initial/scan.json)
          cat > /tmp/kodjo-v2-initial/final-prompt.txt <<'EOF'
          Produce the complete final KODJO V2 INITIAL technical plan from the supplied draft and deterministic one-level direct-import scan.
          This INITIAL contract has exactly one scan level: never promote a consumer into a new scan root and never infer transitive importers.
          Return every scan candidate exactly once in decisions. Production consumers use MODIFY or CONSUMER_UNAFFECTED. Tests use TEST_MUST_ADAPT or TEST_UNAFFECTED. REQUIRES_CLARIFICATION is blocking. A direct import alone never proves that a consumer or test must change.
          If BASE_PLAN and INDEPENDENT_REVIEW are present in the canonical context, preserve all unaffected content and validated decisions from BASE_PLAN and correct only the explicit REVISE findings plus directly demonstrated dependencies. Do not reconstruct unrelated sections and do not widen scope merely to satisfy validation.
          The UI criteria matrix is generated NOW, after the deterministic scan. It must cover every non-test UI path that will be writable in the final one-level scope: each UI modified_module plus each UI scan candidate classified MODIFY. Criteria must remain atomic and source-traceable; preservation entries must be unique within preserve/change/forbidden.
          Every new test required by the plan must be named in the Tests section with its exact repository-relative path. If prose contains scope_allow, the workflow will reconcile it mechanically to the exact final one-level scope.
          Keep all narrative sections in French. Return READY_FOR_INDEPENDENT_REVIEW only when no clarification remains.
          EOF
          printf '\n===== CANONICAL CONTEXT =====\n' >> /tmp/kodjo-v2-initial/final-prompt.txt
          cat /tmp/kodjo-v2-initial/canonical-context.txt >> /tmp/kodjo-v2-initial/final-prompt.txt
          printf '\n===== DRAFT %s =====\n' "$SLICE_ID" >> /tmp/kodjo-v2-initial/final-prompt.txt
          cat /tmp/kodjo-v2-initial/plan-draft.md >> /tmp/kodjo-v2-initial/final-prompt.txt
          printf '\n===== DETERMINISTIC ONE-LEVEL DIRECT IMPORT SCAN =====\n' >> /tmp/kodjo-v2-initial/final-prompt.txt
          cat /tmp/kodjo-v2-initial/scan.json >> /tmp/kodjo-v2-initial/final-prompt.txt
          node scripts/kodjo/generate-ui-plan-contract.js request final /tmp/kodjo-v2-initial/final-prompt.txt /tmp/kodjo-v2-initial/final-request.json /tmp/kodjo-v2-initial/scan.json
          node scripts/kodjo/openai-plan-request.js /tmp/kodjo-v2-initial/final-request.json /tmp/kodjo-v2-initial/final-response.json /tmp/kodjo-v2-initial/final-api-evidence.json /tmp/kodjo-v2-initial/api-pacing.json
          test "$(jq -r '.status // "missing"' /tmp/kodjo-v2-initial/final-response.json)" = completed
          node scripts/kodjo/generate-ui-plan-contract.js decode final /tmp/kodjo-v2-initial/final-response.json /tmp/kodjo-v2-initial/final-plan-with-decisions.md /tmp/kodjo-v2-initial/scan.json /tmp/kodjo-v2-initial/source
          node <<'NODE'
          const fs=require('node:fs');
          const {extractTaggedJson,sha256}=require('./scripts/kodjo/lib/plan-impact');
          const plan=fs.readFileSync('/tmp/kodjo-v2-initial/final-plan-with-decisions.md','utf8');
          const scan=JSON.parse(fs.readFileSync('/tmp/kodjo-v2-initial/scan.json','utf8'));
          const decisions=extractTaggedJson(plan,'KODJO_PLAN_DECISIONS_JSON');
          const byPath=new Map(decisions.map(x=>[x.path,x]));
          if(byPath.size!==scan.candidates.length) throw new Error('INITIAL_PLAN_DECISION_CARDINALITY');
          for(const candidate of scan.candidates) {
            const d=byPath.get(candidate.path);
            if(!d) throw new Error('INITIAL_PLAN_CANDIDATE_UNCLASSIFIED:'+candidate.path);
            if(d.classification==='REQUIRES_CLARIFICATION') throw new Error('INITIAL_PLAN_REQUIRES_CLARIFICATION:'+candidate.path);
            if(candidate.candidate_kind==='TEST'&&!['TEST_MUST_ADAPT','TEST_UNAFFECTED'].includes(d.classification)) throw new Error('INITIAL_PLAN_TEST_CLASSIFICATION_INVALID:'+candidate.path);
            if(candidate.candidate_kind==='CONSUMER'&&!['MODIFY','CONSUMER_UNAFFECTED'].includes(d.classification)) throw new Error('INITIAL_PLAN_CONSUMER_CLASSIFICATION_INVALID:'+candidate.path);
          }
          const rows=[
            ...scan.modified_modules.map(m=>({path:m.path,candidate_kind:'MODIFIED_MODULE',triggered_by:[],risk_score:0,classification:'MODIFY',justification:'Module explicitement déclaré par le plan initial.'})),
            ...scan.candidates.map(candidate=>({...candidate,classification:byPath.get(candidate.path).classification,justification:byPath.get(candidate.path).justification}))
          ];
          const scope=rows.filter(r=>r.classification==='MODIFY'||r.classification==='TEST_MUST_ADAPT').map(r=>r.path).sort();
          const directModifiedConsumers=scan.candidates.filter(c=>c.candidate_kind==='CONSUMER'&&byPath.get(c.path).classification==='MODIFY').map(c=>c.path);
          console.log(`INITIAL_PLAN_DIRECT_SCOPE modified_modules=${scan.modified_modules.length} candidates=${scan.candidates.length} direct_modified_consumers=${directModifiedConsumers.length} scope_allow=${scope.length}`);
          if(scope.length>20) console.warn(`INITIAL_PLAN_DIRECT_SCOPE_WARNING scope_allow=${scope.length} threshold=20 contract=ONE_LEVEL_DIRECT_IMPORTS`);
          const matrix={schema:'kodjo.plan-impact.v1',scan_revision:scan.scan_revision,scan_sha256:sha256(scan),modified_modules:scan.modified_modules,rows,scope_allow:scope};
          fs.writeFileSync('/tmp/kodjo-v2-initial/matrix.json',JSON.stringify(matrix,null,2)+'\n');
          const modulesBlock='<KODJO_MODIFIED_MODULES_JSON>\n'+JSON.stringify(scan.modified_modules,null,2)+'\n</KODJO_MODIFIED_MODULES_JSON>\n';
          const marker='<KODJO_PLAN_DECISIONS_JSON>';
          if(!plan.includes(marker)) throw new Error('INITIAL_PLAN_DECISIONS_MISSING');
          fs.writeFileSync('/tmp/kodjo-v2-initial/final-plan.md',plan.replace(marker,modulesBlock+'\n'+marker),'utf8');
          NODE
          node scripts/kodjo/reconcile-initial-plan-prose.js \
            /tmp/kodjo-v2-initial/final-plan.md \
            /tmp/kodjo-v2-initial/matrix.json \
            /tmp/kodjo-v2-initial/technical-plan.md
          printf '\n\n<KODJO_PLAN_IMPACT_JSON>\n' >> /tmp/kodjo-v2-initial/technical-plan.md
          cat /tmp/kodjo-v2-initial/matrix.json >> /tmp/kodjo-v2-initial/technical-plan.md
          printf '</KODJO_PLAN_IMPACT_JSON>\n' >> /tmp/kodjo-v2-initial/technical-plan.md
          if test -f /tmp/kodjo-v2-initial/base-plan-for-revision.md; then
            node scripts/kodjo/verify-bounded-plan-revision.js /tmp/kodjo-v2-initial/base-plan-for-revision.md /tmp/kodjo-v2-initial/base-review-for-revision.md /tmp/kodjo-v2-initial/technical-plan.md /tmp/kodjo-v2-initial/plan-revision-status.json
            revision_status=$(jq -er '.status' /tmp/kodjo-v2-initial/plan-revision-status.json)
            case "$revision_status" in
              BOUNDED|APPROVED_BASE_NEW_CYCLE) ;;
              LEGACY_UNBOUNDED) echo 'Historical plan: full independent revalidation required' >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo 'PLAN_REVISION_STATUS_INVALID' >&2; exit 1 ;;
            esac
            printf "\n<KODJO_PLAN_REVISION_STATUS_JSON>\n" >> /tmp/kodjo-v2-initial/technical-plan.md
            cat /tmp/kodjo-v2-initial/plan-revision-status.json >> /tmp/kodjo-v2-initial/technical-plan.md
            printf "</KODJO_PLAN_REVISION_STATUS_JSON>\n" >> /tmp/kodjo-v2-initial/technical-plan.md
          fi
          node scripts/kodjo/verify-ui-plan-criteria.js /tmp/kodjo-v2-initial/technical-plan.md "$SOURCE_HEAD" /tmp/kodjo-v2-initial/source /tmp/kodjo-v2-initial/ui-plan-contract.json
          printf '\n<KODJO_UI_PLAN_CONTRACT_JSON>\n' >> /tmp/kodjo-v2-initial/technical-plan.md
          cat /tmp/kodjo-v2-initial/ui-plan-contract.json >> /tmp/kodjo-v2-initial/technical-plan.md
          printf '</KODJO_UI_PLAN_CONTRACT_JSON>\n' >> /tmp/kodjo-v2-initial/technical-plan.md
          KODJO_REQUIRE_NON_UI_COVERAGE=1 node scripts/kodjo/verify-plan-contract-consistency.js /tmp/kodjo-v2-initial/technical-plan.md "$SOURCE_HEAD" /tmp/kodjo-v2-initial/source /tmp/kodjo-v2-initial/plan-contract.json
          printf '\n<KODJO_PLAN_CONTRACT_JSON>\n' >> /tmp/kodjo-v2-initial/technical-plan.md
          cat /tmp/kodjo-v2-initial/plan-contract.json >> /tmp/kodjo-v2-initial/technical-plan.md
          printf '</KODJO_PLAN_CONTRACT_JSON>\n' >> /tmp/kodjo-v2-initial/technical-plan.md
          (cd /tmp/kodjo-v2-initial/source && node "$GITHUB_WORKSPACE/scripts/kodjo/verify-plan-impact.js" /tmp/kodjo-v2-initial/technical-plan.md "$SOURCE_HEAD" /tmp/kodjo-v2-initial/replay.json /tmp/kodjo-v2-initial/proof.json)

      - name: Publish canonical initial V2 PLAN_OUTPUT
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          BOOTSTRAP_PATH: ${{ steps.gate.outputs.bootstrap_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
        run: |
          set -euo pipefail
          STATUS='PLAN_READY_FOR_INDEPENDENT_REVIEW'
          if grep -q '^PLAN_STATUS: CLARIFICATION_REQUIRED' /tmp/kodjo-v2-initial/technical-plan.md; then STATUS='CLARIFICATION_REQUIRED'; fi
          {
            echo '[KODJO_V2] PLAN_OUTPUT'
            echo "slice_id=$SLICE_ID"
            echo "bootstrap_path=$BOOTSTRAP_PATH"
            echo "source_head=$SOURCE_HEAD"
            echo 'planning_mode=INITIAL'
            echo 'planning_contract=kodjo.plan-impact.v1'
            echo 'ui_planning_contract=kodjo.ui-plan-criteria.v2'
            echo "STATUT : $STATUS"
            echo
            cat /tmp/kodjo-v2-initial/technical-plan.md
          } > /tmp/kodjo-v2-initial/comment.md
          CREATED="$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$(cat /tmp/kodjo-v2-initial/comment.md)")"
          PLAN_ID="$(printf '%s' "$CREATED" | jq -r '.id')"
          printf '%s' "$PLAN_ID" | grep -Eq '^[1-9][0-9]*$'
          if [ "$STATUS" = 'PLAN_READY_FOR_INDEPENDENT_REVIEW' ]; then
            gh workflow run kodjo-v2-slice-initial-plan-review.yml --ref main \
              -f issue_number="$ISSUE_NUMBER" \
              -f slice_id="$SLICE_ID" \
              -f bootstrap_path="$BOOTSTRAP_PATH" \
              -f source_plan_comment_id="$PLAN_ID"
          fi

      - name: Classify initial planning failure before any retry
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/kodjo-v2-initial
          node scripts/kodjo/classify-planning-failure.js /tmp/kodjo-v2-initial/planning-stderr.log /tmp/kodjo-v2-initial/error-classification.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preserve initial planning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-initial-plan-${{ github.run_id }}
          path: |
            /tmp/kodjo-v2-initial/*api-evidence*.json
            /tmp/kodjo-v2-initial/draft-response.json
            /tmp/kodjo-v2-initial/final-response.json
            /tmp/kodjo-v2-initial/draft-structured.json
