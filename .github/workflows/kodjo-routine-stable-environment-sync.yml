name: KODJO — Routine stable environment sync

run-name: Routine stable sync — PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: routine-stable-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: production

    steps:
      - name: Checkout environment-sync tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve finalized V2 delivery
        id: delivery
        shell: bash
        run: |
          set -euo pipefail
          meta="${RUNNER_TEMP}/routine-stable-sync.json"
          node scripts/kodjo/resolve-stable-environment-sync.js             "$GITHUB_REPOSITORY"             "${{ github.event.pull_request.number }}"             "$meta"
          applicable="$(jq -r 'if (.applicable | type) == "boolean" then .applicable else error("ENV_SYNC_APPLICABILITY_INVALID") end' "$meta")"
          {
            echo "meta=$meta"
            echo "applicable=$applicable"
          } >> "$GITHUB_OUTPUT"
          if [ "$applicable" = "true" ]; then
            {
              echo "slice_id=$(jq -r .slice_id "$meta")"
              echo "base_head=$(jq -r .base_head "$meta")"
              echo "delivered_head=$(jq -r .delivered_head "$meta")"
              echo "main_merge_head=$(jq -r .main_merge_head "$meta")"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact closed-slice main commit
        if: steps.delivery.outputs.applicable == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.delivery.outputs.main_merge_head }}
          fetch-depth: 0
          persist-credentials: false
          path: delivery

      - name: Verify main commit and classify update compatibility
        if: steps.delivery.outputs.applicable == 'true'
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.delivery.outputs.main_merge_head }}"
          actual="$(git -C delivery rev-parse HEAD)"
          test "$actual" = "$expected"
          git -C delivery fetch --quiet origin main
          git -C delivery merge-base --is-ancestor "$expected" origin/main
          compat="${RUNNER_TEMP}/routine-stable-compatibility.json"
          (
            cd delivery
            node ../scripts/kodjo/classify-environment-update.js               "${{ steps.delivery.outputs.base_head }}"               "${{ steps.delivery.outputs.delivered_head }}"               "$compat"
          )
          echo "file=$compat" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r .status "$compat")" >> "$GITHUB_OUTPUT"

      - name: Verify Expo authentication
        if: steps.delivery.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || {
            echo "::error::Repository secret EXPO_TOKEN is missing."
            exit 1
          }

      - name: Install project dependencies
        if: steps.delivery.outputs.applicable == 'true'
        working-directory: delivery
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        if: steps.delivery.outputs.applicable == 'true'
        shell: bash
        run: npm install --global eas-cli@21.7.1

      - name: Verify Routine stable configuration
        if: steps.delivery.outputs.applicable == 'true'
        working-directory: delivery
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public --json > "${RUNNER_TEMP}/routine-stable-expo-config.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/routine-stable-expo-config.json','utf8'));
          if(c.name!=='Routine') throw new Error('ROUTINE_NAME_INVALID');
          if(c.ios?.bundleIdentifier!=='com.ankusha.kodjo') throw new Error('ROUTINE_BUNDLE_ID_INVALID');
          if(c.extra?.eas?.projectId!=='0ee44f86-bd22-4b92-8780-e265b72907d9') throw new Error('EAS_PROJECT_ID_INVALID');
          if(c.updates?.url!=='https://u.expo.dev/0ee44f86-bd22-4b92-8780-e265b72907d9') throw new Error('EAS_UPDATE_URL_INVALID');
          if(!c.runtimeVersion) throw new Error('EAS_RUNTIME_VERSION_MISSING');
          NODE

      - name: Publish exact closed-slice main commit to Routine stable channel
        if: steps.delivery.outputs.applicable == 'true' && steps.compatibility.outputs.status == 'OTA_COMPATIBLE'
        working-directory: delivery
        shell: bash
        run: |
          set -euo pipefail
          eas update             --channel stable             --platform ios             --environment preview             --message "KODJO stable ${{ steps.delivery.outputs.slice_id }} ${{ steps.delivery.outputs.main_merge_head }}"             --non-interactive             --json > "${RUNNER_TEMP}/routine-stable-eas-update.json"
          cat "${RUNNER_TEMP}/routine-stable-eas-update.json"

      - name: Submit new Routine stable preview build when native runtime changed
        if: steps.delivery.outputs.applicable == 'true' && steps.compatibility.outputs.status == 'NATIVE_REBUILD_REQUIRED'
        working-directory: delivery
        shell: bash
        run: |
          set -euo pipefail
          eas build             --platform ios             --profile preview             --non-interactive             --no-wait             --json > "${RUNNER_TEMP}/routine-stable-eas-build.json"
          cat "${RUNNER_TEMP}/routine-stable-eas-build.json"

      - name: Publish environment-sync summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.delivery.outputs.applicable }}" != "true" ]; then
            {
              echo "### Routine stable environment synchronization"
              echo
              echo "Merged PR #${{ github.event.pull_request.number }} is not a finalized KODJO V2 application delivery."
              echo "No Routine environment action was taken."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Routine stable environment synchronization"
            echo
            echo "- Slice: \`${{ steps.delivery.outputs.slice_id }}\`"
            echo "- Closed application PR: #${{ github.event.pull_request.number }}"
            echo "- Delivered HEAD: \`${{ steps.delivery.outputs.delivered_head }}\`"
            echo "- Main closure commit: \`${{ steps.delivery.outputs.main_merge_head }}\`"
            echo "- Compatibility: \`${{ steps.compatibility.outputs.status }}\`"
            if [ "${{ steps.compatibility.outputs.status }}" = "OTA_COMPATIBLE" ]; then
              echo "- Target: EAS Update channel \`stable\`"
            else
              echo "- Target: new Routine internal preview build"
              echo "- Reason: native-sensitive change requires a new binary before further OTA updates"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve environment-sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routine-stable-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.delivery.outputs.meta }}
            ${{ steps.compatibility.outputs.file }}
            ${{ runner.temp }}/routine-stable-expo-config.json
            ${{ runner.temp }}/routine-stable-eas-update.json
            ${{ runner.temp }}/routine-stable-eas-build.json
          if-no-files-found: warn
          retention-days: 14
