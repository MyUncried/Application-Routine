name: KODJO V2 targeted runner cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CLEAN_CERTIFIED_STALE_KODJO_DIRECTORIES
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  cleanup:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 20
    env:
      CONFIRMATION: ${{ inputs.confirm }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Revalidate and remove only the nine certified stale directories
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedConfirmation = 'CLEAN_CERTIFIED_STALE_KODJO_DIRECTORIES'
          if ($env:CONFIRMATION -cne $expectedConfirmation) {
            throw 'CLEANUP_CONFIRMATION_MISMATCH'
          }

          $runIds = @(
            '34581475667',
            '34581685318',
            '34582316734',
            '34583615121',
            '34584903053',
            '34587778681',
            '34602213649',
            '34605322274',
            '34606534268'
          )
          $expectedNames = @($runIds | Sort-Object)
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $kodjoRoot = [IO.Path]::GetFullPath((Join-Path $workspace '_kodjo')).TrimEnd('\')
          if ([IO.Path]::GetDirectoryName($kodjoRoot).TrimEnd('\') -ne $workspace -or [IO.Path]::GetFileName($kodjoRoot) -ne '_kodjo') {
            throw ('KODJO_ROOT_IDENTITY_MISMATCH: ' + $kodjoRoot)
          }

          $lock = Join-Path (Join-Path $env:USERPROFILE '.kodjo-v2') 'claude-local.lock'
          if (Test-Path -LiteralPath $lock) {
            throw ('CLAUDE_LOCK_PRESENT: ' + $lock)
          }
          $processes = @(Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -and $_.CommandLine.IndexOf($kodjoRoot, [StringComparison]::OrdinalIgnoreCase) -ge 0
          })
          if ($processes.Count -ne 0) {
            throw ('KODJO_PROCESS_PRESENT: ' + (($processes | ForEach-Object { $_.ProcessId }) -join ','))
          }

          if (-not (Test-Path -LiteralPath $kodjoRoot -PathType Container)) {
            throw ('KODJO_ROOT_NOT_FOUND: ' + $kodjoRoot)
          }
          $currentNames = @(Get-ChildItem -LiteralPath $kodjoRoot -Directory -Force | ForEach-Object { $_.Name } | Sort-Object)
          if (($currentNames -join ',') -cne ($expectedNames -join ',')) {
            throw ('KODJO_INVENTORY_CHANGED expected=' + ($expectedNames -join ',') + ' actual=' + ($currentNames -join ','))
          }

          $headers = @{
            Authorization = 'Bearer ' + $env:GH_TOKEN
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          foreach ($runId in $runIds) {
            $uri = $env:GITHUB_API_URL + '/repos/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $runId
            $run = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
            if ($run.id.ToString() -cne $runId -or $run.status -cne 'completed' -or $run.name -cne 'KODJO V2 Lean Queue') {
              throw ('RUN_NOT_CERTIFIED_STALE: id=' + $runId + ' name=' + $run.name + ' status=' + $run.status)
            }
            Write-Host ('KODJO_CLEANUP_PREFLIGHT run_id=' + $runId + ' conclusion=' + $run.conclusion)
          }

          $deletedBytes = [int64]0
          foreach ($runId in $runIds) {
            if (Test-Path -LiteralPath $lock) {
              throw ('CLAUDE_LOCK_APPEARED: ' + $lock)
            }
            $processes = @(Get-CimInstance Win32_Process | Where-Object {
              $_.CommandLine -and $_.CommandLine.IndexOf($kodjoRoot, [StringComparison]::OrdinalIgnoreCase) -ge 0
            })
            if ($processes.Count -ne 0) {
              throw ('KODJO_PROCESS_APPEARED: ' + (($processes | ForEach-Object { $_.ProcessId }) -join ','))
            }

            $target = [IO.Path]::GetFullPath((Join-Path $kodjoRoot $runId)).TrimEnd('\')
            if ([IO.Path]::GetDirectoryName($target).TrimEnd('\') -ne $kodjoRoot -or [IO.Path]::GetFileName($target) -cne $runId) {
              throw ('TARGET_IDENTITY_MISMATCH: ' + $target)
            }
            $measure = Get-ChildItem -LiteralPath $target -File -Force -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum
            $bytes = if ($null -eq $measure.Sum) { [int64]0 } else { [int64]$measure.Sum }
            $cmdTarget = if ($target.StartsWith('\\?\')) { $target } else { '\\?\' + $target }
            for ($attempt = 1; $attempt -le 5 -and (Test-Path -LiteralPath $target); $attempt++) {
              $previousErrorActionPreference = $ErrorActionPreference
              try {
                $ErrorActionPreference = 'Continue'
                $output = & cmd.exe /d /c rd /s /q $cmdTarget 2>&1
                $exitCode = $LASTEXITCODE
              } finally {
                $ErrorActionPreference = $previousErrorActionPreference
              }
              if ($exitCode -ne 0 -or $output) {
                Write-Warning ('run_id={0} attempt={1} exit={2}: {3}' -f $runId, $attempt, $exitCode, ($output -join ' '))
              }
              if (Test-Path -LiteralPath $target) { Start-Sleep -Seconds 2 }
            }
            if (Test-Path -LiteralPath $target) {
              throw ('TARGET_CLEANUP_FAILED: ' + $target)
            }
            $deletedBytes += $bytes
            Write-Host ('KODJO_CLEANUP_DELETED run_id=' + $runId + ' bytes=' + $bytes)
          }

          $remaining = @(Get-ChildItem -LiteralPath $kodjoRoot -Directory -Force)
          if ($remaining.Count -ne 0) {
            throw ('KODJO_DIRECTORIES_REMAIN: ' + (($remaining | ForEach-Object { $_.Name }) -join ','))
          }
          Write-Host ('KODJO_CLEANUP_COMPLETE directories=9 bytes=' + $deletedBytes)

      - name: Confirm runner state after cleanup
        if: always()
        shell: powershell
        run: |
          $root = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '_kodjo')).TrimEnd('\')
          $lock = Join-Path (Join-Path $env:USERPROFILE '.kodjo-v2') 'claude-local.lock'
          $directories = if (Test-Path -LiteralPath $root) { @(Get-ChildItem -LiteralPath $root -Directory -Force) } else { @() }
          $processes = @(Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -and $_.CommandLine.IndexOf($root, [StringComparison]::OrdinalIgnoreCase) -ge 0
          })
          Write-Host ('KODJO_CLEANUP_FINAL lock=' + [bool](Test-Path -LiteralPath $lock) + ' processes=' + $processes.Count + ' directories=' + $directories.Count)
