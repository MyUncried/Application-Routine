      - name: Publish independent initial V2 plan review
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          BOOTSTRAP_PATH: ${{ steps.gate.outputs.bootstrap_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
          PLAN_ID: ${{ steps.gate.outputs.plan_id }}
          PINNED_PUBLICATION: ${{ steps.gate.outputs.pinned_publication }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          $ErrorActionPreference='Stop'
          $review=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-initial-review.md" -Encoding UTF8
          $findings=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-initial-review-findings.json" -Encoding UTF8 | ConvertFrom-Json
          $verdict=[string]$findings.verdict
          if($verdict -notin @('APPROVE','REVISE')){throw 'Derived review verdict invalid'}
          $status=if($verdict -eq 'APPROVE'){'PLAN_REVIEW_APPROVED'}else{'PLAN_REVISION_REQUIRED'}
          $proof=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-initial-review-proof.json" -Encoding UTF8
          $contract=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-initial-review-contract.json" -Encoding UTF8
          $uiContract=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-initial-review-ui-contract.json" -Encoding UTF8
          $nl=[Environment]::NewLine
          $header='[KODJO_V2] PLAN_REVIEW_OUTPUT'+$nl+'slice_id='+$env:SLICE_ID+$nl+'bootstrap_path='+$env:BOOTSTRAP_PATH+$nl+'source_head='+$env:SOURCE_HEAD+$nl+'protocol_execution_head='+$env:PROTOCOL_EXECUTION_HEAD+$nl+'planning_mode=INITIAL'+$nl+'source_plan_comment_id='+$env:PLAN_ID+$nl+'reviewer=CLAUDE'+$nl+'review_session_id='+$env:SESSION_ID+$nl+'verdict='+$verdict+$nl+'STATUT : '+$status+$nl+$nl
          $impact=$nl+'<KODJO_PLAN_IMPACT_REVIEW_JSON>'+$nl+$proof.Trim()+$nl+'</KODJO_PLAN_IMPACT_REVIEW_JSON>'+$nl
          $contractProof=$nl+'<KODJO_PLAN_CONTRACT_REVIEW_JSON>'+$nl+$contract.Trim()+$nl+'</KODJO_PLAN_CONTRACT_REVIEW_JSON>'+$nl
          $uiContractProof=$nl+'<KODJO_UI_PLAN_CONTRACT_REVIEW_JSON>'+$nl+$uiContract.Trim()+$nl+'</KODJO_UI_PLAN_CONTRACT_REVIEW_JSON>'+$nl
                    $findingsProof=$nl+'<KODJO_PLAN_REVIEW_FINDINGS_JSON>'+$nl+(Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-initial-review-findings.json" -Encoding UTF8).Trim()+$nl+'</KODJO_PLAN_REVIEW_FINDINGS_JSON>'+$nl
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\kodjo-v2-initial-review-comment.md",$header+$review+$impact+$contractProof+$uiContractProof+$findingsProof,(New-Object Text.UTF8Encoding($false)))
          $commentPath=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-comment.md'
          [string]$commentBody=[IO.File]::ReadAllText($commentPath,[Text.Encoding]::UTF8)
          $payloadPath=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-publish.json'
          [IO.File]::WriteAllText($payloadPath,(@{body=[string]$commentBody}|ConvertTo-Json -Depth 3),(New-Object Text.UTF8Encoding($false)))
          $payloadCheck=[IO.File]::ReadAllText($payloadPath)|ConvertFrom-Json
          if($payloadCheck.body -isnot [string] -or $payloadCheck.body -cne $commentBody){throw 'Plan review publication payload body must be an exact string'}
          # Publication bornée à trois tentatives (run 37136337819 : HTTP 400 de cause non démontrée, sortie de revue perdue).
          # Après chaque échec, y compris le troisième, une publication déjà créée côté serveur pour la même session et le
          # même plan est reprise : jamais de doublon. Si cette recherche échoue, aucune nouvelle tentative n'est faite.
          $created=$null
          for($attempt=1;$attempt -le 3;$attempt++){
            $raw=gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input $payloadPath
            if($LASTEXITCODE -eq 0 -and $raw){$created=$raw|ConvertFrom-Json;break}
            Write-Host "Plan review publication attempt $attempt failed"
            Start-Sleep -Seconds (15*$attempt)
            $listing=gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments?per_page=100"
            if($LASTEXITCODE -ne 0 -or -not $listing){throw 'Plan review publication lookup failed; no further attempt'}
            $existing=@(($listing|ConvertFrom-Json)|ForEach-Object{$_}|Where-Object{$_.user.login -eq 'github-actions[bot]' -and ([string]$_.body).StartsWith('[KODJO_V2] PLAN_REVIEW_OUTPUT') -and (([string]$_.body) -replace "`r",'') -cmatch "(?m)^review_session_id=$([regex]::Escape($env:SESSION_ID))$" -and (([string]$_.body) -replace "`r",'') -cmatch "(?m)^source_plan_comment_id=$([regex]::Escape($env:PLAN_ID))$"})
            if($existing.Count -ge 1){$created=$existing[-1];break}
          }
          if($null-eq$created-or-not$created.id){throw 'Plan review publication failed'}
          $reviewCommentId=[string]$created.id
          if($verdict -eq 'APPROVE'){
            gh workflow run kodjo-v2-plan-handoff-materialize.yml --ref main -f "issue_number=$env:ISSUE_NUMBER" -f "review_comment_id=$reviewCommentId"
            if($LASTEXITCODE-ne0){throw 'Plan handoff materialization dispatch failed'}
          }else{
            $history=gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments?per_page=100"
            if($LASTEXITCODE-ne0){throw 'Plan retry history unavailable'}
            $historyFile=Join-Path $env:RUNNER_TEMP 'kodjo-plan-retry-history.json'
            [IO.File]::WriteAllText($historyFile,($history -join [Environment]::NewLine),(New-Object Text.UTF8Encoding($false)))
            $retry=node (Join-Path (Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-protocol') 'decide-plan-review-retry.js') $historyFile $env:SLICE_ID $reviewCommentId|ConvertFrom-Json
            if($LASTEXITCODE-ne0){throw 'Plan retry decision failed'}
            # Un plan publié (non produit par le modèle de planification) n'est jamais régénéré automatiquement après REVISE.
            if(($env:PLAN_ID -in @('5913845392','5916079168','5918243649','5920359910','5930810339','5939160567')) -or ($env:PINNED_PUBLICATION -eq 'true') -or ([string]$retry.status -eq 'USER_VALIDATION') -or (@($findings.findings|Where-Object{$_.category -eq 'CLARIFICATION'}).Count -gt 0)){
              $stop='[KODJO_V2] PLAN_RETRY_USER_VALIDATION'+$nl+'slice_id='+$env:SLICE_ID+$nl+'review_comment_id='+$reviewCommentId+$nl+'reason=REPEATED_REVISE'+$nl+'STATUT : USER_VALIDATION'
              $stopFile=Join-Path $env:RUNNER_TEMP 'kodjo-plan-retry-stop.json'
              [IO.File]::WriteAllText($stopFile,(@{body=$stop}|ConvertTo-Json -Depth 3),(New-Object Text.UTF8Encoding($false)))
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input $stopFile
              if($LASTEXITCODE-ne0){throw 'Plan retry stop publication failed'}
              exit 0
            }
            gh workflow run kodjo-v2-slice-initial-plan.yml --ref main -f "issue_number=$env:ISSUE_NUMBER" -f "slice_id=$env:SLICE_ID" -f "bootstrap_path=$env:BOOTSTRAP_PATH" -f "source_head=$env:SOURCE_HEAD" -f "command_comment_id=$reviewCommentId"
            if($LASTEXITCODE-ne0){throw 'Bounded initial replanning dispatch failed'}
          }

      - name: Preserve initial V2 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-initial-plan-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\kodjo-v2-initial-plan.md
            ${{ runner.temp }}\kodjo-v2-initial-review.json
            ${{ runner.temp }}\kodjo-v2-initial-review.err.txt
            ${{ runner.temp }}\kodjo-v2-initial-review-prompt.txt
            ${{ runner.temp }}\kodjo-v2-initial-review.md
            ${{ runner.temp }}\kodjo-v2-initial-review-findings.json
            ${{ runner.temp }}\kodjo-v2-initial-review-comment.md
            ${{ runner.temp }}\kodjo-v2-plan-review-publish.json
            ${{ runner.temp }}\kodjo-pre1-prior-findings.json
            ${{ runner.temp }}\kodjo-pre1-correction-register.md
            ${{ runner.temp }}\kodjo-pre1-closure-bound.json
            ${{ runner.temp }}\kodjo-pre1-round1-review.md
            ${{ runner.temp }}\kodjo-pre1-decision-register.md
            ${{ runner.temp }}\kodjo-v2-initial-review-scan.json
            ${{ runner.temp }}\kodjo-v2-initial-review-proof.json
            ${{ runner.temp }}\kodjo-v2-initial-review-contract.json
            ${{ runner.temp }}\kodjo-v2-initial-review-ui-contract.json
            ${{ runner.temp }}\kodjo-v2-initial-current-product-context\product-evidence.txt
          if-no-files-found: warn
          retention-days: 14
