name: KODJO V2 — Initial Slice Plan Review
run-name: KODJO V2 / INITIAL-PLAN-REVIEW / ${{ github.event.comment.id }}

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      slice_id:
        required: true
        type: string
      bootstrap_path:
        required: true
        type: string
      source_plan_comment_id:
        required: true
        type: string
      review_session_id:
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: kodjo-v2-initial-plan-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  review:
    if: (github.event_name == 'issue_comment' && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_INITIAL_PLAN_REVIEW')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body || '' }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      DISPATCH_SLICE_ID: ${{ inputs.slice_id || '' }}
      DISPATCH_BOOTSTRAP_PATH: ${{ inputs.bootstrap_path || '' }}
      DISPATCH_PLAN_ID: ${{ inputs.source_plan_comment_id || '' }}
      DISPATCH_REVIEW_SESSION: ${{ inputs.review_session_id || '' }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable initial V2 review gate
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner' }
          $slice=if($env:DISPATCH_SLICE_ID){$env:DISPATCH_SLICE_ID.Trim()}else{[regex]::Match($env:TRIGGER_BODY,'(?m)^slice_id=([^\r\n]+)\s*$').Groups[1].Value.Trim()}
          $bootstrap=if($env:DISPATCH_BOOTSTRAP_PATH){$env:DISPATCH_BOOTSTRAP_PATH.Trim()}else{[regex]::Match($env:TRIGGER_BODY,'(?m)^bootstrap_path=([^\r\n]+)\s*$').Groups[1].Value.Trim()}
          $planId=if($env:DISPATCH_PLAN_ID){$env:DISPATCH_PLAN_ID.Trim()}else{[regex]::Match($env:TRIGGER_BODY,'(?m)^source_plan_comment_id=([0-9]+)\s*$').Groups[1].Value}
          $reviewSession=if($env:DISPATCH_REVIEW_SESSION){$env:DISPATCH_REVIEW_SESSION.Trim()}else{[regex]::Match($env:TRIGGER_BODY,'(?m)^review_session_id=([0-9a-f-]{36})\s*$').Groups[1].Value}
          if (!$slice -or !$bootstrap -or !$planId) { throw 'Missing immutable initial V2 review inputs' }
          if ($bootstrap -ne ".github/orchestration/v2-slices/$slice/slice-bootstrap.json") { throw 'V2 bootstrap path mismatch' }
          if (!(Test-Path -LiteralPath $bootstrap)) { throw 'V2 bootstrap missing' }
          $b=Get-Content -Raw -LiteralPath $bootstrap -Encoding UTF8 | ConvertFrom-Json
          if ([string]$b.slice_id -ne $slice -or [int]$b.issue_number -ne [int]$env:ISSUE_NUMBER) { throw 'V2 identity mismatch' }
          if ([string]$b.repository -ne $env:GITHUB_REPOSITORY) { throw 'V2 repository mismatch' }
          $registry=Get-Content -Raw -LiteralPath ([string]$b.activation_registry) -Encoding UTF8 | ConvertFrom-Json
          $active=@($registry.activations | Where-Object { $_.slice_id -eq $slice })
          if ($active.Count -ne 1 -or $active[0].status -ne 'ACTIVE') { throw 'V2 slice is not active' }
          $plan=gh api "repos/$env:GITHUB_REPOSITORY/issues/comments/$planId" | ConvertFrom-Json
          $recoveredPublication=($planId -in @('5913845392','5916079168','5918243649','5920359910','5930810339','5939160567'))
          if($recoveredPublication){
            $recoveredFile=Join-Path $env:RUNNER_TEMP 'kodjo-pre1-recovered-publication.md'
            node scripts/kodjo/recover-published-pre1-plan.js $planId $recoveredFile
            if($LASTEXITCODE-ne0){throw 'Verified PRE-1 publication recovery failed'}
            $plan.body=[IO.File]::ReadAllText($recoveredFile)
          }
          # Publication générique d'un plan assemblé et contrôlé localement (aucun identifiant codé en dur) :
          # autorité du propriétaire, tranche, bootstrap, commit sur la branche cible, blob, taille et SHA-256.
          $genericPublication=$false
          if(-not $recoveredPublication -and ((([string]$plan.body) -replace "`r",'') -split "`n")[0].Trim() -eq '[KODJO_V2] PLAN_PUBLICATION'){
            $recoveredFile=Join-Path $env:RUNNER_TEMP 'kodjo-v2-recovered-publication.md'
            node scripts/kodjo/recover-published-plan.js $planId $recoveredFile
            if($LASTEXITCODE-ne0){throw 'Verified plan publication recovery failed'}
            $plan.body=[IO.File]::ReadAllText($recoveredFile)
            $genericPublication=$true
          }
          if ($plan.user.login -ne 'github-actions[bot]' -and -not $recoveredPublication -and -not $genericPublication) { throw 'Plan author mismatch' }
          if ($plan.body -notmatch '(?m)^\[KODJO_V2\] PLAN_OUTPUT\s*$') { throw 'Not a V2 PLAN_OUTPUT' }
          if ($plan.body -notmatch "(?m)^slice_id=$([regex]::Escape($slice))\s*$") { throw 'Plan slice mismatch' }
          if ($plan.body -notmatch "(?m)^bootstrap_path=$([regex]::Escape($bootstrap))\s*$") { throw 'Plan bootstrap mismatch' }
          if ($plan.body -notmatch '(?m)^planning_mode=INITIAL\s*$') { throw 'Initial planning mode missing' }
          if ($plan.body -notmatch '(?m)^planning_contract=kodjo\.plan-impact\.v1\s*$') { throw 'Plan impact contract missing' }
          if ($plan.body -notmatch '(?m)^STATUT : PLAN_READY_FOR_INDEPENDENT_REVIEW\s*$') { throw 'Plan is not reviewable' }
          $source=[regex]::Match($plan.body,'(?m)^source_head=([0-9a-f]{40})\s*$').Groups[1].Value
          if ($source -ne [string]$b.baseline_head) { throw 'Initial plan source differs from bootstrap baseline' }
          $protocolExecutionHead=(git rev-parse HEAD).Trim()
          if ($protocolExecutionHead -notmatch '^[0-9a-f]{40}$') { throw 'Protocol execution HEAD invalid' }
          $planFile=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-plan.md'
          [IO.File]::WriteAllText($planFile,[string]$plan.body,(New-Object Text.UTF8Encoding($false)))
          "slice_id=$slice" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bootstrap_path=$bootstrap" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_head=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "protocol_execution_head=$protocolExecutionHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "plan_id=$planId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pinned_publication=$(if($recoveredPublication -or $genericPublication){'true'}else{'false'})" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "review_session=$reviewSession" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Snapshot protocol verifiers and immutable slice metadata
        run: |
          $ErrorActionPreference='Stop'
          $protocol=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-protocol'
          if(Test-Path -LiteralPath $protocol){Remove-Item -LiteralPath $protocol -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $protocol | Out-Null
          Copy-Item -LiteralPath scripts/kodjo/verify-plan-impact.js -Destination $protocol
          Copy-Item -LiteralPath scripts/kodjo/verify-plan-contract-consistency.js -Destination $protocol
          Copy-Item -LiteralPath scripts/kodjo/verify-ui-plan-criteria.js -Destination $protocol
          Copy-Item -LiteralPath scripts/kodjo/normalize-review-findings.js -Destination $protocol
          Copy-Item -LiteralPath scripts/kodjo/run-plan-review-cli.js -Destination $protocol
          Copy-Item -LiteralPath scripts/kodjo/resolve-claude-binary.js -Destination $protocol
          Copy-Item -LiteralPath scripts/kodjo/verify-pre1-closure-review.js -Destination $protocol
          Copy-Item -LiteralPath scripts/kodjo/decide-plan-review-retry.js -Destination $protocol
          Copy-Item -LiteralPath scripts/kodjo/verify-initial-product-sources.js -Destination $protocol
          Copy-Item -LiteralPath scripts/kodjo/lib -Destination (Join-Path $protocol 'lib') -Recurse
          $context=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-current-product-context'
          if(Test-Path -LiteralPath $context){Remove-Item -LiteralPath $context -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $context | Out-Null
          Copy-Item -LiteralPath ${{ steps.gate.outputs.bootstrap_path }} -Destination (Join-Path $context 'slice-bootstrap.json')
          Copy-Item -LiteralPath .github/orchestration/v2-slices/${{ steps.gate.outputs.slice_id }}/planning-mission.md -Destination (Join-Path $context 'planning-mission.md')

      - name: Checkout exact initial product source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.source_head }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Build exact product context from checked-out source
        run: |
          $ErrorActionPreference='Stop'
          $context=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-current-product-context'
          $bootstrapCopy=Join-Path $context 'slice-bootstrap.json'
          $protocol=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-protocol'
          $sourceVerifier=Join-Path $protocol 'verify-initial-product-sources.js'
          $evidence=Join-Path $context 'product-evidence.txt'
          & node $sourceVerifier $bootstrapCopy (Get-Location).Path $evidence $context
          if ($LASTEXITCODE -ne 0) { throw 'Portable initial product source verification failed' }
          if (!(Test-Path -LiteralPath $evidence)) { throw 'Canonical product evidence missing' }

      - name: Replay initial V2 plan impact independently
        env:
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
        run: |
          $ErrorActionPreference='Stop'
          $verifier=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-protocol\verify-plan-impact.js'
          $replay=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-scan.json'
          $proof=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-proof.json'
          & node $verifier "$env:RUNNER_TEMP\kodjo-v2-initial-plan.md" $env:SOURCE_HEAD $replay $proof
          if ($LASTEXITCODE -ne 0) { throw 'Independent initial V2 impact replay failed' }

      - name: Revalidate current plan contract before Claude
        env:
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
        run: |
          $ErrorActionPreference='Stop'
          $verifier=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-protocol\verify-plan-contract-consistency.js'
          $contract=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-contract.json'
          & node $verifier "$env:RUNNER_TEMP\kodjo-v2-initial-plan.md" $env:SOURCE_HEAD (Get-Location).Path $contract consume $env:PROTOCOL_EXECUTION_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Initial V2 plan contract is stale or inconsistent' }

      - name: Revalidate UI criteria contract before Claude
        env:
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
        run: |
          $ErrorActionPreference='Stop'
          $verifier=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-protocol\verify-ui-plan-criteria.js'
          $contract=Join-Path $env:RUNNER_TEMP 'kodjo-v2-initial-review-ui-contract.json'
          & node $verifier "$env:RUNNER_TEMP\kodjo-v2-initial-plan.md" $env:SOURCE_HEAD (Get-Location).Path $contract consume $env:PROTOCOL_EXECUTION_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Initial V2 UI criteria contract is stale or inconsistent' }

      - name: Review initial V2 plan with Claude
        id: claude
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
          REVIEW_SESSION: ${{ steps.gate.outputs.review_session }}
          SOURCE_PLAN_COMMENT_ID: ${{ steps.gate.outputs.plan_id }}
        run: |
          $ErrorActionPreference='Stop'
          $prompt=@"
          You are the independent KODJO V2 reviewer of the FIRST technical plan for $env:SLICE_ID. There is deliberately no application PR yet. Review the candidate plan in $env:RUNNER_TEMP\kodjo-v2-initial-plan.md against immutable product HEAD $env:SOURCE_HEAD, protocol execution HEAD $env:PROTOCOL_EXECUTION_HEAD, exact product context in $env:RUNNER_TEMP\kodjo-v2-initial-current-product-context, and the checked-out code/tests. This is READ-ONLY.
          The direct-import scan and the current plan contract have both been replayed independently; proof files are $env:RUNNER_TEMP\kodjo-v2-initial-review-scan.json, $env:RUNNER_TEMP\kodjo-v2-initial-review-proof.json and $env:RUNNER_TEMP\kodjo-v2-initial-review-contract.json. The UI criteria contract was also replayed before this review. Independently verify source-to-criteria completeness and source-to-assertion completeness against the current normative product sources and checked-out code: no normative UI requirement may be omitted or collapsed into a vague criterion; verify every REUSE|EXTEND|CREATE decision against actual existing components/patterns, PRESERVE/CHANGE/FORBIDDEN coverage, and risk-to-test-to-proof adequacy. A self-consistent but incomplete UI matrix requires VERDICT: REVISE. A legacy or stale plan is rejected before you run. Verify scope classifications, migration safety, backward compatibility, preservation of validated decisions, and absence of out-of-scope implementation. Do not require an application PR, prior approved plan or prior review for this INITIAL path. The INITIAL path deliberately does not use verify-plan-review-transition.js because the current planning mission may legitimately supersede the bootstrap-era mission while product sources remain immutable; product immutability is instead certified by verify-initial-product-sources.js plus the versioned plan contract. Do not invent a V1 manifest.
          Independently compare every non-UI functional, data, technical, migration and preservation requirement in the normative sources against KODJO_NON_UI_REQUIREMENTS_JSON. Verify that KODJO_NON_UI_COVERAGE_JSON cites all relevant sources. If status is NONE, challenge its reason against the actual sources; any omission or unsupported NONE requires VERDICT: REVISE.
          Before the terminal verdict, emit exactly one <KODJO_REVIEW_FINDINGS_JSON> JSON block with shape {"findings":[{"category":"REQUIREMENT_GAP|SCOPE|PATH|TEST|MIGRATION|COMPATIBILITY|PRESERVATION|UI_CRITERION|ARCHITECTURE|CLARIFICATION|OTHER","target_kind":"REQUIREMENT_ID|CRITERION_ID|PATH|PLAN|SOURCE","target":"...","blocking":true,"diagnostic":"...","expected_correction":"...","dependency_expansion_required":false,"dependency_evidence":""}]}. Do not emit finding_id: it is derived mechanically. If there is no finding, emit {"findings":[]}. Every blocking point must be one row with an exact target. Any scope expansion must set dependency_expansion_required=true and provide concrete dependency_evidence. The machine derives APPROVE/REVISE from blocking findings. A blocking PLAN target is allowed only for NON_UI_COVERAGE; otherwise emit separate exact PATH, REQUIREMENT_ID or CRITERION_ID targets so a bounded correction is possible.
          Do not emit a terminal VERDICT line. The protocol derives APPROVE or REVISE exclusively from the normalized blocking findings.
          "@
          if($env:SOURCE_PLAN_COMMENT_ID -eq '5913845392'){
            $oldReview=gh api "repos/$env:GITHUB_REPOSITORY/issues/comments/5878031654"|ConvertFrom-Json
            if($LASTEXITCODE-ne0 -or $oldReview.user.login -ne 'github-actions[bot]' -or
               $oldReview.body -notmatch '(?m)^slice_id=V2-PRE-1\s*$' -or
               $oldReview.body -notmatch '(?m)^source_plan_comment_id=5874870872\s*$' -or
               $oldReview.body -notmatch '(?m)^verdict=REVISE\s*$'){
              throw 'Bounded PRE-1 prior review binding invalid'
            }
            $oldPlan=gh api "repos/$env:GITHUB_REPOSITORY/issues/comments/5874870872"|ConvertFrom-Json
            if($LASTEXITCODE-ne0 -or $oldPlan.user.login -ne 'github-actions[bot]' -or
               $oldPlan.body -notmatch '(?m)^source_head=e216294506bed87dd80855937e3fabfbfa322b82\s*$'){
              throw 'Bounded PRE-1 prior plan binding invalid'
            }
            $oldPlanFile=Join-Path $env:RUNNER_TEMP 'kodjo-pre1-before-correction.md'
            [IO.File]::WriteAllText($oldPlanFile,[string]$oldPlan.body,(New-Object Text.UTF8Encoding($false)))
            $prompt=@"
          You are the independent reviewer of the BOUNDED CORRECTION of PRE-1, not a new initial-plan audit. This is READ-ONLY.
          Candidate: $env:RUNNER_TEMP\kodjo-v2-initial-plan.md. Immutable product HEAD: $env:SOURCE_HEAD. Its source, scope, requirement, UI and impact contracts have passed independent deterministic replay. Prior plan: $oldPlanFile. Normative sources: $env:RUNNER_TEMP\kodjo-v2-initial-current-product-context and checked-out code/tests.
          Review ONLY closure of the five blocking findings in the bound prior review below, their directly demonstrated dependencies and regressions caused by these corrections. Use the prior findings as the cumulative register. Do not reopen unrelated validated decisions, redesign the product, require future engine/UI features, audit the orchestration protocol or introduce VNext as a prerequisite.
          Closure groups: R1 effective historical migration SQL and imported constants; R2 genuinely affected removed-symbol consumers and tests; R3 both canonical ValidationField unions; R4 BODY_ZONES runtime consumers and EXTEND; R5 atomic UI/i18n requirements and preservation/change/forbidden boundaries. Check each against the actual old/new plan delta and PRE-1 scope.
          New blocking findings are admissible ONLY with concrete evidence of an unresolved direct consequence of R1..R5 or a regression introduced by their correction. State the causal link, applicable existing normative requirement, exact evidence and real PRE-1 consequence. Unrelated pre-existing improvements, unproven risks and later-phase work do not block closure. Never fabricate APPROVE or ignore a demonstrated in-scope defect.
          Provide a closure table R1..R5: prior defect, candidate correction, source/code evidence, dependencies, closed YES/NO. Nonblocking observations may be separate and do not expand this cycle.
          Emit exactly one <KODJO_REVIEW_FINDINGS_JSON> JSON block with shape {"findings":[{"category":"REQUIREMENT_GAP|SCOPE|PATH|TEST|MIGRATION|COMPATIBILITY|PRESERVATION|UI_CRITERION|ARCHITECTURE|CLARIFICATION|OTHER","target_kind":"REQUIREMENT_ID|CRITERION_ID|PATH|PLAN|SOURCE","target":"...","blocking":true,"diagnostic":"R1..R5 causal link, normative requirement, exact evidence and PRE-1 consequence","expected_correction":"...","dependency_expansion_required":false,"dependency_evidence":""}]}. Do not emit finding_id. Every blocking row needs an exact target and demonstrated causal justification. Scope expansion requires dependency_expansion_required=true and concrete dependency_evidence. A blocking PLAN target is allowed only for NON_UI_COVERAGE; otherwise use precise PATH, REQUIREMENT_ID or CRITERION_ID targets. If no finding, emit {"findings":[]}.
          Do not emit a terminal VERDICT line. The protocol derives APPROVE or REVISE from normalized blocking findings. No automatic replanning or audit relaunch is authorized after this review.
          BOUND PRIOR REVIEW (comment5878031654, candidate5874870872):
          $($oldReview.body)
          "@
          }
          if($env:SOURCE_PLAN_COMMENT_ID -eq '5916079168'){
            $findingsBlob=gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/07f6579ad59f66015c8189f079bde0aaab7d01aa"|ConvertFrom-Json
            if($LASTEXITCODE-ne0 -or $findingsBlob.sha -ne '07f6579ad59f66015c8189f079bde0aaab7d01aa' -or $findingsBlob.encoding -ne 'base64'){throw 'Pinned PRE-1 prior findings unavailable'}
            $priorFindings=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($findingsBlob.content))
            $priorCheck=$priorFindings|ConvertFrom-Json
            if(@($priorCheck.findings).Count -ne 11 -or @($priorCheck.findings|Where-Object{$_.blocking -ne $true}).Count -ne 0){throw 'Pinned PRE-1 prior findings invalid'}
            $registerBlob=gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/2b304f6408b91baf798a4b43de4d313856ed60da"|ConvertFrom-Json
            if($LASTEXITCODE-ne0 -or $registerBlob.sha -ne '2b304f6408b91baf798a4b43de4d313856ed60da' -or $registerBlob.encoding -ne 'base64'){throw 'Pinned PRE-1 correction register unavailable'}
            $correctionRegister=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($registerBlob.content))
            [IO.File]::WriteAllText("$env:RUNNER_TEMP\kodjo-pre1-prior-findings.json",$priorFindings,(New-Object Text.UTF8Encoding($false)))
            [IO.File]::WriteAllText("$env:RUNNER_TEMP\kodjo-pre1-correction-register.md",$correctionRegister,(New-Object Text.UTF8Encoding($false)))
            $prompt=@"
          You are the independent reviewer of the TARGETED CLOSURE VERIFICATION of the corrected PRE-1 plan. This is READ-ONLY. Candidate: $env:RUNNER_TEMP\kodjo-v2-initial-plan.md, pinned commit 990103188f2936bb2ed7d766fabe56ab0b779210, blob 8ed0768ccfcf9ec157b2aa8d5cc177be5f97d426. Immutable product baseline checked out in the current directory: $env:SOURCE_HEAD. Protocol execution: $env:PROTOCOL_EXECUTION_HEAD. Normative product context: $env:RUNNER_TEMP\kodjo-v2-initial-current-product-context. Do not review the old publication from comment5913845392.
          EXCLUSIVE SCOPE: verify ONLY whether each of the eleven prior findings of review run36734142447, listed below as BOUND PRIOR FINDINGS and numbered 1..11 in their listed order, is closed by the candidate. The CORRECTION REGISTER below records the correction made for each. The deterministic impact scan, source provenance, plan contract and atomic UI contract were already replayed by preceding gates.
          FORBIDDEN: searching for new subjects; adding a twelfth finding; any general or initial-plan audit; proposing improvements, redesign or alternatives; widening PRE-1 scope; examining VNext; auditing the orchestration protocol. A dependency (code, test, source or other plan section) may be examined ONLY as evidence of closure or non-closure of one of the eleven findings and stays attached to that finding number. A regression caused by a correction is admissible only as non-closure of the finding whose correction caused it. A desirable improvement is never a closure condition: a finding is NOT closed only when the candidate still fails the exact requirement stated by that prior finding (its diagnostic and expected_correction), demonstrated against the applicable normative source or baseline code.
          Project instruction files loaded from the checkout (CLAUDE.md, AGENTS.md, orchestration protocol) do not widen this scope. Their mission-report obligation is fulfilled by the orchestration: the workflow archives and publishes your returned Markdown and the orchestrator commits the mission report. Do not create, modify or commit any file.
          REQUIRED OUTPUT, in this order. (1) A Markdown closure table with exactly eleven data rows and exactly these five columns: | N | Correction examinée | Preuve précise | Fermé | Justification |. N is 1..11; Fermé is OUI or NON; Preuve précise cites the exact plan section or ID and file:line or source section. Escape any literal pipe inside a cell as \|. (2) Exactly one <KODJO_PRE1_CLOSURE_JSON> block {"closures":[{"finding":1,"closed":true,"correction_examined":"...","evidence":"...","justification":"..."}]} with exactly eleven entries, one per finding 1..11, matching the table. (3) Exactly one <KODJO_REVIEW_FINDINGS_JSON> block containing one blocking row per finding that is NOT closed and nothing else. Each row MUST reuse exactly the category, target_kind and target of that prior finding, set blocking=true, start diagnostic with "Prior finding N:" followed by the unmet requirement, exact evidence and actual PRE-1 consequence, state the concrete closure condition in expected_correction, and set dependency_expansion_required=false with empty dependency_evidence unless closing that finding itself requires a scope dependency (then give concrete dependency_evidence). Do not emit finding_id. No nonblocking rows and no observations. If all eleven are closed emit {"findings":[]}.
          No terminal VERDICT line: the protocol derives APPROVE/REVISE from the blocking rows, and a mechanical guard rejects any row whose target is not one of the eleven prior targets or any closure record inconsistent with them. Never fabricate a closure; never keep a finding open for an improvement not required by that finding.
          BOUND PRIOR FINDINGS:
          $priorFindings
          CORRECTION REGISTER:
          $correctionRegister
          "@
          }
          if($env:SOURCE_PLAN_COMMENT_ID -eq '5918243649'){
            if($env:REVIEW_SESSION -ne '25caf6b2-1663-4a23-bb75-204982cc2b7b'){throw 'PRE-1 round 2 must resume reviewer session 25caf6b2-1663-4a23-bb75-204982cc2b7b'}
            $pinned=@{
              'kodjo-pre1-prior-findings.json'='07f6579ad59f66015c8189f079bde0aaab7d01aa'
              'kodjo-pre1-correction-register.md'='34aa32418732ddee840e99caa418977b45d830d2'
              'kodjo-pre1-round1-review.md'='9cd1b0674902da3fbe2802279ebc3e863b639a94'
              'kodjo-pre1-round1-plan.md'='8ed0768ccfcf9ec157b2aa8d5cc177be5f97d426'
            }
            foreach($name in $pinned.Keys){
              $blob=gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/$($pinned[$name])"|ConvertFrom-Json
              if($LASTEXITCODE-ne0 -or $blob.sha -ne $pinned[$name] -or $blob.encoding -ne 'base64'){throw "Pinned PRE-1 round 2 input unavailable: $name"}
              [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP $name),[Convert]::FromBase64String($blob.content))
            }
