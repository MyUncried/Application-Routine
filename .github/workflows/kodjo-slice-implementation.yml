name: KODJO — Generic Slice Implementation
run-name: KODJO SLICE / IMPLEMENTATION / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: kodjo-slice-implementation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.comment.user.login == 'MyUncried' && (startsWith(github.event.comment.body, format('[KODJO_SLICE] START_IMPLEMENTATION{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('[KODJO_SLICE] IMPLEMENTATION_REVISION{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('[KODJO_SLICE] VISUAL_CORRECTION{0}', fromJSON('"\n"'))))
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve approved plan and immutable source
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner' }
          if ($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine') { throw 'Unexpected repository' }
          $slice=[regex]::Match($env:TRIGGER_BODY,'(?m)^slice_id=([^\r\n]+)\s*$').Groups[1].Value.Trim()
          $manifest=[regex]::Match($env:TRIGGER_BODY,'(?m)^manifest_path=([^\r\n]+)\s*$').Groups[1].Value.Trim()
          $planId=[regex]::Match($env:TRIGGER_BODY,'(?m)^source_plan_comment_id=([0-9]+)\s*$').Groups[1].Value
          $reviewId=[regex]::Match($env:TRIGGER_BODY,'(?m)^source_review_comment_id=([0-9]+)\s*$').Groups[1].Value
          $source=[regex]::Match($env:TRIGGER_BODY,'(?m)^source_head=([0-9a-f]{40})\s*$').Groups[1].Value
          $incrementMatches=[regex]::Matches($env:TRIGGER_BODY,'(?m)^increment=(LOT_[1-9][0-9]*_OF_[1-9][0-9]*)\s*$')
          if($incrementMatches.Count -ne 1){throw 'Exactly one valid increment is required'}
          $increment=$incrementMatches[0].Groups[1].Value
          if($increment -notmatch '^LOT_([1-9][0-9]*)_OF_([1-9][0-9]*)$' -or [int]$Matches[1] -gt [int]$Matches[2]){throw 'Invalid increment bounds'}
          if (!$slice -or !$manifest -or !$planId -or !$reviewId -or !$source) { throw 'Missing immutable implementation inputs' }
          if ($manifest -ne ".github/orchestration/slices/$slice.yml" -or !(Test-Path $manifest)) { throw 'Manifest mismatch' }
          $manifestRaw=Get-Content -Raw -LiteralPath $manifest
          $m=[pscustomobject]@{
            schema=[regex]::Match($manifestRaw,'(?m)^schema:\s*([^\r\n]+)').Groups[1].Value.Trim()
            slice_id=[regex]::Match($manifestRaw,'(?m)^slice_id:\s*([^\r\n]+)').Groups[1].Value.Trim()
            issue_number=[regex]::Match($manifestRaw,'(?m)^issue_number:\s*([0-9]+)').Groups[1].Value
            target_branch=[regex]::Match($manifestRaw,'(?m)^target_branch:\s*([^\r\n]+)').Groups[1].Value.Trim()
            baseline_head=[regex]::Match($manifestRaw,'(?m)^baseline_head:\s*([0-9a-f]{40})').Groups[1].Value
          }
          if ($m.schema -ne 'kodjo.slice.v1' -or $m.slice_id -ne $slice -or [int]$m.issue_number -ne [int]$env:ISSUE_NUMBER) { throw 'Manifest identity mismatch' }
          # The manifest baseline is the immutable origin of the slice. A revision may
          # legitimately resume from a later implementation commit, but only when that
          # commit is still the exact target-branch tip and descends from the baseline.
          $remote=git ls-remote origin "refs/heads/$($m.target_branch)"
          if (!$remote -or (($remote -split '\s+')[0]) -ne $source) { throw 'Target branch moved' }
          git fetch --no-tags origin "refs/heads/$($m.target_branch):refs/remotes/origin/$($m.target_branch)"
          if($LASTEXITCODE -ne 0){throw 'Unable to fetch target branch for ancestry validation'}
          git merge-base --is-ancestor $m.baseline_head $source
          if($LASTEXITCODE -ne 0){throw 'Source is not a descendant of manifest baseline'}
          $plan=gh api "repos/$env:GITHUB_REPOSITORY/issues/comments/$planId"|ConvertFrom-Json
          $review=gh api "repos/$env:GITHUB_REPOSITORY/issues/comments/$reviewId"|ConvertFrom-Json
          if ($plan.body -notmatch '(?m)^\[KODJO_SLICE\] PLAN_OUTPUT\s*$' -or $plan.body -notmatch '(?m)^STATUT : PLAN_READY_FOR_INDEPENDENT_REVIEW\s*$') { throw 'Invalid plan' }
          $reviewBody=([string]$review.body).TrimStart([char]0xFEFF)
          if ($reviewBody -notmatch '(?m)^\[KODJO_SLICE\] PLAN_REVIEW_OUTPUT\s*$' -or $reviewBody -notmatch '(?m)^verdict=APPROVE\s*$' -or $reviewBody -notmatch '(?m)^STATUT : PLAN_REVIEW_APPROVED\s*$') { throw 'Independent plan approval missing' }
          if ($reviewBody -notmatch "(?m)^source_plan_comment_id=$planId\s*$") { throw 'Review does not bind approved plan' }
          $cred=Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json') -Raw|ConvertFrom-Json
          if([int64]$cred.claudeAiOauth.expiresAt -le [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()){throw 'Claude token expired'}
          $triggerMarker=(($env:TRIGGER_BODY -split "\r?\n",2)[0]).TrimEnd([char]0x0D)
          $mode=switch($triggerMarker){
            '[KODJO_SLICE] START_IMPLEMENTATION' {'INITIAL';break}
            '[KODJO_SLICE] IMPLEMENTATION_REVISION' {'REVISION';break}
            '[KODJO_SLICE] VISUAL_CORRECTION' {'VISUAL';break}
            default {throw 'Invalid implementation trigger marker'}
          }
          $session=[regex]::Match($env:TRIGGER_BODY,'(?m)^session_id=([0-9a-f-]{36})\s*$').Groups[1].Value
          if($mode -ne 'INITIAL' -and !$session){throw 'Correction session_id missing'}
          $plan.body|Out-File "$env:RUNNER_TEMP\kodjo-approved-plan.md" -Encoding utf8
          $review.body|Out-File "$env:RUNNER_TEMP\kodjo-plan-review.md" -Encoding utf8
          "slice_id=$slice"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_branch=$($m.target_branch)"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_head=$source"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "plan_id=$planId"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "review_id=$reviewId"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_path=$manifest"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mode=$mode"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "session=$session"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "increment=$increment"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout exact application source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.target_branch }}
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Revalidate exact HEAD and dependencies
        env:
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_HEAD) { throw 'Checkout HEAD moved' }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))) { throw 'Dirty worktree before Claude' }
          npm ci
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          if(-not (Test-Path 'node_modules/.bin/jest.cmd')){throw 'Jest unavailable'}

      - name: Run Claude implementation
        id: claude
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          MODE: ${{ steps.gate.outputs.mode }}
          SESSION: ${{ steps.gate.outputs.session }}
          PLAN_ID: ${{ steps.gate.outputs.plan_id }}
          REVIEW_ID: ${{ steps.gate.outputs.review_id }}
          CAUSAL_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:MODE -eq 'INITIAL'){
            $plan=Get-Content "$env:RUNNER_TEMP\kodjo-approved-plan.md" -Raw -Encoding utf8
            $review=Get-Content "$env:RUNNER_TEMP\kodjo-plan-review.md" -Raw -Encoding utf8
            $prompt="KODJO generic DEV for $env:SLICE_ID. Start one dedicated development session. The current checkout at $env:SOURCE_HEAD is authoritative. Implement only the approved plan below. Reuse all established behavior and controls from prior slices. Do not modify .github workflows, protocol files, CLAUDE.md, or immutable migration001.ts. Add migrations only. Run targeted tests. Do not commit or push. Begin the result with exactly KODJO_STATUS: IMPLEMENTED when application changes are complete. If implementation cannot safely proceed because an arbitration, clarification, scope decision, device proof, or architecture decision is required, do not change application files and begin the result with exactly KODJO_STATUS: CLARIFICATION_REQUIRED, followed by the blocking questions and evidence."+[Environment]::NewLine+[Environment]::NewLine+"APPROVED PLAN:"+[Environment]::NewLine+$plan+[Environment]::NewLine+[Environment]::NewLine+"INDEPENDENT REVIEW:"+[Environment]::NewLine+$review
            $args=@('-p','--permission-mode','acceptEdits','--output-format','json')
          } else {
            $feedbackMarker=if($env:MODE -eq 'VISUAL'){'VISUAL_FEEDBACK:'}else{'REVIEW_FEEDBACK:'}
            $i=$env:TRIGGER_BODY.IndexOf($feedbackMarker)
            if($i -lt 0){throw 'Correction feedback missing'}
            $feedback=$env:TRIGGER_BODY.Substring($i+$feedbackMarker.Length).Trim()
            if(!$feedback){throw 'Correction feedback empty'}
            $rollover=($env:TRIGGER_BODY -match '(?m)^session_rollover=AUTHORIZED_AFTER_USAGE_LIMIT\s*$')
            if($rollover){
              $prompt="KODJO compact correction for $env:SLICE_ID. Start a new session. The previous session $env:SESSION is exhausted and MUST NOT be resumed. Current clean checkout: $env:SOURCE_HEAD. Apply only the delta below. Preserve all code outside it. Do not reconstruct or reread the complete plan, prior reviews, documentation or transcript. Run only relevant tests. Do not commit or push. Begin with exactly KODJO_STATUS: IMPLEMENTED only when complete."+[Environment]::NewLine+[Environment]::NewLine+"CONTEXT DELTA ONLY:"+[Environment]::NewLine+$feedback
              $args=@('-p','--permission-mode','acceptEdits','--output-format','json','--max-turns','8')
            } else {
              $prompt="KODJO differential resume for $env:SLICE_ID. Resume only session $env:SESSION; its existing plan, review, decisions and prior work remain authoritative and MUST NOT be reconstructed or reread unless the delta explicitly requires one named file. Current immutable checkout: $env:SOURCE_HEAD. Approved plan comment: $env:PLAN_ID. Approved review comment: $env:REVIEW_ID. Causal comment: $env:CAUSAL_COMMENT_ID. Apply only the delta below, preserve all previously approved behavior, run only tests relevant to this delta, and do not commit or push. Do not repeat prior analysis in the result. Begin the result with exactly KODJO_STATUS: IMPLEMENTED when application changes are complete. If a genuinely new arbitration is required, do not change application files and begin the result with exactly KODJO_STATUS: CLARIFICATION_REQUIRED, followed only by the new blocking question and evidence."+[Environment]::NewLine+[Environment]::NewLine+"CONTEXT DELTA ONLY:"+[Environment]::NewLine+$feedback
              $args=@('-p','--resume',$env:SESSION,'--permission-mode','acceptEdits','--output-format','json')
            }
            if($prompt -match '(?im)^APPROVED PLAN:|^INDEPENDENT REVIEW:'){throw 'Claude budget guard: full context forbidden on correction'}
          }
          $promptPath="$env:RUNNER_TEMP\claude-prompt.txt"
          [IO.File]::WriteAllText($promptPath,$prompt,(New-Object Text.UTF8Encoding($false)))
          $out="$env:RUNNER_TEMP\dev-out.txt"; $err="$env:RUNNER_TEMP\dev-err.txt"; $diag="$env:RUNNER_TEMP\dev-diagnostic.json"
          $old=$ErrorActionPreference; $ErrorActionPreference='Continue'
          Get-Content $promptPath -Raw -Encoding utf8 | & claude.cmd @args 1> $out 2> $err
          $exit=$LASTEXITCODE; $ErrorActionPreference=$old
          $raw=if(Test-Path $out){Get-Content $out -Raw -Encoding utf8}else{''}
          $stderr=if(Test-Path $err){Get-Content $err -Raw -Encoding utf8}else{''}
          $parsed=$null; $parseError=''
          try{$parsed=$raw|ConvertFrom-Json -ErrorAction Stop}catch{$parseError=$_.Exception.Message}
          [ordered]@{call_mode=if($env:MODE -eq 'INITIAL'){'INITIAL'}elseif($rollover){'ROLLOVER_COMPACT'}else{'RESUME_DELTA'};prompt_length=$prompt.Length;source_head=$env:SOURCE_HEAD;exit_code=$exit;stdout_length=$raw.Length;stderr_length=$stderr.Length;json_valid=($null-ne$parsed);json_error=$parseError;session_id=if($parsed){$parsed.session_id}else{$null};result_present=($null-ne$parsed-and![string]::IsNullOrWhiteSpace([string]$parsed.result))}|ConvertTo-Json|Out-File $diag -Encoding utf8
          if($parsed -and [string]$parsed.result -match 'session limit|rate.limit|429'){throw "Claude usage limit: $($parsed.result)"}
          if($exit -ne 0){throw "Claude CLI exit $exit; see diagnostic artifact"}
          if(!$parsed){throw "Claude JSON invalid: $parseError"}
          if(!$parsed.session_id -or !$parsed.result){throw 'Claude result incomplete'}
          if($env:MODE -ne 'INITIAL' -and !$rollover -and [string]$parsed.session_id -ne $env:SESSION){throw 'Claude resumed a different session'}
          if($rollover -and [string]$parsed.session_id -eq $env:SESSION){throw 'Claude rollover reused the exhausted session'}
          $result=[string]$parsed.result
          $result|Out-File "$env:RUNNER_TEMP\dev-result.txt" -Encoding utf8
          $clarification=($result -match '(?im)^KODJO_STATUS:\s*CLARIFICATION_REQUIRED\s*$|\bCLARIFICATION_REQUIRED\b|\bSCOPE_EXPANSION_REQUIRED\b|\bORCHESTRATION_FAILURE\b|arbitrage requis|arrêt sur barrière')
          "session=$($parsed.session_id)"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "clarification=$($clarification.ToString().ToLowerInvariant())"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Preserve Claude diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-slice-implementation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\dev-out.txt
            ${{ runner.temp }}\dev-err.txt
            ${{ runner.temp }}\dev-diagnostic.json
            ${{ runner.temp }}\dev-result.txt
            .github\orchestration\reports\*.md
          if-no-files-found: warn
          retention-days: 7

      - name: Publish clarification and wake ChatGPT Development
        if: steps.claude.outputs.clarification == 'true'
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          MANIFEST_PATH: ${{ steps.gate.outputs.manifest_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PLAN_ID: ${{ steps.gate.outputs.plan_id }}
          REVIEW_ID: ${{ steps.gate.outputs.review_id }}
          SESSION_ID: ${{ steps.claude.outputs.session }}
          SOURCE_IMPLEMENTATION_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          $ErrorActionPreference='Stop'
          $result=Get-Content "$env:RUNNER_TEMP\dev-result.txt" -Raw -Encoding utf8
          $nl=[Environment]::NewLine
          $body='[KODJO_SLICE] CLARIFICATION_REQUIRED'+$nl+'slice_id='+$env:SLICE_ID+$nl+'manifest_path='+$env:MANIFEST_PATH+$nl+'source_head='+$env:SOURCE_HEAD+$nl+'session_id='+$env:SESSION_ID+$nl+'source_plan_comment_id='+$env:PLAN_ID+$nl+'source_review_comment_id='+$env:REVIEW_ID+$nl+'source_implementation_comment_id='+$env:SOURCE_IMPLEMENTATION_COMMENT_ID+$nl+'STATUT : CLARIFICATION_REQUIRED'+$nl+$nl+$result
          $payload=@{body=$body}|ConvertTo-Json -Depth 4
          $payloadPath="$env:RUNNER_TEMP\clarification-payload.json"
          [IO.File]::WriteAllText($payloadPath,$payload,(New-Object Text.UTF8Encoding($false)))
          $posted=gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input $payloadPath|ConvertFrom-Json
          if(!$posted.id){throw 'Clarification publication failed'}
          $wake='[KODJO_EVENT] CHATGPT_RESUME_REQUIRED'+$nl+'schema=kodjo.resume-event.v1'+$nl+'event_type=SLICE_CLARIFICATION_REQUIRED'+$nl+'slice_id='+$env:SLICE_ID+$nl+'issue_number='+$env:ISSUE_NUMBER+$nl+'source_comment_id='+$posted.id+$nl+'source_head='+$env:SOURCE_HEAD+$nl+'session_id='+$env:SESSION_ID+$nl+'next_actor=CHATGPT_DEVELOPMENT'+$nl+'STATUT : CHATGPT_RESUME_REQUIRED'
          $wakePayload=@{body=$wake}|ConvertTo-Json -Depth 4
          $wakePath="$env:RUNNER_TEMP\chatgpt-resume-payload.json"
          [IO.File]::WriteAllText($wakePath,$wakePayload,(New-Object Text.UTF8Encoding($false)))
          $wakeup=gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input $wakePath|ConvertFrom-Json
          if(!$wakeup.id){throw 'ChatGPT Development wake-up publication failed'}

      - name: Enforce scope and deterministic checks
        if: steps.claude.outputs.clarification != 'true'
        run: |
          $ErrorActionPreference='Stop'
          $changed=@(git status --porcelain --untracked-files=all|ForEach-Object{$_.Substring(3).Trim('"') -replace '\\','/'})
          if($changed.Count -eq 0){throw 'No changes'}
          $applicationChanged=$false
          foreach($p in $changed){
            if($p -eq 'src/infrastructure/database/migrations/migration001.ts'){throw 'migration001 immutable'}
            if($p.StartsWith('app/') -or $p.StartsWith('src/')){$applicationChanged=$true;continue}
            if($p.StartsWith('docs/')){continue}
            if($p.StartsWith('.github/orchestration/reports/') -and $p.EndsWith('.md')){continue}
            throw "Unauthorized path: $p"
          }
          if(!$applicationChanged){throw 'No application changes'}
          npm test -- --runInBand
          if($LASTEXITCODE -ne 0){throw 'Jest failed'}
          npx tsc --noEmit
          if($LASTEXITCODE -ne 0){throw 'TypeScript failed'}

      - name: Commit push and publish for independent review
        if: steps.claude.outputs.clarification != 'true'
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          TARGET_BRANCH: ${{ steps.gate.outputs.target_branch }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PLAN_ID: ${{ steps.gate.outputs.plan_id }}
          REVIEW_ID: ${{ steps.gate.outputs.review_id }}
          SESSION_ID: ${{ steps.claude.outputs.session }}
          INCREMENT: ${{ steps.gate.outputs.increment }}
          SOURCE_TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app src docs .github/orchestration/reports
          git commit -m "feat: implement $env:SLICE_ID"
          if($LASTEXITCODE -ne 0){throw 'Commit failed'}
          $new=(git rev-parse HEAD).Trim()
          git fetch origin $env:TARGET_BRANCH
          $target=(git rev-parse "origin/$env:TARGET_BRANCH").Trim()
          if($target -ne $env:SOURCE_HEAD){throw 'Target moved during implementation'}
          git push origin "HEAD:$env:TARGET_BRANCH"
          if($LASTEXITCODE -ne 0){throw 'Push failed'}
          $summary=Get-Content "$env:RUNNER_TEMP\dev-result.txt" -Raw -Encoding utf8
          $nl=[Environment]::NewLine
          $body='[KODJO_SLICE] IMPLEMENTATION_OUTPUT'+$nl+'slice_id='+$env:SLICE_ID+$nl+'increment='+$env:INCREMENT+$nl+'base_head='+$env:SOURCE_HEAD+$nl+'head='+$new+$nl+'session_id='+$env:SESSION_ID+$nl+'plan_comment_id='+$env:PLAN_ID+$nl+'plan_review_comment_id='+$env:REVIEW_ID+$nl+'source_implementation_trigger_comment_id='+$env:SOURCE_TRIGGER_COMMENT_ID+$nl+'STATUT : IMPLEMENTATION_READY_FOR_REVIEW'+$nl+$nl+$summary
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\implementation-comment.md",$body,(New-Object Text.UTF8Encoding($false)))
          $payload=@{body=$body}|ConvertTo-Json -Depth 4
          $payloadPath="$env:RUNNER_TEMP\implementation-payload.json"
          [IO.File]::WriteAllText($payloadPath,$payload,(New-Object Text.UTF8Encoding($false)))
          $posted=gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input $payloadPath | ConvertFrom-Json
          if(!$posted.id){throw 'Implementation output publication failed'}
          # Every successful delivery emits one certified, reusable checkpoint.
          # It is published only after the commit and diagnostic artifact exist.
          $appPr=[regex]::Match($env:TRIGGER_BODY,'(?m)^application_pr=([0-9]+)\\s*$').Groups[1].Value
          $gateId=[regex]::Match($env:TRIGGER_BODY,'(?m)^(?:gate_comment_id|user_gate_comment_id|validation_comment_id)=([0-9]+)\\s*$').Groups[1].Value
          if(!$appPr -or !$gateId){throw 'Delivery checkpoint requires application_pr and gate comment reference'}
          $artifactName="kodjo-slice-implementation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $artifact=(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts" | ConvertFrom-Json).artifacts | Where-Object { $_.name -eq $artifactName } | Select-Object -First 1
          if(!$artifact -or !$artifact.id){throw 'Delivery checkpoint artifact not found'}
          $cp='[KODJO_V2] APPLICATION_CHECKPOINT'+$nl+'status=CERTIFIED'+$nl+'slice_id='+$env:SLICE_ID+$nl+'checkpoint_ref=issue_comment:'+[string]$posted.id+$nl+'application_pr='+$appPr+$nl+'application_head='+$new+$nl+'plan_comment_id='+$env:PLAN_ID+$nl+'review_comment_id='+$env:REVIEW_ID+$nl+'gate_comment_id='+$gateId+$nl+'protocol_head='+$env:SOURCE_HEAD+$nl+'package_run_id='+$env:GITHUB_RUN_ID+$nl+'package_artifact_id='+[string]$artifact.id+$nl+'delivery_head='+$new+$nl+'STATUT : APPLICATION_CHECKPOINT_CERTIFIED'
          $cpPayload=@{body=$cp}|ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\checkpoint-payload.json",$cpPayload,(New-Object Text.UTF8Encoding($false)))
          $cpPosted=gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input "$env:RUNNER_TEMP\checkpoint-payload.json" | ConvertFrom-Json
          if(!$cpPosted.id){throw 'Delivery checkpoint publication failed'}
          $dispatch=@{event_type='kodjo_implementation_ready';client_payload=@{issue_number=[string]$env:ISSUE_NUMBER;source_comment_id=[string]$posted.id}}|ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\review-dispatch.json",$dispatch,(New-Object Text.UTF8Encoding($false)))
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/dispatches" --input "$env:RUNNER_TEMP\review-dispatch.json"
          if($LASTEXITCODE -ne 0){throw 'Implementation review dispatch failed'}
