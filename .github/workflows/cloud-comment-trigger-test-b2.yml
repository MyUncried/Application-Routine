name: Claude Cloud Comment Trigger Test (Issue #15 - Etape B.2) [TEMPORAIRE]
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  comment-trigger-test-b2:
    if: >
      github.event.issue.number == 15 &&
      contains(github.event.comment.body, '@claude-etape-b2-15')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude-etape-b2-15"
          claude_args: |
            --max-turns 3
            --allowedTools ""
