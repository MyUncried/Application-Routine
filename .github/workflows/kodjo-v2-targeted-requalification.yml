name: KODJO V2 — Targeted validation and full requalification
on:
  workflow_call:
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write
concurrency:
  group: kodjo-v2-targeted-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  record-and-requalify:
    if: github.event.comment.user.login == 'MyUncried' && startsWith(github.event.comment.body, '[KODJO_SLICE] TARGETED_VISUAL_APPROVED_REQUALIFY')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Record targeted success and mandatory global requalification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kodjo/targeted-requalification.js record "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "$COMMENT_ID" "$RUNNER_TEMP/targeted-checkpoint-id.txt"
      - name: Enter canonical full plan revision without a queue operation
        shell: bash
        run: |
          set -euo pipefail
          checkpoint=$(cat "$RUNNER_TEMP/targeted-checkpoint-id.txt")
          # A recorded checkpoint can be replayed after a transport failure,
          # but an already admitted planning run must not be duplicated.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/kodjo-v2-slice-plan.yml/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/requalification-runs.json"
          if jq -e --arg title "KODJO V2 / PLAN / $checkpoint" '[.[].workflow_runs[] | select(.display_title == $title)] | length > 0' "$RUNNER_TEMP/requalification-runs.json" >/dev/null; then
            echo 'Requalification already admitted for this checkpoint'
            exit 0
          fi
          gh workflow run kodjo-v2-slice-plan.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$ISSUE_NUMBER" -f targeted_validation_comment_id="$checkpoint"
