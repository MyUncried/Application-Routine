name: Claude Cloud Comment Trigger Test (Issue #15 - Etape B.3) [TEMPORAIRE]
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  comment-trigger-test-b3:
    if: >
      github.event.issue.number == 15 &&
      contains(github.event.comment.body, '@claude-etape-b3-15')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run Claude (automation mode, structured output)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Test isole (Issue #15, Etape B.3, protocole KODJO).
            Reponds uniquement avec un objet JSON conforme au schema fourni.
            Le champ "message" doit contenir EXACTEMENT le texte suivant,
            mot pour mot, sans rien ajouter ni modifier :
            "B3-PROOF-RUN-${{ github.run_id }} - reponse generee via structured_output, authentification OAuth Claude Code, Issue #15."
            N'effectue aucune lecture ni modification de fichier, n'utilise aucun outil.
          claude_args: |
            --max-turns 2
            --allowedTools ""
            --json-schema '{"type":"object","properties":{"message":{"type":"string"}},"required":["message"]}'
      - name: Publier la reponse structuree en commentaire
        if: always()
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MESSAGE=$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.message // empty')
          if [ -z "$MESSAGE" ]; then
            MESSAGE="ETAPE-B3-ECHEC-RUN-${{ github.run_id }} — structured_output absent ou invalide (voir logs du run)."
          fi
          printf '%s\n' "$MESSAGE" | gh issue comment 15 --repo "${{ github.repository }}" --body-file -
