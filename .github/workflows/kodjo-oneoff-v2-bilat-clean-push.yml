name: KODJO V2 BILAT clean repair

on:
  push:
    branches:
      - kodjo/v2-v2-bilat-01-34948992572

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kodjo/v2-v2-bilat-01-34948992572
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore baseline bytes and apply correction
        shell: bash
        run: |
          set -euo pipefail
          git show 3a0dbbe7510f69f702c4b440e25b63b893d2d492:src/features/sessions/CompositionScreen.tsx > src/features/sessions/CompositionScreen.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path("src/features/sessions/CompositionScreen.tsx")
          b = p.read_bytes()
          old = b"  activitySideModeIndicator: {\r\n    position: \"absolute\",\r\n    left: 311,\r\n    top: 24.5,\r\n    alignItems: \"center\","
          new = b"  activitySideModeIndicator: {\r\n    position: \"absolute\",\r\n    right: spacing[16],\r\n    top: spacing[4],\r\n    alignItems: \"center\","
          if b.count(old) != 1:
              raise SystemExit("legacy coordinate block not found exactly once")
          p.write_bytes(b.replace(old, new, 1))
          PY
          git diff --check 3a0dbbe7510f69f702c4b440e25b63b893d2d492 -- src/features/sessions/CompositionScreen.tsx
          test "$(git diff --numstat 3a0dbbe7510f69f702c4b440e25b63b893d2d492 -- src/features/sessions/CompositionScreen.tsx)" = "2	2	src/features/sessions/CompositionScreen.tsx"

      - name: Install dependencies
        run: npm ci

      - name: Targeted tests
        run: npx jest src/features/sessions/__tests__/CompositionScreen.test.tsx --runInBand

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint bounded
        run: npx eslint src/features/sessions/CompositionScreen.tsx

      - name: Full Jest
        run: npx jest --runInBand

      - name: Finalize clean branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/kodjo-oneoff-v2-bilat-clean-push.yml .kodjo-oneoff-trigger
          test "$(git diff 3a0dbbe7510f69f702c4b440e25b63b893d2d492 --name-only)" = "src/features/sessions/CompositionScreen.tsx"
          test "$(git diff --numstat 3a0dbbe7510f69f702c4b440e25b63b893d2d492 -- src/features/sessions/CompositionScreen.tsx)" = "2	2	src/features/sessions/CompositionScreen.tsx"
          git diff --check 3a0dbbe7510f69f702c4b440e25b63b893d2d492
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(V2-BILAT-01): clean activity direction alignment"
          git push origin HEAD:kodjo/v2-v2-bilat-01-34948992572
