name: KODJO V1.4 Local E2E
run-name: KODJO V1.4 E2E-01 / ${{ inputs.stage }}

on:
  workflow_dispatch:
    inputs:
      stage:
        required: true
        type: choice
        options: [BASE, RESUME]
      authorization:
        required: true
        type: string
      target_ref:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kodjo-v14-local-e2e-01
  cancel-in-progress: false

env:
  TEST_ID: KODJO-V14-LOCAL-E2E-01
  EXPECTED_TARGET_REF: orchestration/v1-4-local-e2e-01
  SENTINEL_PATH: .github/orchestration/e2e/KODJO_V14_LOCAL_E2E_SENTINEL.md
  REPORT_PREFIX: .github/orchestration/reports/KODJO_V14_LOCAL_E2E_01_
  STATE_ROOT: .github/orchestration/e2e/state/KODJO-V14-LOCAL-E2E-01
  CLAUDE_CODE_PROJECT_DIR_NAME: kodjo-v14-local-e2e-01

jobs:
  execute:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: ${{ vars.KODJO_LOCAL_CLAUDE_CONFIG_DIR }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout exact E2E branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Deterministic preflight — no Claude call
        id: gate
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner.' }
          if ('${{ inputs.target_ref }}' -ne $env:EXPECTED_TARGET_REF) { throw 'Unexpected target_ref.' }
          $expectedAuth = if ('${{ inputs.stage }}' -eq 'BASE') { 'LAUNCH KODJO V14 LOCAL E2E 01 BASE' } else { 'LAUNCH KODJO V14 LOCAL E2E 01 RESUME' }
          if ('${{ inputs.authorization }}' -ne $expectedAuth) { throw 'Invalid launch authorization.' }
          if ($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine') { throw 'Unexpected repository.' }
          $branch = (git branch --show-current).Trim()
          if ($branch -ne $env:EXPECTED_TARGET_REF) { throw "Unexpected branch: $branch" }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) { throw 'Worktree not clean.' }
          $head = (git rev-parse HEAD).Trim()
          $claude = Get-Command claude.cmd -ErrorAction Stop
          $credPath = Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json'
          if (-not (Test-Path $credPath)) { throw '.credentials.json missing.' }
          $cred = Get-Content $credPath -Raw | ConvertFrom-Json
          if ([int64]$cred.claudeAiOauth.expiresAt -le [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) { throw 'Claude token expired; refusing model call.' }
          $checkpointPath = Join-Path $env:STATE_ROOT (if ('${{ inputs.stage }}' -eq 'BASE') { 'BASE.checkpoint.json' } else { 'RESUME.checkpoint.json' })
          if (-not (Test-Path $checkpointPath)) { throw "Checkpoint missing: $checkpointPath" }
          $cp = Get-Content $checkpointPath -Raw | ConvertFrom-Json
          if ($cp.test_id -ne $env:TEST_ID -or $cp.stage -ne '${{ inputs.stage }}') { throw 'Checkpoint identity mismatch.' }
          if ($cp.status -ne 'AUTHORIZED' -or $cp.mode -ne 'LOCAL_WRITE' -or $cp.writer -ne 'CLAUDE_LOCAL') { throw 'Checkpoint authorization mismatch.' }
          if ($cp.authorized_head -ne $head) { throw "HEAD mismatch: authorized=$($cp.authorized_head) actual=$head" }
          if ($cp.consumed -ne $false) { throw 'Checkpoint already consumed.' }
          if (Test-Path (Join-Path $env:STATE_ROOT ('${{ inputs.stage }}' + '.claim.json'))) { throw 'Duplicate claim blocked.' }
          if (Test-Path (Join-Path $env:STATE_ROOT ('${{ inputs.stage }}' + '.result.json'))) { throw 'Duplicate result blocked.' }
          if ('${{ inputs.stage }}' -eq 'RESUME') {
            $baseResult = Join-Path $env:STATE_ROOT 'BASE.result.json'
            if (-not (Test-Path $baseResult)) { throw 'BASE.result.json missing.' }
            $base = Get-Content $baseResult -Raw | ConvertFrom-Json
            $transcript = Get-ChildItem -Path $env:CLAUDE_CONFIG_DIR -Recurse -File -Filter "$($base.session_id).jsonl" -ErrorAction SilentlyContinue
            if (@($transcript).Count -ne 1) { throw 'Exactly one native BASE transcript required.' }
          }
          "head=$head" >> $env:GITHUB_OUTPUT
          "claude_path=$($claude.Source)" >> $env:GITHUB_OUTPUT

      - name: Claim stage before model invocation
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = '${{ inputs.stage }}'
          $ordinal = if ($stage -eq 'BASE') { 1 } else { 2 }
          $path = Join-Path $env:STATE_ROOT ($stage + '.claim.json')
          $claim = [ordered]@{test_id=$env:TEST_ID;stage=$stage;status='CLAIMED';call_ordinal=$ordinal;run_id="$env:GITHUB_RUN_ID";authorized_head=$env:HEAD_SHA;mode='LOCAL_WRITE';writer='CLAUDE_LOCAL';claude_cloud=$false;fallback='NONE';created_at=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json
          [IO.File]::WriteAllText($path,$claim,(New-Object Text.UTF8Encoding($false)))
          git add -- $path
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "e2e: claim $stage $env:GITHUB_RUN_ID"
          git push origin "HEAD:$env:EXPECTED_TARGET_REF"

      - name: Run Claude Local BASE — call 1/2
        if: inputs.stage == 'BASE'
        id: base
        env:
          CLAUDE_PATH: ${{ steps.gate.outputs.claude_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = New-Object byte[] 24
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create(); try {$rng.GetBytes($bytes)} finally {$rng.Dispose()}
          $marker = 'KODJO-E2E-' + (([BitConverter]::ToString($bytes) -replace '-','').ToLowerInvariant())
          $sha = [Security.Cryptography.SHA256]::Create(); try {$markerHash=([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($marker)))-replace '-','').ToLowerInvariant()} finally {$sha.Dispose()}
          $prompt = "KODJO V1.4 LOCAL E2E-01 BASE. Lis .github/orchestration/KODJO_V14_LOCAL_E2E_01_SPEC.md et $env:STATE_ROOT/BASE.checkpoint.json. Modifie uniquement $env:SENTINEL_PATH et crée un rapport $env:REPORT_PREFIX<timestamp>.md. Dans la sentinelle, ajoute test_id=$env:TEST_ID, stage=BASE, status=BASE_WRITTEN. Mémorise ce marqueur sans l'écrire dans aucun fichier ni le répéter dans ta réponse: $marker. N'effectue aucun commit ni push."
          $raw = (& $env:CLAUDE_PATH -p --output-format json $prompt 2>&1 | Out-String); $exit=$LASTEXITCODE; $marker=$null; $prompt=$null
          if ($exit -ne 0) { throw "Claude BASE failed: $exit" }
          $p=$raw|ConvertFrom-Json; if ([string]::IsNullOrWhiteSpace($p.session_id)) {throw 'No BASE session_id.'}
          "session_id=$($p.session_id)" >> $env:GITHUB_OUTPUT; "marker_hash=$markerHash" >> $env:GITHUB_OUTPUT; "duration_ms=$($p.duration_ms)" >> $env:GITHUB_OUTPUT; "num_turns=$($p.num_turns)" >> $env:GITHUB_OUTPUT; "cost=$($p.total_cost_usd)" >> $env:GITHUB_OUTPUT

      - name: Run Claude Local RESUME — call 2/2
        if: inputs.stage == 'RESUME'
        id: resume
        env:
          CLAUDE_PATH: ${{ steps.gate.outputs.claude_path }}
        run: |
          $ErrorActionPreference='Stop'
          $base=Get-Content (Join-Path $env:STATE_ROOT 'BASE.result.json') -Raw|ConvertFrom-Json
          $prompt="KODJO V1.4 LOCAL E2E-01 RESUME. Lis $env:STATE_ROOT/RESUME.checkpoint.json. Modifie uniquement $env:SENTINEL_PATH et crée un rapport $env:REPORT_PREFIX<timestamp>.md. Dans la sentinelle, ajoute test_id=$env:TEST_ID, stage=RESUME, status=RESUME_WRITTEN. N'écris jamais le marqueur mémorisé dans un fichier. Dans ta réponse finale, inclus une ligne exactement CONTINUITY_MARKER=<marqueur mémorisé>. N'effectue aucun commit ni push."
          $raw=(& $env:CLAUDE_PATH -p --resume $base.session_id --output-format json $prompt 2>&1|Out-String); $exit=$LASTEXITCODE
          if($exit -ne 0){throw "Claude RESUME failed: $exit"}
          $p=$raw|ConvertFrom-Json; if($p.session_id -ne $base.session_id){throw 'SESSION_RESUME mismatch.'}
          $m=[regex]::Match([string]$p.result,'(?m)^CONTINUITY_MARKER=(KODJO-E2E-[0-9a-f]+)\s*$'); if(-not $m.Success){throw 'Continuity marker line missing.'}
          $sha=[Security.Cryptography.SHA256]::Create(); try{$h=([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($m.Groups[1].Value)))-replace '-','').ToLowerInvariant()}finally{$sha.Dispose()}
          if($h -ne $base.marker_sha256){throw 'NO_CONTEXT_REINJECTION marker mismatch.'}
          "session_id=$($p.session_id)" >> $env:GITHUB_OUTPUT; "marker_hash=$h" >> $env:GITHUB_OUTPUT; "duration_ms=$($p.duration_ms)" >> $env:GITHUB_OUTPUT; "num_turns=$($p.num_turns)" >> $env:GITHUB_OUTPUT; "cost=$($p.total_cost_usd)" >> $env:GITHUB_OUTPUT

      - name: Enforce Claude write-path confinement
        run: |
          $ErrorActionPreference='Stop'
          $changed=@(git status --porcelain|ForEach-Object{$_.Substring(3).Trim()})
          if($changed.Count -eq 0){throw 'Claude produced no changes.'}
          $sentinel=$false; $report=$false
          foreach($path in $changed){$n=$path -replace '\\','/'; if($n -eq $env:SENTINEL_PATH){$sentinel=$true;continue}; if($n.StartsWith($env:REPORT_PREFIX) -and $n.EndsWith('.md')){$report=$true;continue}; throw "Unauthorized Claude path: $n"}
          if(-not $sentinel){throw 'Sentinel change missing.'}; if(-not $report){throw 'Report missing.'}

      - name: Persist result and publish controlled commit
        env:
          BASE_SESSION: ${{ steps.base.outputs.session_id }}
          BASE_HASH: ${{ steps.base.outputs.marker_hash }}
          BASE_DURATION: ${{ steps.base.outputs.duration_ms }}
          BASE_TURNS: ${{ steps.base.outputs.num_turns }}
          BASE_COST: ${{ steps.base.outputs.cost }}
          RESUME_SESSION: ${{ steps.resume.outputs.session_id }}
          RESUME_HASH: ${{ steps.resume.outputs.marker_hash }}
          RESUME_DURATION: ${{ steps.resume.outputs.duration_ms }}
          RESUME_TURNS: ${{ steps.resume.outputs.num_turns }}
          RESUME_COST: ${{ steps.resume.outputs.cost }}
        run: |
          $ErrorActionPreference='Stop'
          $stage='${{ inputs.stage }}'; $cpPath=Join-Path $env:STATE_ROOT ($stage+'.checkpoint.json'); $cp=Get-Content $cpPath -Raw|ConvertFrom-Json; $cp.consumed=$true; $cp.consumed_run_id="$env:GITHUB_RUN_ID"; $cp|ConvertTo-Json -Depth 10|Set-Content -Encoding UTF8 $cpPath
          if($stage -eq 'BASE'){$session=$env:BASE_SESSION;$hash=$env:BASE_HASH;$duration=$env:BASE_DURATION;$turns=$env:BASE_TURNS;$cost=$env:BASE_COST}else{$session=$env:RESUME_SESSION;$hash=$env:RESUME_HASH;$duration=$env:RESUME_DURATION;$turns=$env:RESUME_TURNS;$cost=$env:RESUME_COST}
          $result=[ordered]@{test_id=$env:TEST_ID;stage=$stage;status='SUCCESS';run_id="$env:GITHUB_RUN_ID";session_id=$session;marker_sha256=$hash;duration_ms=$duration;num_turns=$turns;total_cost_usd=$cost;mode='LOCAL_WRITE';writer='CLAUDE_LOCAL';fallback='NONE';claude_cloud=$false;published_at=(Get-Date).ToUniversalTime().ToString('o')}|ConvertTo-Json
          $resultPath=Join-Path $env:STATE_ROOT ($stage+'.result.json'); [IO.File]::WriteAllText($resultPath,$result,(New-Object Text.UTF8Encoding($false)))
          git add -- $env:SENTINEL_PATH "$env:REPORT_PREFIX*" $env:STATE_ROOT
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "e2e: publish $stage result $env:GITHUB_RUN_ID"
          git push origin "HEAD:$env:EXPECTED_TARGET_REF"
          Write-Host "KODJO_V14_E2E_STAGE=$stage SUCCESS"
          Write-Host "SESSION_ID=$session"
          Write-Host "FALLBACK=NONE"
