name: KODJO V1.4 S09 — Automated Review
run-name: T01-S09 / REVIEW / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v14-s09-review
  cancel-in-progress: false

env:
  ISSUE_NUMBER: '17'
  TARGET_BRANCH: feat/creation-seance-catalogue

jobs:
  review:
    if: >
      github.event.issue.number == 17 &&
      (
        (
          github.event.comment.user.login == 'github-actions[bot]' &&
          (
            contains(github.event.comment.body, '[KODJO_S09_PLAN_OUTPUT]') ||
            contains(github.event.comment.body, '[KODJO_S09_IMPLEMENTATION_OUTPUT]')
          )
        ) ||
        (
          github.event.comment.user.login == 'MyUncried' &&
          contains(github.event.comment.body, '[KODJO_S09_REVIEW_BRIDGE]')
        )
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Validate source event
        id: source
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_HEAD=$(git rev-parse HEAD)
          if printf '%s' "$COMMENT_BODY" | grep -Fq '[KODJO_S09_REVIEW_BRIDGE]'; then
            SOURCE_COMMENT_ID=$(printf '%s' "$COMMENT_BODY" | sed -n 's/^source_comment_id=//p' | head -n1)
            test -n "$SOURCE_COMMENT_ID"
            COMMENT_BODY=$(gh api "repos/${{ github.repository }}/issues/comments/$SOURCE_COMMENT_ID" --jq '.body')
            echo "SOURCE_COMMENT_ID=$SOURCE_COMMENT_ID" >> "$GITHUB_ENV"
          fi
          printf '%s' "$COMMENT_BODY" > /tmp/source-comment.txt
          if grep -q '\[KODJO_S09_PLAN_OUTPUT\]' /tmp/source-comment.txt; then
            KIND=PLAN
            EXPECTED_HEAD=$(sed -n 's/^source_head=//p' /tmp/source-comment.txt | head -n1)
            SESSION=$(sed -n 's/^session_id=//p' /tmp/source-comment.txt | head -n1)
            ATTEMPT=$(sed -n 's/^attempt=//p' /tmp/source-comment.txt | head -n1)
            grep -q '^STATUT : PLAN_READY_FOR_REVIEW$' /tmp/source-comment.txt
            grep -q '^plan_report=GITHUB_PLAN_OUTPUT_COMMENT$' /tmp/source-comment.txt
            test "$CURRENT_HEAD" = "$EXPECTED_HEAD"
          else
            KIND=IMPLEMENTATION
            EXPECTED_HEAD=$(sed -n 's/^head=//p' /tmp/source-comment.txt | head -n1)
            SESSION=$(sed -n 's/^session_id=//p' /tmp/source-comment.txt | head -n1)
            ATTEMPT=$(sed -n 's/^attempt=//p' /tmp/source-comment.txt | head -n1)
            BASE_HEAD=$(sed -n 's/^base_head=//p' /tmp/source-comment.txt | head -n1)
            PLAN_COMMENT_ID=$(sed -n 's/^plan_comment_id=//p' /tmp/source-comment.txt | head -n1)
            grep -q '^STATUT : IMPLEMENTATION_READY_FOR_REVIEW$' /tmp/source-comment.txt
            test "$CURRENT_HEAD" = "$EXPECTED_HEAD"
            echo "base_head=$BASE_HEAD" >> "$GITHUB_OUTPUT"
            echo "plan_comment_id=$PLAN_COMMENT_ID" >> "$GITHUB_OUTPUT"
          fi
          test -n "$SESSION"
          test -n "$ATTEMPT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "head=$CURRENT_HEAD" >> "$GITHUB_OUTPUT"
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Build verified review packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kodjo-review
          cp /tmp/source-comment.txt /tmp/kodjo-review/source-comment.txt
          gh api repos/${{ github.repository }}/issues/17 > /tmp/kodjo-review/issue.json
          printf 'HEAD=%s\n' "$(git rev-parse HEAD)" > /tmp/kodjo-review/source-attestation.txt
          : > /tmp/kodjo-review/evidence.txt
          while IFS= read -r f; do
            printf '\n===== %s =====\n' "$f" >> /tmp/kodjo-review/evidence.txt
            grep -En -C 3 -i 'T01-S09|Catégor|Enregistrer la séance|atomic|transaction|zone corporelle|double|D-015|D-016|D-092|D-093|D-094|Composition|Catalogue' "$f" >> /tmp/kodjo-review/evidence.txt || true
          done < <(printf '%s\n' 'docs/PRODUCT.md' 'docs/INDEX.md' 'docs/Specifications-fonctionnelles/06 – Ecrans et navigation de la V1.md' 'docs/Specifications-fonctionnelles/07 – Registre des décisions de conception.md' 'docs/Specifications-fonctionnelles/08 – Conception fonctionnelle détaillée.md' 'docs/Specifications-fonctionnelles/09 – Modèle de données fonctionnel.md' 'docs/Specifications-fonctionnelles/10 – Processus métier et règles métier transverses.md' 'docs/Specifications-fonctionnelles/11 – API fonctionnelles.md' 'docs/Specifications-fonctionnelles/12 – Architecture technique.md' 'docs/Specifications-fonctionnelles/13 – Contrats d’écran.md')
          head -c 220000 /tmp/kodjo-review/evidence.txt > /tmp/kodjo-review/evidence-trimmed.txt
          if [ '${{ steps.source.outputs.kind }}' = 'IMPLEMENTATION' ]; then
            BASE='${{ steps.source.outputs.base_head }}'
            test -n "$BASE"
            git diff --stat "$BASE..HEAD" > /tmp/kodjo-review/diff-stat.txt
            git diff --unified=3 "$BASE..HEAD" > /tmp/kodjo-review/diff.txt
            head -c 180000 /tmp/kodjo-review/diff.txt > /tmp/kodjo-review/diff-trimmed.txt
            PLAN_ID='${{ steps.source.outputs.plan_comment_id }}'
            test -n "$PLAN_ID"
            gh api "repos/${{ github.repository }}/issues/comments/$PLAN_ID" --jq '.body' > /tmp/kodjo-review/approved-plan.txt
          fi

      - name: Run independent OpenAI review
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          KIND='${{ steps.source.outputs.kind }}'
          if [ "$KIND" = PLAN ]; then
            TASK='Review the T01-S09 plan against the current authoritative project sources. The PLAN phase is strictly read-only: the GitHub PLAN_OUTPUT comment is the durable plan report, so absence of a repository report file is not a defect. Minor technical omissions => REVISE. Use CLARIFY only for a genuine product/UX decision not determinable from sources. If CLARIFY, blocking_points MUST enumerate every unresolved decision precisely and feedback MUST explain why each is not determinable from the supplied sources. APPROVE only when executable and source-grounded.'
          else
            TASK='Review the T01-S09 implementation against the approved plan and current authoritative sources. Check behavior, contracts, persistence and atomicity, errors/loading/double-submit, tests, architecture and scope. Technical defects => REVISE. Use CLARIFY only for a genuine unresolved product/UX decision. If CLARIFY, blocking_points MUST enumerate every unresolved decision precisely. APPROVE only when ready for user visual review.'
          fi
          printf '%s\n' "You are the independent KODJO V1.4 review gate. $TASK" 'Hierarchy: current checked-out HEAD and current versioned sources supersede a stale baseline written in the Issue body; Figma/rendered screenshots = visual representation and represented states; functional docs = behaviors/interactions/business rules; technical docs = implementation constraints; decision register = explicit arbitrations. Do not invent. Treat the verified source excerpts below as the evidence at the current HEAD.' '' 'ISSUE #17:' > /tmp/prompt.txt
          jq -r '.body' /tmp/kodjo-review/issue.json >> /tmp/prompt.txt
          printf '%s\n' '' 'CANDIDATE OUTPUT:' >> /tmp/prompt.txt
          cat /tmp/kodjo-review/source-comment.txt >> /tmp/prompt.txt
          printf '%s\n' '' 'VERIFIED SOURCE EXCERPTS:' >> /tmp/prompt.txt
          cat /tmp/kodjo-review/evidence-trimmed.txt >> /tmp/prompt.txt
          if [ "$KIND" = IMPLEMENTATION ]; then
            printf '%s\n' '' 'APPROVED PLAN:' >> /tmp/prompt.txt
            cat /tmp/kodjo-review/approved-plan.txt >> /tmp/prompt.txt
            printf '%s\n' '' 'IMPLEMENTATION DIFF:' >> /tmp/prompt.txt
            cat /tmp/kodjo-review/diff-trimmed.txt >> /tmp/prompt.txt
          fi
          SCHEMA='{"type":"object","properties":{"decision":{"type":"string","enum":["APPROVE","REVISE","CLARIFY"]},"summary":{"type":"string"},"feedback":{"type":"string"},"blocking_points":{"type":"array","items":{"type":"string"}},"sources_checked":{"type":"array","items":{"type":"string"}}},"required":["decision","summary","feedback","blocking_points","sources_checked"],"additionalProperties":false}'
          jq -n --arg model 'gpt-5.6-luna' --rawfile prompt /tmp/prompt.txt --argjson schema "$SCHEMA" '{model:$model,input:$prompt,store:false,reasoning:{effort:"medium"},max_output_tokens:4000,text:{verbosity:"low",format:{type:"json_schema",name:"kodjo_s09_review",strict:true,schema:$schema}}}' > /tmp/request.json
          curl --fail-with-body -sS https://api.openai.com/v1/responses -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' -d @/tmp/request.json -o /tmp/response.json
          OUTPUT=$(jq -r '[.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text] | join("\n")' /tmp/response.json)
          printf '%s' "$OUTPUT" | jq -e . >/dev/null
          printf '%s' "$OUTPUT" > /tmp/review.json

      - name: Route review result
        shell: bash
        run: |
          set -euo pipefail
          KIND='${{ steps.source.outputs.kind }}'
          ATTEMPT='${{ steps.source.outputs.attempt }}'
          SESSION='${{ steps.source.outputs.session }}'
          HEAD_SHA='${{ steps.source.outputs.head }}'
          DECISION=$(jq -r '.decision' /tmp/review.json)
          SUMMARY=$(jq -r '.summary' /tmp/review.json)
          FEEDBACK=$(jq -r '.feedback' /tmp/review.json)
          SOURCES=$(jq -r '.sources_checked[]?' /tmp/review.json | sed 's/^/- /')
          BLOCKERS=$(jq -r '.blocking_points[]?' /tmp/review.json | sed 's/^/- /')
          if [ "$DECISION" = CLARIFY ]; then
            test -n "$BLOCKERS"
            test -n "$FEEDBACK"
          fi
          : > /tmp/out.md
          if [ "$DECISION" = APPROVE ] && [ "$KIND" = PLAN ]; then
            printf '%s\n' '[KODJO_S09_PLAN_GATE]' "source_plan_comment_id=$SOURCE_COMMENT_ID" "source_head=$HEAD_SHA" "session_id=$SESSION" "attempt=$ATTEMPT" 'STATUT : PLAN_READY_FOR_USER_GATE' '' "$SUMMARY" '' 'Sources contrôlées :' "$SOURCES" '' 'Action utilisateur attendue dans ChatGPT Work : APPROUVER PLAN S09 ou CORRIGER PLAN S09 : ...' > /tmp/out.md
          elif [ "$DECISION" = APPROVE ]; then
            printf '%s\n' '[KODJO_S09_VISUAL_GATE]' "source_implementation_comment_id=$SOURCE_COMMENT_ID" "head=$HEAD_SHA" "session_id=$SESSION" "attempt=$ATTEMPT" 'STATUT : VISUAL_REVIEW_READY' '' "$SUMMARY" '' 'Sources contrôlées :' "$SOURCES" '' 'Action utilisateur attendue dans ChatGPT Work : VALIDER VISUEL S09 ou CORRIGER VISUEL S09 : ...' > /tmp/out.md
          elif [ "$DECISION" = CLARIFY ] || [ "$ATTEMPT" -ge 3 ]; then
            printf '%s\n' '[KODJO_S09_CLARIFICATION_REQUIRED]' "kind=$KIND" "source_comment_id=$SOURCE_COMMENT_ID" "head=$HEAD_SHA" "session_id=$SESSION" "attempt=$ATTEMPT" 'STATUT : CLARIFICATION_REQUIRED' '' "$SUMMARY" '' 'Points bloquants :' "$BLOCKERS" '' 'Feedback de revue :' "$FEEDBACK" '' 'Sources contrôlées :' "$SOURCES" > /tmp/out.md
          else
            NEXT=$((ATTEMPT+1))
            if [ "$KIND" = PLAN ]; then TRIGGER='[KODJO_V14_S09] PLAN_REVISION'; else TRIGGER='[KODJO_V14_S09] IMPLEMENTATION_REVISION'; fi
            printf '%s\n' "$TRIGGER" "attempt=$NEXT" "session_id=$SESSION" "source_head=$HEAD_SHA" 'REVIEW_FEEDBACK:' "$FEEDBACK" > /tmp/out.md
          fi
          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/out.md
