name: KODJO V1.4 S09 — Independent Review
run-name: T01-S09 / REVIEW / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v14-s09-review
  cancel-in-progress: false

env:
  ISSUE_NUMBER: '17'
  TARGET_BRANCH: feat/creation-seance-catalogue
  HISTORICAL_SESSION_ID: 99404ae0-19e3-4004-8dde-cd670588afb5

jobs:
  review-plan-claude:
    if: >
      github.event.issue.number == 17 &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      contains(github.event.comment.body, '[KODJO_S09_PLAN_OUTPUT]') &&
      contains(github.event.comment.body, 'plan_builder=OPENAI') &&
      contains(github.event.comment.body, 'STATUT : PLAN_READY_FOR_CLAUDE_REVIEW')
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      SOURCE_BODY: ${{ github.event.comment.body }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight and build bounded evidence packet
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME){throw 'Unexpected runner.'}
          if($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine'){throw 'Unexpected repository.'}
          if((git branch --show-current).Trim() -ne $env:TARGET_BRANCH){throw 'Unexpected branch.'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Worktree not clean.'}
          $head=(git rev-parse HEAD).Trim()
          $expected=[regex]::Match($env:SOURCE_BODY,'(?m)^source_head=([0-9a-f]{40})\s*$'); if(-not$expected.Success){throw 'source_head missing.'}
          if($head -ne $expected.Groups[1].Value){throw "Plan HEAD mismatch: $head"}
          $attemptMatch=[regex]::Match($env:SOURCE_BODY,'(?m)^attempt=(\d+)\s*$'); if(-not$attemptMatch.Success){throw 'attempt missing.'}
          $claude=Get-Command claude.cmd -ErrorAction Stop
          $credPath=Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json'
          if(-not(Test-Path $credPath)){throw 'Claude credentials missing.'}
          $cred=Get-Content $credPath -Raw|ConvertFrom-Json
          if([int64]$cred.claudeAiOauth.expiresAt -le [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()){throw 'Claude token expired.'}
          $evidence=Join-Path $env:RUNNER_TEMP 's09-review-evidence.txt'
          $files=@('docs/PRODUCT.md','docs/INDEX.md','docs/Specifications-fonctionnelles/06 – Ecrans et navigation de la V1.md','docs/Specifications-fonctionnelles/07 – Registre des décisions de conception.md','docs/Specifications-fonctionnelles/08 – Conception fonctionnelle détaillée.md','docs/Specifications-fonctionnelles/09 – Modèle de données fonctionnel.md','docs/Specifications-fonctionnelles/10 – Processus métier et règles métier transverses.md','docs/Specifications-fonctionnelles/11 – API fonctionnelles.md','docs/Specifications-fonctionnelles/12 – Architecture technique.md','docs/Specifications-fonctionnelles/13 – Contrats d’écran.md')
          $sb=New-Object Text.StringBuilder
          foreach($f in $files){if(Test-Path $f){[void]$sb.AppendLine("===== $f ====="); $matches=Select-String -Path $f -Pattern 'T01-S09|Catégor|Composition|atomic|transaction|zone corporelle|double|D-015|D-016|D-092|D-093|D-094|D-095|D-096|Catalogue|Enregistrer' -Context 2,2; foreach($m in $matches){[void]$sb.AppendLine($m.ToString())}}}
          $txt=$sb.ToString(); if($txt.Length -gt 180000){$txt=$txt.Substring(0,180000)}
          [IO.File]::WriteAllText($evidence,$txt,(New-Object Text.UTF8Encoding($false)))
          "head=$head" >> $env:GITHUB_OUTPUT
          "attempt=$($attemptMatch.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "claude_path=$($claude.Source)" >> $env:GITHUB_OUTPUT
          "evidence=$evidence" >> $env:GITHUB_OUTPUT

      - name: Run fresh independent Claude review
        id: claude
        env:
          CLAUDE_PATH: ${{ steps.gate.outputs.claude_path }}
          EVIDENCE_PATH: ${{ steps.gate.outputs.evidence }}
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Get-Content $env:EVIDENCE_PATH -Raw -Encoding UTF8
          $prompt=@"
KODJO V1.4 — revue indépendante courte du PLAN T01-S09 construit par OpenAI. Tu es reviewer uniquement. N'utilise PAS --resume et ne t'appuie sur aucune session historique. Phase strictement lecture seule : aucune écriture, aucun Edit/Write, aucun commit/push.

Évalue sur cinq axes : couverture du périmètre, traçabilité sources, absence de règles inventées/obsolètes, exécutabilité technique, testabilité. Vérifie en particulier : unicité Catégorie après normalisation des espaces, insensible casse ET accents/diacritiques ; libellé visible conservé ; aucun fuzzy/correction/suggestion ; migration additive sans modifier migration001 ; atomicité SQLite ; persistance complète T01-S08 et zones corporelles ; double-submit ; reset uniquement après succès ; retour Catalogue ; erreurs/loading ; tests ; pas de S10.

Réponds STRICTEMENT avec ce format texte :
DECISION: APPROVE|REVISE|CLARIFY
SUMMARY: <une synthèse>
BLOCKING_POINTS:
- <point ou NONE>
FEEDBACK:
<corrections précises, ou NONE>
SOURCES_CHECKED:
- <sources effectivement contrôlées>

CLARIFY est réservé à une vraie décision produit/UX indéterminable. Un défaut technique déterminable = REVISE. Une limite de session, erreur OAuth, timeout ou sortie invalide est une ERREUR TECHNIQUE, jamais une décision métier.

PLAN CANDIDAT :
$env:SOURCE_BODY

EXTRAITS DE SOURCES VERSIONNÉES :
$evidence
"@
          $stdout=Join-Path $env:RUNNER_TEMP 'claude-review-out.txt'; $stderr=Join-Path $env:RUNNER_TEMP 'claude-review-err.txt'
          $previous=$ErrorActionPreference; $ErrorActionPreference='Continue'
          & $env:CLAUDE_PATH -p --output-format json $prompt 1> $stdout 2> $stderr
          $exit=$LASTEXITCODE; $ErrorActionPreference=$previous
          $raw=if(Test-Path $stdout){Get-Content $stdout -Raw -Encoding UTF8}else{''}
          $err=if(Test-Path $stderr){Get-Content $stderr -Raw -Encoding UTF8}else{''}
          $p=$null; try{$p=$raw|ConvertFrom-Json}catch{}
          if($exit -ne 0 -or $null -eq $p -or [string]::IsNullOrWhiteSpace([string]$p.session_id) -or [string]::IsNullOrWhiteSpace([string]$p.result)){
            $excerpt=if($err.Length -gt 1200){$err.Substring($err.Length-1200)}else{$err}; throw "Claude review technical failure. exit=$exit stderr=$excerpt"
          }
          if($p.session_id -eq $env:HISTORICAL_SESSION_ID){throw 'Historical Claude session was reused unexpectedly.'}
          if([string]$p.result -match "You've hit your session limit|session limit|rate limit") {throw 'Claude usage limit reached; not a business review result.'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Read-only review modified worktree.'}
          $result=Join-Path $env:RUNNER_TEMP 'review-result.txt'; [IO.File]::WriteAllText($result,[string]$p.result,(New-Object Text.UTF8Encoding($false)))
          "session=$($p.session_id)" >> $env:GITHUB_OUTPUT
          "result=$result" >> $env:GITHUB_OUTPUT

      - name: Route Claude plan review
        env:
          RESULT_PATH: ${{ steps.claude.outputs.result }}
          REVIEW_SESSION: ${{ steps.claude.outputs.session }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content $env:RESULT_PATH -Raw -Encoding UTF8
          $m=[regex]::Match($r,'(?m)^DECISION:\s*(APPROVE|REVISE|CLARIFY)\s*$'); if(-not$m.Success){throw 'Invalid Claude review decision format.'}; $decision=$m.Groups[1].Value
          $feedbackMarker='FEEDBACK:'; $fi=$r.IndexOf($feedbackMarker); if($fi -lt 0){throw 'Review feedback missing.'}; $feedback=$r.Substring($fi+$feedbackMarker.Length).Trim()
          if($decision -eq 'APPROVE'){
            $body="[KODJO_S09_PLAN_GATE]`nsource_plan_comment_id=$env:SOURCE_COMMENT_ID`nsource_head=$env:HEAD_SHA`nreview_session_id=$env:REVIEW_SESSION`nattempt=$env:ATTEMPT`nSTATUT : PLAN_READY_FOR_USER_GATE`n`n$r`n`nAction utilisateur attendue dans ChatGPT Work : APPROUVER PLAN S09 ou CORRIGER PLAN S09 : ..."
          } elseif($decision -eq 'REVISE' -and [int]$env:ATTEMPT -lt 3){
            $next=[int]$env:ATTEMPT+1
            $body="[KODJO_V14_S09] PLAN_REVISION_OPENAI`nattempt=$next`nsource_plan_comment_id=$env:SOURCE_COMMENT_ID`nsource_head=$env:HEAD_SHA`nREVIEW_FEEDBACK:`n$feedback"
          } else {
            $body="[KODJO_S09_CLARIFICATION_REQUIRED]`nkind=PLAN`nsource_comment_id=$env:SOURCE_COMMENT_ID`nhead=$env:HEAD_SHA`nreview_session_id=$env:REVIEW_SESSION`nattempt=$env:ATTEMPT`nSTATUT : CLARIFICATION_REQUIRED`n`n$r"
          }
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json -Depth 4) | Out-Null

  review-implementation-openai:
    if: >
      github.event.issue.number == 17 &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      contains(github.event.comment.body, '[KODJO_S09_IMPLEMENTATION_OUTPUT]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOURCE_BODY: ${{ github.event.comment.body }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Review implementation with OpenAI
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          EXPECTED=$(printf '%s' "$SOURCE_BODY" | sed -n 's/^head=//p' | head -n1); test "$HEAD_SHA" = "$EXPECTED"
          BASE=$(printf '%s' "$SOURCE_BODY" | sed -n 's/^base_head=//p' | head -n1); test -n "$BASE"
          PLAN_ID=$(printf '%s' "$SOURCE_BODY" | sed -n 's/^plan_comment_id=//p' | head -n1); test -n "$PLAN_ID"
          SESSION=$(printf '%s' "$SOURCE_BODY" | sed -n 's/^session_id=//p' | head -n1); test -n "$SESSION"; test "$SESSION" != "$HISTORICAL_SESSION_ID"
          ATTEMPT=$(printf '%s' "$SOURCE_BODY" | sed -n 's/^attempt=//p' | head -n1); test -n "$ATTEMPT"
          gh api "repos/${{ github.repository }}/issues/comments/$PLAN_ID" --jq '.body' > /tmp/plan.txt
          git diff --unified=3 "$BASE..HEAD" | head -c 220000 > /tmp/diff.txt || true
          cat > /tmp/prompt.txt <<'EOF'
You are the independent OpenAI implementation reviewer for KODJO V1.4 T01-S09. Review against the approved plan and current authoritative sources. Check scope, behavior, contracts, complete T01-S08 persistence, body zones, category duplicate semantics (spaces + case + accents/diacritics), additive migration and SQLite atomicity, errors/loading/double-submit/reset-after-success, tests, TypeScript, and no S10 scope. Technical defects => REVISE. CLARIFY only for a genuine product/UX decision not determinable from sources. Return JSON matching the supplied schema.
EOF
          printf '\nAPPROVED PLAN:\n' >> /tmp/prompt.txt; cat /tmp/plan.txt >> /tmp/prompt.txt
          printf '\nIMPLEMENTATION OUTPUT:\n%s\nDIFF:\n' "$SOURCE_BODY" >> /tmp/prompt.txt; cat /tmp/diff.txt >> /tmp/prompt.txt
          SCHEMA='{"type":"object","properties":{"decision":{"type":"string","enum":["APPROVE","REVISE","CLARIFY"]},"summary":{"type":"string"},"feedback":{"type":"string"},"blocking_points":{"type":"array","items":{"type":"string"}},"sources_checked":{"type":"array","items":{"type":"string"}}},"required":["decision","summary","feedback","blocking_points","sources_checked"],"additionalProperties":false}'
          jq -n --arg model 'gpt-5.6-luna' --rawfile prompt /tmp/prompt.txt --argjson schema "$SCHEMA" '{model:$model,input:$prompt,store:false,reasoning:{effort:"high"},max_output_tokens:5000,text:{verbosity:"low",format:{type:"json_schema",name:"kodjo_s09_impl_review",strict:true,schema:$schema}}}' > /tmp/request.json
          curl --fail-with-body -sS https://api.openai.com/v1/responses -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' -d @/tmp/request.json -o /tmp/response.json
          jq -r '[.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text] | join("\n")' /tmp/response.json > /tmp/review.json
          DECISION=$(jq -r '.decision' /tmp/review.json); FEEDBACK=$(jq -r '.feedback' /tmp/review.json); SUMMARY=$(jq -r '.summary' /tmp/review.json)
          if [ "$DECISION" = APPROVE ]; then
            printf '%s\n' '[KODJO_S09_VISUAL_GATE]' "source_implementation_comment_id=$SOURCE_COMMENT_ID" "head=$HEAD_SHA" "session_id=$SESSION" "attempt=$ATTEMPT" 'STATUT : VISUAL_REVIEW_READY' '' "$SUMMARY" > /tmp/out.md
          elif [ "$DECISION" = REVISE ] &&