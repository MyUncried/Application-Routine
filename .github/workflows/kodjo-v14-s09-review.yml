name: KODJO V1.4 S09 — Independent Review
run-name: "T01-S09 / ${{ contains(github.event.comment.body, '[KODJO_S09_IMPLEMENTATION_OUTPUT]') && 'IMPLEMENTATION-REVIEW' || 'PLAN-REVIEW' }} / ${{ github.event.comment.id }}"
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: kodjo-v14-s09-review
  cancel-in-progress: false
env:
  ISSUE_NUMBER: '17'
  TARGET_BRANCH: feat/creation-seance-catalogue
  HISTORICAL_SESSION_ID: 99404ae0-19e3-4004-8dde-cd670588afb5

jobs:
  plan-claude-review:
    if: github.event.issue.number == 17 && github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, '[KODJO_S09_PLAN_OUTPUT]') && contains(github.event.comment.body, 'plan_builder=OPENAI')
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      SOURCE_BODY: ${{ github.event.comment.body }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.TARGET_BRANCH }}', fetch-depth: 0, persist-credentials: false}
      - name: Preflight
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME){throw 'Unexpected runner'}
          if($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine'){throw 'Unexpected repository'}
          if((git branch --show-current).Trim() -ne $env:TARGET_BRANCH){throw 'Unexpected branch'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Dirty worktree'}
          $head=(git rev-parse HEAD).Trim(); $hm=[regex]::Match($env:SOURCE_BODY,'(?m)^source_head=([0-9a-f]{40})\s*$'); if(-not$hm.Success -or $hm.Groups[1].Value -ne $head){throw 'HEAD mismatch'}
          $am=[regex]::Match($env:SOURCE_BODY,'(?m)^attempt=(\d+)\s*$'); if(-not$am.Success){throw 'Attempt missing'}
          $claude=Get-Command claude.cmd -ErrorAction Stop
          $cred=Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json') -Raw|ConvertFrom-Json
          if([int64]$cred.claudeAiOauth.expiresAt -le [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()){throw 'Claude token expired'}
          "head=$head" >> $env:GITHUB_OUTPUT; "attempt=$($am.Groups[1].Value)" >> $env:GITHUB_OUTPUT; "claude=$($claude.Source)" >> $env:GITHUB_OUTPUT
      - name: Fresh Claude review
        id: review
        env:
          CLAUDE_PATH: ${{ steps.gate.outputs.claude }}
        run: |
          $ErrorActionPreference='Stop'
          $sources=''
          $files=@('docs/PRODUCT.md','docs/INDEX.md','docs/Specifications-fonctionnelles/06 – Ecrans et navigation de la V1.md','docs/Specifications-fonctionnelles/07 – Registre des décisions de conception.md','docs/Specifications-fonctionnelles/08 – Conception fonctionnelle détaillée.md','docs/Specifications-fonctionnelles/09 – Modèle de données fonctionnel.md','docs/Specifications-fonctionnelles/10 – Processus métier et règles métier transverses.md','docs/Specifications-fonctionnelles/11 – API fonctionnelles.md','docs/Specifications-fonctionnelles/12 – Architecture technique.md','docs/Specifications-fonctionnelles/13 – Contrats d’écran.md')
          foreach($f in $files){if(Test-Path $f){$m=Select-String -Path $f -Pattern 'T01-S09|Catégor|Composition|atomic|transaction|zone corporelle|double|D-09[2-9]|Catalogue|Enregistrer' -Context 1,1; $sources += "`n===== $f =====`n" + (($m|ForEach-Object{$_.ToString()}) -join "`n")}}
          if($sources.Length -gt 160000){$sources=$sources.Substring(0,160000)}
          $prompt="KODJO V1.4 — revue indépendante courte du PLAN T01-S09 construit par OpenAI. Nouvelle session obligatoire : ne reprends aucune session historique. Lecture seule absolue. Évalue 5 axes : couverture, traçabilité, absence de règles inventées/obsolètes, exécutabilité, testabilité. Règle catégorie impérative : normalisation des espaces puis comparaison sans casse ET sans accents/diacritiques; libellé visible conserve la saisie; aucun fuzzy/correction/suggestion. Vérifie migration additive sans modifier migration001, atomicité SQLite, persistance complète T01-S08 et zones, double-submit, reset après succès seulement, retour Catalogue, erreurs/loading, tests, aucun S10. Réponds STRICTEMENT :`nDECISION: APPROVE|REVISE|CLARIFY`nSUMMARY: ...`nBLOCKING_POINTS:`n- ... ou NONE`nFEEDBACK:`n... ou NONE`nSOURCES_CHECKED:`n- ...`nCLARIFY uniquement vraie décision produit indéterminable; défaut technique=REVISE. Une limite d'usage/erreur/timeout n'est jamais un résultat métier.`n`nPLAN:`n$env:SOURCE_BODY`n`nSOURCES:`n$sources"
          $out=Join-Path $env:RUNNER_TEMP 'review-out.txt'; $err=Join-Path $env:RUNNER_TEMP 'review-err.txt'; $old=$ErrorActionPreference; $ErrorActionPreference='Continue'
          & $env:CLAUDE_PATH -p --output-format json $prompt 1> $out 2> $err; $exit=$LASTEXITCODE; $ErrorActionPreference=$old
          $raw=if(Test-Path $out){Get-Content $out -Raw -Encoding UTF8}else{''}; $stderr=if(Test-Path $err){Get-Content $err -Raw -Encoding UTF8}else{''}; $p=$null; try{$p=$raw|ConvertFrom-Json}catch{}
          if($exit -ne 0 -or $null -eq $p -or [string]::IsNullOrWhiteSpace([string]$p.result) -or [string]::IsNullOrWhiteSpace([string]$p.session_id)){throw "Claude review technical failure: $stderr"}
          if($p.session_id -eq $env:HISTORICAL_SESSION_ID){throw 'Historical session reused'}
          if([string]$p.result -match 'session limit|rate limit'){throw 'Claude usage limit reached'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Review modified worktree'}
          $rp=Join-Path $env:RUNNER_TEMP 'review.txt'; [IO.File]::WriteAllText($rp,[string]$p.result,(New-Object Text.UTF8Encoding($false))); "session=$($p.session_id)" >> $env:GITHUB_OUTPUT; "result=$rp" >> $env:GITHUB_OUTPUT
      - name: Route plan review
        env:
          RESULT: ${{ steps.review.outputs.result }}
          REVIEW_SESSION: ${{ steps.review.outputs.session }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
        run: |
          $ErrorActionPreference='Stop'; $r=Get-Content $env:RESULT -Raw -Encoding UTF8; $m=[regex]::Match($r,'(?m)^DECISION:\s*(APPROVE|REVISE|CLARIFY)\s*$'); if(-not$m.Success){throw 'Invalid decision'}; $d=$m.Groups[1].Value
          $fi=$r.IndexOf('FEEDBACK:'); if($fi -lt 0){throw 'Feedback missing'}; $feedback=$r.Substring($fi+9).Trim()
          if($d -eq 'APPROVE'){$body="[KODJO_S09_PLAN_GATE]`nsource_plan_comment_id=$env:SOURCE_COMMENT_ID`nsource_head=$env:HEAD_SHA`nreview_session_id=$env:REVIEW_SESSION`nattempt=$env:ATTEMPT`nSTATUT : PLAN_READY_FOR_USER_GATE`n`n$r"}
          elseif($d -eq 'REVISE' -and [int]$env:ATTEMPT -lt 3){$next=[int]$env:ATTEMPT+1; $body="[KODJO_V14_S09] PLAN_REVISION_OPENAI`nattempt=$next`nsource_plan_comment_id=$env:SOURCE_COMMENT_ID`nsource_head=$env:HEAD_SHA`nREVIEW_FEEDBACK:`n$feedback"}
          else{$body="[KODJO_S09_CLARIFICATION_REQUIRED]`nkind=PLAN`nsource_comment_id=$env:SOURCE_COMMENT_ID`nhead=$env:HEAD_SHA`nreview_session_id=$env:REVIEW_SESSION`nattempt=$env:ATTEMPT`nSTATUT : CLARIFICATION_REQUIRED`n`n$r"}
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}; Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/17/comments" -Headers $h -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json) | Out-Null

  implementation-openai-review:
    if: github.event.issue.number == 17 && (github.event.comment.user.login == 'github-actions[bot]' || github.event.comment.user.login == 'MyUncried') && contains(github.event.comment.body, '[KODJO_S09_IMPLEMENTATION_OUTPUT]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOURCE_BODY: ${{ github.event.comment.body }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.TARGET_BRANCH }}', fetch-depth: 0}
      - name: OpenAI implementation review and route
        shell: bash
        run: |
          set -euo pipefail
          publish_orchestration_failure() {
            local reason="$1"
            printf '%s\n' '[KODJO_S09_ORCHESTRATION_FAILURE]' 'kind=IMPLEMENTATION_REVIEW' "source_comment_id=$SOURCE_COMMENT_ID" "head=$HEAD_SHA" 'STATUT : ORCHESTRATION_FAILURE' '' "$reason" > /tmp/out.md
            gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/out.md
      - name: Preserve OpenAI review transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s09-implementation-review-${{ github.run_id }}
          path: |
            /tmp/response.json
            /tmp/review.json
          if-no-files-found: warn
          retention-days: 7
            exit 1
          }
          HEAD_SHA=$(git rev-parse HEAD); EXPECTED=$(printf '%s' "$SOURCE_BODY"|sed -n 's/^head=//p'|head -n1); test "$HEAD_SHA" = "$EXPECTED"
          BASE=$(printf '%s' "$SOURCE_BODY"|sed -n 's/^base_head=//p'|head -n1); PLAN_ID=$(printf '%s' "$SOURCE_BODY"|sed -n 's/^plan_comment_id=//p'|head -n1); SESSION=$(printf '%s' "$SOURCE_BODY"|sed -n 's/^session_id=//p'|head -n1); ATTEMPT=$(printf '%s' "$SOURCE_BODY"|sed -n 's/^attempt=//p'|head -n1)
          test -n "$BASE"; test -n "$PLAN_ID"; test -n "$SESSION"; test "$SESSION" != "$HISTORICAL_SESSION_ID"; test -n "$ATTEMPT"
          gh api "repos/${{ github.repository }}/issues/comments/$PLAN_ID" --jq '.body' > /tmp/plan.txt
          git diff --unified=3 "$BASE..HEAD" | head -c 220000 > /tmp/diff.txt || true
          printf '%s\n' 'Review KODJO T01-S09 implementation independently. Technical defect=REVISE; CLARIFY only genuine product decision. Check approved plan, scope, complete T01-S08 persistence/body zones, category duplicate spaces+case+diacritics, additive migration/atomicity, double-submit/reset/errors/loading, tests/TypeScript, no S10. Return strict JSON. Be concise: summary <= 1200 characters; feedback <= 2500 characters; at most 10 blocking_points and 15 sources_checked, each <= 300 characters.' > /tmp/prompt.txt
          cat /tmp/plan.txt >> /tmp/prompt.txt; printf '\nOUTPUT:\n%s\nDIFF:\n' "$SOURCE_BODY" >> /tmp/prompt.txt; cat /tmp/diff.txt >> /tmp/prompt.txt
          SCHEMA='{"type":"object","properties":{"decision":{"type":"string","enum":["APPROVE","REVISE","CLARIFY"]},"summary":{"type":"string"},"feedback":{"type":"string"},"blocking_points":{"type":"array","items":{"type":"string"}},"sources_checked":{"type":"array","items":{"type":"string"}}},"required":["decision","summary","feedback","blocking_points","sources_checked"],"additionalProperties":false}'
          jq -n --arg model 'gpt-5.6-luna' --rawfile prompt /tmp/prompt.txt --argjson schema "$SCHEMA" '{model:$model,input:$prompt,store:false,reasoning:{effort:"high"},max_output_tokens:8000,text:{format:{type:"json_schema",name:"review",strict:true,schema:$schema}}}' > /tmp/request.json
          curl --fail-with-body -sS https://api.openai.com/v1/responses -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' -d @/tmp/request.json -o /tmp/response.json
          RESPONSE_STATUS=$(jq -r '.status // empty' /tmp/response.json)
          if [ "$RESPONSE_STATUS" != completed ]; then
            DETAILS=$(jq -c '{status:(.status // "missing"), incomplete_details:(.incomplete_details // null), error:(.error // null)}' /tmp/response.json)
            publish_orchestration_failure "OpenAI response incomplete: $DETAILS"
          fi
          if ! jq -er '[.output[]?|select(.type=="message")|.content[]?|select(.type=="output_text")|.text]|join("\n")|select(length>0)' /tmp/response.json > /tmp/review.json; then
            publish_orchestration_failure 'OpenAI response completed without a non-empty output_text.'
          fi
          if ! jq -e 'type=="object" and (.decision=="APPROVE" or .decision=="REVISE" or .decision=="CLARIFY") and (.summary|type=="string") and (.feedback|type=="string") and (.blocking_points|type=="array") and (.sources_checked|type=="array")' /tmp/review.json > /dev/null; then
            publish_orchestration_failure 'OpenAI output_text is not a complete review JSON matching the routing contract.'
          fi
          D=$(jq -r '.decision' /tmp/review.json); F=$(jq -r '.feedback' /tmp/review.json); S=$(jq -r '.summary' /tmp/review.json)
          if [ "$D" = APPROVE ]; then printf '%s\n' '[KODJO_S09_VISUAL_GATE]' "source_implementation_comment_id=$SOURCE_COMMENT_ID" "head=$HEAD_SHA" "session_id=$SESSION" "attempt=$ATTEMPT" 'STATUT : VISUAL_REVIEW_READY' '' "$S" > /tmp/out.md
          elif [ "$D" = REVISE ] && [ "$ATTEMPT" -lt 3 ]; then NEXT=$((ATTEMPT+1)); printf '%s\n' '[KODJO_V14_S09] IMPLEMENTATION_REVISION' "attempt=$NEXT" "session_id=$SESSION" "source_head=$HEAD_SHA" 'REVIEW_FEEDBACK:' "$F" > /tmp/out.md
          else printf '%s\n' '[KODJO_S09_CLARIFICATION_REQUIRED]' 'kind=IMPLEMENTATION' "source_comment_id=$SOURCE_COMMENT_ID" "head=$HEAD_SHA" "session_id=$SESSION" "attempt=$ATTEMPT" 'STATUT : CLARIFICATION_REQUIRED' '' "$S" '' 'Feedback:' "$F" > /tmp/out.md; fi
          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/out.md
