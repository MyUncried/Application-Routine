name: KODJO T8 Work Arbitration Transport

run-name: KODJO T8 — Work response to real Claude Cloud

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  resume-from-work-arbitration:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 18 &&
      github.event.comment.user.login == 'MyUncried' &&
      (contains(github.event.comment.body, '[KODJO_T8_USER_ARBITRATION]') ||
       contains(github.event.comment.body, '[KODJO_T8_TECHNICAL_RETRY]')) &&
      contains(github.event.comment.body, 'choice=A') &&
      contains(github.event.comment.body, 'source=CHATGPT_WORK_SAME_THREAD')
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact T8 arbitration transport
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
          SOURCE_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          ORIGINAL_BODY="$(cat <<'EOF'
          [KODJO_T8_USER_ARBITRATION]
          choice=A
          source=CHATGPT_WORK_SAME_THREAD
          transport_test=T8
          pr=18
          implementation_authorized=false
          business_write=false
          real_claude_authorized=true
          EOF
          )"
          RETRY_BODY="$(cat <<'EOF'
          [KODJO_T8_TECHNICAL_RETRY]
          source_comment_id=5463763289
          choice=A
          source=CHATGPT_WORK_SAME_THREAD
          transport_test=T8
          pr=18
          implementation_authorized=false
          business_write=false
          real_claude_authorized=true
          EOF
          )"
          test "$SOURCE_BODY" = "$ORIGINAL_BODY" || test "$SOURCE_BODY" = "$RETRY_BODY"
          CAUSAL_COMMENT_ID=5463763289
          cat > /tmp/t8-accepted.md <<EOF
          [KODJO_T8_ARBITRATION_ACCEPTED] VERIFIED_SUCCESS

          \`schema=kodjo.t8-arbitration-accepted.v1`
          \`source_comment_id=$CAUSAL_COMMENT_ID\`
          \`source=CHATGPT_WORK_SAME_THREAD\`
          \`choice=A\`
          \`pr=18\`
          \`implementation_authorized=false\`
          \`business_write=false\`
          \`real_claude_authorized=true\`

          La réponse utilisateur reçue dans le fil Work a été matérialisée dans GitHub et la chaîne T8 reprend automatiquement vers Claude Cloud réel.
          EOF
          gh issue comment 18 --repo "${{ github.repository }}" --body-file /tmp/t8-accepted.md

      - uses: actions/checkout@v6
        with:
          ref: orchestration/t7-t8-work-transport
          fetch-depth: 0

      - name: Verify transport branch is non-business
        run: |
          set -euo pipefail
          test -f .github/orchestration/T7_T8_WORK_TRANSPORT.md
          CHANGED=$(git diff --name-only d7e99c9a68939ebb18f7813be692f7e7d42e760f...HEAD)
          test "$CHANGED" = ".github/orchestration/T7_T8_WORK_TRANSPORT.md"
          test -z "$(git status --porcelain)"

      - name: Call real Claude Cloud for T8
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            KODJO T8 — REAL CLAUDE CLOUD TRANSPORT TEST.
            GitHub Actions has already validated the upstream T8 transport input. Your role is limited to proving this downstream actor is the real Claude Cloud action.
            Strictly read-only. Do not edit, write, commit, push, or access the network.
            Read only `.github/orchestration/T7_T8_WORK_TRANSPORT.md`.
            Return one structured JSON object whose `message` reports your own observable execution: Claude Cloud was invoked, the transport manifest was read, and no business write or T01-S09 implementation was performed or authorized. End exactly with `STATUT : KODJO_T8_REAL_CLAUDE_SUCCESS`.
          claude_args: |
            --max-turns 10
            --allowedTools "Read"
            --json-schema '{"type":"object","properties":{"message":{"type":"string"}},"required":["message"]}'

      - name: Publish verifiable T8 result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          SOURCE_COMMENT_ID: 5463763289
        run: |
          set -euo pipefail
          MESSAGE=$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.message // empty')
          test -n "$MESSAGE"
          printf '%s' "$MESSAGE" | grep -Fq 'STATUT : KODJO_T8_REAL_CLAUDE_SUCCESS'
          test -z "$(git status --porcelain)"
          cat > /tmp/t8-result.md <<EOF
          [KODJO_T8_REAL_CLAUDE_RESULT] VERIFIED_SUCCESS

          \`schema=kodjo.t8-real-claude-result.v1`
          \`source_comment_id=$CAUSAL_COMMENT_ID\`
          \`source=CHATGPT_WORK_SAME_THREAD\`
          \`choice=A\`
          \`pr=18\`
          \`implementation_authorized=false\`
          \`real_claude_called=true\`
          \`business_write=false\`

          $MESSAGE
          EOF
          gh issue comment 18 --repo "${{ github.repository }}" --body-file /tmp/t8-result.md
