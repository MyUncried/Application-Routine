name: Orchestration event detection test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  detect-marker:
    if: >-
      github.event.issue.number == 4 &&
      contains(github.event.comment.body, 'PLAN_READY_FOR_REVIEW') &&
      !contains(github.event.comment.body, 'ORCHESTRATOR_EVENT_DETECTED')
    runs-on: ubuntu-latest
    steps:
      - name: Publish detection proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body "ORCHESTRATOR_EVENT_DETECTED — marker PLAN_READY_FOR_REVIEW detected from comment $COMMENT_ID."
