name: KODJO BASE Recovery Durable Verifier

on:
  workflow_run:
    workflows: [KODJO BASE Evidence Recovery]
    types: [completed]
    branches: [main]

permissions:
  contents: write

env:
  TEST_ID: KODJO-CLAUDE-SESSION-RESUME-01
  BASE_RUN_ID: "33384761722"
  ORIGINAL_SESSION_ID: 1995230a-7b4a-4c7b-ba54-60b0762ad850
  STATE_REF: test-state/claude-session-resume-01
  STATE_ROOT: .github/orchestration/state/KODJO-CLAUDE-SESSION-RESUME-01

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read recovered BASE in this distinct run and persist proof
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RESULT_PATH="$STATE_ROOT/BASE.result.json"
          PROOF_PATH="$STATE_ROOT/BASE.recovery-verified.json"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$PROOF_PATH?ref=$STATE_REF" >/dev/null 2>&1; then
            EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PROOF_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
            printf '%s' "$EXISTING" | jq -e --arg base_run_id "$BASE_RUN_ID" --arg session_id "$ORIGINAL_SESSION_ID" '.status=="BASE_RECOVERED_AND_READ" and .base_run_id==$base_run_id and .returned_session_id==$session_id and .distinct_runs==true and .claude_action_present==false and .claude_call_count==1' >/dev/null
            exit 0
          fi
          STORED="$(gh api "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          RECOVERY_RUN_ID="$(printf '%s' "$STORED" | jq -r '.recovered_by_run_id // empty')"
          test -n "$RECOVERY_RUN_ID"
          printf '%s' "$STORED" | jq -e --arg base_run_id "$BASE_RUN_ID" --arg session_id "$ORIGINAL_SESSION_ID" '.stage=="BASE" and .status=="success" and .run_id==$base_run_id and .returned_session_id==$session_id and .metrics.execution_session_id==$session_id and .recovery_without_claude==true' >/dev/null
          PROOF="$(jq -nc --arg test_id "$TEST_ID" --arg base_run_id "$BASE_RUN_ID" --arg session_id "$ORIGINAL_SESSION_ID" --arg recovery_run_id "$RECOVERY_RUN_ID" --arg triggering_run_id "$TRIGGERING_RUN_ID" --arg verification_run_id "$GITHUB_RUN_ID" '{test_id:$test_id,stage:"BASE_RECOVERY_VERIFY",status:"BASE_RECOVERED_AND_READ",base_run_id:$base_run_id,returned_session_id:$session_id,recovery_run_id:$recovery_run_id,triggering_run_id:$triggering_run_id,verification_run_id:$verification_run_id,distinct_runs:($recovery_run_id!=$verification_run_id),claude_action_present:false,claude_call_count:1,max_claude_calls:2}')"
          ENCODED="$(printf '%s' "$PROOF" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$PROOF_PATH" -f message="test-state: verify recovered BASE #3 in distinct run" -f content="$ENCODED" -f branch="$STATE_REF" >/dev/null
          READ_BACK="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PROOF_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$READ_BACK" | jq -e '.status=="BASE_RECOVERED_AND_READ" and .distinct_runs==true and .claude_action_present==false and .claude_call_count==1 and .max_claude_calls==2' >/dev/null
