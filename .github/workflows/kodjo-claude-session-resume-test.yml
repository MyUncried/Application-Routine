name: KODJO Claude Session Resume Micro-Test
run-name: KODJO-CLAUDE-SESSION-RESUME-01 / ${{ inputs.stage }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Internal stage
        required: true
        type: choice
        options: [BASE, RESUME]
      base_marker:
        description: BASE-only continuity marker; leave empty for RESUME
        required: false
        type: string
        default: ""

concurrency:
  group: KODJO-CLAUDE-SESSION-RESUME-01
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  actions: write
  id-token: write

env:
  TEST_ID: KODJO-CLAUDE-SESSION-RESUME-01
  TEST_REF: main
  STATE_REF: test-state/claude-session-resume-01
  STATE_ROOT: .github/orchestration/state/KODJO-CLAUDE-SESSION-RESUME-01
  WORKFLOW_FILE: kodjo-claude-session-resume-test.yml
  EXPECTED_MARKER_SHA256: 27cb9c7dc5672a86772fae50aa58fb4adf019022c5c59e2bb7d2e9914dbf551d

jobs:
  base:
    if: inputs.stage == 'BASE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TEST_REF }}
          fetch-depth: 1
      - name: Acquire and verify durable BASE claim
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_MARKER: ${{ inputs.base_marker }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$BASE_MARKER" | sha256sum | cut -d' ' -f1)" = "$EXPECTED_MARKER_SHA256"
          CLAIM_PATH="$STATE_ROOT/BASE.claim.json"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$CLAIM_PATH?ref=$STATE_REF" >/dev/null 2>&1; then
            echo "BASE already claimed; no Claude call permitted." >&2
            exit 1
          fi
          CLAIM="$(jq -nc --arg test_id "$TEST_ID" --arg run_id "$GITHUB_RUN_ID" --arg marker_sha256 "$EXPECTED_MARKER_SHA256" '{test_id:$test_id,stage:"BASE",status:"CLAIMED",run_id:$run_id,marker_sha256:$marker_sha256,business_write:false,implementation_authorized:false,mode:"CLOUD_READ_ONLY",writer:"NONE"}')"
          ENCODED="$(printf '%s' "$CLAIM" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$CLAIM_PATH" -f message="test-state: claim BASE $GITHUB_RUN_ID" -f content="$ENCODED" -f branch="$STATE_REF" >/dev/null
          STORED="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CLAIM_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$STORED" | jq -e --arg run_id "$GITHUB_RUN_ID" '.stage=="BASE" and .status=="CLAIMED" and .run_id==$run_id' >/dev/null
      - name: Run Claude BASE
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            MICRO-TEST TECHNIQUE KODJO — ÉTAPE BASE — STRICTEMENT EN LECTURE SEULE.
            Lis uniquement `.github/orchestration/KODJO_CLAUDE_SESSION_RESUME_TEST.md`.
            Mémorise dans le contexte de cette session le marqueur suivant : ${{ inputs.base_marker }}
            Ne restitue pas le marqueur dans ta réponse. Ne lis rien d'autre. N'utilise aucun accès réseau. Ne modifie rien.
            Retourne uniquement le résultat structuré demandé.
          claude_args: |
            --max-turns 3
            --allowedTools "Read"
            --json-schema '{"type":"object","properties":{"test_id":{"const":"KODJO-CLAUDE-SESSION-RESUME-01"},"stage":{"const":"BASE"},"manifest_read":{"const":true},"marker_memorized":{"const":true},"business_write":{"const":false},"implementation_authorized":{"const":false}},"required":["test_id","stage","manifest_read","marker_memorized","business_write","implementation_authorized"],"additionalProperties":false}'
      - name: Persist BASE evidence
        if: always() && steps.gate.outcome == 'success'
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          set -euo pipefail
          METRICS='{}'
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            METRICS="$(jq -c '{execution_session_id:(.session_id//null),claude_model:(.model//null),duration_ms:(.duration_ms//null),num_turns:(.num_turns//null),total_cost_usd:(.total_cost_usd//null),permission_denials_count:(if (.permission_denials|type)=="array" then (.permission_denials|length) else null end)}' "$EXECUTION_FILE" 2>/dev/null || printf '{}')"
          fi
          RESULT_PATH="$STATE_ROOT/BASE.result.json"
          RESULT="$(jq -nc --arg test_id "$TEST_ID" --arg status "${CONCLUSION:-failure}" --arg session_id "${SESSION_ID:-NONE}" --arg execution_file "${EXECUTION_FILE:-NONE}" --arg run_id "$GITHUB_RUN_ID" --argjson structured_output "${STRUCTURED_OUTPUT:-{}}" --argjson metrics "$METRICS" '{test_id:$test_id,stage:"BASE",status:$status,returned_session_id:$session_id,execution_file:$execution_file,run_id:$run_id,business_write:false,implementation_authorized:false,mode:"CLOUD_READ_ONLY",writer:"NONE",structured_output:$structured_output,metrics:$metrics}')"
          ENCODED="$(printf '%s' "$RESULT" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH" -f message="test-state: persist BASE result $GITHUB_RUN_ID" -f content="$ENCODED" -f branch="$STATE_REF" >/dev/null
          STORED="$(gh api "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$STORED" | jq -e --arg run_id "$GITHUB_RUN_ID" '.stage=="BASE" and .run_id==$run_id' >/dev/null
          if [ "${CONCLUSION:-failure}" = success ] && [ -n "$SESSION_ID" ]; then echo 'dispatch_resume=true' >> "$GITHUB_OUTPUT"; else echo 'dispatch_resume=false' >> "$GITHUB_OUTPUT"; fi
      - name: Preserve BASE execution file
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: KODJO-CLAUDE-SESSION-RESUME-01-BASE-execution
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 30
      - name: Dispatch distinct RESUME run
        if: steps.persist.outputs.dispatch_resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "$WORKFLOW_FILE" --repo "$GITHUB_REPOSITORY" --ref "$TEST_REF" -f stage=RESUME

  resume:
    if: inputs.stage == 'RESUME'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TEST_REF }}
          fetch-depth: 1
      - name: Resolve BASE result, acquire and verify durable RESUME claim
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORBIDDEN_RESUME_INPUT: ${{ inputs.base_marker }}
        run: |
          set -euo pipefail
          test -z "$FORBIDDEN_RESUME_INPUT"
          CLAIM_PATH="$STATE_ROOT/RESUME.claim.json"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$CLAIM_PATH?ref=$STATE_REF" >/dev/null 2>&1; then echo 'RESUME already claimed; no Claude call permitted.' >&2; exit 1; fi
          BASE_PATH="$STATE_ROOT/BASE.result.json"
          BASE_RESULT="$(gh api "repos/$GITHUB_REPOSITORY/contents/$BASE_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$BASE_RESULT" | jq -e '.stage=="BASE" and .status=="success"' >/dev/null
          SESSION_ID="$(printf '%s' "$BASE_RESULT" | jq -r '.returned_session_id // empty')"
          test -n "$SESSION_ID"; test "$SESSION_ID" != NONE
          CLAIM="$(jq -nc --arg test_id "$TEST_ID" --arg session_id "$SESSION_ID" --arg run_id "$GITHUB_RUN_ID" '{test_id:$test_id,stage:"RESUME",status:"CLAIMED",requested_session_id:$session_id,run_id:$run_id,business_write:false,implementation_authorized:false,mode:"CLOUD_READ_ONLY",writer:"NONE"}')"
          ENCODED="$(printf '%s' "$CLAIM" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$CLAIM_PATH" -f message="test-state: claim RESUME $GITHUB_RUN_ID" -f content="$ENCODED" -f branch="$STATE_REF" >/dev/null
          STORED="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CLAIM_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$STORED" | jq -e --arg run_id "$GITHUB_RUN_ID" --arg session_id "$SESSION_ID" '.stage=="RESUME" and .run_id==$run_id and .requested_session_id==$session_id' >/dev/null
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
      - name: Run Claude RESUME
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Restitue le marqueur de continuité qui t'a été donné dans l'étape précédente de cette session.
            Ne lis aucun fichier. N'utilise aucun outil, aucun accès réseau et n'effectue aucune écriture.
            Retourne uniquement le résultat structuré demandé.
          claude_args: |
            --resume ${{ steps.gate.outputs.session_id }}
            --max-turns 3
            --allowedTools ""
            --json-schema '{"type":"object","properties":{"test_id":{"const":"KODJO-CLAUDE-SESSION-RESUME-01"},"stage":{"const":"RESUME"},"marker_returned":{"type":"string"},"business_write":{"const":false},"implementation_authorized":{"const":false}},"required":["test_id","stage","marker_returned","business_write","implementation_authorized"],"additionalProperties":false}'
      - name: Persist RESUME evidence
        if: always() && steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SESSION_ID: ${{ steps.gate.outputs.session_id }}
          RETURNED_SESSION_ID: ${{ steps.claude.outputs.session_id }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          set -euo pipefail
          METRICS='{}'
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then METRICS="$(jq -c '{execution_session_id:(.session_id//null),claude_model:(.model//null),duration_ms:(.duration_ms//null),num_turns:(.num_turns//null),total_cost_usd:(.total_cost_usd//null),permission_denials_count:(if (.permission_denials|type)=="array" then (.permission_denials|length) else null end)}' "$EXECUTION_FILE" 2>/dev/null || printf '{}')"; fi
          RESULT_PATH="$STATE_ROOT/RESUME.result.json"
          RESULT="$(jq -nc --arg test_id "$TEST_ID" --arg status "${CONCLUSION:-failure}" --arg requested_session_id "$REQUESTED_SESSION_ID" --arg returned_session_id "${RETURNED_SESSION_ID:-NONE}" --arg execution_file "${EXECUTION_FILE:-NONE}" --arg run_id "$GITHUB_RUN_ID" --argjson structured_output "${STRUCTURED_OUTPUT:-{}}" --argjson metrics "$METRICS" '{test_id:$test_id,stage:"RESUME",status:$status,requested_session_id:$requested_session_id,returned_session_id:$returned_session_id,execution_file:$execution_file,run_id:$run_id,fallback:"NONE",business_write:false,implementation_authorized:false,mode:"CLOUD_READ_ONLY",writer:"NONE",structured_output:$structured_output,metrics:$metrics}')"
          ENCODED="$(printf '%s' "$RESULT" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH" -f message="test-state: persist RESUME result $GITHUB_RUN_ID" -f content="$ENCODED" -f branch="$STATE_REF" >/dev/null
          STORED="$(gh api "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$STORED" | jq -e --arg run_id "$GITHUB_RUN_ID" '.stage=="RESUME" and .run_id==$run_id' >/dev/null
      - name: Preserve RESUME execution file
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: KODJO-CLAUDE-SESSION-RESUME-01-RESUME-execution
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 30
