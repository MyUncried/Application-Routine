name: KODJO — Routine Dev environment sync

run-name: Routine Dev sync — review run ${{ github.event.workflow_run.id || inputs.review_run_id }}

on:
  workflow_call:
    inputs:
      review_run_id:
        required: true
        type: string
      review_run_attempt:
        required: true
        type: string
  workflow_run:
    workflows: ["KODJO — Generic Slice Implementation Review"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: routine-dev-sync-${{ github.event.workflow_run.id || inputs.review_run_id }}-${{ github.event.workflow_run.run_attempt || inputs.review_run_attempt }}
  cancel-in-progress: false

jobs:
  sync:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'issue_comment' && inputs.review_run_id == format('{0}', github.run_id) && inputs.review_run_attempt == format('{0}', github.run_attempt))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: development

    steps:
      - name: Checkout environment-sync tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Resolve the exact IMPLEMENTATION_REVIEW_OUTPUT / IMPLEMENTATION_REVIEW_APPROVED milestone.
      - name: Resolve exact V2 application delivery
        id: delivery
        shell: bash
        run: |
          set -euo pipefail
          meta="${RUNNER_TEMP}/routine-dev-sync.json"
          node scripts/kodjo/resolve-review-run-environment-sync.js "$GITHUB_REPOSITORY" "${{ github.event.workflow_run.id || inputs.review_run_id }}" "${{ github.event.workflow_run.run_attempt || inputs.review_run_attempt }}" "$meta"
          applicable="$(jq -r 'if (.applicable | type) == "boolean" then .applicable else error("ENV_SYNC_APPLICABILITY_INVALID") end' "$meta")"
          {
            echo "meta=$meta"
            echo "applicable=$applicable"
          } >> "$GITHUB_OUTPUT"
          if [ "$applicable" = "true" ]; then
            {
              echo "slice_id=$(jq -r .slice_id "$meta")"
              echo "application_pr=$(jq -r .application_pr "$meta")"
              echo "application_branch=$(jq -r .application_branch "$meta")"
              echo "base_head=$(jq -r .base_head "$meta")"
              echo "application_head=$(jq -r .application_head "$meta")"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact application HEAD
        if: steps.delivery.outputs.applicable == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.delivery.outputs.application_head }}
          fetch-depth: 0
          persist-credentials: false
          path: delivery

      - name: Verify exact checkout and classify update compatibility
        if: steps.delivery.outputs.applicable == 'true'
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.delivery.outputs.application_head }}"
          actual="$(git -C delivery rev-parse HEAD)"
          test "$actual" = "$expected"
          compat="${RUNNER_TEMP}/routine-dev-compatibility.json"
          (
            cd delivery
            node ../scripts/kodjo/classify-environment-update.js               "${{ steps.delivery.outputs.base_head }}"               "$expected"               "$compat"
          )
          environment_contract="${RUNNER_TEMP}/routine-dev-environment-contract.json"
          protocol_head="$(git rev-parse HEAD)"
          node scripts/kodjo/materialize-review-environment.js \
            delivery \
            "$compat" \
            "$environment_contract" \
            "$protocol_head" \
            "$expected"
          echo "file=$compat" >> "$GITHUB_OUTPUT"
          echo "environment_contract=$environment_contract" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r .status "$compat")" >> "$GITHUB_OUTPUT"

      - name: Verify Expo authentication
        if: steps.delivery.outputs.applicable == 'true' && (steps.compatibility.outputs.status == 'OTA_COMPATIBLE' || steps.compatibility.outputs.status == 'NATIVE_REBUILD_REQUIRED')
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || {
            echo "::error::Repository secret EXPO_TOKEN is missing."
            exit 1
          }

      - name: Install project dependencies
        if: steps.delivery.outputs.applicable == 'true' && (steps.compatibility.outputs.status == 'OTA_COMPATIBLE' || steps.compatibility.outputs.status == 'NATIVE_REBUILD_REQUIRED')
        working-directory: delivery
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        if: steps.delivery.outputs.applicable == 'true' && (steps.compatibility.outputs.status == 'OTA_COMPATIBLE' || steps.compatibility.outputs.status == 'NATIVE_REBUILD_REQUIRED')
        shell: bash
        run: npm install --global eas-cli@21.7.1

      - name: Verify Routine Dev configuration
        if: steps.delivery.outputs.applicable == 'true' && (steps.compatibility.outputs.status == 'OTA_COMPATIBLE' || steps.compatibility.outputs.status == 'NATIVE_REBUILD_REQUIRED')
        working-directory: delivery
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public --json > "${RUNNER_TEMP}/routine-dev-expo-config.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/routine-dev-expo-config.json','utf8'));
          const eas=JSON.parse(fs.readFileSync('eas.json','utf8'));
          if(c.name!=='Routine Dev') throw new Error('ROUTINE_DEV_NAME_INVALID');
          if(c.ios?.bundleIdentifier!=='com.ankusha.kodjo.dev') throw new Error('ROUTINE_DEV_BUNDLE_ID_INVALID');
          if(c.extra?.eas?.projectId!=='0ee44f86-bd22-4b92-8780-e265b72907d9') throw new Error('EAS_PROJECT_ID_INVALID');
          if(c.updates?.url!=='https://u.expo.dev/0ee44f86-bd22-4b92-8780-e265b72907d9') throw new Error('EAS_UPDATE_URL_INVALID');
          if(!c.runtimeVersion) throw new Error('EAS_RUNTIME_VERSION_MISSING');
          if(eas.build?.review?.developmentClient!==false) throw new Error('ROUTINE_DEV_STANDALONE_REQUIRED');
          if(eas.build?.review?.autoIncrement!==true) throw new Error('ROUTINE_DEV_BUILD_INCREMENT_REQUIRED');
          NODE

      - name: Publish exact HEAD to Routine Dev review channel
        if: steps.delivery.outputs.applicable == 'true' && steps.compatibility.outputs.status == 'OTA_COMPATIBLE'
        id: update
        working-directory: delivery
        shell: bash
        run: |
          set -euo pipefail
          eas update             --channel review             --platform ios             --environment development             --message "KODJO review ${{ steps.delivery.outputs.slice_id }} ${{ steps.delivery.outputs.application_head }}"             --non-interactive             --json > "${RUNNER_TEMP}/routine-dev-eas-update.json"
          cat "${RUNNER_TEMP}/routine-dev-eas-update.json"

      - name: Submit new Routine Dev review build when native runtime changed
        if: steps.delivery.outputs.applicable == 'true' && steps.compatibility.outputs.status == 'NATIVE_REBUILD_REQUIRED'
        id: rebuild
        working-directory: delivery
        shell: bash
        run: |
          set -euo pipefail
          eas build             --platform ios             --profile review             --non-interactive             --no-wait             --json > "${RUNNER_TEMP}/routine-dev-eas-build.json"
          cat "${RUNNER_TEMP}/routine-dev-eas-build.json"

      - name: Publish environment-sync summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.delivery.outputs.applicable }}" != "true" ]; then
            {
              echo "### Routine Dev environment synchronization"
              echo
              echo "This approved implementation review is not a KODJO V2 Lean Queue application delivery."
              echo "No Routine Dev environment action was taken."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Routine Dev environment synchronization"
            echo
            echo "- Slice: \`${{ steps.delivery.outputs.slice_id }}\`"
            echo "- PR: #${{ steps.delivery.outputs.application_pr }}"
            echo "- Application HEAD: \`${{ steps.delivery.outputs.application_head }}\`"
            echo "- Compatibility: \`${{ steps.compatibility.outputs.status }}\`"
            if [ "${{ steps.compatibility.outputs.status }}" = "OTA_COMPATIBLE" ]; then
              echo "- Target: EAS Update channel \`review\`"
            elif [ "${{ steps.compatibility.outputs.status }}" = "NO_ENVIRONMENT_UPDATE" ]; then
              echo "- Qualification-only change: no EAS authentication, installation, update or build performed."
            else
              echo "- Target: new Routine Dev internal review build"
              echo "- Reason: native-sensitive change requires a new binary before further OTA updates"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve environment-sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routine-dev-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.delivery.outputs.meta }}
            ${{ steps.compatibility.outputs.file }}
            ${{ steps.compatibility.outputs.environment_contract }}
            ${{ runner.temp }}/routine-dev-expo-config.json
            ${{ runner.temp }}/routine-dev-eas-update.json
            ${{ runner.temp }}/routine-dev-eas-build.json
          if-no-files-found: warn
          retention-days: 30
