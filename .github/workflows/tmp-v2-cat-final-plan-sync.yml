name: TEMP V2-CAT-01 final plan sync
on:
  push:
    branches:
      - docs/v2-cat-01-final-plan-findings-20260917
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v2-cat-01-final-plan-findings-20260917
          fetch-depth: 0
      - name: Apply bounded final review findings
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/orchestration/v2-slices/V2-CAT-01/planning-mission.md')
          text = p.read_text(encoding='utf-8')
          marker = '### Corrections imposées après la troisième revue indépendante'
          if marker not in text:
              addition = '''\n\n### Corrections imposées après la troisième revue indépendante\n\nLa revue `5714941349` a confirmé les axes précédemment fermés et ne laisse qu'un écart de scope et deux formulations à corriger. Le prochain plan doit appliquer exactement les règles suivantes :\n\n- `src/features/sessions/SessionService.ts` est classé `CONSUMER_UNAFFECTED` pour cette tranche : aucun changement de contrat consommé n'est démontré, `SessionService` ne consomme que `SessionDraft`, `toCreateSessionInput` et `toUpdateSessionInput`, et l'évolution additive du brouillon ne justifie aucune écriture dans ce service ;\n- `src/features/sessions/__tests__/SessionService.test.ts` est classé `TEST_UNAFFECTED` : aucun contrat couvert par ce test ne change dans V2-CAT-01 ; il ne doit apparaître ni dans `modified_modules`, ni dans `TEST_MUST_ADAPT`, ni dans `scope_allow` ;\n- le `scope_allow` machine final doit être strictement identique à la liste de périmètre technique en prose et à `modified_modules` pour les chemins en écriture ; aucun importeur classé non affecté ne peut rester autorisé en écriture ;\n- sur la carte d'Activité du Catalogue, `Lecture`/`Démarrer` doit être présenté comme **présent** lorsque le contrat `CE-T03-02` le fixe, et non sous une formulation conditionnelle ; dans cette tranche il reste systématiquement désactivé et sans handler fonctionnel ;\n- dans le parcours de sélection d'Activités existantes depuis la Composition, une validation sans sélection est **invalide**, ne crée aucune donnée et ne modifie ni le brouillon ni le Catalogue ; cette règle doit figurer dans la spécification comportementale du plan, pas seulement dans la stratégie de tests.\n\nLes axes explicitement déclarés conformes par la revue `5714941349` ne doivent pas être rouverts.\n'''
              anchor = '\n## Périmètre fonctionnel inclus\n'
              if anchor not in text:
                  raise SystemExit('anchor missing')
              text = text.replace(anchor, addition + anchor, 1)
              p.write_text(text, encoding='utf-8', newline='\n')
      - name: Commit bounded change and remove transport workflow
        run: |
          git config user.name "MyUncried"
          git config user.email "hadjou@gmail.com"
          git rm .github/workflows/tmp-v2-cat-final-plan-sync.yml
          git add .github/orchestration/v2-slices/V2-CAT-01/planning-mission.md
          git diff --cached --check
          git commit -m "docs(kodjo): close final V2-CAT-01 plan review findings"
          git push origin HEAD:docs/v2-cat-01-final-plan-findings-20260917
