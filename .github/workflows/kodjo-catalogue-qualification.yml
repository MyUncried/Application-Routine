name: KODJO Catalogue - qualification ciblee

on:
  push:
    branches:
      - docs/catalogue-taxonomie-v0-20261107
      - feat/catalogue-admin-local-v0-20261107
      - feat/catalogue-admin-static-medias-20261107
  pull_request:
    paths:
      - "catalogue/**"
      - "scripts/catalogue/**"
      - "tools/catalogue-admin/**"
      - "src/domain/catalogue/**"
      - "src/infrastructure/database/testing/seedMovementTestCorpus.ts"
      - "src/infrastructure/database/testing/smokeMovementFixtures.ts"
      - "src/infrastructure/database/__tests__/seedMovementTestCorpus.test.ts"
      - ".github/workflows/kodjo-catalogue-qualification.yml"

permissions:
  contents: read

concurrency:
  group: catalogue-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate non-publishable pilot corpus
        run: node scripts/catalogue/validate-pilot-corpus.mjs
      - name: Validate provisional taxonomy
        run: node scripts/catalogue/validate-taxonomy.mjs
      - name: Run Node catalogue tests
        run: node --test scripts/catalogue/__tests__/validate-pilot-corpus.test.mjs scripts/catalogue/__tests__/validate-taxonomy.test.mjs
      - name: Check local admin JavaScript syntax
        run: node --check tools/catalogue-admin/app.js && node --check tools/catalogue-admin/server.mjs && node --check tools/catalogue-admin/drafts.mjs
      - name: Validate static OVH media page
        run: node --test scripts/catalogue/__tests__/static-ovh-medias.test.mjs
      - name: Run local admin API and security tests
        run: node --test tools/catalogue-admin/server.test.mjs
      - name: Run Jest catalogue tests
        run: npx jest --runInBand src/domain/catalogue/__tests__/MovementEditorialProvenance.test.ts src/infrastructure/database/__tests__/seedMovementTestCorpus.test.ts
