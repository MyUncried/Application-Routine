name: TEMP V2 minor clarification register sync
on:
  push:
    branches:
      - feat/v2-minor-plan-clarification-fast-path-20260917
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-minor-plan-clarification-fast-path-20260917
          fetch-depth: 0
      - name: Update canonical register and qualification oracle
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'Version du registre : **3.41.0**' .github/orchestration/KODJO_PROTOCOL_INCIDENT_REGISTER.md; then
            echo 'register already synchronized'
            exit 0
          fi
          python scripts/kodjo/tmp_sync_minor_register.py
          node --test tests/kodjo/incident-register.pilot.js tests/kodjo/minor-plan-clarification.pilot.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/orchestration/KODJO_PROTOCOL_INCIDENT_REGISTER.md tests/kodjo/incident-register.pilot.js
          git commit -m 'docs(kodjo): register minor plan clarification fast path'
          git push origin HEAD:feat/v2-minor-plan-clarification-fast-path-20260917
