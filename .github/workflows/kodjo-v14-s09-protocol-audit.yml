name: KODJO V1.4 S09 — Protocol Audit
run-name: T01-S09 / PROTOCOL-AUDIT / ${{ github.event.comment.id }}

on:
  workflow_call:

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v14-s09-protocol-audit
  cancel-in-progress: false

env:
  ISSUE_NUMBER: '17'
  RECOVERY_BRANCH: recovery/t01-s09-attempt2
  RECOVERY_HEAD: 3615ebf202f80c130ee90ef6ef4a8e4d2bad2435
  TARGET_BRANCH: feat/creation-seance-catalogue
  CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude

jobs:
  audit:
    if: github.event.issue.number == 17 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V14_S09] AUDIT_PROTOCOL')
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Audit preflight
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME){throw 'Unexpected runner'}
          if($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine'){throw 'Unexpected repository'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Dirty worktree'}
          $claude=Get-Command claude.cmd -ErrorAction Stop
          $cred=Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json') -Raw | ConvertFrom-Json
          if([int64]$cred.claudeAiOauth.expiresAt -le [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()){throw 'Claude token expired'}
          "claude=$($claude.Source)" >> $env:GITHUB_OUTPUT

      - name: Fresh Claude protocol audit
        id: audit
        env:
          CLAUDE_PATH: ${{ steps.gate.outputs.claude }}
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            '.github/workflows/kodjo-v14-s09-implementation-local.yml',
            '.github/workflows/kodjo-v14-s09-review.yml',
            '.github/workflows/kodjo-v14-s09-recover-worktree.yml',
            '.github/workflows/kodjo-v14-s09-finalize.yml'
          )
          $sources=''
          foreach($f in $files){
            if(Test-Path $f){$sources += "`n===== $f =====`n" + (Get-Content $f -Raw -Encoding UTF8)}
          }
          $prompt=@"
          KODJO V1.4 — AUDIT INDÉPENDANT DU PROTOCOLE T01-S09, STRICTEMENT EN LECTURE SEULE.
          
          OBJECTIF PRIORITAIRE : permettre de TERMINER S09 à partir de l'état matériel durable existant, sans repartir de zéro et sans multiplier les workflows de secours.
          
          ÉTAT MATÉRIEL À CONSIDÉRER COMME VÉRIFIÉ :
          - checkpoint durable : recovery/t01-s09-attempt2 @ 3615ebf202f80c130ee90ef6ef4a8e4d2bad2435 ;
          - ce checkpoint contient de vraies modifications applicatives S09 récupérées ;
          - dernier passage Jest connu sur ce checkpoint : 7 suites en échec, 36 réussies, 58 tests en échec, 571 réussis ; TypeScript non exécuté car Jest a bloqué ;
          - objectif fonctionnel immédiat : corriger code/tests, obtenir Jest complet vert puis TypeScript vert, commit/push vers feat/creation-seance-catalogue, puis revue indépendante ;
          - run #60 a échoué AVANT appel Claude sur une erreur de parsing PowerShell dans Run Claude DEV-S09 ; la parenthèse manquante a été corrigée sur main au commit 8634387db6945dabd1201a37d6d0dd0d5fce5af7 ;
          - ne considère jamais la mémoire de session Claude comme preuve de l'état du code : Git est la source de vérité matérielle.
          
          AUDITE LES WORKFLOWS FOURNIS CI-DESSOUS DE BOUT EN BOUT.
          
          Vérifie au minimum :
          1. syntaxe PowerShell et expressions GitHub Actions ;
          2. branche/HEAD source durable et promotion vers target ;
          3. cohérence session Claude INITIAL / CORRECT / REVISION / VISUAL ;
          4. transport intégral du feedback et du plan ;
          5. risques liés au runner Windows, git clean, node_modules et chemins longs ;
          6. contrôles de périmètre/Unicode ;
          7. traitement des erreurs Claude et absence de faux SUCCESS ;
          8. ordre Jest -> TypeScript -> commit/push -> publication review ;
          9. fast-forward/promotion depuis recovery/t01-s09-attempt2 vers feat/creation-seance-catalogue ;
          10. possibilité réelle de terminer S09 avec le moins de modifications de protocole possible.
          
          Ne modifie aucun fichier. Ne propose pas de refonte générale si une correction locale suffit. Distingue :
          - BLOQUANT AVANT REPRISE S09 ;
          - RISQUE NON BLOQUANT ;
          - DETTE À TRAITER APRÈS S09.
          
          Réponds STRICTEMENT sous cette forme :
          DECISION: READY_WITH_FIXES | NOT_READY | READY
          SUMMARY: ...
          BLOCKING_FIXES:
          - fichier / ligne ou bloc / cause / correction exacte
          RISKS:
          - ... ou NONE
          SAFE_RESUME_SEQUENCE:
          1. ...
          2. ...
          3. ...
          DO_NOT_DO:
          - ...
          FINAL_RECOMMENDATION: ...
          
          SOURCES À AUDITER :
          $sources
          "@
          $out=Join-Path $env:RUNNER_TEMP 'audit-out.txt'
          $err=Join-Path $env:RUNNER_TEMP 'audit-err.txt'
          $old=$ErrorActionPreference
          $ErrorActionPreference='Continue'
          $promptPath=Join-Path $env:RUNNER_TEMP 'audit-prompt.txt'
          [IO.File]::WriteAllText($promptPath,$prompt,(New-Object Text.UTF8Encoding($false)))
          Get-Content $promptPath -Raw -Encoding UTF8 | & $env:CLAUDE_PATH -p --output-format json 1> $out 2> $err
          $exit=$LASTEXITCODE
          $ErrorActionPreference=$old
          $raw=if(Test-Path $out){Get-Content $out -Raw -Encoding UTF8}else{''}
          $stderr=if(Test-Path $err){Get-Content $err -Raw -Encoding UTF8}else{''}
          $p=$null
          try{$p=$raw | ConvertFrom-Json}catch{}
          if($exit -ne 0 -or $null -eq $p -or [string]::IsNullOrWhiteSpace([string]$p.result) -or [string]::IsNullOrWhiteSpace([string]$p.session_id)){throw "Claude audit technical failure: $stderr"}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Audit modified worktree'}
          $rp=Join-Path $env:RUNNER_TEMP 'audit-result.txt'
          [IO.File]::WriteAllText($rp,[string]$p.result,(New-Object Text.UTF8Encoding($false)))
          "result=$rp" >> $env:GITHUB_OUTPUT
          "session=$($p.session_id)" >> $env:GITHUB_OUTPUT

      - name: Publish Claude protocol audit
        env:
          RESULT_PATH: ${{ steps.audit.outputs.result }}
          AUDIT_SESSION: ${{ steps.audit.outputs.session }}
        run: |
          $ErrorActionPreference='Stop'
          $result=Get-Content $env:RESULT_PATH -Raw -Encoding UTF8
          $body="[KODJO_S09_PROTOCOL_AUDIT]`naudit_session_id=$env:AUDIT_SESSION`nsource_main_head=$(git rev-parse HEAD)`nrecovery_head=$env:RECOVERY_HEAD`nSTATUT : PROTOCOL_AUDIT_COMPLETE`n`n$result"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/17/comments" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json) | Out-Null
