name: TEMP apply V2-CAT-01 documentation fix

on:
  push:
    branches:
      - docs/v2-cat-01-review-findings-20260917
    paths:
      - .github/workflows/tmp-apply-v2-cat-doc-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: docs/v2-cat-01-review-findings-20260917
          fetch-depth: 0

      - name: Reassemble and apply deterministic documentation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/orchestration/tmp/v2-cat-doc-fix.patch.* > /tmp/v2-cat-doc-fix.patch
          git apply --check /tmp/v2-cat-doc-fix.patch
          git apply /tmp/v2-cat-doc-fix.patch

      - name: Independent post-change controls
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'D-185' 'docs/Specifications-fonctionnelles/07 – Registre des décisions de conception.md'
          grep -Fq 'D-186' 'docs/Specifications-fonctionnelles/07 – Registre des décisions de conception.md'
          grep -Fq 'Une nouvelle activité' 'docs/Specifications-fonctionnelles/06 – Ecrans et navigation de la V1.md'
          grep -Fq 'section Médias reste visible et repliable' 'docs/Specifications-fonctionnelles/06 – Ecrans et navigation de la V1.md'
          grep -Fq 'src/features/activities/' 'docs/Specifications-fonctionnelles/12 – Architecture technique.md'
          grep -Fq 'RES-NAV-LABEL-01' 'docs/Specifications-fonctionnelles/07 – Registre des décisions de conception.md'
          if rg -n '#U[0-9A-Fa-f]{4}|\\u[0-9A-Fa-f]{4}' docs/PRODUCT.md docs/INDEX.md docs/MATRICE-TRACABILITE-T03-CATALOGUE-ACTIVITES.md docs/Specifications-fonctionnelles; then
            echo 'Unicode path/content degradation marker detected' >&2
            exit 1
          fi

      - name: Remove temporary patch transport and commit only target documentation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/orchestration/tmp/v2-cat-doc-fix.patch.*
          rm -f .github/workflows/tmp-apply-v2-cat-doc-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(kodjo): resolve V2-CAT-01 review findings'
          git push origin HEAD:docs/v2-cat-01-review-findings-20260917
