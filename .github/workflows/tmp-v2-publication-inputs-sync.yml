name: TEMP V2 publication inputs sync

on:
  push:
    branches:
      - fix/v2-plan-consumption-lifecycle-20260917
    paths:
      - .github/workflows/tmp-v2-publication-inputs-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-plan-consumption-lifecycle-20260917
          fetch-depth: 0
      - name: Update fixed input allowlist only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/kodjo/publication-security.pilot.js')
          s=p.read_text(encoding='utf-8')
          old="""      'mode',
      'slice_bootstrap_file',"""
          new="""      'mode',
      'plan_comment_id',
      'review_comment_id',
      'slice_bootstrap_file',"""
          if old not in s:
              raise SystemExit('first input anchor missing')
          s=s.replace(old,new,1)
          old2="""      'source_run_id',
      'slice_id',"""
          new2="""      'source_run_id',
      'slice_id',
      'user_gate_comment_id',"""
          if old2 not in s:
              raise SystemExit('second input anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/kodjo/publication-security.pilot.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/kodjo/publication-security.pilot.js
          git commit -m 'test(kodjo): authorize implementation gate dispatch inputs'
          git push origin HEAD:fix/v2-plan-consumption-lifecycle-20260917
