name: KODJO V2 — Slice Plan Revision
run-name: KODJO V2 / PLAN / ${{ github.event.comment.id || inputs.targeted_validation_comment_id }}

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue carrying the scoped validation evidence
        required: true
        type: string
      targeted_validation_comment_id:
        description: Immutable targeted checkpoint to replay before full requalification
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: kodjo-openai-planning
  cancel-in-progress: false

jobs:
  plan:
    if: (github.event_name == 'issue_comment' && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_PLAN_REVISION')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Replay targeted validation before full requalification
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGETED_CHECKPOINT: ${{ inputs.targeted_validation_comment_id }}
        run: |
          set -euo pipefail
          node scripts/kodjo/targeted-requalification.js resolve "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "$TARGETED_CHECKPOINT" "$RUNNER_TEMP/requalification-trigger.txt"
          {
            echo 'TRIGGER_BODY<<KODJO_REQUALIFICATION_EVENT'
            cat "$RUNNER_TEMP/requalification-trigger.txt"
            echo KODJO_REQUALIFICATION_EVENT
          } >> "$GITHUB_ENV"

      - name: Validate immutable V2 planning gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          SLICE_ID=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^slice_id=//p' | head -n1)
          BOOTSTRAP_PATH=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^bootstrap_path=//p' | head -n1)
          SOURCE_HEAD=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^source_head=//p' | head -n1)
          APPLICATION_PR=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^application_pr=//p' | head -n1)
          APPLICATION_HEAD=$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^application_head=//p' | head -n1)
          test -n "$SLICE_ID"
          test "$BOOTSTRAP_PATH" = ".github/orchestration/v2-slices/$SLICE_ID/slice-bootstrap.json"
          printf '%s' "$SOURCE_HEAD" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$APPLICATION_PR" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$APPLICATION_HEAD" | grep -Eq '^[0-9a-f]{40}$'
          test -f "$BOOTSTRAP_PATH"
          SLICE_DIR=$(dirname "$BOOTSTRAP_PATH")
          PLAN_PATH="$SLICE_DIR/technical-plan.md"
          REVIEW_PATH="$SLICE_DIR/independent-review.md"
          MISSION_PATH="$SLICE_DIR/planning-mission.md"
          test -f "$PLAN_PATH"
          test -f "$REVIEW_PATH"
          test -f "$MISSION_PATH"
          grep -Eq '^Verdict[[:space:]]*:[[:space:]]*`?APPROVED`?[[:space:]]*$' "$REVIEW_PATH"
          export SLICE_ID BOOTSTRAP_PATH SOURCE_HEAD ISSUE_NUMBER
          node <<'NODE' > /tmp/kodjo-v2-gate.env
          const fs = require('node:fs');
          const b = JSON.parse(fs.readFileSync(process.env.BOOTSTRAP_PATH, 'utf8').replace(/^\uFEFF/, ''));
          if (!String(b.schema_version || '').startsWith('kodjo.protocol.v2.slice-bootstrap.')) throw new Error('V2_BOOTSTRAP_SCHEMA_REFUSED');
          if (b.slice_id !== process.env.SLICE_ID) throw new Error('V2_BOOTSTRAP_SLICE_MISMATCH');
          if (b.repository !== process.env.GITHUB_REPOSITORY) throw new Error('V2_BOOTSTRAP_REPOSITORY_MISMATCH');
          if (Number(b.issue_number) !== Number(process.env.ISSUE_NUMBER)) throw new Error('V2_BOOTSTRAP_ISSUE_MISMATCH');
          if (!b.target_branch) throw new Error('V2_BOOTSTRAP_TARGET_MISSING');
          if (!Array.isArray(b.product_sources) || b.product_sources.length === 0) throw new Error('V2_BOOTSTRAP_SOURCES_MISSING');
          const registry = JSON.parse(fs.readFileSync(b.activation_registry, 'utf8').replace(/^\uFEFF/, ''));
          const active = (registry.activations || []).filter(x => x && x.slice_id === b.slice_id);
          if (active.length !== 1 || active[0].status !== 'ACTIVE') throw new Error('V2_SLICE_NOT_ACTIVE');
          process.stdout.write('target_branch=' + b.target_branch + '\n');
          NODE
          source /tmp/kodjo-v2-gate.env
          ACTUAL=$(node scripts/kodjo/resolve-private-head.js "$GITHUB_REPOSITORY" "$target_branch")
          node scripts/kodjo/verify-plan-review-transition.js "$SOURCE_HEAD" "$ACTUAL" "$BOOTSTRAP_PATH" /tmp/kodjo-v2-plan-transition.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$APPLICATION_PR" > /tmp/kodjo-v2-application-pr.json
          test "$(jq -r .state /tmp/kodjo-v2-application-pr.json)" = open
          test "$(jq -r .head.sha /tmp/kodjo-v2-application-pr.json)" = "$APPLICATION_HEAD"
          test "$(jq -r .base.ref /tmp/kodjo-v2-application-pr.json)" = "$target_branch"
          PLAN_OID=$(git rev-parse "$SOURCE_HEAD:$PLAN_PATH")
          REVIEW_OID=$(git rev-parse "$SOURCE_HEAD:$REVIEW_PATH")
          printf 'slice_id=%s\nbootstrap_path=%s\nsource_head=%s\nprotocol_execution_head=%s\napplication_pr=%s\napplication_head=%s\ntarget_branch=%s\nplan_path=%s\nreview_path=%s\nmission_path=%s\nplan_oid=%s\nreview_oid=%s\n' "$SLICE_ID" "$BOOTSTRAP_PATH" "$SOURCE_HEAD" "$ACTUAL" "$APPLICATION_PR" "$APPLICATION_HEAD" "$target_branch" "$PLAN_PATH" "$REVIEW_PATH" "$MISSION_PATH" "$PLAN_OID" "$REVIEW_OID" >> "$GITHUB_OUTPUT"

      - name: Install isolated planning tokenizer
        run: npm ci --prefix scripts/kodjo/openai-runtime --ignore-scripts --no-audit --no-fund

      - name: Build authoritative V2 planning packet
        shell: bash
        env:
          BOOTSTRAP_PATH: ${{ steps.gate.outputs.bootstrap_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
          PLAN_PATH: ${{ steps.gate.outputs.plan_path }}
          REVIEW_PATH: ${{ steps.gate.outputs.review_path }}
          MISSION_PATH: ${{ steps.gate.outputs.mission_path }}
          APPLICATION_PR: ${{ steps.gate.outputs.application_pr }}
          COMMAND_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/kodjo-v2-plan
          mkdir -p /tmp/kodjo-v2-plan
          git worktree add --detach /tmp/kodjo-v2-plan/source "$SOURCE_HEAD"
          if git cat-file -e "$APPLICATION_HEAD^{commit}" 2>/dev/null; then
            git worktree add --detach /tmp/kodjo-v2-plan/application "$APPLICATION_HEAD"
          else
            gh repo clone "$GITHUB_REPOSITORY" /tmp/kodjo-v2-plan/application -- --no-checkout --filter=blob:none
            git -C /tmp/kodjo-v2-plan/application fetch --quiet origin "$APPLICATION_HEAD"
            git -C /tmp/kodjo-v2-plan/application checkout --quiet --detach "$APPLICATION_HEAD"
          fi
          cp "$BOOTSTRAP_PATH" /tmp/kodjo-v2-plan/slice-bootstrap.json
          cp "$PLAN_PATH" /tmp/kodjo-v2-plan/prior-technical-plan.md
          cp "$REVIEW_PATH" /tmp/kodjo-v2-plan/prior-independent-review.md
          cp "$MISSION_PATH" /tmp/kodjo-v2-plan/planning-mission.md
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > /tmp/kodjo-v2-plan/issue.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" | jq -s add > /tmp/kodjo-v2-plan/comments.json
          jq -r '.product_sources[].path' /tmp/kodjo-v2-plan/slice-bootstrap.json > /tmp/kodjo-v2-plan/sources.list
          : > /tmp/kodjo-v2-plan/product-evidence.txt
          while IFS= read -r file; do
            test -f "/tmp/kodjo-v2-plan/source/$file"
            printf '\n===== %s =====\n' "$file" >> /tmp/kodjo-v2-plan/product-evidence.txt
            cat "/tmp/kodjo-v2-plan/source/$file" >> /tmp/kodjo-v2-plan/product-evidence.txt
          done < /tmp/kodjo-v2-plan/sources.list
          git -C /tmp/kodjo-v2-plan/application ls-files app src > /tmp/kodjo-v2-plan/code-files.txt
          node scripts/kodjo/build-planning-context.js /tmp/kodjo-v2-plan
          test -z "$(git -C /tmp/kodjo-v2-plan/source status --porcelain --untracked-files=all)"
          test -z "$(git -C /tmp/kodjo-v2-plan/application status --porcelain --untracked-files=all)"

      - name: Construct V2 plan draft with OpenAI
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          cat > /tmp/kodjo-v2-plan/draft-prompt.txt <<EOF
          You are the KODJO V2 plan builder for $SLICE_ID. Revise the existing plan against immutable product HEAD $SOURCE_HEAD, protocol execution HEAD $PROTOCOL_EXECUTION_HEAD and exact application HEAD $APPLICATION_HEAD. The source-to-execution transition is proven protocol-only. This phase is READ-ONLY: never modify repository files and never implement.
          The V2 slice bootstrap, planning mission, current product sources, Issue, selected base plan and its latest independent review supplied below are authoritative. Preserve validated product decisions. Do not invent a V1 manifest, reuse a V1 slice contract or extend the functional scope.
          Targeted validation evidence certifies only its delta; never infer global conformity, implementation, merge or closure authorization. Keep all narrative sections in French.
          Declare every application module that the revised implementation would CREATE or MODIFY in exactly one block:
          <KODJO_MODIFIED_MODULES_JSON>
          [{"path":"relative/posix/path.ts","change":"MODIFY|CREATE"}]
          </KODJO_MODIFIED_MODULES_JSON>
          Use repository-relative POSIX paths only. This is a draft pending the deterministic direct-import scan.
          Preserve or rebuild exactly one <KODJO_UI_CRITERIA_MATRIX_JSON> block with schema kodjo.ui-criteria.v1. UI requirements must remain atomic and traceable to their current normative source; search existing components before proposing CREATE and explicitly classify PRESERVE / CHANGE / FORBIDDEN. The final closure prompt will revalidate this block.
          EOF
          if [ -f "$RUNNER_TEMP/requalification-trigger.txt.proof.json" ]; then
            echo "FULL SLICE REQUALIFICATION REQUIRED. Audit every normative requirement; the targeted proof is not global approval." >> /tmp/kodjo-v2-plan/draft-prompt.txt
          fi
          cat /tmp/kodjo-v2-plan/canonical-context.txt >> /tmp/kodjo-v2-plan/draft-prompt.txt
          node scripts/kodjo/generate-ui-plan-contract.js request draft /tmp/kodjo-v2-plan/draft-prompt.txt /tmp/kodjo-v2-plan/draft-request.json
          node scripts/kodjo/openai-plan-request.js /tmp/kodjo-v2-plan/draft-request.json /tmp/kodjo-v2-plan/draft-response.json /tmp/kodjo-v2-plan/draft-api-evidence.json /tmp/kodjo-v2-plan/api-pacing.json
          test "$(jq -r '.status // "missing"' /tmp/kodjo-v2-plan/draft-response.json)" = completed
          node scripts/kodjo/generate-ui-plan-contract.js decode draft /tmp/kodjo-v2-plan/draft-response.json /tmp/kodjo-v2-plan/plan-draft.md

      - name: Close direct-import roots and assemble opposable V2 plan
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
        run: |
          set -euo pipefail
          node scripts/kodjo/scan-plan-impact.js extract-modules /tmp/kodjo-v2-plan/plan-draft.md /tmp/kodjo-v2-plan/modified-modules.json
          node scripts/kodjo/validate-plan-module-paths.js "$APPLICATION_HEAD" /tmp/kodjo-v2-plan/modified-modules.json /tmp/kodjo-v2-plan/application
          rm -f /tmp/kodjo-v2-plan/technical-plan.md
          for iteration in 1 2 3 4; do
            (cd /tmp/kodjo-v2-plan/application && node "$GITHUB_WORKSPACE/scripts/kodjo/scan-plan-impact.js" scan "$APPLICATION_HEAD" /tmp/kodjo-v2-plan/modified-modules.json /tmp/kodjo-v2-plan/direct-import-scan.json)
            node -e "const fs=require('node:fs');const {sha256}=require('./scripts/kodjo/lib/plan-impact');process.stdout.write(sha256(JSON.parse(fs.readFileSync(process.argv[1],'utf8')))+'\n')" /tmp/kodjo-v2-plan/direct-import-scan.json > /tmp/kodjo-v2-plan/direct-import-scan.sha256
            cat > /tmp/kodjo-v2-plan/final-prompt.txt <<'EOF'
          Produce the complete final KODJO V2 technical plan from the supplied draft, structured review findings and deterministic direct-import scan.
          The scan path set is authoritative. Classify each supplied candidate semantically; never invent, rename or freely recopy a candidate path.
          If a direct consumer is classified MODIFY, the workflow may promote it into modified_modules and replay the bounded closure. Do not infer paths outside the current scan.
          Preserve every validated requirement, criterion, assertion, file choice and test binding that is not targeted by a blocking REVIEW_FINDING or a concretely demonstrated dependency expansion.
          Every non-UI functional/data/technical/migration/preservation requirement must be represented in non_ui_requirements, with exact source locator, in-scope targets, tests, proof_required and clarification state.
          Every unresolved ambiguity must be represented in clarifications. Do not hide an ambiguity in prose.
          The UI matrix must use the current atomic contract. Each independently falsifiable UI invariant gets its own assertion sourced from the normative material. Do not invent geometry, style or interaction details absent from Figma/tokens/decisions.
          Every test obligation must be bound to an exact repository path. Every new test must use CREATE and an allowed repository location.
          The workflow derives scope_allow, stable requirement IDs, requirement/test/boundary contracts and final plan status mechanically.
          Keep narrative sections in French and do not emit KODJO machine tags yourself.
          EOF            cat /tmp/kodjo-v2-plan/current-command.txt >> /tmp/kodjo-v2-plan/final-prompt.txt
            printf '\n===== DRAFT %s — CLOSURE ITERATION %s =====\n' "$SLICE_ID" "$iteration" >> /tmp/kodjo-v2-plan/final-prompt.txt
            cat /tmp/kodjo-v2-plan/plan-draft.md >> /tmp/kodjo-v2-plan/final-prompt.txt
            printf '\n===== DETERMINISTIC DIRECT IMPORT SCAN =====\n' >> /tmp/kodjo-v2-plan/final-prompt.txt
            cat /tmp/kodjo-v2-plan/direct-import-scan.json >> /tmp/kodjo-v2-plan/final-prompt.txt
            printf '\nSCAN_SHA256=' >> /tmp/kodjo-v2-plan/final-prompt.txt
            cat /tmp/kodjo-v2-plan/direct-import-scan.sha256 >> /tmp/kodjo-v2-plan/final-prompt.txt
            node scripts/kodjo/generate-ui-plan-contract.js request final /tmp/kodjo-v2-plan/final-prompt.txt "/tmp/kodjo-v2-plan/final-request-$iteration.json" /tmp/kodjo-v2-plan/direct-import-scan.json
            node scripts/kodjo/openai-plan-request.js "/tmp/kodjo-v2-plan/final-request-$iteration.json" "/tmp/kodjo-v2-plan/final-response-$iteration.json" "/tmp/kodjo-v2-plan/final-api-evidence-$iteration.json" /tmp/kodjo-v2-plan/api-pacing.json
            test "$(jq -r '.status // "missing"' "/tmp/kodjo-v2-plan/final-response-$iteration.json")" = completed
            node scripts/kodjo/generate-ui-plan-contract.js decode final "/tmp/kodjo-v2-plan/final-response-$iteration.json" /tmp/kodjo-v2-plan/technical-plan-with-decisions.md /tmp/kodjo-v2-plan/direct-import-scan.json
            node scripts/kodjo/assemble-plan-impact.js close /tmp/kodjo-v2-plan/technical-plan-with-decisions.md /tmp/kodjo-v2-plan/direct-import-scan.json /tmp/kodjo-v2-plan/plan-impact-closure.json
            if jq -e '.closed == true' /tmp/kodjo-v2-plan/plan-impact-closure.json >/dev/null; then
              node scripts/kodjo/assemble-plan-impact.js assemble /tmp/kodjo-v2-plan/technical-plan-with-decisions.md /tmp/kodjo-v2-plan/direct-import-scan.json /tmp/kodjo-v2-plan/technical-plan.md
              break
            fi
            jq '.modified_modules' /tmp/kodjo-v2-plan/plan-impact-closure.json > /tmp/kodjo-v2-plan/modified-modules.json
            if test "$iteration" = 4; then
              echo 'PLAN_SCOPE_NOT_CLOSED_BOUND: fermeture non atteinte apres 4 scans' >&2
              exit 1
            fi
          done
          test -f /tmp/kodjo-v2-plan/technical-plan.md
          node scripts/kodjo/verify-ui-plan-criteria.js /tmp/kodjo-v2-plan/technical-plan.md "$APPLICATION_HEAD" /tmp/kodjo-v2-plan/application /tmp/kodjo-v2-plan/ui-plan-contract.json
          printf "\n<KODJO_UI_PLAN_CONTRACT_JSON>\n" >> /tmp/kodjo-v2-plan/technical-plan.md
          cat /tmp/kodjo-v2-plan/ui-plan-contract.json >> /tmp/kodjo-v2-plan/technical-plan.md
          printf "</KODJO_UI_PLAN_CONTRACT_JSON>\n" >> /tmp/kodjo-v2-plan/technical-plan.md
          node scripts/kodjo/verify-plan-contract-consistency.js /tmp/kodjo-v2-plan/technical-plan.md "$APPLICATION_HEAD" /tmp/kodjo-v2-plan/application /tmp/kodjo-v2-plan/plan-contract.json
          printf "\n<KODJO_PLAN_CONTRACT_JSON>\n" >> /tmp/kodjo-v2-plan/technical-plan.md
          cat /tmp/kodjo-v2-plan/plan-contract.json >> /tmp/kodjo-v2-plan/technical-plan.md
          printf "</KODJO_PLAN_CONTRACT_JSON>\n" >> /tmp/kodjo-v2-plan/technical-plan.md
          (cd /tmp/kodjo-v2-plan/application && node "$GITHUB_WORKSPACE/scripts/kodjo/verify-plan-impact.js" /tmp/kodjo-v2-plan/technical-plan.md "$APPLICATION_HEAD" /tmp/kodjo-v2-plan/plan-impact-replay.json)
          grep -Fxq 'PLAN_STATUS: READY_FOR_INDEPENDENT_REVIEW' /tmp/kodjo-v2-plan/technical-plan.md
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish candidate V2 plan
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          BOOTSTRAP_PATH: ${{ steps.gate.outputs.bootstrap_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
          APPLICATION_PR: ${{ steps.gate.outputs.application_pr }}
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
          PLAN_OID: ${{ steps.gate.outputs.plan_oid }}
          REVIEW_OID: ${{ steps.gate.outputs.review_oid }}
        run: |
          set -euo pipefail
          {
            echo '[KODJO_V2] PLAN_OUTPUT'
            echo "slice_id=$SLICE_ID"
            echo "bootstrap_path=$BOOTSTRAP_PATH"
            echo "source_head=$SOURCE_HEAD"
            echo "protocol_execution_head=$PROTOCOL_EXECUTION_HEAD"
            echo "application_pr=$APPLICATION_PR"
            echo "application_head=$APPLICATION_HEAD"
            echo "supersedes_plan_blob_oid=$PLAN_OID"
            echo "prior_review_blob_oid=$REVIEW_OID"
            echo "planning_context_sha256=$(jq -r .sha256 /tmp/kodjo-v2-plan/context-manifest.json)"
            jq -r '.selection[] | select(.role == "BASE_PLAN" or .role == "INDEPENDENT_REVIEW" or .role == "RESUMED_COMMAND") | (.role | ascii_downcase) + "_comment_id=" + .id' /tmp/kodjo-v2-plan/context-manifest.json
            echo 'planning_contract=kodjo.plan-impact.v1'
            echo 'ui_planning_contract=kodjo.ui-plan-criteria.v1'
            echo 'STATUT : PLAN_READY_FOR_INDEPENDENT_REVIEW'
            echo
            cat /tmp/kodjo-v2-plan/technical-plan.md
            echo
            echo '<KODJO_PLAN_TRANSITION_JSON>'
            cat /tmp/kodjo-v2-plan-transition.json
            echo '</KODJO_PLAN_TRANSITION_JSON>'
          } > /tmp/kodjo-v2-plan/out.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/kodjo-v2-plan/out.md

      - name: Preserve V2 planning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-slice-plan-${{ github.run_id }}
          path: |
            /tmp/kodjo-v2-plan/*api-evidence*.json
            /tmp/kodjo-v2-plan/context-manifest.json
            /tmp/kodjo-v2-plan/context-error.json
            /tmp/kodjo-v2-plan/slice-bootstrap.json
            /tmp/kodjo-v2-plan/planning-mission.md
            /tmp/kodjo-v2-plan/prior-technical-plan.md
            /tmp/kodjo-v2-plan/prior-independent-review.md
            /tmp/kodjo-v2-plan/plan-draft.md
            /tmp/kodjo-v2-plan/modified-modules.json
            /tmp/kodjo-v2-plan/direct-import-scan.json
            /tmp/kodjo-v2-plan/direct-import-scan.sha256
            /tmp/kodjo-v2-plan/technical-plan-with-decisions.md
            /tmp/kodjo-v2-plan/plan-impact-closure.json
            /tmp/kodjo-v2-plan/technical-plan.md
            /tmp/kodjo-v2-plan/plan-impact-replay.json
            /tmp/kodjo-v2-plan/plan-contract.json
            /tmp/kodjo-v2-plan/ui-plan-contract.json
            /tmp/kodjo-v2-plan-transition.json
          if-no-files-found: warn
          retention-days: 14
