name: Claude T01-S09 Plan Revision V1.3 [TEMPORAIRE]
run-name: T01-S09 — révision du plan V1.3
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  revise-plan:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == 'MyUncried' &&
      github.event.issue.number == 17 &&
      contains(github.event.comment.body, '@claude-t01-s09-plan-revision-v1-3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creation-seance-catalogue
          fetch-depth: 0
      - name: Preflight and fresh compact GitHub context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kodjo-context
          test "$(git branch --show-current)" = "feat/creation-seance-catalogue"
          HEAD_SHA=$(git rev-parse HEAD)
          git status --porcelain > /tmp/kodjo-context/git-status.txt
          test ! -s /tmp/kodjo-context/git-status.txt
          gh api repos/${{ github.repository }}/issues/17 > /tmp/kodjo-context/issue.json
          jq -e '.number == 17 and .state == "open"' /tmp/kodjo-context/issue.json >/dev/null
          gh api --paginate repos/${{ github.repository }}/issues/17/comments \
            | jq '[.[] | {id, user:.user.login, body}] | .[-12:]' \
            > /tmp/kodjo-context/review-delta.json
          jq -e 'length > 0 and any(.[]; .id == 5460923036) and any(.[]; .id == 5460904461)' /tmp/kodjo-context/review-delta.json >/dev/null
          printf 'repository=%s\nissue=17\nbranch=%s\nhead=%s\nmode=CLOUD_READ_ONLY\nwriter=NONE\n' \
            "${{ github.repository }}" "$(git branch --show-current)" "$HEAD_SHA" > /tmp/kodjo-context/SOURCE_ATTESTATION
          sha256sum /tmp/kodjo-context/issue.json /tmp/kodjo-context/review-delta.json > /tmp/kodjo-context/SHA256SUMS
      - name: Run Claude plan revision
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            KODJO — T01-S09 — reprise V1.3. Phase strictement en lecture seule.

            Le transport GitHub a matérialisé dans `/tmp/kodjo-context` SOURCE_ATTESTATION, issue.json, SHA256SUMS et un review-delta.json FRAIS contenant les 12 derniers commentaires. Lis-les. Les décisions/revues les plus récentes supersèdent les formulations antérieures incompatibles. Ne tente aucun accès réseau et ne refais pas les contrôles GitHub déterministes.

            Lis `.github/AI_ORCHESTRATION.md` et `.github/AI_ORCHESTRATION_CONTINUITY.md` V1.3. Corrige exclusivement le dernier point de revue ChatGPT 5460923036, en tenant compte des décisions 5460885591 et 5460904461 : pour l'unicité d'une Catégorie, la clé de comparaison ignore casse ET accents/diacritiques ; le nom visible conserve la saisie normalisée pour les espaces ; aucune correction orthographique, fuzzy matching ou suggestion n'est dans le MVP (report V2). `Étirements`, `Etirements`, `ÉTIREMENTS`, `etirements` doivent donc produire la même clé de comparaison.

            Ne rouvre aucun point déjà résolu sans nouvelle source contradictoire. Produis le plan complet finalisé ou, seulement si une nouvelle barrière nécessaire et démontrée subsiste, la barrière exacte. Ne modifie aucun fichier métier, branche, commit, Issue ou PR. Ne lance pas de sous-agent.

            Le champ JSON `message` doit contenir le commentaire complet, préfixé `[Claude Code] T01-S09 — PLAN FINAL V1.3`, et finir exactement par `STATUT : PLAN_READY_FOR_REVIEW` ou `STATUT : CLARIFICATION_REQUIRED` ou `STATUT : WORKTREE_LOCKED` ou `STATUT : ORCHESTRATION_FAILURE`.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(git:*),Bash(ls:*),Bash(find:*),Bash(rg:*),Bash(sed:*),Bash(head:*),Bash(wc:*),Bash(file:*),Bash(jq:*),Bash(cat:*)"
            --json-schema '{"type":"object","properties":{"message":{"type":"string"}},"required":["message"]}'
      - name: Publish result
        if: always()
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MESSAGE=$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.message // empty')
          if [ -z "$MESSAGE" ]; then
            MESSAGE="[Claude Code] T01-S09 — ORCHESTRATION_FAILURE run ${{ github.run_id }} : structured_output absent ou invalide. Aucune décision produit déduite. STATUT : ORCHESTRATION_FAILURE"
          fi
          printf '%s\n' "$MESSAGE" | gh issue comment 17 --repo "${{ github.repository }}" --body-file -
