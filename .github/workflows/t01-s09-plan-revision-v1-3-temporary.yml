name: Claude T01-S09 Plan Revision V1.3 [TEMPORAIRE]
run-name: T01-S09 — révision du plan V1.3
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  revise-plan:
    if: >
      github.event.issue.number == 17 &&
      contains(github.event.comment.body, '@claude-t01-s09-plan-revision-v1-3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creation-seance-catalogue
          fetch-depth: 0
      - name: Preflight and compact GitHub context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kodjo-context
          test "$(git branch --show-current)" = "feat/creation-seance-catalogue"
          HEAD_SHA=$(git rev-parse HEAD)
          git status --porcelain > /tmp/kodjo-context/git-status.txt
          test ! -s /tmp/kodjo-context/git-status.txt
          gh api repos/${{ github.repository }}/issues/17 > /tmp/kodjo-context/issue.json
          jq -e '.number == 17 and .state == "open"' /tmp/kodjo-context/issue.json >/dev/null
          gh api --paginate repos/${{ github.repository }}/issues/17/comments \
            | jq '[.[] | select(.id == 5457279488 or .id == 5458067685 or .id == 5458207233 or .id == 5460790062) | {id, user:.user.login, body}]' \
            > /tmp/kodjo-context/review-delta.json
          jq -e 'length == 4' /tmp/kodjo-context/review-delta.json >/dev/null
          printf 'repository=%s\nissue=17\nbranch=%s\nhead=%s\nmode=CLOUD_READ_ONLY\nwriter=NONE\n' \
            "${{ github.repository }}" "$(git branch --show-current)" "$HEAD_SHA" > /tmp/kodjo-context/SOURCE_ATTESTATION
          sha256sum /tmp/kodjo-context/issue.json /tmp/kodjo-context/review-delta.json > /tmp/kodjo-context/SHA256SUMS
      - name: Run Claude plan revision
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            KODJO — T01-S09 — reprise V1.3 après arbitrage. Phase strictement en lecture seule.

            Le transport GitHub a matérialisé dans `/tmp/kodjo-context` :
            - `SOURCE_ATTESTATION` : dépôt, Issue, branche, HEAD, mode et écrivain ;
            - `issue.json` : Issue #17 courante ;
            - `review-delta.json` : plan initial 5457279488, revue ChatGPT 5458067685, plan révisé 5458207233 et arbitrage utilisateur 5460790062 ;
            - `SHA256SUMS` : empreintes calculées par le transport.
            Lis ces fichiers. Ne tente aucun accès réseau et ne refais pas les contrôles GitHub déterministes.

            Lis `.github/AI_ORCHESTRATION.md` et `.github/AI_ORCHESTRATION_CONTINUITY.md` V1.3. Reprends le plan révisé en intégrant l'arbitrage utilisateur : unicité des noms de Catégorie insensible à la casse, casse saisie conservée pour l'affichage, aucune capitalisation automatique. Ne définis pas d'équivalence supplémentaire non arbitrée.

            Les autres corrections de la revue restent celles déjà résolues dans le plan révisé 5458207233 : ordre personnalisé non contractuel ; pas d'invention de rendu d'erreur ; auto-sélection sourcée ; badges Catalogue hors tranche ; aucune longueur maximale/D-097 inventée.

            Produis un plan complet finalisé ou, seulement si une nouvelle barrière nécessaire et démontrée subsiste, la barrière exacte. Ne modifie aucun fichier, branche, commit, Issue ou PR. Aucun fichier métier ne doit être écrit. Ne lance pas de sous-agent.

            Le champ JSON `message` doit contenir le commentaire complet, préfixé `[Claude Code] T01-S09 — PLAN FINAL V1.3`, et finir exactement par `STATUT : PLAN_READY_FOR_REVIEW` ou `STATUT : CLARIFICATION_REQUIRED` ou `STATUT : WORKTREE_LOCKED` ou `STATUT : ORCHESTRATION_FAILURE`.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(git:*),Bash(ls:*),Bash(find:*),Bash(rg:*),Bash(sed:*),Bash(head:*),Bash(wc:*),Bash(file:*),Bash(jq:*),Bash(cat:*)"
            --json-schema '{"type":"object","properties":{"message":{"type":"string"}},"required":["message"]}'
      - name: Publish result
        if: always()
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MESSAGE=$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.message // empty')
          if [ -z "$MESSAGE" ]; then
            MESSAGE="[Claude Code] T01-S09 — ORCHESTRATION_FAILURE run ${{ github.run_id }} : structured_output absent ou invalide. Aucune décision produit déduite. STATUT : ORCHESTRATION_FAILURE"
          fi
          printf '%s\n' "$MESSAGE" | gh issue comment 17 --repo "${{ github.repository }}" --body-file -
