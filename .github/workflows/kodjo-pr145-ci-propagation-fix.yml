name: KODJO PR145 CI propagation repair

on:
  push:
    branches:
      - protocol/visual-correction-structural-hardening-20260915

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'MyUncried' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: protocol/visual-correction-structural-hardening-20260915
          fetch-depth: 0
      - name: Apply exact propagation fixes
        run: node scripts/kodjo/pr145-ci-propagation-fix.js
      - name: Verify targeted diff
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/kodjo-pr145-ci-propagation-fix.yml scripts/kodjo/pr145-ci-propagation-fix.js tests/kodjo/protocol-0.6.22.pilot.js tests/kodjo/queue-contract.pilot.js "
      - name: Commit repaired branch
        run: |
          git config user.name "KODJO Protocol Repair"
          git config user.email "kodjo-protocol@users.noreply.github.com"
          git add -A
          git commit -m "test(protocol): propagate visual hardening invariants"
          git push origin HEAD:protocol/visual-correction-structural-hardening-20260915
