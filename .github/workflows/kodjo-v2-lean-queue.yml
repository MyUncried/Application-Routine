name: KODJO V2 Lean Queue

on:
  push:
    branches: [main]
    paths:
      - '.github/orchestration/queue/v2/*.json'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: kodjo-v2-lean-windows
  cancel-in-progress: false

jobs:
  execute:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 90
    env:
      KODJO_INFRA_METRICS_FILE: ${{ runner.temp }}/kodjo-v2-infrastructure-${{ github.run_id }}-${{ github.run_attempt }}.json
    defaults:
      run:
        shell: powershell
        working-directory: _kodjo/${{ github.run_id }}
    steps:
      - name: Start infrastructure measurement
        continue-on-error: true
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $kodjoRoot = Join-Path '${{ github.workspace }}' '_kodjo'
          $count = @(Get-ChildItem -LiteralPath $kodjoRoot -Directory -ErrorAction SilentlyContinue).Count
          $driveRoot = [IO.Path]::GetPathRoot('${{ github.workspace }}')
          $free = (New-Object IO.DriveInfo -ArgumentList $driveRoot).AvailableFreeSpace
          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "KODJO_CHECKOUT_STARTED_MS=$started`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "KODJO_CHECKOUT_COUNT_BEFORE=$count`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "KODJO_VOLUME_FREE_BYTES_BEFORE=$free`n", $utf8NoBom)

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
          # Le runner est persistant : ne jamais checkout dans son répertoire racine.
          path: _kodjo/${{ github.run_id }}

      - name: Finish checkout measurement
        continue-on-error: true
        run: node scripts/kodjo/record-infrastructure-metric.js init $env:KODJO_INFRA_METRICS_FILE $env:KODJO_CHECKOUT_STARTED_MS $env:KODJO_CHECKOUT_COUNT_BEFORE $env:KODJO_VOLUME_FREE_BYTES_BEFORE '${{ github.workspace }}/_kodjo/${{ github.run_id }}'

      - name: Prepare checkout cleanup utility
        shell: powershell
        run: Copy-Item -LiteralPath 'scripts/kodjo/cleanup-run-checkout.ps1' -Destination '${{ runner.temp }}/kodjo-cleanup-${{ github.run_id }}-${{ github.run_attempt }}.ps1' -Force

      - name: Initialize current run diagnostic
        run: node scripts/kodjo/initialize-run-diagnostic.js

      - name: Enable Windows long paths
        shell: powershell
        run: git config --global core.longpaths true

      # KV2-03 : paquet de reprise du run source, quand la demande en declare un.
      - name: Resolve recovery source run
        id: recovery_source
        env:
          KODJO_EVENT_BEFORE: ${{ github.event.before }}
          KODJO_EVENT_AFTER: ${{ github.event.after }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $runId = & node scripts/kodjo/resolve-recovery-source.js $env:KODJO_EVENT_BEFORE $env:KODJO_EVENT_AFTER
          if ($LASTEXITCODE -ne 0) { $runId = ''; $global:LASTEXITCODE = 0 }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "run_id=$runId`n", (New-Object Text.UTF8Encoding($false)))

      - name: Download recovery package of the source run
        if: steps.recovery_source.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kodjo-v2-recovery-${{ steps.recovery_source.outputs.run_id }}-1
          path: ${{ runner.temp }}/kodjo-source-recovery
          github-token: ${{ github.token }}
          run-id: ${{ steps.recovery_source.outputs.run_id }}

      - name: Select and execute immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          KODJO_EVENT_BEFORE: ${{ github.event.before }}
          KODJO_EVENT_AFTER: ${{ github.event.after }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          KODJO_SOURCE_RECOVERY_DIR: ${{ runner.temp }}/kodjo-source-recovery
          KODJO_CERTIFICATION_STOP_AFTER_RECOVERY: ${{ vars.KODJO_CERTIFICATION_STOP_AFTER_RECOVERY || '' }}
          # Verification des preuves GitHub obligatoire : une reaction absente,
          # illisible ou non verifiee bloque l'admission.
          KODJO_VERIFY_GITHUB: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          # KV2-10 : admission avant toute operation. Ajout seul, request_id unique,
          # relance de workflow refusee. Aucun etat local, aucune purge manuelle.
          $selected = & node scripts/kodjo/verify-queue-admission.js $env:KODJO_EVENT_BEFORE $env:KODJO_EVENT_AFTER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/kodjo/run-queued-request.ps1 -QueueFile $selected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # KV2-18 : le diagnostic ne remonte que le run courant. Le glob precedent
      # exportait l'historique de toutes les tranches presentes sur le runner.
      - name: Resolve current run diagnostic directory
        if: always()
        id: diag
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $dir = & node scripts/kodjo/resolve-run-directory.js
          if ($LASTEXITCODE -ne 0) { $dir = '' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "dir=$dir`n", (New-Object Text.UTF8Encoding($false)))

      - name: Preserve KODJO diagnostic
        if: always() && steps.diag.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.diag.outputs.dir }}/result.json
            ${{ steps.diag.outputs.dir }}/claude-stderr.txt
            ${{ steps.diag.outputs.dir }}/claude-output.json
            ${{ steps.diag.outputs.dir }}/invocation.json
          if-no-files-found: warn
          retention-days: 14

      # KV2-03 : le paquet de reprise quitte le disque du runner. Sans lui, une
      # reinstallation du runner detruisait definitivement le delta produit.
      - name: Preserve KODJO recovery package
        if: always() && steps.diag.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diag.outputs.dir }}/recovery-package/
          if-no-files-found: warn
          retention-days: ${{ vars.KODJO_RECOVERY_RETENTION_DAYS || 90 }}

      - name: Clean current run checkout
        if: always()
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $utility = Join-Path '${{ runner.temp }}' 'kodjo-cleanup-${{ github.run_id }}-${{ github.run_attempt }}.ps1'
          if (Test-Path -LiteralPath $utility -PathType Leaf) {
            & $utility -Root '${{ github.workspace }}/_kodjo/${{ github.run_id }}' -WorkspaceRoot '${{ github.workspace }}' -RunId '${{ github.run_id }}' -MetricsFile $env:KODJO_INFRA_METRICS_FILE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            # Le checkout peut échouer avant que l'utilitaire soit copié. Ce repli
            # autonome conserve les mêmes bornes d'identité et de tentatives.
            $runId = '${{ github.run_id }}'
            $workspace = [IO.Path]::GetFullPath('${{ github.workspace }}').TrimEnd('\')
            $kodjoRoot = [IO.Path]::GetFullPath((Join-Path $workspace '_kodjo')).TrimEnd('\')
            $root = [IO.Path]::GetFullPath((Join-Path $kodjoRoot $runId)).TrimEnd('\')
            $expected = [IO.Path]::GetFullPath('${{ github.workspace }}/_kodjo/${{ github.run_id }}').TrimEnd('\')
            if ($runId -notmatch '^[0-9]+$' -or $root -ne $expected -or [IO.Path]::GetDirectoryName($root) -ne $kodjoRoot) {
              throw 'RUN_CHECKOUT_IDENTITY_MISMATCH'
            }
            for ($attempt = 1; $attempt -le 5 -and (Test-Path -LiteralPath $root); $attempt++) {
              & cmd.exe /d /c rd /s /q $root
              if (Test-Path -LiteralPath $root) { Start-Sleep -Seconds 2 }
            }
            if (Test-Path -LiteralPath $root) { throw 'RUN_CHECKOUT_CLEANUP_FAILED' }
          }

      - name: Preserve infrastructure metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-infrastructure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KODJO_INFRA_METRICS_FILE }}
          if-no-files-found: warn
          retention-days: 90
