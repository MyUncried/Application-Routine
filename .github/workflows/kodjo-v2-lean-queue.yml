name: KODJO V2 Lean Queue

on:
  push:
    branches: [main]
    paths:
      - '.github/orchestration/queue/v2/*.json'
  # Lancement explicite sans PR technique : le commit courant doit ajouter
  # exactement une demande et son parent devient la borne "before".
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: kodjo-v2-lean-windows
  cancel-in-progress: false

jobs:
  execute:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
        working-directory: _kodjo/${{ github.run_id }}
    steps:
      - name: Start infrastructure measurement
        continue-on-error: true
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $metricsFile = Join-Path '${{ runner.temp }}' 'kodjo-v2-infrastructure-${{ github.run_id }}-${{ github.run_attempt }}.json'
          $kodjoRoot = Join-Path '${{ github.workspace }}' '_kodjo'
          $count = @(Get-ChildItem -LiteralPath $kodjoRoot -Directory -ErrorAction SilentlyContinue).Count
          $driveRoot = [IO.Path]::GetPathRoot('${{ github.workspace }}')
          $free = (New-Object IO.DriveInfo -ArgumentList $driveRoot).AvailableFreeSpace
          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "KODJO_INFRA_METRICS_FILE=$metricsFile`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "KODJO_CHECKOUT_STARTED_MS=$started`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "KODJO_CHECKOUT_COUNT_BEFORE=$count`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "KODJO_VOLUME_FREE_BYTES_BEFORE=$free`n", $utf8NoBom)

      - uses: actions/checkout@v4
        # Match Git blob bytes for strict prompt/package-lock attestations.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
          path: _kodjo/${{ github.run_id }}

      - name: Preserve blob line endings for subsequent source checkouts
        run: |
          git config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve immutable request boundary
        id: boundary
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $after = (& git rev-parse HEAD).Trim()
            $before = (& git rev-parse HEAD^).Trim()
          } else {
            $before = '${{ github.event.before }}'
            $after = '${{ github.event.after }}'
          }
          if ($before -notmatch '^[0-9a-f]{40}$' -or $after -notmatch '^[0-9a-f]{40}$') {
            throw 'INVALID_REQUEST_BOUNDARY'
          }
          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "before_sha=$before`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "after_sha=$after`n", $utf8NoBom)

      - name: Finish checkout measurement
        continue-on-error: true
        run: node scripts/kodjo/record-infrastructure-metric.js init $env:KODJO_INFRA_METRICS_FILE $env:KODJO_CHECKOUT_STARTED_MS $env:KODJO_CHECKOUT_COUNT_BEFORE $env:KODJO_VOLUME_FREE_BYTES_BEFORE '${{ github.workspace }}/_kodjo/${{ github.run_id }}'

      - name: Prepare checkout cleanup utility
        shell: powershell
        run: Copy-Item -LiteralPath 'scripts/kodjo/cleanup-run-checkout.ps1' -Destination '${{ runner.temp }}/kodjo-cleanup-${{ github.run_id }}-${{ github.run_attempt }}.ps1' -Force

      - name: Initialize current run diagnostic
        run: node scripts/kodjo/initialize-run-diagnostic.js

      - name: Enable Windows long paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Resolve recovery source run
        id: recovery_source
        env:
          KODJO_EVENT_BEFORE: ${{ steps.boundary.outputs.before_sha }}
          KODJO_EVENT_AFTER: ${{ steps.boundary.outputs.after_sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $runId = & node scripts/kodjo/resolve-recovery-source.js $env:KODJO_EVENT_BEFORE $env:KODJO_EVENT_AFTER
          if ($LASTEXITCODE -ne 0) { $runId = ''; $global:LASTEXITCODE = 0 }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "run_id=$runId`n", (New-Object Text.UTF8Encoding($false)))

      - name: Download recovery package of the source run
        if: steps.recovery_source.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kodjo-v2-recovery-${{ steps.recovery_source.outputs.run_id }}-1
          path: ${{ runner.temp }}/kodjo-source-recovery
          github-token: ${{ github.token }}
          run-id: ${{ steps.recovery_source.outputs.run_id }}

      - name: Preflight GitHub Actions artifact budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $inventory=Join-Path $env:RUNNER_TEMP ('kodjo-artifact-inventory-'+$env:GITHUB_RUN_ID+'.json')
          $raw=gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          if($LASTEXITCODE-ne0){throw 'Artifact inventory unavailable'}
          [IO.File]::WriteAllText($inventory,($raw -join "`n"),(New-Object Text.UTF8Encoding($false)))
          node scripts/kodjo/check-artifact-budget.js $inventory
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Select and execute immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          KODJO_EVENT_BEFORE: ${{ steps.boundary.outputs.before_sha }}
          KODJO_EVENT_AFTER: ${{ steps.boundary.outputs.after_sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          KODJO_SOURCE_RECOVERY_DIR: ${{ runner.temp }}/kodjo-source-recovery
          KODJO_VISUAL_DELIVERY_METADATA_FILE: ${{ runner.temp }}/kodjo-visual-delivery-${{ github.run_id }}-${{ github.run_attempt }}.json
          KODJO_IMPLEMENTATION_REVIEW_METADATA_FILE: ${{ runner.temp }}/kodjo-implementation-review-${{ github.run_id }}-${{ github.run_attempt }}.json
          KODJO_CERTIFICATION_STOP_AFTER_RECOVERY: ${{ vars.KODJO_CERTIFICATION_STOP_AFTER_RECOVERY || '' }}
          KODJO_VERIFY_GITHUB: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $selected = & node scripts/kodjo/verify-queue-admission.js $env:KODJO_EVENT_BEFORE $env:KODJO_EVENT_AFTER --selection-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preflight = Join-Path $env:RUNNER_TEMP ("kodjo-preflight-{0}-{1}.json" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          & node scripts/kodjo/verify-queue-preflight.js $selected $env:KODJO_EVENT_BEFORE $env:KODJO_EVENT_AFTER $preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/kodjo/run-queued-request.ps1 -QueueFile $selected -PreflightFile $preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve preflight attestation including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kodjo-preflight-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore

      - name: Resolve current run diagnostic directory
        if: always()
        id: diag
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $dir = & node scripts/kodjo/resolve-run-directory.js
          if ($LASTEXITCODE -ne 0) { $dir = '' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "dir=$dir`n", (New-Object Text.UTF8Encoding($false)))

      - name: Preserve KODJO diagnostic
        if: always() && steps.diag.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.diag.outputs.dir }}/preflight.json
            ${{ steps.diag.outputs.dir }}/result.json
            ${{ steps.diag.outputs.dir }}/claude-stderr.txt
            ${{ steps.diag.outputs.dir }}/claude-output.json
            ${{ steps.diag.outputs.dir }}/implementation-report.json
            ${{ steps.diag.outputs.dir }}/invocation.json
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve KODJO recovery package
        if: always() && steps.diag.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diag.outputs.dir }}/recovery-package/
          if-no-files-found: warn
          retention-days: 14

      # La métadonnée n'existe que lorsqu'une VISUAL_CORRECTION a été réellement
      # committée, poussée et observée sur la PR existante. Le publisher exige en
      # plus l'artefact de récupération du run courant avant de certifier le HEAD.
      - name: Publish visual application checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          KODJO_VISUAL_DELIVERY_METADATA_FILE: ${{ runner.temp }}/kodjo-visual-delivery-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: node scripts/kodjo/publish-visual-checkpoint.js

      - name: Dispatch validated implementation review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          KODJO_IMPLEMENTATION_REVIEW_METADATA_FILE: ${{ runner.temp }}/kodjo-implementation-review-${{ github.run_id }}-${{ github.run_attempt }}.json
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = [string]$env:KODJO_IMPLEMENTATION_REVIEW_METADATA_FILE
          if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw 'KODJO_IMPLEMENTATION_REVIEW_BRIDGE_METADATA_MISSING'
          }
          $meta = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$meta.schema_version -ne 'kodjo.protocol.v2.implementation-review-bridge.0.6.38') {
            throw 'KODJO_IMPLEMENTATION_REVIEW_BRIDGE_METADATA_SCHEMA_INVALID'
          }
          $payload = [ordered]@{
            event_type = 'kodjo_implementation_ready'
            client_payload = [ordered]@{
              issue_number = [string]$meta.issue_number
              source_comment_id = [string]$meta.source_comment_id
            }
          }
          $dispatchFile = Join-Path $env:RUNNER_TEMP ('kodjo-review-dispatch-' + $env:GITHUB_RUN_ID + '.json')
          [IO.File]::WriteAllText($dispatchFile, ($payload | ConvertTo-Json -Depth 4), (New-Object Text.UTF8Encoding($false)))
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/dispatches" --input $dispatchFile
          if ($LASTEXITCODE -ne 0) { throw 'KODJO_IMPLEMENTATION_REVIEW_DISPATCH_FAILED' }

      - name: Clean current run checkout
        if: always()
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $utility = Join-Path '${{ runner.temp }}' 'kodjo-cleanup-${{ github.run_id }}-${{ github.run_attempt }}.ps1'
          if (Test-Path -LiteralPath $utility -PathType Leaf) {
            & $utility -Root '${{ github.workspace }}/_kodjo/${{ github.run_id }}' -WorkspaceRoot '${{ github.workspace }}' -RunId '${{ github.run_id }}' -MetricsFile $env:KODJO_INFRA_METRICS_FILE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $runId = '${{ github.run_id }}'
            $workspace = [IO.Path]::GetFullPath('${{ github.workspace }}').TrimEnd('\')
            $kodjoRoot = [IO.Path]::GetFullPath((Join-Path $workspace '_kodjo')).TrimEnd('\')
            $root = [IO.Path]::GetFullPath((Join-Path $kodjoRoot $runId)).TrimEnd('\')
            $expected = [IO.Path]::GetFullPath('${{ github.workspace }}/_kodjo/${{ github.run_id }}').TrimEnd('\')
            if ($runId -notmatch '^[0-9]+$' -or $root -ne $expected -or [IO.Path]::GetDirectoryName($root) -ne $kodjoRoot) {
              throw 'RUN_CHECKOUT_IDENTITY_MISMATCH'
            }
            $cmdRoot = if ($root.StartsWith('\\?\')) { $root } else { '\\?\' + $root }
            for ($attempt = 1; $attempt -le 5 -and (Test-Path -LiteralPath $root); $attempt++) {
              $previousErrorActionPreference = $ErrorActionPreference
              try {
                $ErrorActionPreference = 'Continue'
                $output = & cmd.exe /d /c rd /s /q $cmdRoot 2>&1
                $exit = $LASTEXITCODE
              } finally {
                $ErrorActionPreference = $previousErrorActionPreference
              }
              if ($exit -ne 0 -or $output) {
                Write-Warning ('cleanup attempt {0}: cmd rd exit={1}: {2}' -f $attempt, $exit, ($output -join ' '))
              }
              if (Test-Path -LiteralPath $root) { Start-Sleep -Seconds 2 }
            }
            if (Test-Path -LiteralPath $root) { throw 'RUN_CHECKOUT_CLEANUP_FAILED' }
          }

      - name: Preserve infrastructure metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-infrastructure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KODJO_INFRA_METRICS_FILE }}
          if-no-files-found: warn
          retention-days: 7
