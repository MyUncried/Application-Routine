name: KODJO V2 Lean Queue

on:
  push:
    branches: [main]
    paths:
      - '.github/orchestration/queue/v2/*.json'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: kodjo-v2-lean-windows
  cancel-in-progress: false

jobs:
  execute:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    defaults:
      run:
        shell: powershell
        working-directory: _kodjo/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
          # Le runner est persistant : ne jamais checkout dans son répertoire racine.
          path: _kodjo/${{ github.run_id }}

      - name: Enable Windows long paths
        shell: powershell
        run: git config --global core.longpaths true

      # KV2-03 : paquet de reprise du run source, quand la demande en declare un.
      - name: Resolve recovery source run
        id: recovery_source
        env:
          KODJO_EVENT_BEFORE: ${{ github.event.before }}
          KODJO_EVENT_AFTER: ${{ github.event.after }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $runId = & node scripts/kodjo/resolve-recovery-source.js $env:KODJO_EVENT_BEFORE $env:KODJO_EVENT_AFTER
          if ($LASTEXITCODE -ne 0) { $runId = '' }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download recovery package of the source run
        if: steps.recovery_source.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kodjo-v2-recovery-${{ steps.recovery_source.outputs.run_id }}-1
          path: ${{ runner.temp }}/kodjo-source-recovery
          github-token: ${{ github.token }}
          run-id: ${{ steps.recovery_source.outputs.run_id }}

      - name: Select and execute immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          KODJO_EVENT_BEFORE: ${{ github.event.before }}
          KODJO_EVENT_AFTER: ${{ github.event.after }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          KODJO_SOURCE_RECOVERY_DIR: ${{ runner.temp }}/kodjo-source-recovery
          # Verification des preuves GitHub obligatoire : une reaction absente,
          # illisible ou non verifiee bloque l'admission.
          KODJO_VERIFY_GITHUB: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          # KV2-10 : admission avant toute operation. Ajout seul, request_id unique,
          # relance de workflow refusee. Aucun etat local, aucune purge manuelle.
          $selected = & node scripts/kodjo/verify-queue-admission.js $env:KODJO_EVENT_BEFORE $env:KODJO_EVENT_AFTER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/kodjo/run-queued-request.ps1 -QueueFile $selected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # KV2-18 : le diagnostic ne remonte que le run courant. Le glob precedent
      # exportait l'historique de toutes les tranches presentes sur le runner.
      - name: Resolve current run diagnostic directory
        if: always()
        id: diag
        run: |
          $dir = & node scripts/kodjo/resolve-run-directory.js
          if ($LASTEXITCODE -ne 0) { $dir = '' }
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Preserve KODJO diagnostic
        if: always() && steps.diag.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.diag.outputs.dir }}/result.json
            ${{ steps.diag.outputs.dir }}/claude-stderr.txt
            ${{ steps.diag.outputs.dir }}/claude-output.json
            ${{ steps.diag.outputs.dir }}/invocation.json
          if-no-files-found: warn
          retention-days: 14

      # KV2-03 : le paquet de reprise quitte le disque du runner. Sans lui, une
      # reinstallation du runner detruisait definitivement le delta produit.
      - name: Preserve KODJO recovery package
        if: always() && steps.diag.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diag.outputs.dir }}/recovery-package/
          if-no-files-found: warn
          retention-days: ${{ vars.KODJO_RECOVERY_RETENTION_DAYS || 90 }}
