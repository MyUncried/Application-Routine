name: Claude Cloud OAuth Isolation Test (Issue #15 - Etape A.2)
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  oauth-isolation-test:
    if: >
      github.event.pull_request.base.ref == 'feat/creation-seance-catalogue' &&
      github.event.pull_request.head.ref == 'chore/cloud-trigger-test-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: >
            Réponds uniquement par un court texte confirmant que tu as été
            déclenché automatiquement par GitHub Actions via authentification
            OAuth Claude Code (Issue #15, Étape A.2, événement pull_request).
            N'effectue aucune lecture ni modification de fichier, n'utilise
            aucun outil.
          claude_args: |
            --max-turns 1
            --allowedTools ""
