name: KODJO V1.4 S09 — Independent Plan Review
run-name: T01-S09 / PLAN-REVIEW-CLAUDE / ${{ github.event.comment.id }}

on:
  workflow_call:

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v14-s09-plan-review-independent
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/creation-seance-catalogue
  EXPECTED_HEAD: 76b8c1f0027b66fa98e4017458fa5d2ccc68a47d
  HISTORICAL_SESSION_ID: 99404ae0-19e3-4004-8dde-cd670588afb5

jobs:
  review:
    if: github.event.issue.number == 17 && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V14_S09] START_PLAN_REVIEW_CLAUDE')
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source state
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME){throw 'Unexpected runner'}
          if($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine'){throw 'Unexpected repository'}
          if((git branch --show-current).Trim() -ne $env:TARGET_BRANCH){throw 'Unexpected branch'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Dirty worktree'}
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:EXPECTED_HEAD){throw "HEAD mismatch: $head"}
          $pm=[regex]::Match($env:TRIGGER_BODY,'(?m)^source_plan_comment_id=(\d+)\s*$')
          if(-not $pm.Success){throw 'source_plan_comment_id missing'}
          $sm=[regex]::Match($env:TRIGGER_BODY,'(?m)^review_session_id=([0-9a-fA-F-]{36})\s*$')
          $resume=if($sm.Success){$sm.Groups[1].Value}else{''}
          if($resume -eq $env:HISTORICAL_SESSION_ID){throw 'Historical session forbidden'}
          $claude=Get-Command claude.cmd -ErrorAction Stop
          $cred=Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json') -Raw|ConvertFrom-Json
          if([int64]$cred.claudeAiOauth.expiresAt -le [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()){throw 'Claude token expired'}
          "head=$head" >> $env:GITHUB_OUTPUT
          "plan_id=$($pm.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "resume_session=$resume" >> $env:GITHUB_OUTPUT
          "claude=$($claude.Source)" >> $env:GITHUB_OUTPUT

      - name: Claude exact-target review
        id: review
        env:
          CLAUDE_PATH: ${{ steps.gate.outputs.claude }}
          PLAN_ID: ${{ steps.gate.outputs.plan_id }}
          RESUME_SESSION: ${{ steps.gate.outputs.resume_session }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $plan=(Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/comments/$env:PLAN_ID").body
          if($plan -notmatch '\[KODJO_S09_PLAN_OUTPUT\]' -or $plan -notmatch 'plan_builder=OPENAI'){throw 'Target is not an OpenAI S09 plan'}
          if($plan -notmatch [regex]::Escape("source_head=$env:EXPECTED_HEAD")){throw 'Plan HEAD mismatch'}
          $issue=(Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/17")

          $sources=''
          $files=@(
            'docs/Specifications-fonctionnelles/06 – Ecrans et navigation de la V1.md',
            'docs/Specifications-fonctionnelles/07 – Registre des décisions de conception.md',
            'docs/Specifications-fonctionnelles/08 – Conception fonctionnelle détaillée.md',
            'docs/Specifications-fonctionnelles/09 – Modèle de données fonctionnel.md',
            'docs/Specifications-fonctionnelles/10 – Processus métier et règles métier transverses.md',
            'docs/Specifications-fonctionnelles/11 – API fonctionnelles.md',
            'docs/Specifications-fonctionnelles/12 – Architecture technique.md',
            'docs/Specifications-fonctionnelles/13 – Contrats d’écran.md',
            'src/domain/sessions/SessionDraft.ts',
            'src/domain/sessions/Session.ts',
            'src/features/sessions/CompositionScreen.tsx',
            'src/infrastructure/database/repositories/SqliteSessionRepository.ts',
            'src/infrastructure/database/migrations/migration001.ts'
          )
          foreach($f in $files){
            if(Test-Path $f){
              $m=Select-String -Path $f -Pattern 'D-106|D-107|Catégor|40|SessionDraft|exercises|exercise|toCreateSessionInput|transaction|withExclusiveTransactionAsync|bodyZone|Continuer|Enregistrer|rollback|migration001|position' -Context 3,3
              $sources += "`n===== $f =====`n" + (($m|ForEach-Object{$_.ToString()}) -join "`n")
            }
          }
          if($sources.Length -gt 180000){$sources=$sources.Substring(0,180000)}

          $promptPath=Join-Path $env:RUNNER_TEMP 'review-prompt.txt'
          $parts=@(
            'KODJO V1.4 - REVUE CIBLEE DU PLAN T01-S09.',
            'Tu es reviewer Claude. Aucun développement ni modification de fichier. Lecture seule absolue.',
            "La SEULE cible de revue est le commentaire PLAN_ID=$env:PLAN_ID ci-dessous. Les autres textes ne sont que des preuves. N''évalue aucun ancien plan et ne le traite jamais comme cible.",
            'Si cette session est reprise, corrige explicitement toute confusion antérieure sur la cible.',
            'Vérifie couverture, traçabilité, règles actives, exécutabilité, testabilité, D-106/D-107, normalisation espaces+casse+diacritiques, max 40, sélection silencieuse d''une Catégorie existante, persistance complète de toutes les Activités ordonnées du SessionDraft, atomicité/rollback, double-submit, reset après succès, aucun S10.',
            'Réponds STRICTEMENT avec les champs suivants :',
            "REVIEWED_PLAN_ID: $env:PLAN_ID",
            'DECISION: APPROVE|REVISE|CLARIFY',
            'SUMMARY: ...',
            'BLOCKING_POINTS:',
            '- ... ou NONE',
            'FEEDBACK:',
            '... ou NONE',
            'SOURCES_CHECKED:',
            '- ...',
            "`nSOURCE HEAD:`n$env:EXPECTED_HEAD",
            "`nISSUE #17:`n$($issue.body)",
            "`nTARGET PLAN - UNIQUE ARTEFACT A REVOIR:`n$plan",
            "`nCURRENT EVIDENCE EXTRACTS:`n$sources"
          )
          [IO.File]::WriteAllText($promptPath,($parts -join "`n"),(New-Object Text.UTF8Encoding($false)))

          $out=Join-Path $env:RUNNER_TEMP 'review-out.json'; $err=Join-Path $env:RUNNER_TEMP 'review-err.txt'
          $old=$ErrorActionPreference; $ErrorActionPreference='Continue'
          if([string]::IsNullOrWhiteSpace($env:RESUME_SESSION)){
            Get-Content $promptPath -Raw -Encoding UTF8 | & $env:CLAUDE_PATH -p --output-format json 1> $out 2> $err
          } else {
            Get-Content $promptPath -Raw -Encoding UTF8 | & $env:CLAUDE_PATH -p --resume $env:RESUME_SESSION --output-format json 1> $out 2> $err
          }
          $exit=$LASTEXITCODE; $ErrorActionPreference=$old
          $raw=if(Test-Path $out){Get-Content $out -Raw -Encoding UTF8}else{''}; $stderr=if(Test-Path $err){Get-Content $err -Raw -Encoding UTF8}else{''}; $p=$null; try{$p=$raw|ConvertFrom-Json}catch{}
          if($exit -ne 0 -or $null -eq $p -or [string]::IsNullOrWhiteSpace([string]$p.result) -or [string]::IsNullOrWhiteSpace([string]$p.session_id)){throw "Claude review technical failure: $stderr"}
          if($p.session_id -eq $env:HISTORICAL_SESSION_ID){throw 'Historical session reused'}
          if(-not [string]::IsNullOrWhiteSpace($env:RESUME_SESSION) -and $p.session_id -ne $env:RESUME_SESSION){throw 'Requested review session was not resumed'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Review modified worktree'}
          $result=[string]$p.result
          if($result -notmatch "(?m)^REVIEWED_PLAN_ID:\s*$env:PLAN_ID\s*$"){throw 'Claude reviewed wrong plan id'}
          if($result -notmatch '(?m)^DECISION:\s*(APPROVE|REVISE|CLARIFY)\s*$'){throw 'Invalid Claude decision format'}
          $rp=Join-Path $env:RUNNER_TEMP 'review.txt'; [IO.File]::WriteAllText($rp,$result,(New-Object Text.UTF8Encoding($false)))
          "session=$($p.session_id)" >> $env:GITHUB_OUTPUT
          "result=$rp" >> $env:GITHUB_OUTPUT

      - name: Publish independent review
        env:
          RESULT: ${{ steps.review.outputs.result }}
          REVIEW_SESSION: ${{ steps.review.outputs.session }}
          PLAN_ID: ${{ steps.gate.outputs.plan_id }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content $env:RESULT -Raw -Encoding UTF8
          $m=[regex]::Match($r,'(?m)^DECISION:\s*(APPROVE|REVISE|CLARIFY)\s*$'); $d=$m.Groups[1].Value
          $body="[KODJO_S09_INDEPENDENT_PLAN_REVIEW]`nsource_plan_comment_id=$env:PLAN_ID`nsource_head=$env:HEAD_SHA`nreview_session_id=$env:REVIEW_SESSION`nreviewer=CLAUDE_EXACT_TARGET`nDECISION=$d`n`n$r"
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/17/comments" -Headers $h -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json) | Out-Null
