name: KODJO V1.4 S09 — Independent Plan Review
run-name: T01-S09 / PLAN-REVIEW-CLAUDE / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v14-s09-plan-review-independent
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/creation-seance-catalogue
  EXPECTED_HEAD: 76b8c1f0027b66fa98e4017458fa5d2ccc68a47d

jobs:
  review:
    if: >
      github.event.issue.number == 17 &&
      github.event.comment.user.login == 'MyUncried' &&
      contains(github.event.comment.body, '[KODJO_V14_S09] START_PLAN_REVIEW_CLAUDE')
    runs-on: [self-hosted, Windows, X64]
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_HEAD) { throw "HEAD mismatch: $head" }
          if (git status --porcelain --untracked-files=all) { throw 'Working tree is not clean.' }

      - name: Build independent review packet
        id: packet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\kodjo-s09-review" | Out-Null
          $packet = "$env:RUNNER_TEMP\kodjo-s09-review"
          $sourceLine = ($env:TRIGGER_BODY -split "`n" | Where-Object { $_ -match '^source_plan_comment_id=' } | Select-Object -First 1)
          if (-not $sourceLine) { throw 'source_plan_comment_id missing.' }
          $sourceId = ($sourceLine -replace '^source_plan_comment_id=', '').Trim()
          if ($sourceId -notmatch '^\d+$') { throw 'Invalid source_plan_comment_id.' }
          gh api "repos/$env:GITHUB_REPOSITORY/issues/comments/$sourceId" --jq '.body' | Out-File -FilePath "$packet\plan.md" -Encoding utf8
          $plan = Get-Content -Raw -Encoding UTF8 "$packet\plan.md"
          if ($plan -notmatch '\[KODJO_S09_PLAN_OUTPUT\]' -or $plan -notmatch 'plan_builder=OPENAI' -or $plan -notmatch "source_head=$env:EXPECTED_HEAD") { throw 'Source plan attestation invalid.' }
          gh api "repos/$env:GITHUB_REPOSITORY/issues/17" | Out-File -FilePath "$packet\issue.json" -Encoding utf8
          gh api --paginate "repos/$env:GITHUB_REPOSITORY/issues/17/comments" | Out-File -FilePath "$packet\comments-pages.json" -Encoding utf8
          $docs = @(
            'docs/PRODUCT.md',
            'docs/INDEX.md',
            'docs/Specifications-fonctionnelles/06 – Ecrans et navigation de la V1.md',
            'docs/Specifications-fonctionnelles/07 – Registre des décisions de conception.md',
            'docs/Specifications-fonctionnelles/08 – Conception fonctionnelle détaillée.md',
            'docs/Specifications-fonctionnelles/09 – Modèle de données fonctionnel.md',
            'docs/Specifications-fonctionnelles/10 – Processus métier et règles métier transverses.md',
            'docs/Specifications-fonctionnelles/11 – API fonctionnelles.md',
            'docs/Specifications-fonctionnelles/12 – Architecture technique.md',
            'docs/Specifications-fonctionnelles/13 – Contrats d’écran.md'
          )
          $evidence = New-Object System.Text.StringBuilder
          foreach ($f in $docs) {
            if (Test-Path -LiteralPath $f) {
              [void]$evidence.AppendLine("`n===== $f =====")
              [void]$evidence.AppendLine((Get-Content -Raw -Encoding UTF8 -LiteralPath $f))
            }
          }
          [IO.File]::WriteAllText("$packet\docs.txt", $evidence.ToString(), [Text.UTF8Encoding]::new($false))
          $code = git grep -n -E 'Category|Catégor|Composition|SessionDraft|SqliteSessionRepository|bodyZone|migration001|DATABASE_VERSION' -- app src 2>$null
          [IO.File]::WriteAllLines("$packet\code.txt", @($code), [Text.UTF8Encoding]::new($false))
          "source_id=$sourceId" >> $env:GITHUB_OUTPUT

      - name: Review plan in a new Claude session
        id: claude
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $packet = "$env:RUNNER_TEMP\kodjo-s09-review"
          $prompt = @'
          You are the independent reviewer of the KODJO T01-S09 implementation plan. This MUST be a new review session. Do not resume any historical Claude session and do not develop or modify repository files.

          Audit the supplied OpenAI plan against the authoritative evidence. Sources outrank agent memory. Check exactly five axes: (1) complete S09 scope coverage, (2) source traceability, (3) no invented or obsolete rules, (4) technical executability against the current code, (5) testability.

          Mandatory validated rule: category duplicate comparison normalizes spaces and ignores case AND accents/diacritics for the comparison key only; visible labels preserve entered casing/accents; no spelling correction, fuzzy matching, suggestion or automatic replacement in MVP. S10 reopening/editing is out of scope.

          Verify additive migration only and no modification of migration001, SQLite atomicity, complete persistence of all T01-S01..S08 draft data including body zones where applicable, category selection/creation, duplicate handling, double-submit protection, reset only after successful save, Catalogue return/reload, loading/error behavior, screen contracts, TypeScript and tests.

          Return exactly one verdict: APPROVE, REVISE, or CLARIFY. APPROVE only if the plan is executable without inventing a missing product/UX decision. For REVISE list each defect with evidence and required correction. For CLARIFY state the exact genuinely unresolved user decision and sources checked.
          '@
          $prompt += "`n`n===== OPENAI PLAN =====`n" + (Get-Content -Raw -Encoding UTF8 "$packet\plan.md")
          $prompt += "`n`n===== ISSUE #17 =====`n" + (Get-Content -Raw -Encoding UTF8 "$packet\issue.json")
          $prompt += "`n`n===== ISSUE COMMENTS =====`n" + (Get-Content -Raw -Encoding UTF8 "$packet\comments-pages.json")
          $prompt += "`n`n===== VERSIONED DOCUMENTATION =====`n" + (Get-Content -Raw -Encoding UTF8 "$packet\docs.txt")
          $prompt += "`n`n===== CODE EVIDENCE =====`n" + (Get-Content -Raw -Encoding UTF8 "$packet\code.txt")
          $stdout = "$packet\claude.json"
          $stderr = "$packet\claude.stderr.txt"
          $proc = Start-Process -FilePath 'claude.cmd' -ArgumentList @('-p', $prompt, '--output-format', 'json', '--max-turns', '25') -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($proc.ExitCode -ne 0) { throw "Claude review failed with exit code $($proc.ExitCode): $((Get-Content -Raw -ErrorAction SilentlyContinue $stderr))" }
          $obj = Get-Content -Raw -Encoding UTF8 $stdout | ConvertFrom-Json
          if (-not $obj.session_id -or -not $obj.result) { throw 'Claude JSON missing session_id/result.' }
          if ($obj.session_id -eq '99404ae0-19e3-4004-8dde-cd670588afb5') { throw 'Historical session was reused unexpectedly.' }
          [IO.File]::WriteAllText("$packet\review.txt", [string]$obj.result, [Text.UTF8Encoding]::new($false))
          "session_id=$($obj.session_id)" >> $env:GITHUB_OUTPUT
          if (git status --porcelain --untracked-files=all) { throw 'Review modified the repository.' }

      - name: Publish independent review result
        env:
          SOURCE_ID: ${{ steps.packet.outputs.source_id }}
          REVIEW_SESSION_ID: ${{ steps.claude.outputs.session_id }}
        shell: powershell
        run: |
          $packet = "$env:RUNNER_TEMP\kodjo-s09-review"
          $review = Get-Content -Raw -Encoding UTF8 "$packet\review.txt"
          $body = @"
          [KODJO_S09_PLAN_INDEPENDENT_REVIEW]
          source_plan_comment_id=$env:SOURCE_ID
          source_head=$env:EXPECTED_HEAD
          reviewer=CLAUDE_NEW_SESSION
          review_session_id=$env:REVIEW_SESSION_ID

          $review
          "@
          $out = "$packet\out.md"
          [IO.File]::WriteAllText($out, $body, [Text.UTF8Encoding]::new($false))
          gh issue comment 17 --repo "$env:GITHUB_REPOSITORY" --body-file $out
