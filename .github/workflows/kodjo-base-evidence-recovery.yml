name: KODJO BASE Evidence Recovery
run-name: KODJO BASE #3 recovery / ${{ github.event_name == 'push' && 'WRITE' || inputs.stage }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kodjo-base-evidence-recovery.yml
  workflow_dispatch:
    inputs:
      stage:
        required: true
        type: choice
        options: [VERIFY]
      recovery_run_id:
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  TEST_ID: KODJO-CLAUDE-SESSION-RESUME-01
  BASE_RUN_ID: "33384761722"
  BASE_ARTIFACT_ID: "9755142915"
  BASE_ARTIFACT_NAME: KODJO-CLAUDE-SESSION-RESUME-01-BASE-execution
  ORIGINAL_SESSION_ID: 1995230a-7b4a-4c7b-ba54-60b0762ad850
  STATE_REF: test-state/claude-session-resume-01
  STATE_ROOT: .github/orchestration/state/KODJO-CLAUDE-SESSION-RESUME-01
  WORKFLOW_FILE: kodjo-base-evidence-recovery.yml

concurrency:
  group: KODJO-CLAUDE-SESSION-RESUME-01-BASE-RECOVERY
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Recover BASE #3 evidence without Claude
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLAIM_PATH="$STATE_ROOT/BASE.claim.json"
          RESULT_PATH="$STATE_ROOT/BASE.result.json"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH?ref=$STATE_REF" >/dev/null 2>&1; then
            echo 'BASE.result.json already exists; refusing to overwrite durable evidence.' >&2
            exit 1
          fi
          CLAIM="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CLAIM_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$CLAIM" | jq -e --arg run_id "$BASE_RUN_ID" '.test_id=="KODJO-CLAUDE-SESSION-RESUME-01" and .stage=="BASE" and .status=="CLAIMED" and .run_id==$run_id' >/dev/null

          mkdir artifact
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BASE_ARTIFACT_ID/zip" > artifact.zip
          unzip -q artifact.zip -d artifact
          EXECUTION_FILE="artifact/claude-execution-output.json"
          test -f "$EXECUTION_FILE"
          jq -e 'type == "array"' "$EXECUTION_FILE" >/dev/null

          SESSION_IDS="$(jq -r '[.[].session_id? // empty] | unique | .[]' "$EXECUTION_FILE")"
          test "$(printf '%s\n' "$SESSION_IDS" | sed '/^$/d' | wc -l)" -eq 1
          SESSION_ID="$(printf '%s\n' "$SESSION_IDS" | sed '/^$/d')"
          test "$SESSION_ID" = "$ORIGINAL_SESSION_ID"
          FINAL="$(jq -ce '[.[] | select(.type=="result" and .subtype=="success")] | last' "$EXECUTION_FILE")"
          STRUCTURED_OUTPUT_JSON="$(printf '%s' "$FINAL" | jq -ce '.structured_output | select(type=="object")')"
          printf '%s' "$STRUCTURED_OUTPUT_JSON" | jq -e '.test_id=="KODJO-CLAUDE-SESSION-RESUME-01" and .stage=="BASE" and .manifest_read==true and .marker_memorized==true and .business_write==false and .implementation_authorized==false' >/dev/null
          METRICS="$(jq -nc --argjson execution "$FINAL" --arg model "$(jq -r '[.[] | select(.type=="system" and .subtype=="init")][0].model' "$EXECUTION_FILE")" '{execution_session_id:$execution.session_id,claude_model:$model,duration_ms:$execution.duration_ms,num_turns:$execution.num_turns,total_cost_usd:$execution.total_cost_usd,permission_denials_count:(if ($execution.permission_denials|type)=="array" then ($execution.permission_denials|length) else null end)}')"
          printf '%s' "$METRICS" | jq -e --arg session_id "$ORIGINAL_SESSION_ID" 'type=="object" and .execution_session_id==$session_id' >/dev/null

          RESULT="$(jq -nc --arg test_id "$TEST_ID" --arg session_id "$SESSION_ID" --arg run_id "$BASE_RUN_ID" --arg execution_file "artifact://$BASE_ARTIFACT_ID/claude-execution-output.json" --arg artifact_name "$BASE_ARTIFACT_NAME" --arg artifact_id "$BASE_ARTIFACT_ID" --arg recovery_run_id "$GITHUB_RUN_ID" --argjson structured_output "$STRUCTURED_OUTPUT_JSON" --argjson metrics "$METRICS" '{test_id:$test_id,stage:"BASE",status:"success",returned_session_id:$session_id,execution_file:$execution_file,artifact:{id:$artifact_id,name:$artifact_name,preserved:true},run_id:$run_id,recovered_by_run_id:$recovery_run_id,recovery_without_claude:true,business_write:false,implementation_authorized:false,mode:"CLOUD_READ_ONLY",writer:"NONE",structured_output:$structured_output,metrics:$metrics}')"
          printf '%s' "$RESULT" | jq -e --arg run_id "$BASE_RUN_ID" --arg session_id "$ORIGINAL_SESSION_ID" '.run_id==$run_id and .returned_session_id==$session_id and .structured_output.stage=="BASE" and .recovery_without_claude==true' >/dev/null
          ENCODED="$(printf '%s' "$RESULT" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH" -f message="test-state: recover BASE #3 evidence without recall" -f content="$ENCODED" -f branch="$STATE_REF" >/dev/null
          STORED="$(gh api "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$STORED" | jq -e --arg run_id "$BASE_RUN_ID" --arg session_id "$ORIGINAL_SESSION_ID" '.stage=="BASE" and .status=="success" and .run_id==$run_id and .returned_session_id==$session_id and .recovery_without_claude==true' >/dev/null
      - name: Dispatch distinct durable verification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "$WORKFLOW_FILE" --repo "$GITHUB_REPOSITORY" --ref main -f stage=VERIFY -f recovery_run_id="$GITHUB_RUN_ID"

  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'VERIFY'
    runs-on: ubuntu-latest
    steps:
      - name: Read BASE result in a distinct run and persist proof
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          RESULT_PATH="$STATE_ROOT/BASE.result.json"
          PROOF_PATH="$STATE_ROOT/BASE.recovery-verified.json"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$PROOF_PATH?ref=$STATE_REF" >/dev/null 2>&1; then
            echo 'BASE recovery verification already exists; refusing duplicate proof.' >&2
            exit 1
          fi
          STORED="$(gh api "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$STORED" | jq -e --arg base_run_id "$BASE_RUN_ID" --arg session_id "$ORIGINAL_SESSION_ID" --arg recovery_run_id "$RECOVERY_RUN_ID" '.stage=="BASE" and .status=="success" and .run_id==$base_run_id and .returned_session_id==$session_id and .recovered_by_run_id==$recovery_run_id and .recovery_without_claude==true' >/dev/null
          PROOF="$(jq -nc --arg test_id "$TEST_ID" --arg base_run_id "$BASE_RUN_ID" --arg session_id "$ORIGINAL_SESSION_ID" --arg recovery_run_id "$RECOVERY_RUN_ID" --arg verification_run_id "$GITHUB_RUN_ID" '{test_id:$test_id,stage:"BASE_RECOVERY_VERIFY",status:"BASE_RECOVERED_AND_READ",base_run_id:$base_run_id,returned_session_id:$session_id,recovery_run_id:$recovery_run_id,verification_run_id:$verification_run_id,distinct_runs:($recovery_run_id!=$verification_run_id),claude_action_present:false,claude_call_count:1,max_claude_calls:2}')"
          ENCODED="$(printf '%s' "$PROOF" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$PROOF_PATH" -f message="test-state: verify recovered BASE #3 evidence" -f content="$ENCODED" -f branch="$STATE_REF" >/dev/null
          READ_BACK="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PROOF_PATH?ref=$STATE_REF" --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$READ_BACK" | jq -e '.status=="BASE_RECOVERED_AND_READ" and .distinct_runs==true and .claude_action_present==false and .claude_call_count==1 and .max_claude_calls==2' >/dev/null
