name: KODJO V2 pilot tests

on:
  pull_request:
    paths:
      - '.github/orchestration/**'
      - '.github/workflows/kodjo-v2-*.yml'
      - 'scripts/kodjo/**'
      - 'tests/kodjo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run complete KODJO pilot suite
        run: node tests/kodjo/run-all.js
      - name: Validate executable workflow invariants
        run: node scripts/kodjo/validate-workflows.js

  protocol-windows-preflight:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 10
    steps:
      - name: Inventory retained KODJO recovery state
        shell: powershell
        run: |
          $state = Join-Path $HOME '.kodjo-v2'
          if (-not (Test-Path -LiteralPath $state)) {
            Write-Output 'KODJO_STATE_ROOT_ABSENT'
            exit 0
          }
          Get-ChildItem -LiteralPath $state -Directory -Recurse |
            Where-Object { $_.Name -like 'V2-BILAT-01-*' } |
            ForEach-Object {
              Write-Output ("KODJO_RUN_DIRECTORY {0}" -f $_.FullName)
              Get-ChildItem -LiteralPath $_.FullName -Recurse -File |
                Select-Object FullName, Length, LastWriteTimeUtc
            }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: _qualification/${{ github.run_id }}
      - name: Record Windows toolchain
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $PSVersionTable.PSVersion.ToString()
          git --version
          node --version
      - name: Parse every PowerShell protocol script with Windows PowerShell
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $failed = $false
          Get-ChildItem scripts/kodjo -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.File, $_.Message) }
            }
          }
          if ($failed) { exit 1 }
      - name: Run complete KODJO pilot suite on Windows
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: node tests/kodjo/run-all.js
