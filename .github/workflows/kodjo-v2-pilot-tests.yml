name: KODJO V2 pilot tests

on:
  pull_request:
    paths:
      - '.github/orchestration/**'
      - '.github/workflows/kodjo-v2-*.yml'
      - 'scripts/kodjo/**'
      - 'tests/kodjo/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run complete KODJO pilot suite
        run: node tests/kodjo/run-all.js
      - name: Validate executable workflow invariants
        run: node scripts/kodjo/validate-workflows.js

  protocol-windows-preflight:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: _qualification/${{ github.run_id }}
      - name: Record Windows toolchain
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $PSVersionTable.PSVersion.ToString()
          git --version
          node --version
      - name: Certify real persistent runner lock before Claude boundary
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          node scripts/kodjo/certify-persistent-runner-lock.js runner-lock-certification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve real runner certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-runner-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: _qualification/${{ github.run_id }}/runner-lock-certification.json
          if-no-files-found: error
          retention-days: 90
      - name: Parse every PowerShell protocol script with Windows PowerShell
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $failed = $false
          Get-ChildItem scripts/kodjo -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.File, $_.Message) }
            }
          }
          if ($failed) { exit 1 }
      - name: Run complete KODJO pilot suite on Windows
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: node tests/kodjo/run-all.js
      - name: Run isolated queue path with Windows PowerShell 5.1
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) { throw 'GIT_BASH_NOT_FOUND' }
          $env:PWSH = 'powershell.exe'
          & $bash tests/kodjo/queue-integration/run-bench.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download the real run 16 recovery package
        uses: actions/download-artifact@v4
        with:
          name: kodjo-v2-recovery-34606534268-1
          path: ${{ runner.temp }}/kodjo-real-run-16-recovery
          github-token: ${{ github.token }}
          run-id: 34606534268
      - name: Dry-run the real run 16 recovery on the exact candidate HEAD
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          node scripts/kodjo/certify-recovery-artifact.js `
            "${{ runner.temp }}/kodjo-real-run-16-recovery" `
            "$PWD" `
            "${{ github.event.pull_request.head.sha || github.sha }}" `
            "real-recovery-certification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve real recovery certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-real-recovery-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: _qualification/${{ github.run_id }}/real-recovery-certification.json
          if-no-files-found: error
          retention-days: 90
