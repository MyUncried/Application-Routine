name: KODJO V2 pilot tests

on:
  pull_request:
    paths:
      - '.github/orchestration/**'
      # Une demande immuable n'est pas une modification du protocole : son
      # admission ciblée est effectuée par Lean Queue au lancement.
      - '!.github/orchestration/queue/v2/*.json'
      # Le backlog d'évolution est explicitement non normatif : une PR qui ne
      # modifie que ce fichier ne qualifie aucun exécutable du protocole.
      - '!.github/orchestration/PROTOCOL_EVOLUTION_BACKLOG.md'
      - '!.github/orchestration/reports/2026-09-29_PROTOCOL_DETERMINISM_AUDIT.md'
      - '!.github/orchestration/reports/2026-09-29_PROTOCOL_DETERMINISM_MATRIX.md'
      - '!.github/orchestration/reports/2026-09-29_PROTOCOL_EVOLUTION_CLAUDE_AUDIT_MISSION.md'
      - '!.github/orchestration/KODJO_PROTOCOL_NEXT_EVOLUTION_*.md'
      - '.github/workflows/kodjo-v2-*.yml'
      - '.github/workflows/kodjo-slice-plan.yml'
      - '.github/workflows/kodjo-slice-plan-review.yml'
      - '.github/workflows/kodjo-slice-implementation-review.yml'
      - 'scripts/kodjo/**'
      - 'tests/kodjo/**'
  workflow_dispatch:
    inputs:
      run_disposable_qualification:
        description: 'Run the real V2-QUALIF-00 slice on the persistent Windows runner'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: kodjo-v2-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_windows_required: ${{ steps.change_class.outputs.full_windows_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up independent workflow syntax parser
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse workflow YAML independently
        shell: bash
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/kodjo/validate-workflow-syntax.py
      - name: Classify protocol change
        id: change_class
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          full=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            full=false
            count=0
            while IFS= read -r -d '' changed; do
              count=$((count + 1))
              case "$changed" in
                .github/orchestration/v2-slices/*/technical-plan.md|.github/orchestration/v2-slices/*/independent-review.md|.github/orchestration/PROTOCOL_EVOLUTION_BACKLOG.md)
                  ;;
                *)
                  full=true
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
            if [ "$count" -eq 0 ]; then full=true; fi
          fi
          echo "full_windows_required=$full" >> "$GITHUB_OUTPUT"
          echo "KODJO_CI_CLASSIFICATION_FULL_WINDOWS=$full"
      - name: Install isolated planning tokenizer
        run: npm ci --prefix scripts/kodjo/openai-runtime --ignore-scripts --no-audit --no-fund
      - name: Qualify authenticated private HEAD lookup on Linux
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(node scripts/kodjo/resolve-private-head.js "$GITHUB_REPOSITORY" main)
          printf '%s' "$ACTUAL" | grep -Eq '^[0-9a-f]{40}$'
          if env -u GH_TOKEN node scripts/kodjo/resolve-private-head.js "$GITHUB_REPOSITORY" main; then
            echo 'missing token was accepted' >&2
            exit 1
          fi
          if node scripts/kodjo/resolve-private-head.js "$GITHUB_REPOSITORY" "__kodjo_missing_${GITHUB_RUN_ID}"; then
            echo 'missing branch was accepted' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$EVENT_PR_NUMBER" > "$RUNNER_TEMP/kodjo-pr-permission.json"
            test "$(jq -r .state "$RUNNER_TEMP/kodjo-pr-permission.json")" = open
            test "$(jq -r .head.sha "$RUNNER_TEMP/kodjo-pr-permission.json")" = "$EVENT_PR_HEAD"
            test "$(jq -r .base.ref "$RUNNER_TEMP/kodjo-pr-permission.json")" = "$EVENT_PR_BASE"
          else
            gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=1" --jq '.[0] | (.number > 0) and (.head.sha | test("^[0-9a-f]{40}$")) and (.base.ref | length > 0)' | grep -Fx true
          fi
      - name: Run complete KODJO pilot suite
        run: node tests/kodjo/run-all.js
      - name: Validate executable workflow invariants
        run: node scripts/kodjo/validate-workflows.js
      - name: Record immutable qualification identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          git ls-tree -r "$SOURCE_SHA" | sha256sum | awk '{print "source_tree_manifest_sha256=" $1}' >> "$GITHUB_STEP_SUMMARY"

  protocol-windows-preflight:
    needs: protocol
    if: needs.protocol.outputs.full_windows_required == 'true'
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    # Le préflight complet inclut npm ci et la suite applicative sous Windows.
    # 20 minutes coupait le job sans verdict lors des passages réels chargés.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: _qualification/${{ github.run_id }}
      - name: Record Windows toolchain
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $PSVersionTable.PSVersion.ToString()
          git --version
          node --version
      - name: Qualify authenticated private HEAD lookup on Windows
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          $ErrorActionPreference='Stop'
          $actual=& node scripts/kodjo/resolve-private-head.js $env:GITHUB_REPOSITORY main
          if ($LASTEXITCODE -ne 0 -or [string]$actual -notmatch '^[0-9a-f]{40}$') { throw 'Authenticated private HEAD lookup failed' }
          $token=$env:GH_TOKEN
          Remove-Item Env:GH_TOKEN
          & node scripts/kodjo/resolve-private-head.js $env:GITHUB_REPOSITORY main
          if ($LASTEXITCODE -eq 0) { throw 'Missing token was accepted' }
          $env:GH_TOKEN=$token
          & node scripts/kodjo/resolve-private-head.js $env:GITHUB_REPOSITORY "__kodjo_missing_${{ github.run_id }}"
          if ($LASTEXITCODE -eq 0) { throw 'Missing branch was accepted' }
          if ($env:EVENT_NAME -eq 'pull_request') {
            $application=gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:EVENT_PR_NUMBER" | ConvertFrom-Json
            if ($application.state -ne 'open' -or [string]$application.head.sha -ne $env:EVENT_PR_HEAD -or [string]$application.base.ref -ne $env:EVENT_PR_BASE) {
              throw 'Authenticated pull request lookup mismatch'
            }
          } else {
            $application=@(gh api "repos/$env:GITHUB_REPOSITORY/pulls?state=all&per_page=1" | ConvertFrom-Json)
            if ($application.Count -ne 1 -or [string]$application[0].head.sha -notmatch '^[0-9a-f]{40}$' -or -not [string]$application[0].base.ref) {
              throw 'Authenticated pull request lookup failed'
            }
          }
          exit 0
      - name: Certify real persistent runner lock before Claude boundary
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $runnerProof = Join-Path '${{ runner.temp }}' 'kodjo-v2-runner-certification-${{ github.run_id }}-${{ github.run_attempt }}.json'
          node scripts/kodjo/certify-persistent-runner-lock.js $runnerProof
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve real runner certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-runner-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kodjo-v2-runner-certification-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Parse every PowerShell protocol script with Windows PowerShell
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $failed = $false
          Get-ChildItem scripts/kodjo -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.File, $_.Message) }
            }
          }
          if ($failed) { exit 1 }
      - name: Install isolated planning tokenizer on Windows
        working-directory: _qualification/${{ github.run_id }}
        shell: powershell
        run: |
          npm ci --prefix scripts/kodjo/openai-runtime --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete KODJO pilot suite on Windows
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: node tests/kodjo/run-all.js
      - name: Run isolated queue path with Windows PowerShell 5.1
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) { throw 'GIT_BASH_NOT_FOUND' }
          $env:PWSH = 'powershell.exe'
          & $bash tests/kodjo/queue-integration/run-bench.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run full disposable preflight without Claude
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          & scripts/kodjo/run-disposable-qualification.ps1 `
            -ExpectedHead '${{ github.event.pull_request.head.sha || github.sha }}' `
            -EvidenceDirectory 'disposable-preflight-evidence' `
            -PreflightOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve disposable preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-disposable-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: _qualification/${{ github.run_id }}/disposable-preflight-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Download the real run 16 recovery package
        uses: actions/download-artifact@v4
        with:
          name: kodjo-v2-recovery-34606534268-1
          path: ${{ runner.temp }}/kodjo-real-run-16-recovery
          github-token: ${{ github.token }}
          run-id: 34606534268
      - name: Certify historical run 16 recovery without gating the disposable slice
        continue-on-error: true
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          node scripts/kodjo/certify-recovery-artifact.js `
            "${{ runner.temp }}/kodjo-real-run-16-recovery" `
            "$PWD" `
            "${{ github.event.pull_request.head.sha || github.sha }}" `
            "real-recovery-certification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve real recovery certification
        if: always()
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          if (-not (Test-Path -LiteralPath 'real-recovery-certification.json')) {
            $proof = [ordered]@{
              status = 'FAIL'
              reason = 'HISTORICAL_RECOVERY_CERTIFICATION_FAILED'
              claude_invoked = $false
              run_id = '${{ github.run_id }}'
              run_attempt = '${{ github.run_attempt }}'
              source_sha = '${{ github.event.pull_request.head.sha || github.sha }}'
            }
            $proofJson = ($proof | ConvertTo-Json -Depth 5).Replace("`r`n", "`n") + "`n"
            [IO.File]::WriteAllText('real-recovery-certification.json', $proofJson, (New-Object Text.UTF8Encoding($false)))
          }
      - name: Upload real recovery certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-real-recovery-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: _qualification/${{ github.run_id }}/real-recovery-certification.json
          if-no-files-found: error
          retention-days: 7

  disposable-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.run_disposable_qualification == true
    needs: [protocol, protocol-windows-preflight]
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 90
    permissions:
      contents: write # Durable consumption for the explicitly requested Claude run.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: _qualification/${{ github.run_id }}
      - name: Refuse any active Lean Queue run
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = 'repos/${{ github.repository }}/actions/workflows/kodjo-v2-lean-queue.yml/runs?per_page=50'
          $runs = gh api $uri | ConvertFrom-Json
          $active = @($runs.workflow_runs | Where-Object { $_.status -ne 'completed' })
          if ($active.Count -ne 0) {
            $active | ForEach-Object { Write-Error ("Lean Queue active: {0} ({1})" -f $_.id, $_.status) }
            exit 1
          }
      - name: Execute real disposable qualification
        env:
          KODJO_LIVE_GH_TOKEN: ${{ github.token }}
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          & scripts/kodjo/run-disposable-qualification.ps1 `
            -ExpectedHead '${{ github.sha }}' `
            -EvidenceDirectory 'qualification-evidence'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve disposable qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-disposable-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: _qualification/${{ github.run_id }}/qualification-evidence
          if-no-files-found: error
          retention-days: 7
