name: KODJO E2E Orchestration Test V1.3
run-name: KODJO E2E — OpenAI review bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  e2e-review-bridge:
    if: >
      github.event.issue.number == 17 &&
      contains(github.event.comment.body, '[KODJO_E2E_AUTOMATION_TEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate checkpoint, call OpenAI, and dispatch completion event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          fail() { echo "E2E_BRIDGE_FAILURE: $1" >&2; exit 1; }

          test -n "${OPENAI_API_KEY:-}" || fail "OPENAI_API_KEY absent"

          COMMENTS=$(gh api --paginate "repos/${{ github.repository }}/issues/17/comments")
          CHECKPOINT=$(printf '%s' "$COMMENTS" | jq -r '[.[] | select(.body | startswith("[KODJO_CHECKPOINT_ACTIVE]"))] | last | .body // empty')
          test -n "$CHECKPOINT" || fail "active checkpoint missing"
          CHECKPOINT_JSON=$(printf '%s\n' "$CHECKPOINT" | sed -n '/```json/,/```/p' | sed '1d;$d')
          printf '%s' "$CHECKPOINT_JSON" | jq -e '.schema == "kodjo.checkpoint.v1" and .issue == 17 and .implementation_authorized == false and .mode == "CLOUD_READ_ONLY" and .writer == "NONE"' >/dev/null || fail "unsafe checkpoint"

          STATE=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.state')
          BRANCH=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.branch')
          HEAD=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.head')
          CURRENT_HEAD=$(gh api "repos/${{ github.repository }}/branches/$BRANCH" --jq '.commit.sha')
          test "$CURRENT_HEAD" = "$HEAD" || fail "feature branch HEAD mismatch"

          PROMPT=$(cat <<EOF
          You are the controlled KODJO end-to-end orchestration review test.
          Validate only that the supplied GitHub checkpoint is internally safe for a NO-WRITE automation-chain test.
          This test MUST NOT authorize implementation and MUST NOT trigger Claude.
          Accept only when schema=kodjo.checkpoint.v1, issue=17, implementation_authorized=false, mode=CLOUD_READ_ONLY, writer=NONE, and the current GitHub branch HEAD equals checkpoint HEAD.
          The current protocol state may be ORCHESTRATION_FAILURE because this is a transport/review-chain test, not an implementation authorization.

          Source comment id: $SOURCE_COMMENT_ID
          Current GitHub branch HEAD: $CURRENT_HEAD
          Active checkpoint JSON:
          $CHECKPOINT_JSON
          EOF
          )

          SCHEMA=$(cat <<'EOF'
          {"type":"object","properties":{"schema":{"type":"string","enum":["kodjo.e2e-review.v1"]},"decision":{"type":"string","enum":["E2E_REVIEW_ACCEPTED"]},"checkpoint_state":{"type":"string"},"implementation_authorized":{"type":"boolean","enum":[false]},"head_match":{"type":"boolean","enum":[true]},"reason":{"type":"string"}},"required":["schema","decision","checkpoint_state","implementation_authorized","head_match","reason"],"additionalProperties":false}
          EOF
          )

          jq -n --arg model "gpt-5.6-luna" --arg prompt "$PROMPT" --argjson schema "$SCHEMA" \
            '{model:$model,input:$prompt,store:false,reasoning:{effort:"none"},max_output_tokens:350,text:{verbosity:"low",format:{type:"json_schema",name:"kodjo_e2e_review",strict:true,schema:$schema}}}' > /tmp/openai-request.json

          if ! curl --fail-with-body -sS https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/openai-request.json -o /tmp/openai-response.json; then
            ERROR=$(jq -r '.error.message // "OpenAI API request failed"' /tmp/openai-response.json 2>/dev/null || echo "OpenAI API request failed")
            gh issue comment 17 --repo "${{ github.repository }}" --body "[KODJO_E2E_REVIEW_RESULT] ORCHESTRATION_FAILURE — $ERROR — aucune écriture métier ni aucun appel Claude."
            exit 1
          fi

          OUTPUT=$(jq -r '[.output[]? | select(.type == "message") | .content[]? | select(.type == "output_text") | .text] | join("\n")' /tmp/openai-response.json)
          printf '%s' "$OUTPUT" | jq -e --arg state "$STATE" '.schema == "kodjo.e2e-review.v1" and .decision == "E2E_REVIEW_ACCEPTED" and .checkpoint_state == $state and .implementation_authorized == false and .head_match == true' >/dev/null || fail "OpenAI structured review rejected or invalid"

          RESPONSE_ID=$(jq -r '.id // "unknown"' /tmp/openai-response.json)
          MODEL=$(jq -r '.model // "unknown"' /tmp/openai-response.json)
          INPUT_TOKENS=$(jq -r '.usage.input_tokens // 0' /tmp/openai-response.json)
          CACHED_TOKENS=$(jq -r '.usage.input_tokens_details.cached_tokens // 0' /tmp/openai-response.json)
          OUTPUT_TOKENS=$(jq -r '.usage.output_tokens // 0' /tmp/openai-response.json)
          TOTAL_TOKENS=$(jq -r '.usage.total_tokens // 0' /tmp/openai-response.json)
          REASON=$(printf '%s' "$OUTPUT" | jq -r '.reason')
          UNCACHED_TOKENS=$((INPUT_TOKENS - CACHED_TOKENS))
          ESTIMATED_COST_USD=$(python3 - <<PY
          uncached=$UNCACHED_TOKENS
          cached=$CACHED_TOKENS
          output=$OUTPUT_TOKENS
          print(f"{uncached*0.20/1000000 + cached*0.02/1000000 + output*1.20/1000000:.10f}")
          PY
          )

          cat > /tmp/result.md <<EOF
          [KODJO_E2E_REVIEW_RESULT] VERIFIED_SUCCESS

          \`schema=kodjo.e2e-review-result.v1\`
          \`source_comment_id=$SOURCE_COMMENT_ID\`
          \`checkpoint_state=$STATE\`
          \`branch=$BRANCH\`
          \`head=$HEAD\`
          \`implementation_authorized=false\`
          \`claude_triggered=false\`
          \`business_write=false\`
          \`model=$MODEL\`
          \`response_id=$RESPONSE_ID\`
          \`input_tokens=$INPUT_TOKENS\`
          \`cached_input_tokens=$CACHED_TOKENS\`
          \`output_tokens=$OUTPUT_TOKENS\`
          \`total_tokens=$TOTAL_TOKENS\`
          \`estimated_cost_usd=$ESTIMATED_COST_USD\`

          $REASON

          Revue OpenAI contrôlée uniquement. Aucun droit d’écriture métier et aucun déclenchement Claude ne résultent de ce verdict.
          EOF
          RESULT_URL=$(gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/result.md)
          RESULT_COMMENT_ID=$(printf '%s' "$RESULT_URL" | sed -n 's/.*issuecomment-\([0-9]*\).*/\1/p')
          test -n "$RESULT_COMMENT_ID" || fail "cannot extract review result comment id"

          COMMENTS_AFTER=$(gh api --paginate "repos/${{ github.repository }}/issues/17/comments")
          LEDGER_ID=$(printf '%s' "$COMMENTS_AFTER" | jq -r '[.[] | select(.body | startswith("[KODJO_API_COST_LEDGER_ACTIVE]"))] | last | .id // empty')
          if [ -n "$LEDGER_ID" ]; then
            LEDGER_BODY=$(printf '%s' "$COMMENTS_AFTER" | jq -r --argjson id "$LEDGER_ID" '.[] | select(.id == $id) | .body')
            LEDGER_JSON=$(printf '%s\n' "$LEDGER_BODY" | sed -n '/```json/,/```/p' | sed '1d;$d')
            if [ -n "$LEDGER_JSON" ]; then
              UPDATED_LEDGER=$(printf '%s' "$LEDGER_JSON" | jq \
                --arg response_id "$RESPONSE_ID" --arg model "$MODEL" --argjson input "$INPUT_TOKENS" --argjson cached "$CACHED_TOKENS" --argjson output "$OUTPUT_TOKENS" --argjson total "$TOTAL_TOKENS" --argjson cost "$ESTIMATED_COST_USD" --argjson result_comment_id "$RESULT_COMMENT_ID" \
                '.calls += [{phase:"E2E_AUTOMATION_TEST",response_id:$response_id,model:$model,input_tokens:$input,cached_input_tokens:$cached,output_tokens:$output,total_tokens:$total,estimated_cost_usd:$cost,cost_basis:"token usage returned by Responses API × published Luna rates",result_comment_id:$result_comment_id}] | .totals.calls=(.calls|length) | .totals.input_tokens=([.calls[].input_tokens]|add) | .totals.output_tokens=([.calls[].output_tokens]|add) | .totals.total_tokens=([.calls[].total_tokens]|add) | .totals.estimated_cost_usd=([.calls[].estimated_cost_usd]|add)')
              {
                echo '[KODJO_API_COST_LEDGER_ACTIVE]'; echo; echo '```json'; printf '%s\n' "$UPDATED_LEDGER"; echo '```'; echo; echo 'Registre opérationnel consolidé des appels OpenAI de l’orchestration KODJO. Les coûts sont des estimations ; la facturation OpenAI reste la source comptable finale.'
              } > /tmp/ledger.md
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$LEDGER_ID" -f body="$(cat /tmp/ledger.md)" >/dev/null
            fi
          fi

          jq -n --argjson issue 17 --arg result_comment_id "$RESULT_COMMENT_ID" --arg checkpoint_state "$STATE" --arg branch "$BRANCH" --arg head "$HEAD" --arg source_comment_id "$SOURCE_COMMENT_ID" \
            '{event_type:"kodjo-e2e-review-complete",client_payload:{issue:$issue,result_comment_id:$result_comment_id,checkpoint_state:$checkpoint_state,branch:$branch,head:$head,source_comment_id:$source_comment_id,implementation_authorized:"false"}}' \
            | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -
