name: KODJO V1.3 Integrated T1-T9 Test

run-name: KODJO T1-T9 — ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  TEST_ID: KODJO-V13-T1T9-20260829-01
  TEST_PR: 19
  TEST_BRANCH: orchestration/v1-3-integrated-t1-t9
  SIGNAL_FILE: .github/orchestration/KODJO_WORK_TRANSPORT_COMMIT_TEST.txt

jobs:
  claude-transition:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 19 &&
      github.event.comment.user.login == 'MyUncried' &&
      contains(github.event.comment.body, 'test_id=KODJO-V13-T1T9-20260829-01') &&
      (contains(github.event.comment.body, '[KODJO_T1T9_START]') ||
       contains(github.event.comment.body, '[KODJO_T1T9_REVIEW_CHANGES_REQUESTED]') ||
       contains(github.event.comment.body, '[KODJO_T1T9_REVIEW_RETEST_REQUIRED]') ||
       contains(github.event.comment.body, '[KODJO_T1T9_DECISION_MID]') ||
       contains(github.event.comment.body, '[KODJO_T1T9_DECISION_LOOP3]'))
    runs-on: ubuntu-latest
    steps:
      - name: Classify and validate causal event
        id: classify
        env:
          SOURCE_BODY: ${{ github.event.comment.body }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          case "$SOURCE_BODY" in
            *"[KODJO_T1T9_START]"*)
              stage="INITIAL"
              transition="T1"
              required_choice=""
              ;;
            *"[KODJO_T1T9_REVIEW_CHANGES_REQUESTED]"*)
              stage="CORRECTION"
              transition="T3"
              required_choice=""
              ;;
            *"[KODJO_T1T9_REVIEW_RETEST_REQUIRED]"*)
              stage="RETEST"
              transition="T5"
              required_choice=""
              ;;
            *"[KODJO_T1T9_DECISION_MID]"*)
              stage="MID_RESUME"
              transition="T6"
              required_choice="A"
              ;;
            *"[KODJO_T1T9_DECISION_LOOP3]"*)
              stage="FINAL"
              transition="T9"
              required_choice="A"
              ;;
            *)
              exit 1
              ;;
          esac
          if [ -n "$required_choice" ]; then
            if printf '%s' "$SOURCE_BODY" | grep -Fxq "choice=$required_choice"; then
              :
            elif printf '%s' "$SOURCE_BODY" | grep -Fxq 'choice=C'; then
              printf '%s' "$SOURCE_BODY" | grep -Fxq 'choice_type=OTHER'
              printf '%s' "$SOURCE_BODY" | grep -Fxq 'definition_status=SUFFICIENT'
              printf '%s' "$SOURCE_BODY" | grep -Fxq 'decision_effect=CONTINUE'
            else
              echo "Decision must be A or a sufficiently defined C/OTHER with CONTINUE effect." >&2
              exit 1
            fi
          fi
          {
            echo "stage=$stage"
            echo "transition=$transition"
            echo "source_comment_id=$SOURCE_COMMENT_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Idempotency preflight
        id: idempotency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ steps.classify.outputs.stage }}
          TRANSITION_ID: ${{ steps.classify.outputs.transition }}
          SOURCE_COMMENT_ID: ${{ steps.classify.outputs.source_comment_id }}
        run: |
          set -euo pipefail
          existing_id=$(gh api "repos/${{ github.repository }}/issues/$TEST_PR/comments" --paginate | jq -r --arg test_id "$TEST_ID" --arg transition "$TRANSITION_ID" --arg stage "$STAGE" --arg source "$SOURCE_COMMENT_ID" '
            .[] | select(
              (.body | contains("test_id=" + $test_id)) and
              (.body | contains("transition_id=" + $transition)) and
              (.body | contains("stage=" + $stage)) and
              (.body | contains("source_comment_id=" + $source))
            ) | .id' | head -n 1)
          if [ -n "$existing_id" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "existing_comment_id=$existing_id" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Claude continuity and delta
        id: continuity
        if: steps.idempotency.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ steps.classify.outputs.stage }}
        run: |
          set -euo pipefail
          case "$STAGE" in
            INITIAL)
              previous_stage=""
              delta_nature="INITIAL_CHECKPOINT_AND_MANIFEST"
              ;;
            CORRECTION)
              previous_stage="INITIAL"
              delta_nature="CHANGES_REQUESTED:COMPUTE_ACTUAL_MANIFEST_SHA256"
              ;;
            RETEST)
              previous_stage="CORRECTION"
              delta_nature="RETEST_REQUIRED:REVALIDATE_SAME_MANIFEST"
              ;;
            MID_RESUME)
              previous_stage="RETEST"
              delta_nature="USER_DECISION_MID:A"
              ;;
            FINAL)
              previous_stage="MID_RESUME"
              delta_nature="USER_DECISION_LOOP3:A_AND_FINAL_VERIFICATION"
              ;;
          esac
          previous_session_id=""
          if [ -n "$previous_stage" ]; then
            previous_session_id=$(gh api "repos/${{ github.repository }}/issues/$TEST_PR/comments" --paginate | jq -r --arg test_id "$TEST_ID" --arg stage "$previous_stage" '
              [.[] | select(
                (.body | contains("test_id=" + $test_id)) and
                (.body | contains("stage=" + $stage)) and
                (.body | contains("session_id="))
              )] | last | .body // ""' | sed -n 's/^session_id=//p' | head -n 1)
          fi
          if [ -n "$previous_session_id" ]; then
            resume_arg="--resume $previous_session_id"
            requested_mode="SESSION_RESUME_REQUESTED"
          else
            resume_arg=""
            requested_mode="NEW_SESSION_CHECKPOINT_DELTA"
          fi
          delta_size_bytes=$(printf '%s' "$delta_nature" | wc -c | tr -d ' ')
          {
            echo "previous_session_id=$previous_session_id"
            echo "resume_arg=$resume_arg"
            echo "requested_mode=$requested_mode"
            echo "delta_nature=$delta_nature"
            echo "delta_size_bytes=$delta_size_bytes"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.idempotency.outputs.should_run == 'true'
        with:
          ref: ${{ env.TEST_BRANCH }}
          fetch-depth: 0

      - name: Verify isolated technical scope and source attestation
        if: steps.idempotency.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          test -f .github/orchestration/KODJO_V13_T1_T9_TEST.md
          test -z "$(git status --porcelain)"
          changed=$(git diff --name-only origin/main...HEAD | sort)
          allowed=$(printf '%s\n' \
            '.github/orchestration/KODJO_V13_T1_T9_TEST.md' \
            "$SIGNAL_FILE" | sort)
          test "$changed" = "$allowed"

      - name: Call real Claude Cloud
        if: steps.idempotency.outputs.should_run == 'true'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            KODJO V1.3 integrated orchestration test.
            test_id=${{ env.TEST_ID }}
            transition_id=${{ steps.classify.outputs.transition }}
            stage=${{ steps.classify.outputs.stage }}
            source_comment_id=${{ steps.classify.outputs.source_comment_id }}
            continuity_requested=${{ steps.continuity.outputs.requested_mode }}
            previous_session_id=${{ steps.continuity.outputs.previous_session_id }}
            delta_nature=${{ steps.continuity.outputs.delta_nature }}
            delta_size_bytes=${{ steps.continuity.outputs.delta_size_bytes }}
            Strictly read-only. Read only .github/orchestration/KODJO_V13_T1_T9_TEST.md.
            Never edit, commit, push, or access business files.
            Return one JSON object with fields:
            status, test_id, transition_id, stage, source_comment_id,
            manifest_sha256, manifest_summary, business_write,
            implementation_authorized, permissions_denied, unnecessary_reconstruction,
            sources_read, read_operations_count, repeated_reads_detected,
            history_reconstruction_detected, delta_nature.
            For INITIAL only, set manifest_sha256 to "INTENTIONALLY_OMITTED_FOR_REVIEW_LOOP".
            For every later stage, compute the actual SHA-256 of the manifest with an allowed read-only shell command.
            business_write and implementation_authorized must be false.
            End status with KODJO_T1T9_${{ steps.classify.outputs.stage }}_SUCCESS.
          claude_args: |
            ${{ steps.continuity.outputs.resume_arg }}
            --allowedTools "Read,Bash(sha256sum .github/orchestration/KODJO_V13_T1_T9_TEST.md)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string"},"test_id":{"type":"string"},"transition_id":{"type":"string"},"stage":{"type":"string"},"source_comment_id":{"type":"string"},"manifest_sha256":{"type":"string"},"manifest_summary":{"type":"string"},"business_write":{"type":"boolean"},"implementation_authorized":{"type":"boolean"},"permissions_denied":{"type":"integer"},"unnecessary_reconstruction":{"type":"boolean"},"sources_read":{"type":"array","items":{"type":"string"}},"read_operations_count":{"type":"integer"},"repeated_reads_detected":{"type":"boolean"},"history_reconstruction_detected":{"type":"boolean"},"delta_nature":{"type":"string"}},"required":["status","test_id","transition_id","stage","source_comment_id","manifest_sha256","manifest_summary","business_write","implementation_authorized","permissions_denied","unnecessary_reconstruction","sources_read","read_operations_count","repeated_reads_detected","history_reconstruction_detected","delta_nature"]}'

      - name: Retry Claude with checkpoint delta when session resume is unavailable
        if: steps.claude.outcome == 'failure' && steps.continuity.outputs.requested_mode == 'SESSION_RESUME_REQUESTED'
        id: claude_fallback
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            KODJO V1.3 integrated orchestration test.
            test_id=${{ env.TEST_ID }}
            transition_id=${{ steps.classify.outputs.transition }}
            stage=${{ steps.classify.outputs.stage }}
            source_comment_id=${{ steps.classify.outputs.source_comment_id }}
            continuity_requested=NEW_SESSION_CHECKPOINT_DELTA_AFTER_RESUME_FAILURE
            previous_session_id=${{ steps.continuity.outputs.previous_session_id }}
            delta_nature=${{ steps.continuity.outputs.delta_nature }}
            delta_size_bytes=${{ steps.continuity.outputs.delta_size_bytes }}
            Strictly read-only. Read only .github/orchestration/KODJO_V13_T1_T9_TEST.md.
            Never edit, commit, push, or access business files.
            Return one JSON object with fields:
            status, test_id, transition_id, stage, source_comment_id,
            manifest_sha256, manifest_summary, business_write,
            implementation_authorized, permissions_denied, unnecessary_reconstruction,
            sources_read, read_operations_count, repeated_reads_detected,
            history_reconstruction_detected, delta_nature.
            For INITIAL only, set manifest_sha256 to "INTENTIONALLY_OMITTED_FOR_REVIEW_LOOP".
            For every later stage, compute the actual SHA-256 of the manifest with an allowed read-only shell command.
            business_write and implementation_authorized must be false.
            End status with KODJO_T1T9_${{ steps.classify.outputs.stage }}_SUCCESS.
          claude_args: |
            --allowedTools "Read,Bash(sha256sum .github/orchestration/KODJO_V13_T1_T9_TEST.md)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string"},"test_id":{"type":"string"},"transition_id":{"type":"string"},"stage":{"type":"string"},"source_comment_id":{"type":"string"},"manifest_sha256":{"type":"string"},"manifest_summary":{"type":"string"},"business_write":{"type":"boolean"},"implementation_authorized":{"type":"boolean"},"permissions_denied":{"type":"integer"},"unnecessary_reconstruction":{"type":"boolean"},"sources_read":{"type":"array","items":{"type":"string"}},"read_operations_count":{"type":"integer"},"repeated_reads_detected":{"type":"boolean"},"history_reconstruction_detected":{"type":"boolean"},"delta_nature":{"type":"string"}},"required":["status","test_id","transition_id","stage","source_comment_id","manifest_sha256","manifest_summary","business_write","implementation_authorized","permissions_denied","unnecessary_reconstruction","sources_read","read_operations_count","repeated_reads_detected","history_reconstruction_detected","delta_nature"]}'

      - name: Select valid Claude execution
        id: selected_claude
        if: steps.idempotency.outputs.should_run == 'true'
        env:
          PRIMARY_OUTCOME: ${{ steps.claude.outcome }}
          FALLBACK_OUTCOME: ${{ steps.claude_fallback.outcome }}
          PRIMARY_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          FALLBACK_EXECUTION_FILE: ${{ steps.claude_fallback.outputs.execution_file }}
          PRIMARY_SESSION_ID: ${{ steps.claude.outputs.session_id }}
          FALLBACK_SESSION_ID: ${{ steps.claude_fallback.outputs.session_id }}
          PRIMARY_STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          FALLBACK_STRUCTURED_OUTPUT: ${{ steps.claude_fallback.outputs.structured_output }}
          ORIGINAL_REQUESTED_MODE: ${{ steps.continuity.outputs.requested_mode }}
        run: |
          set -euo pipefail
          if [ "$PRIMARY_OUTCOME" = "success" ]; then
            execution_file="$PRIMARY_EXECUTION_FILE"
            session_id="$PRIMARY_SESSION_ID"
            structured_output="$PRIMARY_STRUCTURED_OUTPUT"
            effective_mode="$ORIGINAL_REQUESTED_MODE"
            resume_failure="false"
          elif [ "$FALLBACK_OUTCOME" = "success" ]; then
            execution_file="$FALLBACK_EXECUTION_FILE"
            session_id="$FALLBACK_SESSION_ID"
            structured_output="$FALLBACK_STRUCTURED_OUTPUT"
            effective_mode="NEW_SESSION_CHECKPOINT_DELTA"
            resume_failure="true"
          else
            echo "Neither requested resume nor checkpoint-delta fallback produced a valid Claude result." >&2
            exit 1
          fi
          {
            echo "execution_file=$execution_file"
            echo "session_id=$session_id"
            echo "effective_mode=$effective_mode"
            echo "resume_failure=$resume_failure"
            echo "structured_output<<KODJO_EOF"
            echo "$structured_output"
            echo "KODJO_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Collect performance and continuity evidence
        id: performance
        if: steps.idempotency.outputs.should_run == 'true'
        env:
          EXECUTION_FILE: ${{ steps.selected_claude.outputs.execution_file }}
          RETURNED_SESSION_ID: ${{ steps.selected_claude.outputs.session_id }}
          PREVIOUS_SESSION_ID: ${{ steps.continuity.outputs.previous_session_id }}
          REQUESTED_MODE: ${{ steps.selected_claude.outputs.effective_mode }}
          DELTA_NATURE: ${{ steps.continuity.outputs.delta_nature }}
          DELTA_SIZE_BYTES: ${{ steps.continuity.outputs.delta_size_bytes }}
        run: |
          set -euo pipefail
          test -n "$EXECUTION_FILE"
          test -f "$EXECUTION_FILE"
          result=$(jq -sc '[.. | objects | select(.type? == "result")] | last // {}' "$EXECUTION_FILE")
          claude_model=$(printf '%s' "$result" | jq -r '.model // "NON_VERIFIABLE"')
          duration_ms=$(printf '%s' "$result" | jq -r '.duration_ms // "NON_VERIFIABLE"')
          num_turns=$(printf '%s' "$result" | jq -r '.num_turns // "NON_VERIFIABLE"')
          total_cost_usd=$(printf '%s' "$result" | jq -r '.total_cost_usd // "NON_VERIFIABLE"')
          permission_denials=$(printf '%s' "$result" | jq -r '.permission_denials_count // "NON_VERIFIABLE"')
          read_operations=$(jq -sc '[.. | objects | select((.name? == "Read") or (.tool_name? == "Read"))] | length' "$EXECUTION_FILE")
          bash_operations=$(jq -sc '[.. | objects | select((.name? == "Bash") or (.tool_name? == "Bash"))] | length' "$EXECUTION_FILE")
          manifest_bytes=$(wc -c < .github/orchestration/KODJO_V13_T1_T9_TEST.md | tr -d ' ')
          if [ "$REQUESTED_MODE" = "NEW_SESSION_CHECKPOINT_DELTA" ]; then
            continuity_mode="NEW_SESSION_CHECKPOINT_DELTA"
          elif [ -n "$PREVIOUS_SESSION_ID" ] && [ "$RETURNED_SESSION_ID" = "$PREVIOUS_SESSION_ID" ]; then
            continuity_mode="SESSION_RESUMED"
          else
            continuity_mode="NON_VERIFIABLE"
          fi
          jq -n             --arg claude_model "$claude_model"             --arg duration_ms "$duration_ms"             --arg num_turns "$num_turns"             --arg total_cost_usd "$total_cost_usd"             --arg permission_denials "$permission_denials"             --arg continuity_mode "$continuity_mode"             --arg requested_mode "$REQUESTED_MODE"             --arg previous_session_id "$PREVIOUS_SESSION_ID"             --arg returned_session_id "$RETURNED_SESSION_ID"             --arg manifest_bytes "$manifest_bytes"             --arg delta_nature "$DELTA_NATURE"             --arg delta_size_bytes "$DELTA_SIZE_BYTES"             --arg read_operations "$read_operations"             --arg bash_operations "$bash_operations"             '{
              claude_model:$claude_model,
              claude_duration_ms:$duration_ms,
              claude_num_turns:$num_turns,
              claude_cost_usd:$total_cost_usd,
              claude_metric_source:"claude-code-action execution result",
              permission_denials_count:$permission_denials,
              openai_model:"NON_VERIFIABLE",
              openai_api_calls:"NON_VERIFIABLE",
              openai_input_tokens:"NON_VERIFIABLE",
              openai_output_tokens:"NON_VERIFIABLE",
              openai_cost_usd:"NON_VERIFIABLE",
              other_api_cost_usd:"NON_VERIFIABLE",
              measured_ai_cost_usd:$total_cost_usd,
              unverified_cost_components:["openai_cost_usd","other_api_cost_usd"],
              continuity_mode:$continuity_mode,
              continuity_requested:$requested_mode,
              previous_session_id:$previous_session_id,
              returned_session_id:$returned_session_id,
              total_context_tokens:"NON_VERIFIABLE",
              orchestrator_manifest_bytes:$manifest_bytes,
              delta_nature:$delta_nature,
              delta_size_bytes:$delta_size_bytes,
              observed_read_operations:$read_operations,
              observed_bash_operations:$bash_operations,
              full_execution_log_available:true
            }' > "$RUNNER_TEMP/kodjo-performance.json"
          {
            echo "continuity_mode=$continuity_mode"
            echo "session_id=$RETURNED_SESSION_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Validate and publish Claude result deterministically
        id: publish
        if: steps.idempotency.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRUCTURED_OUTPUT: ${{ steps.selected_claude.outputs.structured_output }}
          STAGE: ${{ steps.classify.outputs.stage }}
          TRANSITION_ID: ${{ steps.classify.outputs.transition }}
          SOURCE_COMMENT_ID: ${{ steps.classify.outputs.source_comment_id }}
          PERFORMANCE_FILE: ${{ runner.temp }}/kodjo-performance.json
          SESSION_ID: ${{ steps.performance.outputs.session_id }}
          CONTINUITY_MODE: ${{ steps.performance.outputs.continuity_mode }}
        run: |
          set -euo pipefail
          test -f "$PERFORMANCE_FILE"
          PERFORMANCE=$(jq -c . "$PERFORMANCE_FILE")
          printf '%s' "$STRUCTURED_OUTPUT" | jq -e '
            .test_id == env.TEST_ID and
            .transition_id == env.TRANSITION_ID and
            .stage == env.STAGE and
            .source_comment_id == env.SOURCE_COMMENT_ID and
            .business_write == false and
            .implementation_authorized == false
          ' >/dev/null
          marker="[KODJO_T1T9_CLAUDE_RESULT]"
          if [ "$STAGE" = "RETEST" ]; then marker="[KODJO_T1T9_WORK_ARBITRATION_REQUEST]"; fi
          if [ "$STAGE" = "MID_RESUME" ]; then marker="[KODJO_T1T9_WORK_ARBITRATION_REQUEST]"; fi
          if [ "$STAGE" = "FINAL" ]; then marker="[KODJO_T1T9_FINAL_RESULT]"; fi
          state_after="RESULT_PUBLISHED"
          checkpoint="NONE"
          if [ "$marker" = "[KODJO_T1T9_WORK_ARBITRATION_REQUEST]" ]; then
            state_after="ARBITRAGE"
            checkpoint="ARBITRAGE"
          fi
          body=$(jq -nr --arg marker "$marker" --arg test_id "$TEST_ID" --arg transition_id "$TRANSITION_ID" --arg stage "$STAGE" --arg source_comment_id "$SOURCE_COMMENT_ID" --arg state_after "$state_after" --arg checkpoint "$checkpoint" --arg session_id "$SESSION_ID" --arg continuity_mode "$CONTINUITY_MODE" --argjson performance "$PERFORMANCE" --argjson result "$STRUCTURED_OUTPUT" '"\($marker) VERIFIED_SUCCESS\n\ntest_id=\($test_id)\ntransition_id=\($transition_id)\nstage=\($stage)\nsource_comment_id=\($source_comment_id)\nsource_actor=CLAUDE_CLOUD_REAL\ndestination_actor=CHATGPT_WORK\nstate_after=\($state_after)\ncheckpoint=\($checkpoint)\nresume_from=\($source_comment_id)\nsession_id=\($session_id)\ncontinuity_mode=\($continuity_mode)\nbusiness_write=false\nimplementation_authorized=false\n\nperformance=\($performance|tojson)\nstructured_output=\($result|tojson)"')
          payload=$(jq -n --arg body "$body" '{body:$body}')
          response=$(printf '%s' "$payload" | gh api "repos/${{ github.repository }}/issues/$TEST_PR/comments" --method POST --input -)
          published_id=$(printf '%s' "$response" | jq -er '.id')
          published=$(gh api "repos/${{ github.repository }}/issues/comments/$published_id")
          printf '%s' "$published" | jq -e --arg test_id "$TEST_ID" --arg source "$SOURCE_COMMENT_ID" '
            (.id | type == "number") and
            (.body | contains("test_id=" + $test_id)) and
            (.body | contains("source_comment_id=" + $source)) and
            (.body | contains("business_write=false"))
          ' >/dev/null
          echo "published_comment_id=$published_id" >> "$GITHUB_OUTPUT"

      - name: Emit one idempotent synchronize signal after verified publication
        if: steps.idempotency.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DURABLE_COMMENT_ID: ${{ steps.publish.outputs.published_comment_id }}
          TRANSITION_ID: ${{ steps.classify.outputs.transition }}
          STAGE: ${{ steps.classify.outputs.stage }}
        run: |
          set -euo pipefail
          signal_id="$TEST_ID:$TRANSITION_ID:$DURABLE_COMMENT_ID"
          git fetch origin "$TEST_BRANCH"
          git checkout -B "$TEST_BRANCH" "origin/$TEST_BRANCH"
          if test -f "$SIGNAL_FILE" && grep -Fxq "signal_id=$signal_id" "$SIGNAL_FILE"; then
            echo "Signal already exists; no duplicate synchronize."
            exit 0
          fi
          durable=$(gh api "repos/${{ github.repository }}/issues/comments/$DURABLE_COMMENT_ID")
          printf '%s' "$durable" | jq -e --arg test_id "$TEST_ID" '
            (.id | type == "number") and
            (.body | contains("test_id=" + $test_id)) and
            (.body | contains("business_write=false")) and
            (.body | contains("implementation_authorized=false"))
          ' >/dev/null
          requested_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          {
            echo "test_id=$TEST_ID"
            echo "transition_id=$TRANSITION_ID"
            echo "state_checkpoint=RESULT_PUBLISHED:$STAGE"
            echo "source_comment_id=$DURABLE_COMMENT_ID"
            echo "signal_id=$signal_id"
            echo "pull_request=$TEST_PR"
            echo "event=pull_request:synchronize"
            echo "event_actor=github-actions[bot]"
            echo "signal_requested_at=$requested_at"
            echo "event_timestamp=RESOLVE_FROM_SIGNAL_COMMIT"
            echo "work_execution_timestamp=PENDING"
            echo "business_write=false"
            echo "implementation_authorized=false"
          } > "$SIGNAL_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SIGNAL_FILE"
          git commit -m "test: signal Work for $TRANSITION_ID [$DURABLE_COMMENT_ID]"
          git push origin "HEAD:$TEST_BRANCH"

  resume-after-transport-fix:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 19 &&
      github.event.comment.user.login == 'MyUncried' &&
      contains(github.event.comment.body, '[KODJO_T1T9_RESUME_AFTER_TRANSPORT_FIX]') &&
      contains(github.event.comment.body, 'test_id=KODJO-V13-T1T9-20260829-01')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and verify existing INITIAL durable result
        id: durable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          durable=$(gh api "repos/${{ github.repository }}/issues/$TEST_PR/comments" --paginate | jq -c --arg test_id "$TEST_ID" '
            [.[] | select(
              (.body | contains("[KODJO_T1T9_CLAUDE_RESULT] VERIFIED_SUCCESS")) and
              (.body | contains("test_id=" + $test_id)) and
              (.body | contains("stage=INITIAL")) and
              (.body | contains("source_actor=CLAUDE_CLOUD_REAL")) and
              (.body | contains("business_write=false")) and
              (.body | contains("implementation_authorized=false"))
            )] | last')
          test "$durable" != "null"
          durable_id=$(printf '%s' "$durable" | jq -er '.id')
          test "$durable_id" = "5463979537"
          body=$(printf '%s' "$durable" | jq -er '.body')
          printf '%s' "$body" | grep -Fq 'structured_output={"status":"KODJO_T1T9_INITIAL_SUCCESS"'
          printf '%s' "$body" | grep -Fq '"manifest_sha256":"INTENTIONALLY_OMITTED_FOR_REVIEW_LOOP"'
          printf '%s' "$body" | grep -Fq '"total_cost_usd":"0.18031600000000003"'
          echo "durable_comment_id=$durable_id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TEST_BRANCH }}
          fetch-depth: 0

      - name: Emit resume synchronize without recalling Claude
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DURABLE_COMMENT_ID: ${{ steps.durable.outputs.durable_comment_id }}
        run: |
          set -euo pipefail
          transition_id="T2_TO_T3_REVIEW"
          signal_id="$TEST_ID:$transition_id:$DURABLE_COMMENT_ID"
          if test -f "$SIGNAL_FILE" && grep -Fxq "signal_id=$signal_id" "$SIGNAL_FILE"; then
            echo "Resume signal already exists; Claude INITIAL remains reused."
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/issues/$TEST_PR/comments" --paginate | jq -e --arg test_id "$TEST_ID" --arg source "$DURABLE_COMMENT_ID" '
            any(.[]; (.body | contains("[KODJO_T1T9_REVIEW_CHANGES_REQUESTED]")) and
                     (.body | contains("test_id=" + $test_id)) and
                     (.body | contains("source_comment_id=" + $source)))' >/dev/null; then
            echo "Durable INITIAL was already reviewed; no duplicate signal."
            exit 0
          fi
          requested_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          {
            echo "test_id=$TEST_ID"
            echo "transition_id=$transition_id"
            echo "state_checkpoint=INITIAL_RESULT_PUBLISHED"
            echo "source_comment_id=$DURABLE_COMMENT_ID"
            echo "signal_id=$signal_id"
            echo "pull_request=$TEST_PR"
            echo "event=pull_request:synchronize"
            echo "event_actor=github-actions[bot]"
            echo "signal_requested_at=$requested_at"
            echo "event_timestamp=RESOLVE_FROM_SIGNAL_COMMIT"
            echo "work_execution_timestamp=PENDING"
            echo "business_write=false"
            echo "implementation_authorized=false"
            echo "claude_initial_recall=false"
          } > "$SIGNAL_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SIGNAL_FILE"
          git commit -m "test: resume Work from INITIAL result [5463979537]"
          git push origin "HEAD:$TEST_BRANCH"

  signal-existing-retest:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 19 &&
      github.event.comment.user.login == 'MyUncried' &&
      contains(github.event.comment.body, '[KODJO_T1T9_SIGNAL_EXISTING_RETEST]') &&
      contains(github.event.comment.body, 'test_id=KODJO-V13-T1T9-20260829-01')
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing RETEST result
        id: durable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          durable_id=$(printf '%s' "$SOURCE_BODY" | sed -n 's/^durable_comment_id=//p' | head -n 1)
          test -n "$durable_id"
          durable=$(gh api "repos/${{ github.repository }}/issues/comments/$durable_id")
          printf '%s' "$durable" | jq -e --arg test_id "$TEST_ID" '
            (.body | contains("[KODJO_T1T9_WORK_ARBITRATION_REQUEST] VERIFIED_SUCCESS")) and
            (.body | contains("test_id=" + $test_id)) and
            (.body | contains("stage=RETEST")) and
            (.body | contains("KODJO_T1T9_RETEST_SUCCESS")) and
            (.body | contains("business_write=false")) and
            (.body | contains("implementation_authorized=false"))
          ' >/dev/null
          echo "durable_comment_id=$durable_id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TEST_BRANCH }}
          fetch-depth: 0

      - name: Emit synchronize for recovered RETEST publication
        env:
          DURABLE_COMMENT_ID: ${{ steps.durable.outputs.durable_comment_id }}
        run: |
          set -euo pipefail
          transition_id="T5"
          signal_id="$TEST_ID:$transition_id:$DURABLE_COMMENT_ID"
          if test -f "$SIGNAL_FILE" && grep -Fxq "signal_id=$signal_id" "$SIGNAL_FILE"; then exit 0; fi
          requested_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          {
            echo "test_id=$TEST_ID"
            echo "transition_id=$transition_id"
            echo "state_checkpoint=ARBITRAGE:RETEST"
            echo "source_comment_id=$DURABLE_COMMENT_ID"
            echo "signal_id=$signal_id"
            echo "pull_request=$TEST_PR"
            echo "event=pull_request:synchronize"
            echo "event_actor=github-actions[bot]"
            echo "signal_requested_at=$requested_at"
            echo "event_timestamp=RESOLVE_FROM_SIGNAL_COMMIT"
            echo "work_execution_timestamp=PENDING"
            echo "business_write=false"
            echo "implementation_authorized=false"
          } > "$SIGNAL_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SIGNAL_FILE"
          git commit -m "test: signal Work for recovered RETEST [$DURABLE_COMMENT_ID]"
          git push origin "HEAD:$TEST_BRANCH"

  advance-arbitration:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 19 &&
      github.event.comment.user.login == 'MyUncried' &&
      contains(github.event.comment.body, 'test_id=KODJO-V13-T1T9-20260829-01') &&
      (contains(github.event.comment.body, '[KODJO_T1T9_DECISION_LOOP1]') ||
       contains(github.event.comment.body, '[KODJO_T1T9_DECISION_LOOP2]'))
    runs-on: ubuntu-latest
    steps:
      - name: Validate decision and publish next Work arbitration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BODY: ${{ github.event.comment.body }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          if printf '%s' "$SOURCE_BODY" | grep -Fxq 'choice=A'; then
            :
          elif printf '%s' "$SOURCE_BODY" | grep -Fxq 'choice=C'; then
            printf '%s' "$SOURCE_BODY" | grep -Fxq 'choice_type=OTHER'
            printf '%s' "$SOURCE_BODY" | grep -Fxq 'definition_status=SUFFICIENT'
            printf '%s' "$SOURCE_BODY" | grep -Fxq 'decision_effect=CONTINUE'
          else
            echo "Decision must be A or a sufficiently defined C/OTHER with CONTINUE effect." >&2
            exit 1
          fi
          if printf '%s' "$SOURCE_BODY" | grep -Fq '[KODJO_T1T9_DECISION_LOOP1]'; then
            next_stage="LOOP2"
            transition_id="T8.2"
          else
            next_stage="LOOP3"
            transition_id="T8.3"
          fi
          existing_id=$(gh api "repos/${{ github.repository }}/issues/$TEST_PR/comments" --paginate | jq -r --arg test_id "$TEST_ID" --arg transition "$transition_id" --arg stage "$next_stage" --arg source "$SOURCE_COMMENT_ID" '
            .[] | select(
              (.body | contains("test_id=" + $test_id)) and
              (.body | contains("transition_id=" + $transition)) and
              (.body | contains("stage=" + $stage)) and
              (.body | contains("source_comment_id=" + $source))
            ) | .id' | head -n 1)
          if [ -n "$existing_id" ]; then
            echo "existing_comment_id=$existing_id"
            exit 0
          fi
          body=$(jq -nr             --arg test_id "$TEST_ID"             --arg transition_id "$transition_id"             --arg stage "$next_stage"             --arg source_comment_id "$SOURCE_COMMENT_ID"             '"[KODJO_T1T9_WORK_ARBITRATION_REQUEST]\n\ntest_id=\($test_id)\ntransition_id=\($transition_id)\nstage=\($stage)\nsource_comment_id=\($source_comment_id)\nsource_actor=GITHUB_ORCHESTRATION\ndestination_actor=CHATGPT_WORK\ncheckpoint=ARBITRAGE\nresume_from=\($source_comment_id)\nbusiness_write=false\nimplementation_authorized=false"')
          payload=$(jq -n --arg body "$body" '{body:$body}')
          response=$(printf '%s' "$payload" | gh api "repos/${{ github.repository }}/issues/$TEST_PR/comments" --method POST --input -)
          published_id=$(printf '%s' "$response" | jq -er '.id')
          published=$(gh api "repos/${{ github.repository }}/issues/comments/$published_id")
          printf '%s' "$published" | jq -e --arg test_id "$TEST_ID" --arg source "$SOURCE_COMMENT_ID" '
            (.body | contains("test_id=" + $test_id)) and
            (.body | contains("source_comment_id=" + $source)) and
            (.body | contains("checkpoint=ARBITRAGE"))
          ' >/dev/null
          echo "published_comment_id=$published_id"
