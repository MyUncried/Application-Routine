name: iOS Routine Dev review build

run-name: Routine Dev review build — ${{ inputs.target_ref }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Git ref to build for Routine Dev"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: eas-ios-routine-dev-review-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Routine Dev review binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: development

    steps:
      - name: Checkout current environment tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout requested application ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: delivery

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Materialize Routine Dev review environment
        shell: bash
        run: |
          set -euo pipefail
          application_head="$(git -C delivery rev-parse HEAD)"
          application_base="$(git -C delivery rev-parse HEAD^)"
          protocol_head="$(git rev-parse HEAD)"
          compatibility="${RUNNER_TEMP}/routine-dev-compatibility.json"
          contract="${RUNNER_TEMP}/routine-dev-environment-contract.json"
          (
            cd delivery
            node ../scripts/kodjo/classify-environment-update.js "$application_base" "$application_head" "$compatibility"
          )
          node scripts/kodjo/materialize-review-environment.js             delivery             "$compatibility"             "$contract"             "$protocol_head"             "$application_head"

      - name: Verify Expo authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || {
            echo "::error::Repository secret EXPO_TOKEN is missing."
            exit 1
          }

      - name: Install project dependencies
        working-directory: delivery
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Verify Routine Dev review configuration
        working-directory: delivery
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public --json > "${RUNNER_TEMP}/routine-dev-review-config.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/routine-dev-review-config.json','utf8'));
          if(c.name!=='Routine Dev') throw new Error('ROUTINE_DEV_NAME_INVALID');
          if(c.ios?.bundleIdentifier!=='com.ankusha.kodjo.dev') throw new Error('ROUTINE_DEV_BUNDLE_ID_INVALID');
          if(c.extra?.eas?.projectId!=='0ee44f86-bd22-4b92-8780-e265b72907d9') throw new Error('EAS_PROJECT_ID_INVALID');
          if(c.updates?.url!=='https://u.expo.dev/0ee44f86-bd22-4b92-8780-e265b72907d9') throw new Error('EAS_UPDATE_URL_INVALID');
          if(!c.runtimeVersion) throw new Error('EAS_RUNTIME_VERSION_MISSING');
          NODE

      - name: Install EAS CLI
        shell: bash
        run: npm install --global eas-cli@21.7.1

      - name: Submit Routine Dev review build
        id: build
        working-directory: delivery
        shell: bash
        run: |
          set -euo pipefail
          eas build             --platform ios             --profile review             --non-interactive             --no-wait             --json > eas-build.json
          cat eas-build.json
          node - <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('eas-build.json','utf8'));
          const first=Array.isArray(payload)?payload[0]:payload;
          const id=first?.id||first?.buildId||'';
          if(!id) throw new Error('EAS_BUILD_ID_NOT_FOUND');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'build_id='+id+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'build_url=https://expo.dev/accounts/ankushas-team/projects/routine/builds/'+id+'\n');
          NODE

      - name: Publish build link
        shell: bash
        run: |
          {
            echo "### Routine Dev review build submitted"
            echo
            echo "- Ref: \`${{ inputs.target_ref }}\`"
            echo "- Profile: \`review\`"
            echo "- Bundle ID: \`com.ankusha.kodjo.dev\`"
            echo "- Channel: \`review\`"
            echo "- Build ID: \`${{ steps.build.outputs.build_id }}\`"
            echo "- [Open EAS build / installation page](${{ steps.build.outputs.build_url }})"
          } >> "$GITHUB_STEP_SUMMARY"
