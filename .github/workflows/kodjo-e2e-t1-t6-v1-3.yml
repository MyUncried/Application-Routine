name: KODJO E2E T1-T6 V1.3
run-name: KODJO E2E — real Claude Cloud T1 to T6 chain

on:
  workflow_call:
  repository_dispatch:
    types: [kodjo-e2e-t2-claude-real]

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  t1-to-t2:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 17 &&
      contains(github.event.comment.body, '[KODJO_E2E_T1_T6_REAL_CLAUDE_TEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate T1 and dispatch real Claude Cloud for T2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          fail() { echo "E2E_T1_T2_FAILURE: $1" >&2; exit 1; }
          COMMENTS=$(gh api --paginate "repos/${{ github.repository }}/issues/17/comments")
          CHECKPOINT=$(printf '%s' "$COMMENTS" | jq -r '[.[] | select(.body | startswith("[KODJO_CHECKPOINT_ACTIVE]"))] | last | .body // empty')
          test -n "$CHECKPOINT" || fail "active checkpoint missing"
          CHECKPOINT_JSON=$(printf '%s\n' "$CHECKPOINT" | sed -n '/```json/,/```/p' | sed '1d;$d')
          printf '%s' "$CHECKPOINT_JSON" | jq -e '.schema == "kodjo.checkpoint.v1" and .issue == 17 and .implementation_authorized == false and .mode == "CLOUD_READ_ONLY" and .writer == "NONE"' >/dev/null || fail "unsafe checkpoint"
          BRANCH=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.branch')
          HEAD=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.head')
          CURRENT_HEAD=$(gh api "repos/${{ github.repository }}/branches/$BRANCH" --jq '.commit.sha')
          test "$CURRENT_HEAD" = "$HEAD" || fail "feature branch HEAD mismatch"
          jq -n --argjson issue 17 --arg source_comment_id "$SOURCE_COMMENT_ID" --arg branch "$BRANCH" --arg head "$HEAD" '{event_type:"kodjo-e2e-t2-claude-real",client_payload:{issue:$issue,source_comment_id:$source_comment_id,branch:$branch,head:$head,implementation_authorized:"false",real_claude_authorized:"true"}}' | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -
          cat > /tmp/t1.md <<EOF
          [KODJO_E2E_T1_ACCEPTED] VERIFIED_SUCCESS
          [KODJO_E2E_REAL_CLAUDE_CHAIN]

          \`source_comment_id=$SOURCE_COMMENT_ID\`
          \`branch=$BRANCH\`
          \`head=$HEAD\`
          \`implementation_authorized=false\`
          \`real_claude_authorized=true\`
          \`business_write=false\`

          T1 reçu depuis ChatGPT ; T2 déclenché vers Claude Cloud réel en lecture seule.
          EOF
          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/t1.md

  t2-to-t3:
    if: >
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'kodjo-e2e-t2-claude-real'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0
      - name: Validate real Claude Cloud preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.client_payload.branch }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - name: Run real Claude Cloud read-only T2
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions[bot]
          prompt: |
            KODJO E2E T1-T6 — REAL CLAUDE CLOUD TRANSPORT TEST.
            This is a strictly read-only orchestration test. Do not edit, write, commit, push, or access the network.
            Read `.github/AI_ORCHESTRATION.md` and `.github/AI_ORCHESTRATION_CONTINUITY.md` only enough to confirm that you are Claude Code in the KODJO chain and that no business write is authorized.
            Return exactly one structured JSON message whose `message` says that the real Claude Cloud invocation succeeded, that implementation is not authorized, and ends exactly with `STATUT : KODJO_E2E_REAL_CLAUDE_READY`.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep"
            --json-schema '{"type":"object","properties":{"message":{"type":"string"}},"required":["message"]}'
      - name: Publish real Claude T3 and dispatch T4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          SOURCE_COMMENT_ID: ${{ github.event.client_payload.source_comment_id }}
          BRANCH: ${{ github.event.client_payload.branch }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head }}
        run: |
          set -euo pipefail
          MESSAGE=$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.message // empty')
          test -n "$MESSAGE"
          printf '%s' "$MESSAGE" | grep -Fq 'STATUT : KODJO_E2E_REAL_CLAUDE_READY'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          cat > /tmp/t3.md <<EOF
          [KODJO_E2E_T3_CLAUDE_RESULT] VERIFIED_SUCCESS
          [KODJO_E2E_REAL_CLAUDE_CHAIN]

          \`source_comment_id=$SOURCE_COMMENT_ID\`
          \`branch=$BRANCH\`
          \`head=$EXPECTED_HEAD\`
          \`implementation_authorized=false\`
          \`real_claude_called=true\`
          \`business_write=false\`

          $MESSAGE
          EOF
          T3_URL=$(gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/t3.md)
          T3_COMMENT_ID=$(printf '%s' "$T3_URL" | sed -n 's/.*issuecomment-\([0-9]*\).*/\1/p')
          test -n "$T3_COMMENT_ID"
          jq -n --argjson issue 17 --arg source_comment_id "$T3_COMMENT_ID" --arg root_comment_id "$SOURCE_COMMENT_ID" --arg branch "$BRANCH" --arg head "$EXPECTED_HEAD" '{event_type:"kodjo-e2e-t4-openai-realchain",client_payload:{issue:$issue,source_comment_id:$source_comment_id,root_comment_id:$root_comment_id,branch:$branch,head:$head,implementation_authorized:"false",real_claude_authorized:"true"}}' | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -
