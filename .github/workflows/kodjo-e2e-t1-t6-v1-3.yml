name: KODJO E2E T1-T6 V1.3
run-name: KODJO E2E — full T1 to T6 chain

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [kodjo-e2e-t2-claude-stub]

permissions:
  contents: write
  issues: write

jobs:
  t1-to-t2:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 17 &&
      contains(github.event.comment.body, '[KODJO_E2E_T1_T6_TEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate T1 and dispatch fake Claude for T2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          fail() { echo "E2E_T1_T2_FAILURE: $1" >&2; exit 1; }

          COMMENTS=$(gh api --paginate "repos/${{ github.repository }}/issues/17/comments")
          CHECKPOINT=$(printf '%s' "$COMMENTS" | jq -r '[.[] | select(.body | startswith("[KODJO_CHECKPOINT_ACTIVE]"))] | last | .body // empty')
          test -n "$CHECKPOINT" || fail "active checkpoint missing"
          CHECKPOINT_JSON=$(printf '%s\n' "$CHECKPOINT" | sed -n '/```json/,/```/p' | sed '1d;$d')
          printf '%s' "$CHECKPOINT_JSON" | jq -e '.schema == "kodjo.checkpoint.v1" and .issue == 17 and .implementation_authorized == false and .mode == "CLOUD_READ_ONLY" and .writer == "NONE"' >/dev/null || fail "unsafe checkpoint"

          BRANCH=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.branch')
          HEAD=$(printf '%s' "$CHECKPOINT_JSON" | jq -r '.head')
          CURRENT_HEAD=$(gh api "repos/${{ github.repository }}/branches/$BRANCH" --jq '.commit.sha')
          test "$CURRENT_HEAD" = "$HEAD" || fail "feature branch HEAD mismatch"

          jq -n --argjson issue 17 --arg source_comment_id "$SOURCE_COMMENT_ID" --arg branch "$BRANCH" --arg head "$HEAD" \
            '{event_type:"kodjo-e2e-t2-claude-stub",client_payload:{issue:$issue,source_comment_id:$source_comment_id,branch:$branch,head:$head,implementation_authorized:"false",real_claude_authorized:"false"}}' \
            | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -

          cat > /tmp/t1.md <<EOF
          [KODJO_E2E_T1_ACCEPTED] VERIFIED_SUCCESS

          \`schema=kodjo.e2e-t1-result.v1\`
          \`source_comment_id=$SOURCE_COMMENT_ID\`
          \`branch=$BRANCH\`
          \`head=$HEAD\`
          \`implementation_authorized=false\`
          \`real_claude_authorized=false\`
          \`business_write=false\`

          T1 reçu depuis ChatGPT et T2 déclenché vers un job Claude factice.
          EOF
          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/t1.md

  t2-to-t3:
    if: >
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'kodjo-e2e-t2-claude-stub'
    runs-on: ubuntu-latest
    steps:
      - name: Execute fake Claude T2, publish T3, and dispatch T4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.client_payload.issue }}
          SOURCE_COMMENT_ID: ${{ github.event.client_payload.source_comment_id }}
          BRANCH: ${{ github.event.client_payload.branch }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head }}
          IMPLEMENTATION_AUTHORIZED: ${{ github.event.client_payload.implementation_authorized }}
          REAL_CLAUDE_AUTHORIZED: ${{ github.event.client_payload.real_claude_authorized }}
        run: |
          set -euo pipefail
          fail() { echo "E2E_T2_T3_FAILURE: $1" >&2; exit 1; }

          test "$ISSUE" = "17" || fail "issue mismatch"
          test "$IMPLEMENTATION_AUTHORIZED" = "false" || fail "implementation authorization must remain false"
          test "$REAL_CLAUDE_AUTHORIZED" = "false" || fail "real Claude authorization must remain false"
          CURRENT_HEAD=$(gh api "repos/${{ github.repository }}/branches/$BRANCH" --jq '.commit.sha')
          test "$CURRENT_HEAD" = "$EXPECTED_HEAD" || fail "feature branch HEAD changed"

          cat > /tmp/t3.md <<EOF
          [KODJO_E2E_T3_CLAUDE_RESULT] VERIFIED_SUCCESS

          \`schema=kodjo.e2e-t3-claude-result.v1\`
          \`source_comment_id=$SOURCE_COMMENT_ID\`
          \`branch=$BRANCH\`
          \`head=$EXPECTED_HEAD\`
          \`implementation_authorized=false\`
          \`real_claude_called=false\`
          \`business_write=false\`

          T2 exécuté par un job Claude factice. Ce résultat T3 est publié dans GitHub ; la transition T4 est ensuite déclenchée explicitement par repository_dispatch afin d'éviter la suppression des événements récursifs générés par GITHUB_TOKEN.
          EOF
          T3_URL=$(gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/t3.md)
          T3_COMMENT_ID=$(printf '%s' "$T3_URL" | sed -n 's/.*issuecomment-\([0-9]*\).*/\1/p')
          test -n "$T3_COMMENT_ID" || fail "cannot extract T3 comment id"

          jq -n --argjson issue 17 --arg source_comment_id "$T3_COMMENT_ID" --arg root_comment_id "$SOURCE_COMMENT_ID" --arg branch "$BRANCH" --arg head "$EXPECTED_HEAD" \
            '{event_type:"kodjo-e2e-t4-openai-fullchain",client_payload:{issue:$issue,source_comment_id:$source_comment_id,root_comment_id:$root_comment_id,branch:$branch,head:$head,implementation_authorized:"false",real_claude_authorized:"false"}}' \
            | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -
