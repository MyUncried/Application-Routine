name: KODJO Claude Local Auth Smoke
run-name: KODJO local auth smoke 01

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kodjo-claude-local-auth-smoke-01
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: ${{ vars.KODJO_LOCAL_CLAUDE_CONFIG_DIR }}
      CLAUDE_CODE_PROJECT_DIR_NAME: kodjo-local-auth-smoke-01
    defaults:
      run:
        shell: powershell
    steps:
      - name: Run exactly one Claude Local authentication smoke call
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner.' }
          if ([string]::IsNullOrWhiteSpace($env:CLAUDE_CONFIG_DIR)) { throw 'CLAUDE_CONFIG_DIR missing.' }
          $claude = Get-Command claude.cmd -ErrorAction Stop

          $credPath = Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json'
          if (-not (Test-Path $credPath)) { throw '.credentials.json missing.' }
          $cred = Get-Content $credPath -Raw | ConvertFrom-Json
          $expiresAt = [int64]$cred.claudeAiOauth.expiresAt
          $nowMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          if ($expiresAt -le $nowMs) { throw 'Access token is expired; refusing model call.' }

          $prompt = 'Authentication smoke test only. Do not use tools. Reply with exactly AUTH_SMOKE_OK and nothing else.'
          $output = (& $claude.Source -p $prompt --tools '' 2>&1 | Out-String).Trim()
          $exitCode = $LASTEXITCODE

          Write-Host "ClaudeExitCode=$exitCode"
          Write-Host "ExactReply=$($output -eq 'AUTH_SMOKE_OK')"
          if ($exitCode -ne 0) { throw "Claude model call failed with exit code $exitCode." }
          if ($output -ne 'AUTH_SMOKE_OK') { throw 'Claude authenticated but did not return the exact smoke response.' }
          Write-Host 'AUTH_SMOKE_RESULT=PASS'
