name: KODJO Claude Local Auth Diagnostic
run-name: KODJO local auth diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kodjo-claude-local-auth-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: ${{ vars.KODJO_LOCAL_CLAUDE_CONFIG_DIR }}
      CLAUDE_CODE_PROJECT_DIR_NAME: kodjo-local-session-resume-01
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect auth context without invoking a model
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner.' }
          if ([string]::IsNullOrWhiteSpace($env:CLAUDE_CONFIG_DIR)) { throw 'CLAUDE_CONFIG_DIR missing.' }

          $claude = Get-Command claude.cmd -ErrorAction Stop
          $credPath = Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json'
          if (-not (Test-Path $credPath)) { throw '.credentials.json missing.' }

          $authRaw = (& $claude.Source auth status 2>&1 | Out-String).Trim()
          $authExit = $LASTEXITCODE
          $auth = $null
          try { $auth = $authRaw | ConvertFrom-Json } catch { }

          $credFile = Get-Item $credPath -Force
          $acl = Get-Acl $credPath
          $cred = Get-Content $credPath -Raw | ConvertFrom-Json
          $oauth = $cred.claudeAiOauth

          $oauthFields = @()
          if ($null -ne $oauth) {
            $oauthFields = $oauth.PSObject.Properties | ForEach-Object {
              $name = $_.Name
              $value = $_.Value
              $isSecretLike = $name -match '(?i)token|secret|key|credential'
              [PSCustomObject]@{
                Name = $name
                Type = if ($null -eq $value) { 'null' } else { $value.GetType().Name }
                Present = $null -ne $value
                Length = if ($isSecretLike -and $value -is [string]) { $value.Length } else { $null }
              }
            }
          }

          $envNames = Get-ChildItem Env: |
            Where-Object { $_.Name -match '^(CLAUDE|ANTHROPIC)' } |
            Select-Object -ExpandProperty Name

          Write-Host '=== RUNNER CONTEXT ==='
          [PSCustomObject]@{
            RunnerName = '${{ runner.name }}'
            ComputerName = $env:COMPUTERNAME
            Username = $env:USERNAME
            UserDomain = $env:USERDOMAIN
            UserProfile = $env:USERPROFILE
            HomeDrive = $env:HOMEDRIVE
            HomePath = $env:HOMEPATH
            SessionName = $env:SESSIONNAME
            UserInteractive = [Environment]::UserInteractive
            ClaudeConfigDir = $env:CLAUDE_CONFIG_DIR
            ClaudePath = $claude.Source
          } | Format-List

          Write-Host '=== AUTH STATUS SAFE FIELDS ==='
          [PSCustomObject]@{
            ExitCode = $authExit
            Parsed = $null -ne $auth
            LoggedIn = if ($auth) { $auth.loggedIn } else { $null }
            AuthMethod = if ($auth) { $auth.authMethod } else { $null }
            ApiProvider = if ($auth) { $auth.apiProvider } else { $null }
            ProjectsDirectory = if ($auth) { $auth.projectsDirectory } else { $null }
            SubscriptionType = if ($auth) { $auth.subscriptionType } else { $null }
          } | Format-List

          Write-Host '=== CREDENTIAL FILE ==='
          [PSCustomObject]@{
            Exists = $true
            Length = $credFile.Length
            LastWriteTime = $credFile.LastWriteTime
            Owner = $acl.Owner
            Readable = $true
            HasClaudeAiOauth = $null -ne $oauth
          } | Format-List

          Write-Host '=== OAUTH STRUCTURE (NO VALUES) ==='
          $oauthFields | Format-Table -AutoSize

          Write-Host '=== CLAUDE / ANTHROPIC ENVIRONMENT VARIABLE NAMES ONLY ==='
          if ($envNames) { $envNames | Sort-Object } else { Write-Host '<none>' }
