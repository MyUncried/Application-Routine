name: KODJO V1.4 Local E2E Recovery
run-name: KODJO V1.4 E2E-01 / RECOVER

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kodjo-v14-local-e2e-01
  cancel-in-progress: false

env:
  TEST_ID: KODJO-V14-LOCAL-E2E-01
  EXPECTED_TARGET_REF: orchestration/v1-4-local-e2e-01
  SENTINEL_PATH: .github/orchestration/e2e/KODJO_V14_LOCAL_E2E_SENTINEL.md
  REPORT_PREFIX: .github/orchestration/reports/KODJO_V14_LOCAL_E2E_01_
  STATE_ROOT: .github/orchestration/e2e/state/KODJO-V14-LOCAL-E2E-01
  CLAUDE_CODE_PROJECT_DIR_NAME: kodjo-v14-local-e2e-01

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: ${{ vars.KODJO_LOCAL_CLAUDE_CONFIG_DIR }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Recover and publish without Claude
        run: |
          $ErrorActionPreference='Stop'
          if('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME){throw 'Unexpected runner.'}
          if($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine'){throw 'Unexpected repository.'}
          if((git branch --show-current).Trim() -ne $env:EXPECTED_TARGET_REF){throw 'Unexpected branch.'}
          $head=(git rev-parse HEAD).Trim()
          if($head -ne 'd2550a265c5c0da0cb40a0095b76a9bc8d50aec5'){throw "Unexpected recovery HEAD $head"}

          $cpPath=Join-Path $env:STATE_ROOT 'RESUME.checkpoint.json'
          $claimPath=Join-Path $env:STATE_ROOT 'RESUME.claim.json'
          if(-not(Test-Path $cpPath)-or-not(Test-Path $claimPath)){throw 'RESUME state missing.'}
          $cp=Get-Content $cpPath -Raw|ConvertFrom-Json
          $claim=Get-Content $claimPath -Raw|ConvertFrom-Json
          if($cp.test_id -ne $env:TEST_ID -or $cp.stage -ne 'RESUME' -or $cp.status -ne 'AUTHORIZED' -or $cp.consumed -ne $false){throw 'RESUME checkpoint invalid.'}
          if($claim.test_id -ne $env:TEST_ID -or $claim.stage -ne 'RESUME' -or $claim.status -ne 'CLAIMED' -or [int]$claim.call_ordinal -ne 2){throw 'RESUME claim invalid.'}

          $projectDir=Join-Path (Join-Path $env:CLAUDE_CONFIG_DIR 'projects') $env:CLAUDE_CODE_PROJECT_DIR_NAME
          $transcripts=@(Get-ChildItem $projectDir -File -Filter '*.jsonl' -ErrorAction Stop)
          if($transcripts.Count -ne 1){throw "Expected exactly one native session transcript, found $($transcripts.Count)."}
          $session=[IO.Path]::GetFileNameWithoutExtension($transcripts[0].Name)
          if($session -ne '014c5010-10d8-4bd9-a65b-abbacbfebee0'){throw 'Unexpected native session.'}
          $rawTranscript=Get-Content $transcripts[0].FullName -Raw
          $markers=@([regex]::Matches($rawTranscript,'KODJO-E2E-[0-9a-f]{48}')|ForEach-Object{$_.Value}|Select-Object -Unique)
          if($markers.Count -ne 1){throw "Expected one continuity marker, found $($markers.Count)."}
          $sha=[Security.Cryptography.SHA256]::Create()
          try{$hash=([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($markers[0])))-replace '-','').ToLowerInvariant()}finally{$sha.Dispose()}
          if($hash -ne 'ee8766bcce050870fb7ba2468421ea84a758640b89fec7681e50b68bd594fe55'){throw 'Continuity marker hash mismatch.'}
          if($rawTranscript -notmatch 'CONTINUITY_MARKER=KODJO-E2E-[0-9a-f]{48}'){throw 'RESUME continuity response not found in native transcript.'}

          $changed=@(git status --porcelain --untracked-files=all|ForEach-Object{$_.Substring(3).Trim()})
          if($changed.Count -eq 0){throw 'Recovered worktree has no Claude changes.'}
          $sent=$false
          $rep=$false
          foreach($p in $changed){
            $n=$p-replace '\\','/'
            if($n -eq $env:SENTINEL_PATH){$sent=$true;continue}
            if($n.StartsWith($env:REPORT_PREFIX)-and$n.EndsWith('.md')){$rep=$true;continue}
            throw "Unauthorized recovered path $n"
          }
          if(-not$sent-or-not$rep){throw 'Recovered sentinel/report missing.'}

          $sentinel=Get-Content $env:SENTINEL_PATH -Raw
          if($sentinel -notmatch 'test_id=KODJO-V14-LOCAL-E2E-01' -or $sentinel -notmatch 'stage=BASE' -or $sentinel -notmatch 'status=BASE_WRITTEN' -or $sentinel -notmatch 'stage=RESUME' -or $sentinel -notmatch 'status=RESUME_WRITTEN'){throw 'Sentinel content invalid.'}

          $cp.consumed=$true
          $cp.consumed_run_id="$env:GITHUB_RUN_ID"
          [IO.File]::WriteAllText($cpPath,($cp|ConvertTo-Json -Depth 10),(New-Object Text.UTF8Encoding($false)))
          $res=[ordered]@{test_id=$env:TEST_ID;stage='RESUME';status='SUCCESS_RECOVERED';run_id="$env:GITHUB_RUN_ID";source_run_id='33917607203';session_id=$session;marker_sha256=$hash;mode='LOCAL_WRITE';writer='CLAUDE_LOCAL';fallback='NONE';claude_cloud=$false;recovery_reason='path_enforcer_untracked_directory_collapse'}|ConvertTo-Json
          $rp=Join-Path $env:STATE_ROOT 'RESUME.result.json'
          [IO.File]::WriteAllText($rp,$res,(New-Object Text.UTF8Encoding($false)))

          git add -- $env:SENTINEL_PATH "$env:REPORT_PREFIX*" $env:STATE_ROOT
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "e2e: recover and publish RESUME $env:GITHUB_RUN_ID"
          $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin "HEAD:$env:EXPECTED_TARGET_REF"
          Write-Host 'KODJO_V14_E2E_RECOVERY=SUCCESS'
