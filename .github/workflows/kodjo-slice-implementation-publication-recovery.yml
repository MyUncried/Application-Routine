name: KODJO — Recover Implementation Publication
run-name: KODJO SLICE / RECOVER-IMPLEMENTATION-PUBLICATION / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-slice-publication-recovery-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.comment.user.login == 'MyUncried' && startsWith(github.event.comment.body, format('[KODJO_SLICE] RECOVER_IMPLEMENTATION_PUBLICATION{0}', fromJSON('"\n"')))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate recovery causality
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -Rnr --arg body "$TRIGGER_BODY" '$body | gsub("\\r"; "")')
          [ "${body%%$'\n'*}" = '[KODJO_SLICE] RECOVER_IMPLEMENTATION_PUBLICATION' ]

          extract_one() {
            local source="$1" expression="$2" label="$3" values=()
            mapfile -t values < <(sed -n "$expression" <<<"$source")
            [ "${#values[@]}" -eq 1 ] || { echo "$label must occur exactly once" >&2; return 1; }
            printf '%s' "${values[0]}"
          }

          slice=$(extract_one "$body" 's/^slice_id=//p' slice_id)
          manifest=$(extract_one "$body" 's/^manifest_path=//p' manifest_path)
          head=$(extract_one "$body" 's/^head=//p' head)
          source_trigger_id=$(extract_one "$body" 's/^source_implementation_trigger_comment_id=\([0-9][0-9]*\)$/\1/p' source_implementation_trigger_comment_id)
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          [ "$manifest" = ".github/orchestration/slices/$slice.yml" ] && [ -f "$manifest" ]

          trigger_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$source_trigger_id")
          jq -e --arg issue "$ISSUE_NUMBER" '.user.login == "MyUncried" and (.issue_url | endswith("/issues/" + $issue)) and (.body | type == "string")' <<<"$trigger_json" >/dev/null
          trigger=$(jq -r '.body | gsub("\\r"; "")' <<<"$trigger_json")
          marker="${trigger%%$'\n'*}"
          case "$marker" in
            '[KODJO_SLICE] START_IMPLEMENTATION'|'[KODJO_SLICE] IMPLEMENTATION_REVISION'|'[KODJO_SLICE] VISUAL_CORRECTION') ;;
            *) echo 'Invalid source implementation trigger marker' >&2; exit 1 ;;
          esac

          trigger_slice=$(extract_one "$trigger" 's/^slice_id=//p' trigger_slice_id)
          base=$(extract_one "$trigger" 's/^source_head=\([0-9a-f]\{40\}\)$/\1/p' source_head)
          plan=$(extract_one "$trigger" 's/^source_plan_comment_id=\([0-9][0-9]*\)$/\1/p' source_plan_comment_id)
          plan_review=$(extract_one "$trigger" 's/^source_review_comment_id=\([0-9][0-9]*\)$/\1/p' source_review_comment_id)
          increment=$(extract_one "$trigger" 's/^increment=\(LOT_[1-9][0-9]*_OF_[1-9][0-9]*\)$/\1/p' increment)
          session=$(extract_one "$trigger" 's/^session_id=\([0-9a-f-]\{36\}\)$/\1/p' session_id)
          [ "$trigger_slice" = "$slice" ]
          [[ "$increment" =~ ^LOT_([1-9][0-9]*)_OF_([1-9][0-9]*)$ ]] && [ "${BASH_REMATCH[1]}" -le "${BASH_REMATCH[2]}" ]

          export ISSUE_NUMBER slice base
          branch=$(ruby -ryaml -e 'm=YAML.safe_load(File.read(ARGV[0]),aliases:false);abort "identity" unless m["slice_id"]==ENV["slice"]&&m["issue_number"].to_i==ENV["ISSUE_NUMBER"].to_i;abort "branch" if m["target_branch"].to_s.empty?;puts m["target_branch"]' "$manifest")
          remote=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
          [ "$remote" = "$head" ]
          commit_json=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head")
          jq -e --arg base "$base" '.parents | length == 1 and .[0].sha == $base' <<<"$commit_json" >/dev/null
          jq -e '.commit.message | startswith("feat: implement ")' <<<"$commit_json" >/dev/null

          printf 'slice=%s\nhead=%s\nbase=%s\nbranch=%s\nplan=%s\nplan_review=%s\nincrement=%s\nsession=%s\nsource_trigger_id=%s\n' "$slice" "$head" "$base" "$branch" "$plan" "$plan_review" "$increment" "$session" "$source_trigger_id" >> "$GITHUB_OUTPUT"

      - name: Checkout recovered implementation HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate recovered commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.gate.outputs.head }}"
          npm ci
          npm test -- --runInBand
          npx tsc --noEmit
          git diff --name-only "${{ steps.gate.outputs.base }}..${{ steps.gate.outputs.head }}" > /tmp/changed-files.txt
          test -s /tmp/changed-files.txt
          ! grep -Fxq 'src/infrastructure/database/migrations/migration001.ts' /tmp/changed-files.txt

      - name: Publish recovered implementation output
        shell: bash
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice }}
          HEAD: ${{ steps.gate.outputs.head }}
          BASE: ${{ steps.gate.outputs.base }}
          PLAN: ${{ steps.gate.outputs.plan }}
          PLAN_REVIEW: ${{ steps.gate.outputs.plan_review }}
          INCREMENT: ${{ steps.gate.outputs.increment }}
          SESSION: ${{ steps.gate.outputs.session }}
          SOURCE_TRIGGER_ID: ${{ steps.gate.outputs.source_trigger_id }}
        run: |
          set -euo pipefail
          {
            echo '[KODJO_SLICE] IMPLEMENTATION_OUTPUT'
            echo "slice_id=$SLICE_ID"
            echo "increment=$INCREMENT"
            echo "base_head=$BASE"
            echo "head=$HEAD"
            echo "session_id=$SESSION"
            echo "plan_comment_id=$PLAN"
            echo "plan_review_comment_id=$PLAN_REVIEW"
            echo "source_implementation_trigger_comment_id=$SOURCE_TRIGGER_ID"
            echo 'STATUT : IMPLEMENTATION_READY_FOR_REVIEW'
            echo
            echo 'KODJO_STATUS: IMPLEMENTED'
            echo
            echo 'Publication recovered deterministically after the implementation commit was pushed but the original GitHub comment command failed. No implementation or AI call was repeated.'
            echo
            echo 'Deterministic recovery verification: npm ci, full Jest suite and TypeScript succeeded on the exact recovered HEAD.'
            echo
            echo 'CHANGED FILES:'
            cat /tmp/changed-files.txt
          } > /tmp/implementation-output.md
          jq -n --rawfile body /tmp/implementation-output.md '{body:$body}' > /tmp/comment-payload.json
          posted=$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --input /tmp/comment-payload.json)
          output_id=$(jq -er '.id' <<<"$posted")
          jq -n --arg issue "$ISSUE_NUMBER" --arg source "$output_id" '{event_type:"kodjo_implementation_ready",client_payload:{issue_number:$issue,source_comment_id:$source}}' > /tmp/dispatch.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input /tmp/dispatch.json
