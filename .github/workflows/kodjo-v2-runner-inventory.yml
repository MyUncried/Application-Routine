name: KODJO V2 runner inventory
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional interrupted run to inspect without replay
        required: true
        type: string
      source_run_attempt:
        description: Interrupted run attempt
        default: '1'
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind archived evidence to exact F12 run
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          test "$SOURCE_RUN_ID" = '35464168355'
          test "$SOURCE_RUN_ATTEMPT" = '1'
      - name: Download preserved diagnostic
        uses: actions/download-artifact@v4
        with:
          name: kodjo-v2-diagnostic-35464168355-1
          run-id: '35464168355'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/f12-diagnostic-source
      - name: Read only archived result and invocation evidence
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/f12-diagnostic-source
        run: |
          python - <<'PY'
          import os, pathlib, hashlib, json
          root = pathlib.Path(os.environ['EVIDENCE_ROOT'])
          for name in ('result.json', 'invocation.json'):
              p = root / name
              if not p.exists():
                  print(name + ': ABSENT')
                  continue
              if p.is_symlink() or p.stat().st_size > 1048576:
                  raise RuntimeError('EVIDENCE_AMBIGUOUS')
              raw = p.read_bytes()
              value = json.loads(raw)
              print(name + ' SHA256 ' + hashlib.sha256(raw).hexdigest())
              print(json.dumps(value, ensure_ascii=False, indent=2))
          PY
