name: KODJO V2 runner inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 10
    steps:
      - name: Inventory persistent KODJO directories without mutation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Convert-ToTsvField([object]$Value) {
            if ($null -eq $Value) { return '' }
            return ([string]$Value).Replace("`t", ' ').Replace("`r", ' ').Replace("`n", ' ')
          }

          $root = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '_kodjo')).TrimEnd('\')
          $evidenceLeaf = "kodjo-runner-inventory-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidence = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP $evidenceLeaf)).TrimEnd('\')
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ([IO.Path]::GetDirectoryName($evidence).TrimEnd('\') -ne $temp -or [IO.Path]::GetFileName($evidence) -ne $evidenceLeaf) {
            throw ('EVIDENCE_IDENTITY_MISMATCH: ' + $evidence)
          }
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $lock = Join-Path (Join-Path $env:USERPROFILE '.kodjo-v2') 'claude-local.lock'
          $processes = @(Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -and $_.CommandLine.IndexOf($root, [StringComparison]::OrdinalIgnoreCase) -ge 0
          })
          $directoryLines = @()
          $directoryCount = 0
          $totalBytes = [int64]0
          if (Test-Path -LiteralPath $root) {
            $directoryLines = @(Get-ChildItem -LiteralPath $root -Directory -Force | Sort-Object Name | ForEach-Object {
              $directory = $_
              $measure = Get-ChildItem -LiteralPath $directory.FullName -File -Force -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum
              $runId = ''
              if ($directory.Name -match '^\d+$') { $runId = $directory.Name }
              $size = if ($null -eq $measure.Sum) { [int64]0 } else { [int64]$measure.Sum }
              $directoryCount++
              $totalBytes += $size
              'DIRECTORY' + "`t" + (Convert-ToTsvField $directory.Name) + "`t" + (Convert-ToTsvField $runId) + "`t" + (Convert-ToTsvField $directory.FullName) + "`t" + [int64]$measure.Count + "`t" + $size + "`t" + $directory.CreationTimeUtc.ToString('o') + "`t" + $directory.LastWriteTimeUtc.ToString('o')
            })
          }

          $processLines = @($processes | ForEach-Object {
            'PROCESS' + "`t" + [int64]$_.ProcessId + "`t" + (Convert-ToTsvField $_.Name) + "`t" + (Convert-ToTsvField $_.ExecutablePath)
          })
          $observed = (Get-Date).ToUniversalTime().ToString('o')
          $lines = @(
            'SCHEMA' + "`t" + 'kodjo.protocol.v2.runner-inventory.0.3',
            'SUMMARY' + "`t" + (Convert-ToTsvField $root) + "`t" + [bool](Test-Path -LiteralPath $root) + "`t" + [bool](Test-Path -LiteralPath $lock) + "`t" + @($processes).Count + "`t" + $directoryCount + "`t" + $totalBytes + "`t" + $observed,
            'DIRECTORY_HEADER' + "`t" + 'name' + "`t" + 'run_id' + "`t" + 'full_path' + "`t" + 'file_count' + "`t" + 'size_bytes' + "`t" + 'created_at_utc' + "`t" + 'last_write_at_utc'
          ) + $directoryLines + @(
            'PROCESS_HEADER' + "`t" + 'process_id' + "`t" + 'name' + "`t" + 'executable_path'
          ) + $processLines

          $reportPath = Join-Path $evidence 'runner-inventory.tsv'
          [IO.File]::WriteAllLines($reportPath, [string[]]$lines, (New-Object Text.UTF8Encoding($false)))
          $lines | ForEach-Object { Write-Host ('KODJO_INVENTORY`t' + $_) }

      - name: Preserve read-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-runner-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kodjo-runner-inventory-${{ github.run_id }}-${{ github.run_attempt }}/runner-inventory.tsv
          if-no-files-found: error
          retention-days: 30

      - name: Remove only the temporary inventory report
        if: always()
        shell: powershell
        run: |
          $leaf = "kodjo-runner-inventory-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $target = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP $leaf)).TrimEnd('\')
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ([IO.Path]::GetDirectoryName($target).TrimEnd('\') -ne $temp -or [IO.Path]::GetFileName($target) -ne $leaf) {
            throw ('REPORT_CLEANUP_IDENTITY_MISMATCH: ' + $target)
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
