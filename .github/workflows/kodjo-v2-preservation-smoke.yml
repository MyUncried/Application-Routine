name: KODJO V2 preservation smoke

# Temporary real-run smoke test. It creates only an untracked fixture on the
# ephemeral runner, writes all protocol material under RUNNER_TEMP, uploads its
# recovery artifact before a deliberate failure, then downloads it under the
# second job's RUNNER_TEMP and restores it in a separate clean checkout.

on:
  push:
    branches:
      - chore/kodjo-v2-pilot
    paths:
      - .github/workflows/kodjo-v2-preservation-smoke.yml

env:
  KODJO_WORKFLOW_KIND: SMOKE

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preserve_before_failure:
    runs-on: ubuntu-latest
    outputs:
      source_head: ${{ steps.baseline.outputs.source_head }}
      artifact_name: ${{ steps.names.outputs.recovery_artifact }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout pilot branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse remote functional writes
        run: node scripts/kodjo/scan-remote-write-capability.js

      - name: Record baseline and artifact name
        id: baseline
        run: echo "source_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set artifact name
        id: names
        run: echo "recovery_artifact=kodjo-smoke-${GITHUB_RUN_ID}-recovery" >> "$GITHUB_OUTPUT"

      - name: Create harmless untracked implementation fixture
        run: |
          mkdir -p .kodjo-smoke
          printf '%s\n' 'KODJO_V2_PRESERVATION_SMOKE_v1' > .kodjo-smoke/created.txt

      - name: Resolve and validate orchestration paths outside the checkout
        run: |
          {
            echo "KODJO_DELIVERY_DIR=${RUNNER_TEMP}/kodjo/delivery"
            echo "KODJO_SOURCE_RECOVERY_DIR=${RUNNER_TEMP}/kodjo/source-recovery"
            echo "KODJO_SOURCE_RESULT_DIR=${RUNNER_TEMP}/kodjo/source-result"
          } >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/kodjo"

      - name: Reject invalid orchestration paths before preservation
        run: node scripts/kodjo/validate-orchestration-paths.js

      - name: Preserve fixture before checks
        env:
          KODJO_MODE: IMPLEMENT
          KODJO_SLICE_ID: SMOKE-PRESERVATION
          KODJO_SOURCE_HEAD: ${{ steps.baseline.outputs.source_head }}
          KODJO_SOURCE_RUN_ID: ${{ github.run_id }}
          KODJO_SESSION_ID: smoke-${{ github.run_id }}-${{ github.run_attempt }}
          KODJO_AGENT_STATUS: COMPLETED
        run: node scripts/kodjo/preserve-implementation.js "${KODJO_DELIVERY_DIR}"

      - name: Validate recovery package before upload
        run: node scripts/kodjo/verify-delivery.js "${KODJO_DELIVERY_DIR}"

      - name: Upload recovery artifact before the failing check
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.recovery_artifact }}
          path: ${{ runner.temp }}/kodjo/delivery/recovery/
          if-no-files-found: error
          retention-days: 7

      - name: Deliberately fail after preservation
        run: |
          echo "Expected smoke failure after recovery upload"
          exit 1

      - name: Confirm always step still executes
        if: always()
        run: |
          test -n '${{ steps.upload.outputs.artifact-url }}'
          test -n '${{ steps.upload.outputs.artifact-digest }}'
          echo "always_after_failure=PASS"

  restore_from_artifact:
    if: always()
    needs: preserve_before_failure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact source head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve_before_failure.outputs.source_head }}
          persist-credentials: false
          fetch-depth: 0

      - name: Download previously uploaded recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preserve_before_failure.outputs.artifact_name }}
          path: ${{ runner.temp }}/kodjo/downloaded-recovery

      - name: Restore patch without any AI call
        run: node scripts/kodjo/restore-source-artifact.js "${RUNNER_TEMP}/kodjo/downloaded-recovery" .

      - name: Verify exact restored content and artifact metadata
        run: |
          test "$(cat .kodjo-smoke/created.txt)" = 'KODJO_V2_PRESERVATION_SMOKE_v1'
          test -n '${{ needs.preserve_before_failure.outputs.artifact_url }}'
          test -n '${{ needs.preserve_before_failure.outputs.artifact_digest }}'
          test "$(git rev-parse HEAD)" = '${{ needs.preserve_before_failure.outputs.source_head }}'
          test ! -e delivery
          test ! -e downloaded-recovery
          echo "artifact_download=PASS"
          echo "runner_temp_transport=PASS"
          echo "patch_restore=PASS"
          echo "source_head_unchanged=PASS"
