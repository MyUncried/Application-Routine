name: KODJO V2 disposable qualification

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'INITIAL creates the recovery package; RESUME_DELTA restores and resumes it'
        required: true
        type: choice
        options:
          - INITIAL
          - RESUME_DELTA
          - CLEANUP_ONLY
        default: INITIAL
      expected_head:
        description: 'Exact protocol commit to qualify'
        required: true
        type: string
      expected_main:
        description: 'Exact main commit that must remain unchanged throughout the test'
        required: true
        type: string
      source_run_id:
        description: 'Successful INITIAL run id (required for RESUME_DELTA)'
        required: false
        type: string

      recovery_migration_file:
        description: 'Committed migration attestation path (required when resuming on another HEAD)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    permissions:
      contents: write # Atomic durable consumption tag; never passed to Claude.
      actions: read
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.expected_head }}
          path: _qualification/${{ github.run_id }}

      - name: Require the exact dispatched HEAD
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $observed = (git rev-parse HEAD).Trim()
          if ($observed -ne '${{ inputs.expected_head }}') { throw "HEAD_MISMATCH: $observed" }

      - name: Refuse any active Lean Queue run
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_MAIN: ${{ inputs.expected_main }}
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:RUNNER_TEMP 'qualification-availability-${{ github.run_id }}-${{ github.run_attempt }}.json'
          & node scripts/kodjo/check-qualification-availability.js $proof
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $main = (gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq '.object.sha').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'MAIN_HEAD_READ_FAILED' }
          if ($main -ne '${{ inputs.expected_main }}') { throw "MAIN_HEAD_MISMATCH: $main" }

      - name: Validate stage inputs
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          if ('${{ inputs.stage }}' -eq 'RESUME_DELTA' -and '${{ inputs.source_run_id }}' -notmatch '^\d+$') {
            throw 'RESUME_SOURCE_RUN_ID_REQUIRED'
          }

      - name: Download INITIAL evidence
        if: inputs.stage == 'RESUME_DELTA'
        uses: actions/download-artifact@v4
        with:
          name: kodjo-v2-disposable-qualification-${{ inputs.source_run_id }}-1
          path: _source-qualification-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Diagnose and remove requested orphan without Claude
        if: inputs.stage == 'CLEANUP_ONLY'
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.source_run_id }}' -notmatch '^\d+$') { throw 'CLEANUP_TARGET_RUN_ID_REQUIRED' }
          $leaf = 'kodjo-qualif-resume-${{ inputs.source_run_id }}-1'
          $target = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP $leaf)).TrimEnd('\')
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ([IO.Path]::GetDirectoryName($target).TrimEnd('\') -ne $temp -or [IO.Path]::GetFileName($target) -ne $leaf) {
            throw ('TARGET_IDENTITY_MISMATCH: ' + $target)
          }
          $evidence = [IO.Path]::GetFullPath('qualification-evidence')
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $lock = Join-Path (Join-Path $env:USERPROFILE '.kodjo-v2') 'claude-local.lock'
          $processes = @(Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -and $_.CommandLine.IndexOf($target, [StringComparison]::OrdinalIgnoreCase) -ge 0
          } | Select-Object ProcessId, Name, ExecutablePath, CommandLine)
          $report = [ordered]@{
            schema_version = 'kodjo.protocol.v2.runner-cleanup-diagnostic.0.6.22'
            target = $target
            target_existed_before = (Test-Path -LiteralPath $target)
            claude_lock_present = (Test-Path -LiteralPath $lock)
            target_processes_before = $processes
            attempts = @()
            target_exists_after = $null
            status = 'IN_PROGRESS'
          }
          try {
            if ($report.claude_lock_present) { throw 'CLAUDE_LOCK_PRESENT_CLEANUP_REFUSED' }
            if ($processes.Count -ne 0) { throw 'TARGET_PROCESS_STILL_ACTIVE_CLEANUP_REFUSED' }
            Set-Location -LiteralPath $temp
            for ($attempt = 1; $attempt -le 5 -and (Test-Path -LiteralPath $target); $attempt++) {
              $message = $null
              try {
                Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop
              } catch {
                $message = $_.Exception.Message
                & cmd.exe /d /c rd /s /q $target
              }
              $report.attempts += [ordered]@{
                number = $attempt
                remove_item_error = $message
                target_still_exists = (Test-Path -LiteralPath $target)
              }
              if (Test-Path -LiteralPath $target) { Start-Sleep -Seconds 2 }
            }
            $report.target_exists_after = (Test-Path -LiteralPath $target)
            if ($report.target_exists_after) { throw 'ORPHAN_DIRECTORY_STILL_PRESENT' }
            $report.status = 'PASS'
          } catch {
            $report.status = 'FAIL'
            $report.failure = $_.Exception.Message
            throw
          } finally {
            $report.finished_at = (Get-Date).ToUniversalTime().ToString('o')
            $reportJson = ($report | ConvertTo-Json -Depth 10).Replace("`r`n", "`n") + "`n"
            [IO.File]::WriteAllText((Join-Path $evidence 'runner-cleanup-diagnostic.json'), $reportJson, (New-Object Text.UTF8Encoding($false)))
          }

      - name: Execute real INITIAL qualification
        if: inputs.stage == 'INITIAL'
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        env:
          KODJO_LIVE_GH_TOKEN: ${{ github.token }}
        run: |
          & scripts/kodjo/run-disposable-qualification.ps1 `
            -ExpectedHead '${{ inputs.expected_head }}' `
            -EvidenceDirectory 'qualification-evidence' `
            -SliceId 'V2-QUALIF-01' `
            -SliceBootstrapFile '.github/orchestration/v2-slices/V2-QUALIF-01/slice-bootstrap.json' `
            -PromptFile '.github/orchestration/v2-slices/V2-QUALIF-01/implementation-mission.md' `
            -ScopeAllow 'tests/fixtures/qualif-resume/**' `
            -ExpectedFixturePath 'tests/fixtures/qualif-resume/result.txt' `
            -ExpectedFixtureContent "KODJO V2 RESUME QUALIFICATION PASS`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Establish controlled interruption after delta preservation
        if: inputs.stage == 'INITIAL'
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = [IO.Path]::GetFullPath('qualification-evidence')
          $result = Get-Content -Raw -LiteralPath (Join-Path $evidence 'result.json') -Encoding UTF8 | ConvertFrom-Json
          $invocation = Get-Content -Raw -LiteralPath (Join-Path $evidence 'invocation.json') -Encoding UTF8 | ConvertFrom-Json
          $package = Get-Content -Raw -LiteralPath (Join-Path $evidence 'recovery-package\manifest.json') -Encoding UTF8 | ConvertFrom-Json
          if ($result.claude_invoked -ne $true -or @($result.modified_files).Count -ne 1 -or $result.modified_files[0] -ne 'tests/fixtures/qualif-resume/result.txt') {
            throw 'INITIAL_DELTA_NOT_PROVEN'
          }
          if ($invocation.mode -ne 'INITIAL' -or $invocation.request_id -ne $result.request_id -or $package.request_id -ne $result.request_id) {
            throw 'INITIAL_REQUEST_CORRESPONDENCE_NOT_PROVEN'
          }
          if ($package.session_id -ne $result.session_id -or $package.run_id -ne $result.run_id) {
            throw 'INITIAL_RUN_SESSION_CORRESPONDENCE_NOT_PROVEN'
          }
          if ($invocation.source_head -ne '${{ inputs.expected_head }}' -or $result.source_head -ne '${{ inputs.expected_head }}' -or $package.source_head -ne '${{ inputs.expected_head }}') {
            throw 'INITIAL_SOURCE_CORRESPONDENCE_NOT_PROVEN'
          }
          $lock = Join-Path (Join-Path $env:USERPROFILE '.kodjo-v2') 'claude-local.lock'
          if (Test-Path -LiteralPath $lock) { throw 'CLAUDE_LOCK_REMAINS_BEFORE_INTERRUPTION' }
          $runState = Join-Path (Join-Path (Join-Path $env:USERPROFILE '.kodjo-v2') 'runs') ('github-${{ github.run_id }}-${{ github.run_attempt }}')
          $expectedRunState = [IO.Path]::GetFullPath($runState)
          $expectedParent = [IO.Path]::GetFullPath((Join-Path (Join-Path $env:USERPROFILE '.kodjo-v2') 'runs')).TrimEnd('\')
          if ([IO.Path]::GetDirectoryName($expectedRunState).TrimEnd('\') -ne $expectedParent -or [IO.Path]::GetFileName($expectedRunState) -ne 'github-${{ github.run_id }}-${{ github.run_attempt }}') {
            throw 'INITIAL_STATE_IDENTITY_MISMATCH'
          }
          if (-not (Test-Path -LiteralPath $expectedRunState)) { throw 'INITIAL_STATE_MISSING_BEFORE_INTERRUPTION' }
          & cmd.exe /d /c rd /s /q $expectedRunState
          if (Test-Path -LiteralPath $expectedRunState) { throw 'INITIAL_STATE_DELETION_FAILED' }
          $main = (gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq '.object.sha').Trim()
          if ($main -ne '${{ inputs.expected_main }}') { throw "MAIN_CHANGED_DURING_INITIAL: $main" }
          $marker = [ordered]@{
            schema_version = 'kodjo.protocol.v2.controlled-interruption.0.6.21'
            github_run_id = '${{ github.run_id }}'
            github_run_attempt = '${{ github.run_attempt }}'
            run_id = $result.run_id
            request_id = $result.request_id
            session_id = $result.session_id
            source_head = $result.source_head
            main_head = $main
            modified_files = @($result.modified_files)
            recovery_package_preserved = $true
            local_run_state_deleted = $true
            lock_absent = $true
            status = 'CONTROLLED_INTERRUPTION'
          }
          $markerJson = ($marker | ConvertTo-Json -Depth 8).Replace("`r`n", "`n") + "`n"
          [IO.File]::WriteAllText((Join-Path $evidence 'controlled-interruption.json'), $markerJson, (New-Object Text.UTF8Encoding($false)))
          Write-Error 'CONTROLLED_INTERRUPTION_AFTER_DELTA_PRESERVATION'
          exit 75

      - name: Execute real RESUME_DELTA qualification
        if: inputs.stage == 'RESUME_DELTA'
        shell: powershell
        working-directory: _qualification/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          KODJO_QUALIFICATION_MIGRATION_FILE: ${{ inputs.recovery_migration_file }}
        run: |
          $env:KODJO_LIVE_GH_TOKEN = $env:GH_TOKEN
          Remove-Item Env:GH_TOKEN
          & scripts/kodjo/run-disposable-resume-qualification.ps1 `
            -ExpectedHead '${{ inputs.expected_head }}' `
            -ExpectedMain '${{ inputs.expected_main }}' `
            -SourceRunId '${{ inputs.source_run_id }}' `
            -RecoveryMigrationFile $env:KODJO_QUALIFICATION_MIGRATION_FILE `
            -SourceEvidenceDirectory '${{ github.workspace }}\_source-qualification-evidence' `
            -EvidenceDirectory 'qualification-evidence'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve disposable qualification evidence
        if: always() && inputs.stage != 'CLEANUP_ONLY'
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-disposable-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: _qualification/${{ github.run_id }}/qualification-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Preserve availability proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-qualification-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-availability-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve cleanup diagnostic
        if: always() && inputs.stage == 'CLEANUP_ONLY'
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-runner-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: _qualification/${{ github.run_id }}/qualification-evidence
          if-no-files-found: error
          retention-days: 90
