name: Claude Plan T01-S09 (Issue #17) [TEMPORAIRE]

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  plan-t01-s09:
    if: >
      github.event.issue.number == 17 &&
      contains(github.event.comment.body, '@claude-plan-t01-s09-retry')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creation-seance-catalogue
          fetch-depth: 0
      - name: Run Claude plan (automation mode, read-only)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Dépôt MyUncried/Application-Routine, Issue #17, tranche T01-S09.
            Lis l'Issue #17 et ses commentaires, AI_ORCHESTRATION.md V1.2,
            les instructions, la documentation 06 à 12, le registre des décisions,
            les références visuelles Catégories et le code à la baseline
            c3af9990c8a35013bbad372c2eca2ce16d66d138.
            Phase strictement en lecture seule : aucune modification de fichier,
            branche, commit, Issue ou PR. Revalide branche/baseline, puis produis
            le plan complet et vérifiable demandé par l'Issue. Résous uniquement
            par les sources ; toute décision nécessaire absente déclenche
            CLARIFICATION_REQUIRED. Le JSON "message" contient le commentaire
            GitHub complet, préfixé "[Claude Code]", et finit exactement par
            "STATUT : PLAN_READY_FOR_REVIEW", "STATUT : CLARIFICATION_REQUIRED",
            "STATUT : WORKTREE_LOCKED" ou "STATUT : ARBITRAGE".
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git:*),Bash(ls:*),Bash(find:*),Bash(rg:*),Bash(sed:*),Bash(head:*),Bash(wc:*),Bash(file:*)"
            --json-schema '{"type":"object","properties":{"message":{"type":"string"}},"required":["message"]}'
      - name: Publish structured plan comment
        if: always()
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MESSAGE=$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.message // empty')
          if [ -z "$MESSAGE" ]; then
            MESSAGE="CLOUD_PLAN_RETRY_FAILURE_RUN-${{ github.run_id }} — structured_output absent ou invalide. STATUT : ARBITRAGE"
          fi
          printf '%s\n' "$MESSAGE" | gh issue comment 17 --repo "${{ github.repository }}" --body-file -
