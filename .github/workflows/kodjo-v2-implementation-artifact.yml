name: KODJO V2 implementation artifact

# Pilote technique borne de conservation et de reprise — KODJO V2 0.6.8
#
# Cloture MAJ-03 : ce job reste en contents: read et n'ecrit AUCUNE preuve. Il
# produit une EvidenceDepositRequest decrivant ce que le writer de preuves dedie
# devra ajouter dans le dépôt fixe MyUncried/Application-Routine-KODJO-Evidence,
# sur la branche fixe kodjo/protocol-evidence-v2. L'artefact
# Actions est la barriere immediate de recuperation et un transport temporaire ;
# il ne devient jamais la preuve canonique definitive.
#
# BLK-01 (revue 0.6.4, contre-analyse 0.6.5) : les repertoires techniques du
# protocole vivent SOUS ${RUNNER_TEMP}, jamais dans la copie de travail. Une
# implantation invalide est REFUSEE bruyamment par preserve-implementation.js et
# par validate-workflows.js ; les exclusions de pathspec ne sont qu'une defense
# secondaire et ne masquent jamais une mauvaise configuration.
#
# Corrections issues de la revue independante 0.6.4 : BLK-01 (le delta ne
# contient plus les repertoires d'orchestration), MAJ-01 (un televersement de
# recuperation en echec est detecte et declasse le statut, avec une tentative de
# secours), MAJ-02 (une reprise privee des controles repris relance tout).
# (§4.7, §5.2-A, §6.13-B, §6.13-C).
#
# Ce workflow ne possede AUCUN droit d'ecriture fonctionnelle : contents=read,
# persist-credentials=false, aucune creation de commit, de branche, de tag ni de
# reference. L'application durable reste locale, dans /Dev.
#
# Ordre normatif :
#   adaptateur borne -> controle d'integrite Git -> conservation -> validation du
#   patch -> TELEVERSEMENT DE L'ARTEFACT DE RECUPERATION -> controles -> synthese
#   -> artefact de resultat -> commentaire -> recu de publication -> code de sortie.
#
# L'artefact de recuperation est televerse AVANT Jest, TypeScript, lint et scope :
# une interruption du runner pendant un controle ne peut plus faire perdre le patch.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: IMPLEMENT ou TARGETED_FIX
        type: choice
        options:
          - IMPLEMENT
          - TARGETED_FIX
        required: true
      slice_id:
        type: string
        required: true
      source_head:
        description: SHA complet 40 hex servant de base au patch
        type: string
        required: true
      agent_adapter:
        description: Identifiant d'adaptateur borne du registre (aucune commande libre)
        type: string
        required: false
        default: none
      issue_number:
        type: string
        required: false
      slice_bootstrap_file:
        description: Chemin canonique de la SliceBootstrapIdentity V2
        type: string
        required: true
      slice_bootstrap_sha256:
        description: Empreinte canonique attendue de la SliceBootstrapIdentity
        type: string
        required: true
      scope_allow:
        description: Perimetre autorise de l'increment, globs separes par des virgules
        type: string
        required: false
      source_run_id:
        description: Run source pour une reprise TARGETED_FIX
        type: string
        required: false
      source_recovery_artifact:
        description: Nom de l'artefact de RECUPERATION du run source
        type: string
        required: false
      source_result_artifact:
        description: Nom de l'artefact de RESULTAT du run source, pour les controles repris
        type: string
        required: false
      source_artifact_sha256:
        type: string
        required: false
      failed_checks:
        description: Controles echoues a relancer en TARGETED_FIX
        type: string
        required: false

permissions:
  contents: read
  actions: read
  issues: write

defaults:
  run:
    shell: bash

env:
  KODJO_MODE: ${{ inputs.mode }}
  KODJO_SLICE_ID: ${{ inputs.slice_id }}
  KODJO_SOURCE_HEAD: ${{ inputs.source_head }}
  KODJO_SOURCE_RUN_ID: ${{ github.run_id }}
  KODJO_RECOVERY_OF_RUN_ID: ${{ inputs.source_run_id }}
  KODJO_FAILED_CHECKS: ${{ inputs.failed_checks }}
  KODJO_SOURCE_ARTIFACT_SHA256: ${{ inputs.source_artifact_sha256 }}
  KODJO_ISSUE_NUMBER: ${{ inputs.issue_number }}
  KODJO_SLICE_BOOTSTRAP_FILE: ${{ inputs.slice_bootstrap_file }}
  KODJO_SLICE_BOOTSTRAP_SHA256: ${{ inputs.slice_bootstrap_sha256 }}
  KODJO_REPOSITORY: ${{ github.repository }}
  KODJO_SCOPE_ALLOW: ${{ inputs.scope_allow }}
  KODJO_AGENT_ADAPTER: ${{ inputs.agent_adapter }}
  # Ces trois chemins sont resolus hors du depot par l'etape "orchestration_paths".
  KODJO_WORKFLOW_KIND: IMPLEMENTATION
  RECOVERY_ARTIFACT: kodjo-${{ inputs.slice_id }}-${{ github.run_id }}-recovery
  RESULT_ARTIFACT: kodjo-${{ inputs.slice_id }}-${{ github.run_id }}-result
  RECEIPT_ARTIFACT: kodjo-${{ inputs.slice_id }}-${{ github.run_id }}-publication-receipt

jobs:
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source_head without functional credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_head }}
          persist-credentials: false
          fetch-depth: 0

      # Les repertoires techniques sont resolus hors de la copie de travail.
      # runner.temp n'est pas disponible dans un env de job : il est publie ici.
      - name: Resolve orchestration paths outside the working copy
        id: orchestration_paths
        run: |
          {
            echo "KODJO_DELIVERY_DIR=${RUNNER_TEMP}/kodjo/delivery"
            echo "KODJO_SOURCE_RECOVERY_DIR=${RUNNER_TEMP}/kodjo/source-recovery"
            echo "KODJO_SOURCE_RESULT_DIR=${RUNNER_TEMP}/kodjo/source-result"
          } >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/kodjo"

      - name: Reject invalid orchestration paths before any production
        id: orchestration_preflight
        run: node scripts/kodjo/validate-orchestration-paths.js

      - name: Validate activated V2 slice identity
        id: slice_identity
        run: |
          actual="$(node scripts/kodjo/validate-slice-bootstrap.js . "${KODJO_SLICE_BOOTSTRAP_FILE}" "${KODJO_SOURCE_HEAD}")"
          test "${actual}" = "${KODJO_SLICE_BOOTSTRAP_SHA256}"

      - name: Refuse any remote functional write capability
        id: guard
        run: node scripts/kodjo/scan-remote-write-capability.js

      - name: Validate workflow structure
        id: workflow_check
        run: node scripts/kodjo/validate-workflows.js

      - name: Download source recovery artifact for TARGETED_FIX
        id: download_recovery
        if: inputs.mode == 'TARGETED_FIX'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_recovery_artifact }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kodjo/source-recovery

      - name: Download source result artifact for carried checks
        id: download_result
        if: inputs.mode == 'TARGETED_FIX' && inputs.source_result_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_result_artifact }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kodjo/source-result

      - name: Verify and restore source patch
        id: restore
        if: inputs.mode == 'TARGETED_FIX'
        run: node scripts/kodjo/restore-source-artifact.js "${KODJO_SOURCE_RECOVERY_DIR}" .

      - name: Resolve checks to run
        id: checks_plan
        if: always()
        env:
          KODJO_CARRIED_CHECKS_DIR: ${{ runner.temp }}/kodjo/source-result/checks
        run: |
          list="$(node scripts/kodjo/resolve-checks-to-run.js "${KODJO_FAILED_CHECKS:-}" | tr '\n' ',')"
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          echo "checks planned: ${list}"

      - name: Capture git state before the adapter
        id: git_state_before
        run: node scripts/kodjo/git-state-guard.js capture "${KODJO_DELIVERY_DIR}" before

      - name: Run bounded implementation or targeted correction
        id: agent
        continue-on-error: true
        env:
          KODJO_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/kodjo/run-implementation-agent.js "${KODJO_DELIVERY_DIR}"

      - name: Verify the adapter mutated no git reference
        id: git_state_after
        if: always()
        continue-on-error: true
        run: node scripts/kodjo/git-state-guard.js verify "${KODJO_DELIVERY_DIR}"

      # ---- Barriere de conservation : §4.7, avant tout controle ----
      - name: Preserve implementation before checks
        id: preserve
        if: always() && steps.agent.outcome != 'skipped'
        env:
          KODJO_SESSION_ID: ${{ steps.agent.outputs.session_id }}
          KODJO_AGENT_STATUS: ${{ steps.agent.outputs.agent_status }}
          KODJO_CARRIED_CHECKS_DIR: ${{ inputs.mode == 'TARGETED_FIX' && format('{0}/kodjo/source-result/checks', runner.temp) || '' }}
        run: node scripts/kodjo/preserve-implementation.js "${KODJO_DELIVERY_DIR}"

      - name: Validate patch recovery before checks
        id: patch_check
        if: always() && steps.preserve.outcome == 'success'
        run: node scripts/kodjo/verify-delivery.js "${KODJO_DELIVERY_DIR}"

      # ---- Conservation durable AVANT le moindre controle ----
      # A partir d'ici, une perte du runner ne peut plus detruire le patch.
      - name: Upload recovery artifact BEFORE any check
        id: recovery_upload
        continue-on-error: true
        if: always() && steps.preserve.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RECOVERY_ARTIFACT }}
          path: ${{ runner.temp }}/kodjo/delivery/recovery/
          if-no-files-found: error
          retention-days: 90

      # MAJ-01 : seconde chance de depot durable. Sans elle, un echec du
      # televersement laisse le patch dans le seul workspace ephemere.
      - name: Retry the recovery upload once if the first deposit failed
        id: recovery_upload_retry
        continue-on-error: true
        if: always() && steps.preserve.outcome == 'success' && steps.recovery_upload.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RECOVERY_ARTIFACT }}-retry
          path: ${{ runner.temp }}/kodjo/delivery/recovery/
          if-no-files-found: error
          retention-days: 90

      # ---- Controles : chacun capture son propre code de sortie ----
      - name: Jest
        id: jest
        if: always() && (steps.recovery_upload.outcome == 'success' || steps.recovery_upload_retry.outcome == 'success') && contains(steps.checks_plan.outputs.list, 'jest')
        continue-on-error: true
        run: node scripts/kodjo/run-check.js jest "${KODJO_DELIVERY_DIR}/checks/jest.json"

      - name: TypeScript
        id: typescript
        if: always() && (steps.recovery_upload.outcome == 'success' || steps.recovery_upload_retry.outcome == 'success') && contains(steps.checks_plan.outputs.list, 'typescript')
        continue-on-error: true
        run: node scripts/kodjo/run-check.js typescript "${KODJO_DELIVERY_DIR}/checks/typescript.json"

      - name: Lint
        id: lint
        if: always() && (steps.recovery_upload.outcome == 'success' || steps.recovery_upload_retry.outcome == 'success') && contains(steps.checks_plan.outputs.list, 'lint')
        continue-on-error: true
        run: node scripts/kodjo/run-check.js lint "${KODJO_DELIVERY_DIR}/checks/lint.json"

      - name: Scope
        id: scope
        if: always() && (steps.recovery_upload.outcome == 'success' || steps.recovery_upload_retry.outcome == 'success') && contains(steps.checks_plan.outputs.list, 'scope')
        continue-on-error: true
        run: node scripts/kodjo/run-check.js scope "${KODJO_DELIVERY_DIR}/checks/scope.json"

      - name: Finalize business status and result manifest
        id: summarize
        if: always()
        env:
          KODJO_RECOVERY_ARTIFACT_NAME: ${{ env.RECOVERY_ARTIFACT }}
          KODJO_RECOVERY_ARTIFACT_URL: ${{ steps.recovery_upload.outputs.artifact-url }}
          KODJO_RECOVERY_ARTIFACT_DIGEST: ${{ steps.recovery_upload.outputs.artifact-digest }}
          KODJO_RECOVERY_ARTIFACT_ID: ${{ steps.recovery_upload.outputs.artifact-id }}
          KODJO_RECOVERY_UPLOAD_OUTCOME: ${{ steps.recovery_upload.outcome }}
          KODJO_RECOVERY_RETRY_NAME: ${{ env.RECOVERY_ARTIFACT }}-retry
          KODJO_RECOVERY_RETRY_URL: ${{ steps.recovery_upload_retry.outputs.artifact-url }}
          KODJO_RECOVERY_RETRY_DIGEST: ${{ steps.recovery_upload_retry.outputs.artifact-digest }}
          KODJO_RECOVERY_RETRY_ID: ${{ steps.recovery_upload_retry.outputs.artifact-id }}
          KODJO_RECOVERY_RETRY_OUTCOME: ${{ steps.recovery_upload_retry.outcome }}
        run: node scripts/kodjo/finalize-implementation-delivery.js "${KODJO_DELIVERY_DIR}"

      - name: Upload result artifact after the checks
        id: result_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: |
            ${{ runner.temp }}/kodjo/delivery/result/
            ${{ runner.temp }}/kodjo/delivery/checks/
            ${{ runner.temp }}/kodjo/delivery/integrity/
            ${{ runner.temp }}/kodjo/delivery/adapter.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish structured issue result
        id: publish
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/kodjo/publish-implementation-output.js "${KODJO_DELIVERY_DIR}"

      - name: Upload publication receipt
        id: receipt_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RECEIPT_ARTIFACT }}
          path: ${{ runner.temp }}/kodjo/delivery/receipt/
          if-no-files-found: warn
          retention-days: 90

      - name: Return run status after preservation and publication
        id: exit_status
        if: always()
        run: node scripts/kodjo/exit-from-business-status.js "${KODJO_DELIVERY_DIR}/result/manifest.json"
