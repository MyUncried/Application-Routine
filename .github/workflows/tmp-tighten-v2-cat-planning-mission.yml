name: TEMP tighten V2-CAT-01 planning mission

on:
  push:
    branches:
      - docs/v2-cat-01-review-findings-20260917
    paths:
      - .github/workflows/tmp-tighten-v2-cat-planning-mission.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v2-cat-01-review-findings-20260917
          fetch-depth: 0
      - name: Apply bounded mission corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/orchestration/v2-slices/V2-CAT-01/planning-mission.md')
          s=p.read_text(encoding='utf-8')
          old='- Écran/options : `Activité`, `Séance`, `Circuit`, `Annuler`.\n- `Activité` et `Séance` disponibles ; `Circuit` visible mais désactivé ; `Annuler` disponible.'
          new='- Écran/options : `Une nouvelle activité`, `Une séance`, `Un circuit`, `Annuler`.\n- `Une nouvelle activité` et `Une séance` disponibles ; `Un circuit` visible mais désactivé ; `Annuler` disponible.'
          if s.count(old)!=1:
              raise SystemExit('Expected creation-options mission fragment exactly once')
          s=s.replace(old,new)
          marker='Ne jamais utiliser un rapport historique ou une règle supersédée comme exigence courante lorsqu’une source normative plus récente existe.\n\n## Périmètre fonctionnel inclus'
          insert='''Ne jamais utiliser un rapport historique ou une règle supersédée comme exigence courante lorsqu’une source normative plus récente existe.\n\n## Corrections imposées après la revue indépendante du plan initial\n\nLa revue `5712601284` a demandé une révision avant développement. Les points suivants sont désormais déterminés et doivent être intégrés au prochain plan sans rouvrir les éléments déjà validés :\n\n- le libellé exact de la première option `Créer` est `Une nouvelle activité` ; l’arbitrage utilisateur est tracé dans l’Issue #150 et les anciennes occurrences Figma `Une activité` constituent un écart graphique à resynchroniser, pas une règle fonctionnelle ;\n- la section Médias de l’éditeur est visible et repliable ; `Déployer / Condenser` et le placeholder restent désactivés et aucune fonction média réelle n’entre dans la tranche ;\n- `scope_allow` doit rester minimal et correspondre strictement aux fichiers réellement à créer/modifier et aux tests qui doivent réellement s’adapter ; les calculs de bilatéralité déjà validés, notamment `src/domain/sessions/calculations.ts`, sont gelés et hors périmètre ; `src/domain/sessions/Session.ts` ne doit être classé `MODIFY` que si un changement concret indispensable est démontré ; les importeurs d’un contrat inchangé doivent être classés `CONSUMER_UNAFFECTED` ou `TEST_UNAFFECTED` ;\n- tout nouveau test exigé par le plan doit apparaître explicitement en `CREATE` dans `modified_modules` et donc dans le scope machine ; aucun test nouveau ne peut être exigé uniquement en prose ;\n- `src/features/activities/` est autorisé comme frontière de présentation dédiée aux Activités persistantes : écrans, composants et adaptateurs UI propres à cette feature ; le domaine reste dans `src/domain/activities/`, la persistance SQLite dans `src/infrastructure/database/`, et les composants réellement partagés restent dans les espaces partagés ;\n- le libellé permanent de navigation basse `Catalogues` supersède explicitement l’ancien jalon `RES-NAV-LABEL-01` (`Séances`).\n\nLe prochain plan doit énumérer et justifier l’intégralité de son `scope_allow` ; sa section de périmètre technique et l’artefact machine ne doivent pas diverger.\n\n## Périmètre fonctionnel inclus'''
          if s.count(marker)!=1:
              raise SystemExit('Expected mission insertion marker exactly once')
          s=s.replace(marker,insert)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'Une nouvelle activité' .github/orchestration/v2-slices/V2-CAT-01/planning-mission.md
          grep -Fq 'src/domain/sessions/calculations.ts' .github/orchestration/v2-slices/V2-CAT-01/planning-mission.md
          grep -Fq 'tout nouveau test exigé' .github/orchestration/v2-slices/V2-CAT-01/planning-mission.md
          git diff --check
      - name: Commit mission and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-tighten-v2-cat-planning-mission.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(kodjo): bind V2-CAT-01 plan revision findings'
          git push origin HEAD:docs/v2-cat-01-review-findings-20260917
