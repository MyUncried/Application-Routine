name: KODJO V1.4 S09 — Implementation Local
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: kodjo-v14-s09-implementation
  cancel-in-progress: false
env:
  ISSUE_NUMBER: '17'
  TARGET_BRANCH: feat/creation-seance-catalogue
  HISTORICAL_SESSION_ID: 99404ae0-19e3-4004-8dde-cd670588afb5
  PLAN_GATE_COMMENT_ID: '5552063575'

jobs:
  implement:
    if: github.event_name == 'issue_comment' && github.event.comment.user.login == 'MyUncried' && github.event.issue.number == 17 && (contains(github.event.comment.body, '[KODJO_V14_S09] PLAN_APPROVED') || contains(github.event.comment.body, '[KODJO_V14_S09] IMPLEMENTATION_REVISION') || contains(github.event.comment.body, '[KODJO_V14_S09] VISUAL_CORRECTION') || contains(github.event.comment.body, '[KODJO_V14_S09] CORRECT'))
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
      TRIGGER_AUTHOR: ${{ github.event.comment.user.login }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Resolve durable source ref
        id: source
        run: |
          $ErrorActionPreference='Stop'
          $correct=$env:TRIGGER_BODY.Contains('[KODJO_V14_S09] CORRECT')
          if($correct){
            $bm=[regex]::Match($env:TRIGGER_BODY,'(?m)^source_branch=([^\r\n]+)\s*$')
            $hm=[regex]::Match($env:TRIGGER_BODY,'(?m)^source_head=([0-9a-f]{40})\s*$')
            if(-not $bm.Success -or -not $hm.Success){throw 'Durable correction source metadata missing'}
            $branch=$bm.Groups[1].Value.Trim(); $head=$hm.Groups[1].Value
            if($branch -notmatch '^(feat/creation-seance-catalogue|recovery/t01-s09-[A-Za-z0-9._/-]+)$'){throw 'Unauthorized correction source branch'}
          } else {
            $branch=$env:TARGET_BRANCH; $head=''
          }
          "branch=$branch" >> $env:GITHUB_OUTPUT
          "expected_head=$head" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          ref: '${{ steps.source.outputs.branch }}'
          fetch-depth: 0
          persist-credentials: true
      - name: Resolve approved plan and DEV authorization
        id: gate
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          EXPECTED_SOURCE_HEAD: ${{ steps.source.outputs.expected_head }}
        run: |
          $ErrorActionPreference='Stop'
          if('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME){throw 'Unexpected runner'}
          if($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine'){throw 'Unexpected repository'}
          if((git branch --show-current).Trim() -ne $env:SOURCE_BRANCH){throw 'Unexpected source branch'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Dirty worktree'}
          $head=(git rev-parse HEAD).Trim(); $claude=Get-Command claude.cmd -ErrorAction Stop
          if(-not [string]::IsNullOrWhiteSpace($env:EXPECTED_SOURCE_HEAD) -and $head -ne $env:EXPECTED_SOURCE_HEAD){throw 'Durable source HEAD mismatch'}
          $cred=Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json') -Raw|ConvertFrom-Json; if([int64]$cred.claudeAiOauth.expiresAt -le [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()){throw 'Claude token expired'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $gate=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/comments/$env:PLAN_GATE_COMMENT_ID" -Headers $headers
          if($null -eq $gate -or [string]$gate.body -notmatch '\[KODJO_S09_PLAN_GATE\]' -or [string]$gate.body -notmatch 'STATUT : PLAN_READY_FOR_USER_GATE'){throw 'Direct plan gate invalid'}
          $gm=[regex]::Match([string]$gate.body,'(?m)^source_plan_comment_id=(\d+)\s*$'); if(-not$gm.Success){throw 'Plan id missing'}; $planId=$gm.Groups[1].Value
          $gh=[regex]::Match([string]$gate.body,'(?m)^source_head=([0-9a-f]{40})\s*$'); if(-not$gh.Success){throw 'Plan head missing'}; $planHead=$gh.Groups[1].Value
          $plan=(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/comments/$planId" -Headers $headers).body; if($plan -notmatch 'plan_builder=OPENAI'){throw 'Approved plan is not OpenAI-built'}
          $initial=$env:TRIGGER_BODY.Contains('[KODJO_V14_S09] PLAN_APPROVED'); $visual=$env:TRIGGER_BODY.Contains('[KODJO_V14_S09] VISUAL_CORRECTION'); $correct=$env:TRIGGER_BODY.Contains('[KODJO_V14_S09] CORRECT')
          if($initial){
            if($env:TRIGGER_AUTHOR -ne 'MyUncried'){throw 'PLAN_APPROVED must be user-authored'}
            if($head -ne $planHead){throw 'HEAD changed since plan'}
            $attempt=1; $session=''; $mode='INITIAL'
          } else {
            $am=[regex]::Match($env:TRIGGER_BODY,'(?m)^attempt=(\d+)\s*$'); $sm=[regex]::Match($env:TRIGGER_BODY,'(?m)^session_id=([0-9a-f-]{36})\s*$')
            if(-not$am.Success -or -not$sm.Success){throw 'Correction metadata missing'}
            $attempt=[int]$am.Groups[1].Value; $session=$sm.Groups[1].Value
            if($session -eq $env:HISTORICAL_SESSION_ID){throw 'Historical session forbidden'}
            if(($visual -or $correct) -and $env:TRIGGER_AUTHOR -ne 'MyUncried'){throw 'Correction must be user-authored'}
            $mode=if($correct){'CORRECT'}elseif($visual){'VISUAL'}else{'REVISION'}
          }
          $pp=Join-Path $env:RUNNER_TEMP 'approved-plan.txt'; [IO.File]::WriteAllText($pp,[string]$plan,(New-Object Text.UTF8Encoding($false)))
          "head=$head" >> $env:GITHUB_OUTPUT; "claude=$($claude.Source)" >> $env:GITHUB_OUTPUT; "attempt=$attempt" >> $env:GITHUB_OUTPUT; "session=$session" >> $env:GITHUB_OUTPUT; "mode=$mode" >> $env:GITHUB_OUTPUT; "plan_id=$planId" >> $env:GITHUB_OUTPUT; "plan_path=$pp" >> $env:GITHUB_OUTPUT
      - name: Provision Node dependencies
        run: |
          $ErrorActionPreference='Stop'
          npm ci
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          if(-not (Test-Path 'node_modules/.bin/jest.cmd')){throw 'Jest unavailable after npm ci'}
      - name: Run Claude DEV-S09
        id: claude
        env:
          CLAUDE_PATH: ${{ steps.gate.outputs.claude }}
          SOURCE_HEAD: ${{ steps.gate.outputs.head }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
          SESSION: ${{ steps.gate.outputs.session }}
          MODE: ${{ steps.gate.outputs.mode }}
          PLAN_PATH: ${{ steps.gate.outputs.plan_path }}
        run: |
          $ErrorActionPreference='Stop'; $plan=Get-Content $env:PLAN_PATH -Raw -Encoding UTF8
          if($env:MODE -eq 'INITIAL'){
            $prompt="KODJO V1.4 DEV-S09. Démarre une NOUVELLE session opérationnelle dédiée à S09. Sources actuelles > mémoire agent. Baseline $env:TARGET_BRANCH @ $env:SOURCE_HEAD. Implémente uniquement le plan approuvé ci-dessous. Ne modifie aucun workflow/.github/CLAUDE.md. migration001.ts immuable; migration additive seulement. Préserve T01-S01..S08. Exécute tests ciblés. Ne committe/pousse pas. Signale seulement vraie décision produit indéterminable.`n`nPLAN APPROUVÉ:`n$plan"; $args=@('-p','--permission-mode','acceptEdits','--output-format','json')
          } else {
            $marker=if($env:MODE -eq 'VISUAL'){'VISUAL_FEEDBACK:'}elseif($env:MODE -eq 'CORRECT'){'CORRECTION_FEEDBACK:'}else{'REVIEW_FEEDBACK:'}
            $i=$env:TRIGGER_BODY.IndexOf($marker); if($i -lt 0){throw 'Feedback missing'}; $feedback=$env:TRIGGER_BODY.Substring($i+$marker.Length).Trim(); if([string]::IsNullOrWhiteSpace($feedback)){throw 'Feedback empty'}
            $prompt="KODJO V1.4 DEV-S09 correction $env:MODE tentative $env:ATTEMPT. Continue exclusivement la session DEV-S09 $env:SESSION. SOURCE DE VERITE ABSOLUE : le checkout Git courant @ $env:SOURCE_HEAD. La mémoire de session apporte le contexte mais ne prouve jamais l'état du code. Relis les fichiers et les tests actuels. Pour cette correction, analyse chaque échec Jest : distingue test historique devenu obsolète d'une régression réelle. Mets à jour un test seulement si le comportement attendu a été explicitement remplacé par S09/les décisions approuvées ; sinon corrige le code. Préserve S01-S08 hors décisions explicitement supersédées. Exécute les tests ciblés. Ne committe/pousse pas.`n`nPLAN APPROUVÉ:`n$plan`n`nFEEDBACK COMPLET:`n$feedback"; $args=@('-p','--resume',$env:SESSION,'--permission-mode','acceptEdits','--output-format','json')
          }
          $promptPath=Join-Path $env:RUNNER_TEMP 'claude-prompt.txt'; [IO.File]::WriteAllText($promptPath,$prompt,(New-Object Text.UTF8Encoding($false)))
          $out=Join-Path $env:RUNNER_TEMP 'dev-out.txt'; $err=Join-Path $env:RUNNER_TEMP 'dev-err.txt'; $diag=Join-Path $env:RUNNER_TEMP 'dev-diagnostic.json'
          $old=$ErrorActionPreference; $ErrorActionPreference='Continue'; Get-Content $promptPath -Raw -Encoding UTF8 | & $env:CLAUDE_PATH @args 1> $out 2> $err; $exit=$LASTEXITCODE; $ErrorActionPreference=$old
          $raw=if(Test-Path $out){Get-Content $out -Raw -Encoding UTF8}else{''}; $stderr=if(Test-Path $err){Get-Content $err -Raw -Encoding UTF8}else{''}
          $p=$null; $parseError=''; try{$p=$raw|ConvertFrom-Json -ErrorAction Stop}catch{$parseError=$_.Exception.Message}
          $diagnostic=[ordered]@{exit_code=$exit; stdout_present=(-not [string]::IsNullOrWhiteSpace($raw)); stdout_length=$raw.Length; stderr_present=(-not [string]::IsNullOrWhiteSpace($stderr)); stderr_length=$stderr.Length; json_valid=($null -ne $p); json_error=$parseError; session_id_present=($null -ne $p -and -not [string]::IsNullOrWhiteSpace([string]$p.session_id)); result_present=($null -ne $p -and -not [string]::IsNullOrWhiteSpace([string]$p.result)); is_error=if($null -ne $p){[bool]$p.is_error}else{$null}; api_error_status=if($null -ne $p){$p.api_error_status}else{$null}; terminal_reason=if($null -ne $p){[string]$p.terminal_reason}else{''}; expected_session=$env:SESSION; mode=$env:MODE}
          [IO.File]::WriteAllText($diag,($diagnostic|ConvertTo-Json -Depth 4),(New-Object Text.UTF8Encoding($false)))
          if([string]::IsNullOrWhiteSpace($raw)){throw 'Claude CLI returned empty stdout; diagnostic evidence preserved'}
          if($null -eq $p){throw "Claude CLI returned invalid JSON; diagnostic evidence preserved: $parseError"}
          if([int]$p.api_error_status -eq 429 -or [string]$p.result -match '(?i)session limit|rate limit'){throw "Claude usage limit reached: $([string]$p.result)"}
          if($exit -ne 0){throw "Claude CLI exited with code $exit; terminal_reason=$([string]$p.terminal_reason); diagnostic evidence preserved"}
          if([string]::IsNullOrWhiteSpace([string]$p.session_id)){throw 'Claude JSON missing session_id; diagnostic evidence preserved'}
          if([string]::IsNullOrWhiteSpace([string]$p.result)){throw 'Claude JSON missing result; diagnostic evidence preserved'}
          if($p.session_id -eq $env:HISTORICAL_SESSION_ID){throw 'Historical session reused'}; if($env:MODE -ne 'INITIAL' -and $p.session_id -ne $env:SESSION){throw 'DEV-S09 session continuity mismatch'}
          $resultText=[string]$p.result; if($resultText -match '(?i)ORCHESTRATION_FAILURE|CLARIFICATION_REQUIRED|state\s*=\s*ORCHESTRATION_FAILURE|waiting_for='){throw 'Claude reported blocking state; implementation cannot be published'}
          $rp=Join-Path $env:RUNNER_TEMP 'dev-result.txt'; [IO.File]::WriteAllText($rp,$resultText,(New-Object Text.UTF8Encoding($false))); "session=$($p.session_id)" >> $env:GITHUB_OUTPUT; "result=$rp" >> $env:GITHUB_OUTPUT
      - name: Preserve Claude diagnostic evidence
        if: always() && steps.claude.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: claude-dev-s09-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dev-out.txt
            ${{ runner.temp }}/dev-err.txt
            ${{ runner.temp }}/dev-diagnostic.json
            ${{ runner.temp }}/dev-result.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce scope and deterministic checks
        run: |
          $ErrorActionPreference='Stop'
          function Get-GitRawPaths {
            param([string]$Arguments)
            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName='git.exe'
            $psi.Arguments=$Arguments
            $psi.UseShellExecute=$false
            $psi.RedirectStandardOutput=$true
            $psi.StandardOutputEncoding=[Text.Encoding]::UTF8
            $process=New-Object System.Diagnostics.Process
            $process.StartInfo=$psi
            [void]$process.Start()
            $output=$process.StandardOutput.ReadToEnd()
            $process.WaitForExit()
            if($process.ExitCode -ne 0){throw "git $Arguments failed"}
            return @($output -split "`0"|Where-Object{$_ -ne ''})
          }
          $tracked=@(Get-GitRawPaths 'diff --name-only -z HEAD')
          $untracked=@(Get-GitRawPaths 'ls-files --others --exclude-standard -z')
          $changed=@($tracked+$untracked|Sort-Object -Unique)
          if($changed.Count -eq 0){throw 'No changes'}
          $applicationChanged=$false
          foreach($p in $changed){$n=$p-replace '\\','/'; if($n -eq 'src/infrastructure/database/migrations/migration001.ts'){throw 'migration001 immutable'}; if($n.StartsWith('app/') -or $n.StartsWith('src/')){$applicationChanged=$true; continue}; if($n.StartsWith('docs/')){continue}; if($n.StartsWith('.github/orchestration/reports/') -and $n.EndsWith('.md')){continue}; throw "Unauthorized path: $n"}
          if(-not $applicationChanged){throw 'No application changes: report-only or documentation-only output cannot be published'}
          npm test -- --runInBand; if($LASTEXITCODE -ne 0){throw 'Jest failed'}; npx tsc --noEmit; if($LASTEXITCODE -ne 0){throw 'TypeScript failed'}
      - name: Commit push and publish for OpenAI review
        env:
          SOURCE_HEAD: ${{ steps.gate.outputs.head }}
          SESSION_ID: ${{ steps.claude.outputs.session }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
          PLAN_ID: ${{ steps.gate.outputs.plan_id }}
          RESULT: ${{ steps.claude.outputs.result }}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app src docs .github/orchestration/reports
          git commit -m "feat: implement T01-S09 attempt $env:ATTEMPT"; if($LASTEXITCODE -ne 0){throw 'Commit failed'}
          $new=(git rev-parse HEAD).Trim()
          git fetch origin $env:TARGET_BRANCH
          $target=(git rev-parse "origin/$env:TARGET_BRANCH").Trim()
          git merge-base --is-ancestor $target $new; if($LASTEXITCODE -ne 0){throw 'Candidate is not a fast-forward of target branch; promotion refused'}
          git push origin "HEAD:$env:TARGET_BRANCH"; if($LASTEXITCODE -ne 0){throw 'Push failed'}
          $summary=Get-Content $env:RESULT -Raw -Encoding UTF8
          $body="[KODJO_S09_IMPLEMENTATION_OUTPUT]`nbase_head=$env:SOURCE_HEAD`nhead=$new`nsession_id=$env:SESSION_ID`nattempt=$env:ATTEMPT`nplan_comment_id=$env:PLAN_ID`ncontinuity_origin=DEV_S09_DEDICATED_SESSION`nSTATUT : IMPLEMENTATION_READY_FOR_REVIEW`n`n$summary"
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}; Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/17/comments" -Headers $h -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json) | Out-Null