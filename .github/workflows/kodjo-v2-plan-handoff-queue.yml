name: KODJO V2 — Approved Plan Handoff Queue

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: kodjo-v2-plan-handoff-queue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handoff:
    if: >
      github.event.comment.user.login == 'MyUncried' &&
      (contains(github.event.comment.body, '[KODJO_V2] VALIDATE_PLAN_HANDOFF') ||
       contains(github.event.comment.body, '[KODJO_V2] QUEUE_APPROVED_PLAN'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve handoff mode and gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          HANDOFF_ID="$(printf '%s\n' "$TRIGGER_BODY" | sed -n 's/^handoff_comment_id=//p' | head -n1)"
          printf '%s' "$HANDOFF_ID" | grep -Eq '^[1-9][0-9]*$'
          if printf '%s\n' "$TRIGGER_BODY" | grep -q '^\[KODJO_V2\] QUEUE_APPROVED_PLAN$'; then
            MODE=QUEUE
          else
            MODE=VALIDATE
          fi
          echo "handoff_id=$HANDOFF_ID" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Generate and admit canonical Lean Request
        id: request
        shell: bash
        env:
          HANDOFF_COMMENT_ID: ${{ steps.gate.outputs.handoff_id }}
          LEAN_REQUEST_OUTPUT: ${{ runner.temp }}/kodjo-approved-plan-lean-request.json
          KODJO_VERIFY_GITHUB: '1'
        run: |
          set -euo pipefail
          node scripts/kodjo/generate-approved-plan-lean-request.js
          REQUEST_ID="$(jq -r .request_id "$LEAN_REQUEST_OUTPUT")"
          SLICE_ID="$(jq -r .slice_id "$LEAN_REQUEST_OUTPUT")"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "slice_id=$SLICE_ID" >> "$GITHUB_OUTPUT"
          echo "short_id=${REQUEST_ID:0:8}" >> "$GITHUB_OUTPUT"

      - name: Bounded validation stop
        if: steps.gate.outputs.mode == 'VALIDATE'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SHORT_ID: ${{ steps.request.outputs.short_id }}
          SLICE_ID: ${{ steps.request.outputs.slice_id }}
          HANDOFF_ID: ${{ steps.gate.outputs.handoff_id }}
          SOURCE_FILE: ${{ runner.temp }}/kodjo-approved-plan-lean-request.json
        run: |
          set -euo pipefail
          BEFORE="$(git rev-parse HEAD)"
          TARGET=".github/orchestration/queue/v2/${SLICE_ID}-validate-${SHORT_ID}.json"
          cp "$SOURCE_FILE" "$TARGET"
          git config user.name 'KODJO Protocol Handoff Validation'
          git config user.email 'kodjo-protocol@users.noreply.github.com'
          git add -- "$TARGET"
          git commit -m "test(kodjo): bounded handoff admission $SLICE_ID"
          AFTER="$(git rev-parse HEAD)"
          SELECTED="$(KODJO_VERIFY_GITHUB=1 GITHUB_RUN_ATTEMPT=1 node scripts/kodjo/verify-queue-admission.js "$BEFORE" "$AFTER")"
          test "$SELECTED" = "$TARGET"
          git reset --hard "$BEFORE"
          {
            echo '[KODJO_V2] PLAN_HANDOFF_VALIDATED'
            echo "slice_id=$SLICE_ID"
            echo "handoff_comment_id=$HANDOFF_ID"
            echo "request_id=$REQUEST_ID"
            echo 'STATUT : PLAN_HANDOFF_VALIDATED'
            echo 'STOP : BEFORE_RUN_QUEUED_REQUEST'
          } > "${RUNNER_TEMP}/handoff-validated.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/handoff-validated.md"

      - name: Commit canonical Lean Request
        if: steps.gate.outputs.mode == 'QUEUE'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SHORT_ID: ${{ steps.request.outputs.short_id }}
          SLICE_ID: ${{ steps.request.outputs.slice_id }}
          SOURCE_FILE: ${{ runner.temp }}/kodjo-approved-plan-lean-request.json
        run: |
          set -euo pipefail
          TARGET=".github/orchestration/queue/v2/${SLICE_ID}-implement-${SHORT_ID}.json"
          cp "$SOURCE_FILE" "$TARGET"
          git config user.name 'KODJO Protocol Handoff'
          git config user.email 'kodjo-protocol@users.noreply.github.com'
          git add -- "$TARGET"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --cached --name-only)" = "$TARGET"
          git commit -m "chore(kodjo): queue approved $SLICE_ID implementation"
          git push origin HEAD:main
          {
            echo '[KODJO_V2] IMPLEMENTATION_QUEUED'
            echo "slice_id=$SLICE_ID"
            echo "request_id=$REQUEST_ID"
            echo "queue_path=$TARGET"
            echo 'STATUT : IMPLEMENTATION_QUEUED'
          } > "${RUNNER_TEMP}/implementation-queued.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/implementation-queued.md"

      - name: Preserve bounded validation request
        if: steps.gate.outputs.mode == 'VALIDATE'
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-plan-handoff-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/kodjo-approved-plan-lean-request.json
          if-no-files-found: error
          retention-days: 14
