name: KODJO V2 — Slice Plan Review
run-name: KODJO V2 / PLAN-REVIEW / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      slice_id:
        required: true
        type: string
      bootstrap_path:
        required: true
        type: string
      source_plan_comment_id:
        required: true
        type: string
      review_session_id:
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: read

concurrency:
  group: kodjo-v2-slice-plan-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  review:
    if: (github.event_name == 'issue_comment' && github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_PLAN_REVIEW')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body || '' }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      DISPATCH_SLICE_ID: ${{ inputs.slice_id || '' }}
      DISPATCH_BOOTSTRAP_PATH: ${{ inputs.bootstrap_path || '' }}
      DISPATCH_PLAN_ID: ${{ inputs.source_plan_comment_id || '' }}
      DISPATCH_REVIEW_SESSION: ${{ inputs.review_session_id || '' }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable V2 review gate
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner' }
          $slice=if($env:DISPATCH_SLICE_ID){$env:DISPATCH_SLICE_ID.Trim()}else{[regex]::Match($env:TRIGGER_BODY,'(?m)^slice_id=([^\r\n]+)\s*$').Groups[1].Value.Trim()}
          $bootstrap=if($env:DISPATCH_BOOTSTRAP_PATH){$env:DISPATCH_BOOTSTRAP_PATH.Trim()}else{[regex]::Match($env:TRIGGER_BODY,'(?m)^bootstrap_path=([^\r\n]+)\s*$').Groups[1].Value.Trim()}
          $planId=if($env:DISPATCH_PLAN_ID){$env:DISPATCH_PLAN_ID.Trim()}else{[regex]::Match($env:TRIGGER_BODY,'(?m)^source_plan_comment_id=([0-9]+)\s*$').Groups[1].Value}
          $reviewSession=if($env:DISPATCH_REVIEW_SESSION){$env:DISPATCH_REVIEW_SESSION.Trim()}else{[regex]::Match($env:TRIGGER_BODY,'(?m)^review_session_id=([0-9a-f-]{36})\s*$').Groups[1].Value}
          if (!$slice -or !$bootstrap -or !$planId) { throw 'Missing immutable V2 review inputs' }
          if ($bootstrap -ne ".github/orchestration/v2-slices/$slice/slice-bootstrap.json") { throw 'V2 bootstrap path mismatch' }
          if (!(Test-Path -LiteralPath $bootstrap)) { throw 'V2 bootstrap missing' }
          $b=Get-Content -Raw -LiteralPath $bootstrap -Encoding UTF8 | ConvertFrom-Json
          if ([string]$b.slice_id -ne $slice -or [int]$b.issue_number -ne [int]$env:ISSUE_NUMBER) { throw 'V2 identity mismatch' }
          if ([string]$b.repository -ne $env:GITHUB_REPOSITORY) { throw 'V2 repository mismatch' }
          $registry=Get-Content -Raw -LiteralPath ([string]$b.activation_registry) -Encoding UTF8 | ConvertFrom-Json
          $active=@($registry.activations | Where-Object { $_.slice_id -eq $slice })
          if ($active.Count -ne 1 -or $active[0].status -ne 'ACTIVE') { throw 'V2 slice is not active' }
          $plan=gh api "repos/$env:GITHUB_REPOSITORY/issues/comments/$planId" | ConvertFrom-Json
          if ($plan.user.login -ne 'github-actions[bot]') { throw 'Plan author mismatch' }
          if ($plan.body -notmatch '(?m)^\[KODJO_V2\] PLAN_OUTPUT\s*$') { throw 'Not a V2 PLAN_OUTPUT' }
          if ($plan.body -notmatch "(?m)^slice_id=$([regex]::Escape($slice))\s*$") { throw 'Plan slice mismatch' }
          if ($plan.body -notmatch "(?m)^bootstrap_path=$([regex]::Escape($bootstrap))\s*$") { throw 'Plan bootstrap mismatch' }
          if ($plan.body -notmatch '(?m)^planning_contract=kodjo\.plan-impact\.v1\s*$') { throw 'Plan impact contract missing' }
          if ($plan.body -notmatch '(?m)^STATUT : PLAN_READY_FOR_INDEPENDENT_REVIEW\s*$') { throw 'Plan is not reviewable' }
          $source=[regex]::Match($plan.body,'(?m)^source_head=([0-9a-f]{40})\s*$').Groups[1].Value
          $applicationPr=[regex]::Match($plan.body,'(?m)^application_pr=([1-9][0-9]*)\s*$').Groups[1].Value
          $applicationHead=[regex]::Match($plan.body,'(?m)^application_head=([0-9a-f]{40})\s*$').Groups[1].Value
          if (!$applicationPr -or !$applicationHead) { throw 'Application analysis provenance missing' }
          $remote=& node scripts/kodjo/resolve-private-head.js $env:GITHUB_REPOSITORY ([string]$b.target_branch)
          if ($LASTEXITCODE -ne 0) { throw 'V2 private target branch lookup failed' }
          $protocolExecutionHead=([string]$remote).Trim()
          $transitionProof=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-transition.json'
          & node scripts/kodjo/verify-plan-review-transition.js $source $protocolExecutionHead $bootstrap $transitionProof
          if ($LASTEXITCODE -ne 0) { throw 'V2 plan review transition refused' }
          $application=gh api "repos/$env:GITHUB_REPOSITORY/pulls/$applicationPr" | ConvertFrom-Json
          if ($application.state -ne 'open' -or [string]$application.head.sha -ne $applicationHead) { throw 'V2 application PR moved or closed' }
          if ([string]$application.base.ref -ne [string]$b.target_branch) { throw 'V2 application PR target mismatch' }
          $planFile=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan.md'
          [IO.File]::WriteAllText($planFile,[string]$plan.body,(New-Object Text.UTF8Encoding($false)))
          "slice_id=$slice" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bootstrap_path=$bootstrap" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_head=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "protocol_execution_head=$protocolExecutionHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "application_pr=$applicationPr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "application_head=$applicationHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "plan_id=$planId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "review_session=$reviewSession" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Snapshot plan verifiers from protocol
        run: |
          $ErrorActionPreference='Stop'
          $destination=Join-Path $env:RUNNER_TEMP 'kodjo-v2-impact-protocol'
          if (Test-Path -LiteralPath $destination) { Remove-Item -LiteralPath $destination -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath scripts/kodjo/verify-plan-impact.js -Destination $destination
          Copy-Item -LiteralPath scripts/kodjo/verify-plan-contract-consistency.js -Destination $destination
          Copy-Item -LiteralPath scripts/kodjo/verify-ui-plan-criteria.js -Destination $destination
          Copy-Item -LiteralPath scripts/kodjo/normalize-review-findings.js -Destination $destination
          Copy-Item -LiteralPath scripts/kodjo/lib -Destination (Join-Path $destination 'lib') -Recurse
          $context=Join-Path $env:RUNNER_TEMP 'kodjo-v2-current-product-context'
          New-Item -ItemType Directory -Force -Path $context | Out-Null
          Copy-Item -LiteralPath ${{ steps.gate.outputs.bootstrap_path }} -Destination (Join-Path $context 'slice-bootstrap.json')
          Copy-Item -LiteralPath .github/orchestration/v2-slices/${{ steps.gate.outputs.slice_id }}/planning-mission.md -Destination $context
          $b=Get-Content -Raw -LiteralPath ${{ steps.gate.outputs.bootstrap_path }} -Encoding UTF8 | ConvertFrom-Json
          foreach($source in $b.product_sources){
            $destination=Join-Path $context ([string]$source.path)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath ([string]$source.path) -Destination $destination
          }

      - name: Checkout exact V2 source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.application_head }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Replay V2 direct-import scan independently
        env:
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
        run: |
          $ErrorActionPreference='Stop'
          $verifier=Join-Path $env:RUNNER_TEMP 'kodjo-v2-impact-protocol\verify-plan-impact.js'
          $replay=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-scan.json'
          $proof=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-proof.json'
          & node $verifier "$env:RUNNER_TEMP\kodjo-v2-plan.md" $env:APPLICATION_HEAD $replay $proof
          if ($LASTEXITCODE -ne 0) { throw 'Independent V2 impact replay failed' }

      - name: Revalidate current plan contract before Claude
        env:
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
        run: |
          $ErrorActionPreference='Stop'
          $verifier=Join-Path $env:RUNNER_TEMP 'kodjo-v2-impact-protocol\verify-plan-contract-consistency.js'
          $contract=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-contract.json'
          & node $verifier "$env:RUNNER_TEMP\kodjo-v2-plan.md" $env:APPLICATION_HEAD (Get-Location).Path $contract consume $env:PROTOCOL_EXECUTION_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'V2 plan contract is stale or inconsistent' }

      - name: Revalidate UI criteria contract before Claude
        env:
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
        run: |
          $ErrorActionPreference='Stop'
          $verifier=Join-Path $env:RUNNER_TEMP 'kodjo-v2-impact-protocol\verify-ui-plan-criteria.js'
          $contract=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-ui-contract.json'
          & node $verifier "$env:RUNNER_TEMP\kodjo-v2-plan.md" $env:APPLICATION_HEAD (Get-Location).Path $contract consume $env:PROTOCOL_EXECUTION_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'V2 UI criteria contract is stale or inconsistent' }

      - name: Review V2 plan with Claude
        id: claude
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
          APPLICATION_PR: ${{ steps.gate.outputs.application_pr }}
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
          REVIEW_SESSION: ${{ steps.gate.outputs.review_session }}
        run: |
          $ErrorActionPreference='Stop'
          $prompt=@"
          You are the independent KODJO V2 plan reviewer for $env:SLICE_ID. Review the candidate plan in $env:RUNNER_TEMP\kodjo-v2-plan.md against immutable product HEAD $env:SOURCE_HEAD, protocol execution HEAD $env:PROTOCOL_EXECUTION_HEAD, exact application PR $env:APPLICATION_PR at $env:APPLICATION_HEAD, current product context in $env:RUNNER_TEMP\kodjo-v2-current-product-context, and the checked-out application code and tests. The source-to-execution transition was admitted only because its closed diff is protocol-only and every protected plan input is unchanged. This is READ-ONLY.
          The direct-import scan and current versioned plan contract were independently replayed. The UI criteria contract was also replayed. Independently verify source-to-criteria completeness against current normative product sources and checked-out code: no normative UI requirement may be omitted or collapsed into a vague criterion; verify every REUSE|EXTEND|CREATE decision against actual existing components/patterns, PRESERVE/CHANGE/FORBIDDEN coverage, and risk-to-test-to-proof adequacy. A self-consistent but incomplete UI matrix requires VERDICT: REVISE. Their evidence is in $env:RUNNER_TEMP\kodjo-v2-plan-review-scan.json, $env:RUNNER_TEMP\kodjo-v2-plan-review-proof.json and $env:RUNNER_TEMP\kodjo-v2-plan-review-contract.json. A legacy or stale plan is rejected before you run. Verify every classification and justification, exact scope derivation, migration safety, backward compatibility and preservation of validated product decisions. The risk score may order but never filter. The direct scan is not absolute completeness and full Jest remains mandatory.
          Before the terminal verdict, emit exactly one <KODJO_REVIEW_FINDINGS_JSON> JSON block with shape {"findings":[{"category":"REQUIREMENT_GAP|SCOPE|PATH|TEST|MIGRATION|COMPATIBILITY|PRESERVATION|UI_CRITERION|ARCHITECTURE|CLARIFICATION|OTHER","target_kind":"REQUIREMENT_ID|CRITERION_ID|PATH|PLAN|SOURCE","target":"...","blocking":true,"diagnostic":"...","expected_correction":"...","dependency_expansion_required":false,"dependency_evidence":""}]}. Do not emit finding_id: it is derived mechanically. If there is no finding, emit {"findings":[]}. Every blocking point must be one row with an exact target. Any scope expansion must set dependency_expansion_required=true and provide concrete dependency_evidence. The machine derives APPROVE/REVISE from blocking findings.
          Never request or invent a V1 slice manifest.
          Do not emit a terminal VERDICT line. The protocol derives APPROVE or REVISE exclusively from the normalized blocking findings.
          "@
          $out="$env:RUNNER_TEMP\kodjo-v2-plan-review.json"
          $err="$env:RUNNER_TEMP\kodjo-v2-plan-review.err.txt"
          $args=if($env:REVIEW_SESSION){@('-p','--resume',$env:REVIEW_SESSION,'--output-format','json','--dangerously-skip-permissions')}else{@('-p','--output-format','json','--dangerously-skip-permissions')}
          & claude @args $prompt 1> $out 2> $err
          $code=$LASTEXITCODE
          if (!(Test-Path $out) -or (Get-Item $out).Length -eq 0) { throw "Claude produced no JSON; exit=$code" }
          $json=Get-Content -Raw -LiteralPath $out -Encoding UTF8 | ConvertFrom-Json
          if (!$json.session_id -or !$json.result) { throw 'Claude V2 review result incomplete' }
          if ($env:REVIEW_SESSION -and [string]$json.session_id -ne $env:REVIEW_SESSION) { throw 'Claude resumed a different review session' }
          if ($code -ne 0) { throw "Claude V2 review failed; exit=$code" }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\kodjo-v2-plan-review.md",[string]$json.result,(New-Object Text.UTF8Encoding($false)))
          & node "$env:RUNNER_TEMP\kodjo-v2-impact-protocol\normalize-review-findings.js" "$env:RUNNER_TEMP\kodjo-v2-plan-review.md" "$env:RUNNER_TEMP\kodjo-v2-plan-review-findings.json"
          if ($LASTEXITCODE -ne 0) { throw 'Structured plan review findings invalid' }
          "session_id=$($json.session_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish independent V2 plan review
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          BOOTSTRAP_PATH: ${{ steps.gate.outputs.bootstrap_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          PROTOCOL_EXECUTION_HEAD: ${{ steps.gate.outputs.protocol_execution_head }}
          APPLICATION_PR: ${{ steps.gate.outputs.application_pr }}
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
          PLAN_ID: ${{ steps.gate.outputs.plan_id }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          $ErrorActionPreference='Stop'
          $review=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-plan-review.md" -Encoding UTF8
          $findings=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-plan-review-findings.json" -Encoding UTF8 | ConvertFrom-Json
          $verdict=[string]$findings.verdict
          if($verdict -notin @('APPROVE','REVISE')){throw 'Derived review verdict invalid'}
          $status=if($verdict -eq 'APPROVE'){'PLAN_REVIEW_APPROVED'}else{'PLAN_REVISION_REQUIRED'}
          $proof=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-plan-review-proof.json" -Encoding UTF8
          $contract=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-plan-review-contract.json" -Encoding UTF8
          $uiContract=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-plan-review-ui-contract.json" -Encoding UTF8
          $transition=Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-plan-review-transition.json" -Encoding UTF8
          $nl=[Environment]::NewLine
          $header='[KODJO_V2] PLAN_REVIEW_OUTPUT'+$nl+'slice_id='+$env:SLICE_ID+$nl+'bootstrap_path='+$env:BOOTSTRAP_PATH+$nl+'source_head='+$env:SOURCE_HEAD+$nl+'protocol_execution_head='+$env:PROTOCOL_EXECUTION_HEAD+$nl+'application_pr='+$env:APPLICATION_PR+$nl+'application_head='+$env:APPLICATION_HEAD+$nl+'source_plan_comment_id='+$env:PLAN_ID+$nl+'reviewer=CLAUDE'+$nl+'review_session_id='+$env:SESSION_ID+$nl+'verdict='+$verdict+$nl+'STATUT : '+$status+$nl+$nl
          $impact=$nl+'<KODJO_PLAN_IMPACT_REVIEW_JSON>'+$nl+$proof.Trim()+$nl+'</KODJO_PLAN_IMPACT_REVIEW_JSON>'+$nl
          $contractProof=$nl+'<KODJO_PLAN_CONTRACT_REVIEW_JSON>'+$nl+$contract.Trim()+$nl+'</KODJO_PLAN_CONTRACT_REVIEW_JSON>'+$nl
          $uiContractProof=$nl+'<KODJO_UI_PLAN_CONTRACT_REVIEW_JSON>'+$nl+$uiContract.Trim()+$nl+'</KODJO_UI_PLAN_CONTRACT_REVIEW_JSON>'+$nl
          $migration=$nl+'<KODJO_PLAN_REVIEW_TRANSITION_JSON>'+$nl+$transition.Trim()+$nl+'</KODJO_PLAN_REVIEW_TRANSITION_JSON>'+$nl
                    $findingsProof=$nl+'<KODJO_PLAN_REVIEW_FINDINGS_JSON>'+$nl+(Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\kodjo-v2-plan-review-findings.json" -Encoding UTF8).Trim()+$nl+'</KODJO_PLAN_REVIEW_FINDINGS_JSON>'+$nl
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\kodjo-v2-plan-review-comment.md",$header+$review+$impact+$contractProof+$uiContractProof+$migration+$findingsProof,(New-Object Text.UTF8Encoding($false)))
          $commentPath=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-comment.md'
          $commentBody=Get-Content -Raw -LiteralPath $commentPath -Encoding UTF8
          $payloadPath=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-publish.json'
          [IO.File]::WriteAllText($payloadPath,(@{body=$commentBody}|ConvertTo-Json -Depth 3),(New-Object Text.UTF8Encoding($false)))
          $created=gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" --input $payloadPath|ConvertFrom-Json
          if($LASTEXITCODE-ne0-or$null-eq$created-or-not$created.id){throw 'Plan review publication failed'}
          $reviewCommentId=[string]$created.id
          if($verdict -eq 'APPROVE'){
            gh workflow run kodjo-v2-plan-handoff-materialize.yml --ref main -f "issue_number=$env:ISSUE_NUMBER" -f "review_comment_id=$reviewCommentId"
            if($LASTEXITCODE-ne0){throw 'Plan handoff materialization dispatch failed'}
          }else{
            gh workflow run kodjo-v2-slice-plan.yml --ref main -f "issue_number=$env:ISSUE_NUMBER" -f "review_comment_id=$reviewCommentId"
            if($LASTEXITCODE-ne0){throw 'Bounded plan revision dispatch failed'}
          }

      - name: Preserve V2 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-slice-plan-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\kodjo-v2-plan.md
            ${{ runner.temp }}\kodjo-v2-plan-review.json
            ${{ runner.temp }}\kodjo-v2-plan-review.err.txt
            ${{ runner.temp }}\kodjo-v2-plan-review.md
            ${{ runner.temp }}\kodjo-v2-plan-review-scan.json
            ${{ runner.temp }}\kodjo-v2-plan-review-proof.json
            ${{ runner.temp }}\kodjo-v2-plan-review-contract.json
            ${{ runner.temp }}\kodjo-v2-plan-review-ui-contract.json
            ${{ runner.temp }}\kodjo-v2-plan-review-transition.json
          if-no-files-found: warn
          retention-days: 14
