name: KODJO V2 — Slice Plan Review
run-name: KODJO V2 / PLAN-REVIEW / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v2-slice-plan-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.comment.user.login == 'MyUncried' && contains(github.event.comment.body, '[KODJO_V2] START_PLAN_REVIEW')
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout protocol
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable V2 review gate
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME) { throw 'Unexpected runner' }
          $slice=[regex]::Match($env:TRIGGER_BODY,'(?m)^slice_id=([^\r\n]+)\s*$').Groups[1].Value.Trim()
          $bootstrap=[regex]::Match($env:TRIGGER_BODY,'(?m)^bootstrap_path=([^\r\n]+)\s*$').Groups[1].Value.Trim()
          $planId=[regex]::Match($env:TRIGGER_BODY,'(?m)^source_plan_comment_id=([0-9]+)\s*$').Groups[1].Value
          $reviewSession=[regex]::Match($env:TRIGGER_BODY,'(?m)^review_session_id=([0-9a-f-]{36})\s*$').Groups[1].Value
          if (!$slice -or !$bootstrap -or !$planId) { throw 'Missing immutable V2 review inputs' }
          if ($bootstrap -ne ".github/orchestration/v2-slices/$slice/slice-bootstrap.json") { throw 'V2 bootstrap path mismatch' }
          if (!(Test-Path -LiteralPath $bootstrap)) { throw 'V2 bootstrap missing' }
          $b=Get-Content -Raw -LiteralPath $bootstrap | ConvertFrom-Json
          if ([string]$b.slice_id -ne $slice -or [int]$b.issue_number -ne [int]$env:ISSUE_NUMBER) { throw 'V2 identity mismatch' }
          if ([string]$b.repository -ne $env:GITHUB_REPOSITORY) { throw 'V2 repository mismatch' }
          $registry=Get-Content -Raw -LiteralPath ([string]$b.activation_registry) | ConvertFrom-Json
          $active=@($registry.activations | Where-Object { $_.slice_id -eq $slice })
          if ($active.Count -ne 1 -or $active[0].status -ne 'ACTIVE') { throw 'V2 slice is not active' }
          $plan=gh api "repos/$env:GITHUB_REPOSITORY/issues/comments/$planId" | ConvertFrom-Json
          if ($plan.user.login -ne 'github-actions[bot]') { throw 'Plan author mismatch' }
          if ($plan.body -notmatch '(?m)^\[KODJO_V2\] PLAN_OUTPUT\s*$') { throw 'Not a V2 PLAN_OUTPUT' }
          if ($plan.body -notmatch "(?m)^slice_id=$([regex]::Escape($slice))\s*$") { throw 'Plan slice mismatch' }
          if ($plan.body -notmatch "(?m)^bootstrap_path=$([regex]::Escape($bootstrap))\s*$") { throw 'Plan bootstrap mismatch' }
          if ($plan.body -notmatch '(?m)^planning_contract=kodjo\.plan-impact\.v1\s*$') { throw 'Plan impact contract missing' }
          if ($plan.body -notmatch '(?m)^STATUT : PLAN_READY_FOR_INDEPENDENT_REVIEW\s*$') { throw 'Plan is not reviewable' }
          $source=[regex]::Match($plan.body,'(?m)^source_head=([0-9a-f]{40})\s*$').Groups[1].Value
          $applicationPr=[regex]::Match($plan.body,'(?m)^application_pr=([1-9][0-9]*)\s*$').Groups[1].Value
          $applicationHead=[regex]::Match($plan.body,'(?m)^application_head=([0-9a-f]{40})\s*$').Groups[1].Value
          if (!$applicationPr -or !$applicationHead) { throw 'Application analysis provenance missing' }
          $remote=& node scripts/kodjo/resolve-private-head.js $env:GITHUB_REPOSITORY ([string]$b.target_branch)
          if ($LASTEXITCODE -ne 0) { throw 'V2 private target branch lookup failed' }
          if (!$remote -or ([string]$remote).Trim() -ne $source) { throw 'V2 target branch moved' }
          $application=gh api "repos/$env:GITHUB_REPOSITORY/pulls/$applicationPr" | ConvertFrom-Json
          if ($application.state -ne 'open' -or [string]$application.head.sha -ne $applicationHead) { throw 'V2 application PR moved or closed' }
          if ([string]$application.base.ref -ne [string]$b.target_branch) { throw 'V2 application PR target mismatch' }
          $planFile=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan.md'
          [IO.File]::WriteAllText($planFile,[string]$plan.body,(New-Object Text.UTF8Encoding($false)))
          "slice_id=$slice" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bootstrap_path=$bootstrap" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_head=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "application_pr=$applicationPr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "application_head=$applicationHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "plan_id=$planId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "review_session=$reviewSession" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Snapshot impact verifier from protocol
        run: |
          $ErrorActionPreference='Stop'
          $destination=Join-Path $env:RUNNER_TEMP 'kodjo-v2-impact-protocol'
          if (Test-Path -LiteralPath $destination) { Remove-Item -LiteralPath $destination -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath scripts/kodjo/verify-plan-impact.js -Destination $destination
          Copy-Item -LiteralPath scripts/kodjo/lib -Destination (Join-Path $destination 'lib') -Recurse
          $context=Join-Path $env:RUNNER_TEMP 'kodjo-v2-current-product-context'
          New-Item -ItemType Directory -Force -Path $context | Out-Null
          Copy-Item -LiteralPath ${{ steps.gate.outputs.bootstrap_path }} -Destination (Join-Path $context 'slice-bootstrap.json')
          Copy-Item -LiteralPath .github/orchestration/v2-slices/${{ steps.gate.outputs.slice_id }}/planning-mission.md -Destination $context
          $b=Get-Content -Raw -LiteralPath ${{ steps.gate.outputs.bootstrap_path }} | ConvertFrom-Json
          foreach($source in $b.product_sources){
            $destination=Join-Path $context ([string]$source.path)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath ([string]$source.path) -Destination $destination
          }

      - name: Checkout exact V2 source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.application_head }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Replay V2 direct-import scan independently
        env:
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
        run: |
          $ErrorActionPreference='Stop'
          $verifier=Join-Path $env:RUNNER_TEMP 'kodjo-v2-impact-protocol\verify-plan-impact.js'
          $replay=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-scan.json'
          $proof=Join-Path $env:RUNNER_TEMP 'kodjo-v2-plan-review-proof.json'
          & node $verifier "$env:RUNNER_TEMP\kodjo-v2-plan.md" $env:APPLICATION_HEAD $replay $proof
          if ($LASTEXITCODE -ne 0) { throw 'Independent V2 impact replay failed' }

      - name: Review V2 plan with Claude
        id: claude
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          APPLICATION_PR: ${{ steps.gate.outputs.application_pr }}
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
          REVIEW_SESSION: ${{ steps.gate.outputs.review_session }}
        run: |
          $ErrorActionPreference='Stop'
          $prompt=@"
          You are the independent KODJO V2 plan reviewer for $env:SLICE_ID. Review the candidate plan in $env:RUNNER_TEMP\kodjo-v2-plan.md against product/protocol HEAD $env:SOURCE_HEAD, exact application PR $env:APPLICATION_PR at $env:APPLICATION_HEAD, current product context in $env:RUNNER_TEMP\kodjo-v2-current-product-context, and the checked-out application code and tests. This is READ-ONLY.
          The direct-import scan was independently replayed. Its scan and proof are in $env:RUNNER_TEMP\kodjo-v2-plan-review-scan.json and $env:RUNNER_TEMP\kodjo-v2-plan-review-proof.json. Verify every classification and justification, exact scope derivation, migration safety, backward compatibility and preservation of validated product decisions. The risk score may order but never filter. The direct scan is not absolute completeness and full Jest remains mandatory.
          Never request or invent a V1 slice manifest. End with exactly VERDICT: APPROVE or VERDICT: REVISE.
          "@
          $out="$env:RUNNER_TEMP\kodjo-v2-plan-review.json"
          $err="$env:RUNNER_TEMP\kodjo-v2-plan-review.err.txt"
          $args=if($env:REVIEW_SESSION){@('-p','--resume',$env:REVIEW_SESSION,'--output-format','json','--dangerously-skip-permissions')}else{@('-p','--output-format','json','--dangerously-skip-permissions')}
          & claude @args $prompt 1> $out 2> $err
          $code=$LASTEXITCODE
          if (!(Test-Path $out) -or (Get-Item $out).Length -eq 0) { throw "Claude produced no JSON; exit=$code" }
          $json=Get-Content -Raw $out | ConvertFrom-Json
          if (!$json.session_id -or !$json.result) { throw 'Claude V2 review result incomplete' }
          if ($env:REVIEW_SESSION -and [string]$json.session_id -ne $env:REVIEW_SESSION) { throw 'Claude resumed a different review session' }
          if ($code -ne 0) { throw "Claude V2 review failed; exit=$code" }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\kodjo-v2-plan-review.md",[string]$json.result,(New-Object Text.UTF8Encoding($false)))
          "session_id=$($json.session_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish independent V2 plan review
        env:
          SLICE_ID: ${{ steps.gate.outputs.slice_id }}
          BOOTSTRAP_PATH: ${{ steps.gate.outputs.bootstrap_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.source_head }}
          APPLICATION_PR: ${{ steps.gate.outputs.application_pr }}
          APPLICATION_HEAD: ${{ steps.gate.outputs.application_head }}
          PLAN_ID: ${{ steps.gate.outputs.plan_id }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          $ErrorActionPreference='Stop'
          $review=Get-Content -Raw "$env:RUNNER_TEMP\kodjo-v2-plan-review.md"
          $verdict=if($review -match '(?m)^VERDICT:\s*APPROVE\s*$'){'APPROVE'}elseif($review -match '(?m)^VERDICT:\s*REVISE\s*$'){'REVISE'}else{throw 'Review verdict missing'}
          $status=if($verdict -eq 'APPROVE'){'PLAN_REVIEW_APPROVED'}else{'PLAN_REVISION_REQUIRED'}
          $proof=Get-Content -Raw "$env:RUNNER_TEMP\kodjo-v2-plan-review-proof.json"
          $nl=[Environment]::NewLine
          $header='[KODJO_V2] PLAN_REVIEW_OUTPUT'+$nl+'slice_id='+$env:SLICE_ID+$nl+'bootstrap_path='+$env:BOOTSTRAP_PATH+$nl+'source_head='+$env:SOURCE_HEAD+$nl+'application_pr='+$env:APPLICATION_PR+$nl+'application_head='+$env:APPLICATION_HEAD+$nl+'source_plan_comment_id='+$env:PLAN_ID+$nl+'reviewer=CLAUDE'+$nl+'review_session_id='+$env:SESSION_ID+$nl+'verdict='+$verdict+$nl+'STATUT : '+$status+$nl+$nl
          $impact=$nl+'<KODJO_PLAN_IMPACT_REVIEW_JSON>'+$nl+$proof.Trim()+$nl+'</KODJO_PLAN_IMPACT_REVIEW_JSON>'+$nl
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\kodjo-v2-plan-review-comment.md",$header+$review+$impact,(New-Object Text.UTF8Encoding($false)))
          gh issue comment $env:ISSUE_NUMBER --repo $env:GITHUB_REPOSITORY --body-file "$env:RUNNER_TEMP\kodjo-v2-plan-review-comment.md"

      - name: Preserve V2 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodjo-v2-slice-plan-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\kodjo-v2-plan.md
            ${{ runner.temp }}\kodjo-v2-plan-review.json
            ${{ runner.temp }}\kodjo-v2-plan-review.err.txt
            ${{ runner.temp }}\kodjo-v2-plan-review.md
            ${{ runner.temp }}\kodjo-v2-plan-review-scan.json
            ${{ runner.temp }}\kodjo-v2-plan-review-proof.json
          if-no-files-found: warn
          retention-days: 14

