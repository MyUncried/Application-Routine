name: KODJO V1.4 S09 — Plan Local
run-name: T01-S09 / PLAN / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v14-s09-plan
  cancel-in-progress: false

env:
  ISSUE_NUMBER: '17'
  TARGET_BRANCH: feat/creation-seance-catalogue
  INITIAL_HEAD: f7b3c3158b6de94c5593a5a09daeb11120b0d12e
  CLAUDE_CODE_PROJECT_DIR_NAME: kodjo-v14-s09

jobs:
  plan:
    if: >
      github.event.issue.number == 17 &&
      (
        contains(github.event.comment.body, '[KODJO_V14_S09] START_PLAN') ||
        contains(github.event.comment.body, '[KODJO_V14_S09] PLAN_REVISION')
      )
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: ${{ vars.KODJO_LOCAL_CLAUDE_CONFIG_DIR }}
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight without Claude
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME){throw 'Unexpected runner.'}
          if($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine'){throw 'Unexpected repository.'}
          if((git branch --show-current).Trim() -ne $env:TARGET_BRANCH){throw 'Unexpected branch.'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Worktree not clean.'}
          $head=(git rev-parse HEAD).Trim()
          $isRevision=$env:TRIGGER_BODY.Contains('[KODJO_V14_S09] PLAN_REVISION')
          if(-not $isRevision -and $head -ne $env:INITIAL_HEAD){throw "Initial HEAD mismatch: $head"}
          $claude=Get-Command claude.cmd -ErrorAction Stop
          $credPath=Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json'
          if(-not(Test-Path $credPath)){throw 'Credentials missing.'}
          $cred=Get-Content $credPath -Raw|ConvertFrom-Json
          if([int64]$cred.claudeAiOauth.expiresAt -le [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()){throw 'Claude token expired.'}
          "head=$head" >> $env:GITHUB_OUTPUT
          "claude_path=$($claude.Source)" >> $env:GITHUB_OUTPUT

      - name: Run Claude plan or revision
        id: claude
        env:
          CLAUDE_PATH: ${{ steps.gate.outputs.claude_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.head }}
        run: |
          $ErrorActionPreference='Stop'
          $isRevision=$env:TRIGGER_BODY.Contains('[KODJO_V14_S09] PLAN_REVISION')
          $attempt=1
          $session=''
          if($isRevision){
            $m=[regex]::Match($env:TRIGGER_BODY,'(?m)^attempt=(\d+)\s*$'); if(-not$m.Success){throw 'Revision attempt missing.'}; $attempt=[int]$m.Groups[1].Value
            $s=[regex]::Match($env:TRIGGER_BODY,'(?m)^session_id=([0-9a-f-]{36})\s*$'); if(-not$s.Success){throw 'Revision session_id missing.'}; $session=$s.Groups[1].Value
            $feedbackMarker='REVIEW_FEEDBACK:'; $idx=$env:TRIGGER_BODY.IndexOf($feedbackMarker); if($idx -lt 0){throw 'Revision feedback missing.'}; $feedback=$env:TRIGGER_BODY.Substring($idx+$feedbackMarker.Length).Trim()
            $prompt="KODJO T01-S09 V1.4 — RÉVISION PLAN tentative $attempt. Reprends exactement la session de plan précédente. Corrige le plan uniquement selon le feedback de revue ci-dessous, puis revalide contre les sources Git actuelles. Ne modifie aucun fichier. Si le feedback exige une décision produit non déterminable, retourne CLARIFICATION_REQUIRED au lieu d'inventer. Feedback: $feedback"
            $raw=(& $env:CLAUDE_PATH -p --resume $session --output-format json $prompt 2>&1|Out-String)
          } else {
            $prompt=@"
KODJO T01-S09 — CONSTRUIRE LE PLAN V1.4. Phase strictement lecture seule.

Baseline Git autorisée: $env:TARGET_BRANCH @ $env:SOURCE_HEAD.
Issue métier: #17.

Sources de vérité à lire et citer dans le plan:
- docs/PRODUCT.md et docs/INDEX.md;
- docs/Specifications-fonctionnelles/06 à 13, en particulier 07 registre des décisions et 13 contrats d’écran;
- docs/Specifications-fonctionnelles/images/categories-seance.png et categories-nouvelle-inline.png;
- code réel T01-S01 à T01-S08 sous app/, src/domain/sessions, src/features/sessions et src/infrastructure/database;
- .github/orchestration/reports/2026-09-04_figma-blockers-categories-headers.md si pertinent;
- Issue #17 comme mission, mais toute formulation ancienne incompatible est supersédée par les documents versionnés plus récents.

Le plan doit être exécutable et couvrir au minimum: navigation Composition→Catégories, règles zéro/multi-catégories, création inline, persistance complète T01-S08, zones corporelles, migration additive, transaction/atomicité, double-submit, reset après succès, retour Catalogue, tests, chemins/fichiers probables, critères d'acceptation et preuves attendues.

Distingue explicitement: règle fonctionnelle, rendu/état UI, contrainte technique, décision validée, et point À CLARIFIER. N'invente rien. Pour chaque décision importante, cite le ou les fichiers sources et l'évidence pertinente. Ne propose pas de développement S10.

Aucun Edit/Write, aucun commit/push. Le plan final doit être suffisamment précis pour permettre une revue indépendante puis l'implémentation sans micro-arbitrages humains.
"@
            $raw=(& $env:CLAUDE_PATH -p --output-format json $prompt 2>&1|Out-String)
          }
          if($LASTEXITCODE -ne 0){throw 'Claude plan invocation failed.'}
          $p=$raw|ConvertFrom-Json
          if([string]::IsNullOrWhiteSpace($p.session_id)){throw 'No session_id.'}
          if([string]::IsNullOrWhiteSpace([string]$p.result)){throw 'No plan result.'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Read-only plan modified worktree.'}
          $resultPath=Join-Path $env:RUNNER_TEMP 's09-plan-result.txt'
          [IO.File]::WriteAllText($resultPath,[string]$p.result,(New-Object Text.UTF8Encoding($false)))
          "session=$($p.session_id)" >> $env:GITHUB_OUTPUT
          "attempt=$attempt" >> $env:GITHUB_OUTPUT
          "result_path=$resultPath" >> $env:GITHUB_OUTPUT

      - name: Publish plan for automated review
        env:
          SESSION_ID: ${{ steps.claude.outputs.session }}
          ATTEMPT: ${{ steps.claude.outputs.attempt }}
          SOURCE_HEAD: ${{ steps.gate.outputs.head }}
          RESULT_PATH: ${{ steps.claude.outputs.result_path }}
        run: |
          $ErrorActionPreference='Stop'
          $plan=Get-Content $env:RESULT_PATH -Raw
          $body="[KODJO_S09_PLAN_OUTPUT]`nsource_head=$env:SOURCE_HEAD`nsession_id=$env:SESSION_ID`nattempt=$env:ATTEMPT`nSTATUT : PLAN_READY_FOR_REVIEW`n`n$plan"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json -Depth 4) | Out-Null
          Write-Host 'KODJO_S09_PLAN=READY_FOR_REVIEW'
