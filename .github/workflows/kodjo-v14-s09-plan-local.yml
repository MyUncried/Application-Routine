name: KODJO V1.4 S09 — Plan OpenAI
run-name: T01-S09 / PLAN-OPENAI / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v14-s09-plan
  cancel-in-progress: false

env:
  ISSUE_NUMBER: '17'
  TARGET_BRANCH: feat/creation-seance-catalogue
  BASELINE_HEAD: 76b8c1f0027b66fa98e4017458fa5d2ccc68a47d

jobs:
  plan:
    if: >
      github.event.issue.number == 17 &&
      github.event.comment.user.login == 'MyUncried' &&
      (
        contains(github.event.comment.body, '[KODJO_V14_S09] START_PLAN_OPENAI') ||
        contains(github.event.comment.body, '[KODJO_V14_S09] PLAN_REVISION_OPENAI')
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate read-only source state
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'MyUncried/Application-Routine'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test -z "$(git status --porcelain --untracked-files=all)"
          HEAD_SHA=$(git rev-parse HEAD)
          test "$HEAD_SHA" = "$BASELINE_HEAD"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Build verified planning packet
        id: packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kodjo-plan
          gh api repos/${{ github.repository }}/issues/17 > /tmp/kodjo-plan/issue.json
          gh api --paginate repos/${{ github.repository }}/issues/17/comments > /tmp/kodjo-plan/comments-pages.json
          jq -s 'add' /tmp/kodjo-plan/comments-pages.json > /tmp/kodjo-plan/comments.json
          printf 'repository=%s\nbranch=%s\nhead=%s\n' "$GITHUB_REPOSITORY" "$TARGET_BRANCH" "$(git rev-parse HEAD)" > /tmp/kodjo-plan/attestation.txt
          : > /tmp/kodjo-plan/evidence.txt
          while IFS= read -r f; do
            test -f "$f" || continue
            printf '\n===== %s =====\n' "$f" >> /tmp/kodjo-plan/evidence.txt
            cat "$f" >> /tmp/kodjo-plan/evidence.txt
          done < <(printf '%s\n' 'docs/PRODUCT.md' 'docs/INDEX.md' 'docs/Specifications-fonctionnelles/06 – Ecrans et navigation de la V1.md' 'docs/Specifications-fonctionnelles/07 – Registre des décisions de conception.md' 'docs/Specifications-fonctionnelles/08 – Conception fonctionnelle détaillée.md' 'docs/Specifications-fonctionnelles/09 – Modèle de données fonctionnel.md' 'docs/Specifications-fonctionnelles/10 – Processus métier et règles métier transverses.md' 'docs/Specifications-fonctionnelles/11 – API fonctionnelles.md' 'docs/Specifications-fonctionnelles/12 – Architecture technique.md' 'docs/Specifications-fonctionnelles/13 – Contrats d’écran.md')
          git ls-files app src > /tmp/kodjo-plan/code-files.txt
          grep -RIn -E 'Category|Catégor|Composition|SessionDraft|SqliteSessionRepository|bodyZone|migration001|DATABASE_VERSION' app src 2>/dev/null | head -n 5000 > /tmp/kodjo-plan/code-evidence.txt || true
          jq '[.[] | select((.id == 5548060521) or (.id == 5460885591) or (.id == 5460904461) or (.body | test("D-09[2-9]|Catégor|T01-S09|PLAN"; "i")))]' /tmp/kodjo-plan/comments.json > /tmp/kodjo-plan/relevant-comments.json
          ATTEMPT=1
          if printf '%s' "$TRIGGER_BODY" | grep -Fq '[KODJO_V14_S09] PLAN_REVISION_OPENAI'; then
            ATTEMPT=$(printf '%s' "$TRIGGER_BODY" | sed -n 's/^attempt=//p' | head -n1)
            PREV=$(printf '%s' "$TRIGGER_BODY" | sed -n 's/^source_plan_comment_id=//p' | head -n1)
            test -n "$ATTEMPT"; test -n "$PREV"
            gh api "repos/${{ github.repository }}/issues/comments/$PREV" --jq '.body' > /tmp/kodjo-plan/previous-plan.txt
            IDX=$(grep -n '^REVIEW_FEEDBACK:$' <<< "$TRIGGER_BODY" | cut -d: -f1 | head -n1)
            test -n "$IDX"
            tail -n +$((IDX+1)) <<< "$TRIGGER_BODY" > /tmp/kodjo-plan/review-feedback.txt
          fi
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Construct consolidated plan with OpenAI
        id: openai
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          cat > /tmp/prompt.txt <<'EOF'
You are the KODJO V1.4 PLAN builder for T01-S09. Produce the complete implementation plan only; do not develop and do not propose repository writes during PLAN. Sources of truth outrank agent memory. Scope is S09 only: Categories de la séance and final save, preserving all validated T01-S01..S08 data.

Mandatory decisions already validated in Issue #17: category duplicate comparison normalizes spaces and is case-insensitive AND accent/diacritic-insensitive; visible label preserves the user's entered casing and accents; no spelling correction, fuzzy matching, suggestion or automatic replacement (deferred V2). Examples Étirements / Etirements / ÉTIREMENTS / etirements are duplicates. Do not reintroduce superseded rules.

The plan must explicitly cover: additive migration only, never modify migration001; SQLite atomicity; complete persistence of T01-S08 data including body zones; category selection/creation; double-submit protection; reset only after successful save; return to Catalogue; loading/error behavior; screen contracts; tests and TypeScript; documentation propagation only where a validated decision requires it; no S10 reopening/edit flow.

For every material step cite the authoritative source or code evidence. Separate functional rule, UI/rendered state, technical constraint, validated decision, and unresolved point. Do not invent. If a genuine product/UX decision remains indeterminable after the supplied sources, mark it À CLARIFIER with the exact missing decision and evidence checked.

Quality axes: (1) scope coverage, (2) source traceability, (3) no invented/obsolete rules, (4) technical executability, (5) testability. Include files to create/modify/not modify, migration/data model, transaction boundaries, application/UI flow, acceptance criteria, tests, risks, and a final self-assessment on all five axes.
EOF
          printf '\nSOURCE ATTESTATION:\n' >> /tmp/prompt.txt; cat /tmp/kodjo-plan/attestation.txt >> /tmp/prompt.txt
          printf '\nISSUE #17:\n' >> /tmp/prompt.txt; jq -r '.body' /tmp/kodjo-plan/issue.json >> /tmp/prompt.txt
          printf '\nRELEVANT ISSUE COMMENTS:\n' >> /tmp/prompt.txt; jq -r '.[] | "COMMENT_ID="+(.id|tostring)+"\n"+.body+"\n---"' /tmp/kodjo-plan/relevant-comments.json >> /tmp/prompt.txt
          printf '\nVERSIONED DOCUMENTATION:\n' >> /tmp/prompt.txt; head -c 500000 /tmp/kodjo-plan/evidence.txt >> /tmp/prompt.txt
          printf '\nCODE EVIDENCE:\n' >> /tmp/prompt.txt; head -c 180000 /tmp/kodjo-plan/code-evidence.txt >> /tmp/prompt.txt
          if [ -f /tmp/kodjo-plan/previous-plan.txt ]; then
            printf '\nPREVIOUS CANDIDATE PLAN:\n' >> /tmp/prompt.txt; cat /tmp/kodjo-plan/previous-plan.txt >> /tmp/prompt.txt
            printf '\nCLAUDE REVIEW FEEDBACK TO RESOLVE:\n' >> /tmp/prompt.txt; cat /tmp/kodjo-plan/review-feedback.txt >> /tmp/prompt.txt
          fi
          jq -n --arg model 'gpt-5.6-luna' --rawfile prompt /tmp/prompt.txt '{model:$model,input:$prompt,store:false,reasoning:{effort:"high"},max_output_tokens:12000,text:{verbosity:"medium"}}' > /tmp/request.json
          curl --fail-with-body -sS https://api.openai.com/v1/responses -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' -d @/tmp/request.json -o /tmp/response.json
          jq -r '[.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text] | join("\n")' /tmp/response.json > /tmp/plan.txt
          test -s /tmp/plan.txt
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish candidate for Claude independent review
        env:
          SOURCE_HEAD: ${{ steps.gate.outputs.head }}
          ATTEMPT: ${{ steps.packet.outputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '[KODJO_S09_PLAN_OUTPUT]'
            echo "source_head=$SOURCE_HEAD"
            echo 'plan_builder=OPENAI'
            echo "attempt=$ATTEMPT"
            echo 'plan_report=GITHUB_PLAN_OUTPUT_COMMENT'
            echo 'STATUT : PLAN_READY_FOR_CLAUDE_REVIEW'
            echo
            cat /tmp/plan.txt
          } > /tmp/out.md
          gh issue comment 17 --repo "${{ github.repository }}" --body-file /tmp/out.md
