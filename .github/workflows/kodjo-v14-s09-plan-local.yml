name: KODJO V1.4 S09 — Plan Local
run-name: T01-S09 / PLAN / ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kodjo-v14-s09-plan
  cancel-in-progress: false

env:
  ISSUE_NUMBER: '17'
  TARGET_BRANCH: feat/creation-seance-catalogue
  INITIAL_HEAD: 76b8c1f0027b66fa98e4017458fa5d2ccc68a47d
  INITIAL_SESSION_ID: 99404ae0-19e3-4004-8dde-cd670588afb5
  HISTORICAL_CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude

jobs:
  plan:
    if: >
      github.event.issue.number == 17 &&
      (
        contains(github.event.comment.body, '[KODJO_V14_S09] START_PLAN') ||
        contains(github.event.comment.body, '[KODJO_V14_S09] PLAN_REVISION')
      )
    runs-on: [self-hosted, Windows, X64, kodjo-claude-local]
    env:
      EXPECTED_RUNNER_NAME: ${{ vars.KODJO_LOCAL_RUNNER_NAME }}
      CLAUDE_CONFIG_DIR: C:\Users\hadjo\.claude
      GH_TOKEN: ${{ github.token }}
      TRIGGER_BODY: ${{ github.event.comment.body }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight without Claude
        id: gate
        run: |
          $ErrorActionPreference='Stop'
          if('${{ runner.name }}' -ne $env:EXPECTED_RUNNER_NAME){throw 'Unexpected runner.'}
          if($env:GITHUB_REPOSITORY -ne 'MyUncried/Application-Routine'){throw 'Unexpected repository.'}
          if((git branch --show-current).Trim() -ne $env:TARGET_BRANCH){throw 'Unexpected branch.'}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Worktree not clean.'}
          $head=(git rev-parse HEAD).Trim()
          $isRevision=$env:TRIGGER_BODY.Contains('[KODJO_V14_S09] PLAN_REVISION')
          if(-not $isRevision -and $head -ne $env:INITIAL_HEAD){throw "Initial HEAD mismatch: $head"}
          if($env:CLAUDE_CONFIG_DIR -ne $env:HISTORICAL_CLAUDE_CONFIG_DIR){throw 'Historical Claude store mismatch.'}
          $claude=Get-Command claude.cmd -ErrorAction Stop
          $projectRoot=Join-Path $env:CLAUDE_CONFIG_DIR 'projects'
          if(-not(Test-Path $projectRoot)){throw 'Historical Claude projects store missing.'}
          $transcripts=@(Get-ChildItem $projectRoot -Recurse -File -Filter "$env:INITIAL_SESSION_ID.jsonl")
          if($transcripts.Count -ne 1){throw "Certified historical session transcript not uniquely found: $($transcripts.Count)"}
          $credPath=Join-Path $env:CLAUDE_CONFIG_DIR '.credentials.json'
          if(-not(Test-Path $credPath)){throw 'Credentials missing in historical Claude store.'}
          $cred=Get-Content $credPath -Raw|ConvertFrom-Json
          if([int64]$cred.claudeAiOauth.expiresAt -le [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()){throw 'Claude token expired.'}
          "head=$head" >> $env:GITHUB_OUTPUT
          "claude_path=$($claude.Source)" >> $env:GITHUB_OUTPUT
          "transcript=$($transcripts[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Run Claude plan or revision
        id: claude
        env:
          CLAUDE_PATH: ${{ steps.gate.outputs.claude_path }}
          SOURCE_HEAD: ${{ steps.gate.outputs.head }}
        run: |
          $ErrorActionPreference='Stop'
          $isRevision=$env:TRIGGER_BODY.Contains('[KODJO_V14_S09] PLAN_REVISION')
          $attempt=1
          $session=$env:INITIAL_SESSION_ID
          if($isRevision){
            $m=[regex]::Match($env:TRIGGER_BODY,'(?m)^attempt=(\d+)\s*$'); if(-not$m.Success){throw 'Revision attempt missing.'}; $attempt=[int]$m.Groups[1].Value
            $s=[regex]::Match($env:TRIGGER_BODY,'(?m)^session_id=([0-9a-f-]{36})\s*$'); if(-not$s.Success){throw 'Revision session_id missing.'}; $session=$s.Groups[1].Value
            if($session -ne $env:INITIAL_SESSION_ID){throw "Revision attempted on non-certified session: $session"}
            $feedbackMarker='REVIEW_FEEDBACK:'; $idx=$env:TRIGGER_BODY.IndexOf($feedbackMarker); if($idx -lt 0){throw 'Revision feedback missing.'}; $feedback=$env:TRIGGER_BODY.Substring($idx+$feedbackMarker.Length).Trim()
            $prompt="KODJO T01-S09 V1.4 - REVISION PLAN tentative $attempt. Continue exactement la session historique S01-S08 deja reprise pour S09. Corrige uniquement selon le feedback de revue, puis relis et revalide les sources Git/documentaires actuelles au HEAD $env:SOURCE_HEAD. La memoire de session aide a comprendre l'existant mais ne remplace jamais les sources de verite actuelles. Phase PLAN strictement lecture seule: n'utilise ni Edit ni Write et ne cree aucun rapport fichier. Le commentaire GitHub PLAN_OUTPUT constitue le rapport durable de cette phase. Retourne le plan complet dans ta reponse. Si une vraie decision produit/UX est indeterminable, retourne CLARIFICATION_REQUIRED. Feedback: $feedback"
          } else {
            $lines=@(
              'KODJO T01-S09 - CONSTRUIRE LE PLAN V1.4 en reprenant la session historique S01-S08 certifiee. Phase strictement lecture seule.',
              "Baseline Git autorisee: $env:TARGET_BRANCH @ $env:SOURCE_HEAD. Issue metier: #17.",
              'Tu disposes de l historique de developpement S01-S08 dans cette session, mais il ne constitue pas une source de verite. Relis obligatoirement le HEAD courant et toutes les sources applicables avant de planifier.',
              'Si un plan S09 a deja ete produit dans cette meme session lors d une tentative headless precedente, reutilise-le comme brouillon, revalide-le contre les sources actuelles et retourne directement sa version finale plutot que de recommencer inutilement.',
              'Lis et cite comme sources de verite: docs/PRODUCT.md, docs/INDEX.md, les specifications fonctionnelles 06 a 13 (notamment 07 registre des decisions et 13 contrats d''ecran), les images categories-seance.png et categories-nouvelle-inline.png, le code reel T01-S01 a S08 sous app/ et src/, et le rapport Figma blockers categories/headers si pertinent.',
              'Le plan doit couvrir uniquement le perimetre T01-S09 confirme par les sources: navigation Composition vers Categories, zero/multi-categories si applicable, creation inline, persistance complete T01-S08, zones corporelles, migration additive, transaction/atomicite, prevention double-submit, reset apres succes, retour Catalogue, tests, chemins probables, criteres d''acceptation et preuves attendues.',
              'Distingue explicitement regle fonctionnelle, rendu/etat UI, contrainte technique, decision validee et point A CLARIFIER. N''invente rien. Les documents versionnes plus recents supersedent toute formulation ancienne incompatible de l''Issue.',
              'Prends en compte comme vigilance de revue deja identifiee: ne pas etendre a plusieurs Exercices si hors perimetre; ne pas inventer limite 40 caracteres, normalisation/anti-doublon, ordre displayOrder/created_at, libelle dynamique ou affichage categories dans SessionCard sans source explicite; tracer D-015/D-016/D-092 a D-094 et contrats d''ecran.',
              'Phase PLAN strictement lecture seule: n utilise ni Edit ni Write, ne cree aucun rapport fichier et ne committe/pousse rien. Le commentaire GitHub PLAN_OUTPUT constitue le rapport durable de la phase PLAN. Retourne le plan complet dans ta reponse.',
              'Ne developpe pas S10. Le plan doit permettre une implementation sans micro-arbitrages humains.'
            )
            $prompt=$lines -join [Environment]::NewLine
          }

          $stdoutPath=Join-Path $env:RUNNER_TEMP 's09-claude-stdout.txt'
          $stderrPath=Join-Path $env:RUNNER_TEMP 's09-claude-stderr.txt'
          Remove-Item $stdoutPath,$stderrPath -Force -ErrorAction SilentlyContinue
          $previousEap=$ErrorActionPreference
          $ErrorActionPreference='Continue'
          & $env:CLAUDE_PATH -p --resume $session --output-format json $prompt 1> $stdoutPath 2> $stderrPath
          $exitCode=$LASTEXITCODE
          $ErrorActionPreference=$previousEap

          $raw=if(Test-Path $stdoutPath){Get-Content $stdoutPath -Raw -Encoding UTF8}else{''}
          $stderr=if(Test-Path $stderrPath){Get-Content $stderrPath -Raw -Encoding UTF8}else{''}
          $p=$null
          if(-not [string]::IsNullOrWhiteSpace($raw)){
            try{$p=$raw|ConvertFrom-Json}catch{$p=$null}
          }
          $hasUsableResult=($null -ne $p -and -not [string]::IsNullOrWhiteSpace([string]$p.session_id) -and -not [string]::IsNullOrWhiteSpace([string]$p.result))
          if(-not $hasUsableResult){
            $excerpt=if($stderr.Length -gt 1200){$stderr.Substring($stderr.Length-1200)}else{$stderr}
            throw "Claude plan invocation produced no usable JSON result. exit=$exitCode stderr=$excerpt"
          }
          if($exitCode -ne 0){Write-Warning "Claude returned exit code $exitCode but produced a usable structured result; continuing with validated result."}
          if($p.session_id -ne $env:INITIAL_SESSION_ID){throw "Claude resumed unexpected session: $($p.session_id)"}
          if(-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))){throw 'Read-only plan modified worktree.'}
          $resultPath=Join-Path $env:RUNNER_TEMP 's09-plan-result.txt'
          [IO.File]::WriteAllText($resultPath,[string]$p.result,(New-Object Text.UTF8Encoding($false)))
          "session=$($p.session_id)" >> $env:GITHUB_OUTPUT
          "attempt=$attempt" >> $env:GITHUB_OUTPUT
          "result_path=$resultPath" >> $env:GITHUB_OUTPUT

      - name: Publish plan for automated review
        env:
          SESSION_ID: ${{ steps.claude.outputs.session }}
          ATTEMPT: ${{ steps.claude.outputs.attempt }}
          SOURCE_HEAD: ${{ steps.gate.outputs.head }}
          RESULT_PATH: ${{ steps.claude.outputs.result_path }}
        run: |
          $ErrorActionPreference='Stop'
          $plan=Get-Content $env:RESULT_PATH -Raw -Encoding UTF8
          $body="[KODJO_S09_PLAN_OUTPUT]`nsource_head=$env:SOURCE_HEAD`nsession_id=$env:SESSION_ID`nattempt=$env:ATTEMPT`ncontinuity_origin=S01-S08_CERTIFIED_SESSION`nplan_report=GITHUB_PLAN_OUTPUT_COMMENT`nSTATUT : PLAN_READY_FOR_REVIEW`n`n$plan"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json -Depth 4) | Out-Null
          Write-Host 'KODJO_S09_PLAN=READY_FOR_REVIEW'
