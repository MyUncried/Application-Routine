scope:
  objective: >-
    Modifier bout en bout une Séance persistée et aligner les écrans Catalogue
    et Activité du MVP sur les contrats actualisés, notamment le sélecteur de
    type et le mode À l’échec, sans développer les catalogues Activités/Circuits
    ni les médias V2.
  in_scope:
    - Ouverture, réhydratation complète et modification atomique d’une Séance existante.
    - Modification sans duplication de l’Activité et des associations de Catégories.
    - Abandon protégé, erreurs, retry, double appui, reload et propagation de couleur.
    - Catalogue avec Activités / Séances / Circuits, Séances sélectionné et options latérales désactivées.
    - Préservation de la source Séances, du tri updatedAt DESC et des futures capacités de filtre/tri sans UI inventée.
    - Alignement des variantes vide, liste, déployée, recherche, swipe et archives.
    - Nom de l’Activité en tête de zone bleue, sans contexte Séance.
    - Bouton + Ajouter un média visible mais désactivé et section Médias absente du MVP.
    - Trois modes Durée / Répétitions / À l’échec de même largeur.
    - Mode À l’échec comme variante de configuration d’Exercice : aucune cible, Séries/Pause conservées, synthèses, durée minimale ≥ et sémantique future Suivant identique à Répétitions.
    - Récupération toujours chronométrée.
    - Overlay centré et voile DSF sur toutes les roulettes ouvertes.
    - Types, enums, validations, mapping, persistance, migration additive et tests nécessaires.
  out_of_scope:
    - Catalogue fonctionnel d’Activités ou de Circuits et navigation associée.
    - Import, capture, galerie, lecture ou stockage des médias.
    - Section Médias V2 et node 3417:4341.
    - Boutons de filtre/tri absents de Figma.
    - Suppression ou renommage d’une Catégorie personnalisée.
    - Suppression, archivage ou duplication d’une Séance au titre de S10.
    - Moteur ou domaine d’Exécution, écrans/routes d’Exécution, tables d’Exécution/Instantanés/Résultats et adaptateurs natifs d’Exécution.\n    - Planification, nouveaux écrans de suivi et fonctionnalités S11 ou ultérieures.
    - Modification destructive de migration001.ts.
  acceptance_criteria:
    - "AC-01: la bonne Séance est ouverte par identifiant sans création ni brouillon étranger."
    - "AC-02: le brouillon restitue exactement l’agrégat persistant complet, sans valeur fictive ni écriture."
    - "AC-03: les propriétés générales restent locales jusqu’à la sauvegarde finale."
    - "AC-04: l’Activité modifiée conserve identifiant, position et conteneur, sans duplication."
    - "AC-05: les Catégories conservent toutes les règles S09."
    - "AC-06: l’abandon protège le brouillon et ne modifie jamais le persistant."
    - "AC-07: la sauvegarde est une mise à jour atomique de l’identifiant d’origine."
    - "AC-08: double appui, loading, échec, retry, reset et navigation respectent les contrats."
    - "AC-09: le Catalogue recharge une carte unique et la réouverture restitue la dernière version."
    - "AC-10: la couleur modifiée atteint bande et textes de Catégories, données historiques incluses."
    - "AC-11: Activités / Séances / Circuits est rendu, Séances sélectionné, options latérales désactivées."
    - "AC-12: le nouveau segment ne filtre jamais les Séances et les anciens segments de statut sont retirés."
    - "AC-13: toutes les variantes Catalogue conservent actions, données et layout contractuels."
    - "AC-14: le tri par défaut reste updatedAt DESC et aucune UI de filtre/tri n’est inventée."
    - "AC-15: le nom ouvre la zone bleue Activité, sans contexte Séance, avec bouton média désactivé et sans section Médias."
    - "AC-16: Durée / Répétitions / À l’échec sont trois options égales; Récupération reste chronométrée."
    - "AC-17: À l’échec masque les cibles, conserve Séries/Pause, produit les synthèses et la borne minimale ≥ ; sa sémantique future indique que Suivant terminera chaque Série comme pour Répétitions, sans développer le runtime S10."
    - "AC-18: les synthèses complète et compacte suivent exactement les patrons et masquent la pause sans intervalle."
    - "AC-19: TO_FAILURE traverse les couches de configuration existantes — brouillon, domaine Séance, validation, repository, SQLite et réhydratation — avec migration additive, migration001.ts immuable et compatibilité historique ; aucune couche Exécution nouvelle."
    - "AC-20: toute roulette ouverte utilise l’overlay centré et le voile DSF bloquant."
    - "AC-21: tests ciblés et complets, Jest, TypeScript et contrôle de périmètre passent."
    - "AC-22: aucune fonctionnalité Activités/Circuits, média V2 ou S11 n’est développée."

