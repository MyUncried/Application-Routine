scope:
  objective: Réouvrir une séance existante, hydrater intégralement son brouillon, permettre sa modification et enregistrer atomiquement les changements sans perte.
  in_scope:
    - Réouverture d'une séance existante.
    - Modification conforme aux contrats fonctionnels et visuels actuels.
    - Vérification de la propagation d'un changement de couleur vers la bande gauche et le texte du catalogue.
  out_of_scope:
    - Tout développement avant approbation du plan S10.
    - Toute anticipation non documentée des tranches suivantes.
  acceptance_criteria:
    - Le plan est construit en lecture seule depuis l'Issue 42, le HEAD final S09 et les sources autoritatives.
    - Une séance existante peut être ouverte depuis le catalogue avec toutes ses données persistées et leur ordre.
    - L'enregistrement d'une modification est atomique et ne perd aucune donnée héritée de S01 à S09.
    - Un changement de couleur est propagé à la bande gauche et au texte des catégories du catalogue.
    - Jest complet, TypeScript et les tests ciblés sont exigés avant toute livraison.
    - Aucun développement ne commence avant revue indépendante et approbation utilisateur du plan.

