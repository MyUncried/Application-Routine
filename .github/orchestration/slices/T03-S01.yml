scope:
  objective: >-
    Permettre le lancement et l’exécution fiable d’une Séance linéaire composée
    d’Exercices chronométrés et de Pauses, avec écran réel, commandes, sons,
    voix et reprise après interruption.
  in_scope:
    - Lancement depuis une Séance enregistrée et création d’un instantané immuable.
    - Exercices en mode Durée, Pauses, succession linéaire et une seule série par Exercice.
    - Compte à rebours initial avec signalement des trois dernières secondes, exclu de la durée réalisée.
    - Ecran d’exécution affichant Séance, Activité courante, type, temps restant, progression et Activité suivante.
    - Commandes Pause, Reprendre et Arrêter avec confirmation Continuer ou Abandonner.
    - Transitions automatiques idempotentes fondées sur des horodatages de référence.
    - Recalcul après suspension, arrière-plan, verrouillage ou ralentissement.
    - Sons de décompte, début Exercice, début Pause et fin de Séance, plus annonce vocale du nom si disponible.
    - Validation sur appareils réels iOS et Android et documentation des restrictions de plateforme.
    - Fin de Séance sans durée ajoutée et retour vers la Séance ou le Catalogue.
  out_of_scope:
    - Répétitions et mode À l’échec.
    - Séries multiples, Récupérations et Tours.
    - Navigation Précédent ou Suivant.
    - Historique, statistiques et préférences complètes de sons, voix ou vibration.
    - Finalisation du Catalogue, catalogue fonctionnel d’Activités ou de Circuits et Médias V2.
  acceptance_criteria:
    - "AC-01: une Séance linéaire réelle composée d’Exercices en Durée et de Pauses est exécutable."
    - "AC-02: l’instantané d’exécution est construit au lancement et n’est pas altéré par une modification ultérieure de la Séance."
    - "AC-03: le compte à rebours initial signale les trois dernières secondes et n’est pas comptabilisé."
    - "AC-04: le temps restant, la progression, l’Activité courante et la suivante sont exacts."
    - "AC-05: chaque transition est exécutée exactement une fois."
    - "AC-06: Pause fige l’exécution et Reprendre repart du temps restant; la pause manuelle est exclue de la durée réalisée."
    - "AC-07: Arrêter demande confirmation et permet de continuer ou d’abandonner."
    - "AC-08: le chronométrage se recalcule correctement après arrière-plan, verrouillage, suspension ou ralentissement."
    - "AC-09: les signaux sonores et vocaux prévus sont testés sur iOS et Android."
    - "AC-10: la fin arrête le chronométrage, n’ajoute aucune durée et propose les retours prévus."
    - "AC-11: les restrictions iOS et Android observées sont documentées."
    - "AC-12: les tests couvrent calcul temporel, transitions, pause, reprise, restauration et idempotence."
    - "AC-13: le moteur expose des structures extensibles par T04 sans développer le périmètre T04."
    - "AC-14: les fonctions livrées par T01 et T02 ne régressent pas."

